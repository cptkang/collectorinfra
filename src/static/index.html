<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인프라 데이터 조회 에이전트</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>

<!-- §15: 인증 확정 전까지 auth-pending 상태로 앱 셸을 감춰 FOUC(로그인 전환 플래시)를 방지한다.
     checkAuthOnLoad() 완료 시 app.js가 클래스를 제거해 노출하거나, 미인증이면 노출 없이 리다이렉트한다. -->
<body class="auth-pending">
    <!-- 인증 확정까지 표시되는 스플래시(간단 스피너) -->
    <div class="auth-splash" id="authSplash" aria-hidden="true">
        <div class="auth-splash-spinner"></div>
    </div>
    <header>
        <div class="container">
            <h1>INFRA QUERY AGENT</h1>
            <nav>
                <span class="status-badge-wrapper">
                    <span id="statusBadge" class="status-badge status-badge--checking">CHECKING</span>
                    <div class="status-tooltip" id="statusTooltip"></div>
                </span>
                <span id="userInfoArea"
                    style="display: none; align-items: center; gap: 8px; font-size: 0.8125rem; color: var(--text-secondary, #aaa);">
                    <span id="userDisplayName"></span>
                    <button id="userLogoutBtn" class="btn btn-secondary"
                        style="display: none; font-size: 0.75rem; padding: 5px 10px;">Logout</button>
                </span>
                <!-- §17: 알림 수신 토글(권한 있는 사용자에게만 노출, 개인 표시 설정).
                     호버 시 수신 가능한 알림 존 리스트를 툴팁으로 표시(status-badge-wrapper 패턴 재사용). -->
                <span id="alarmToggleWrap" class="alarm-toggle-wrapper" style="display: none;">
                    <label class="alarm-toggle">
                        <input type="checkbox" id="alarmReceiveToggle"> 알림 수신
                    </label>
                    <div class="status-tooltip" id="alarmZonesTooltip"></div>
                </span>
                <a id="adminEntryLink" href="/admin" class="btn btn-secondary"
                    style="display: none; font-size: 0.8125rem; padding: 7px 14px;">Admin</a>
            </nav>
        </div>
    </header>

    <div class="chat-layout">
        <!-- Main Chat Area -->
        <div class="chat-main">
            <!-- Chat Messages Area -->
            <div class="chat-messages" id="chatMessages">
                <!-- Welcome screen (shown when no messages) -->
                <div class="chat-welcome" id="chatWelcome">
                    <div class="chat-welcome-icon">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
                            <line x1="12" y1="22.08" x2="12" y2="12" />
                        </svg>
                    </div>
                    <h2>Infrastructure Query Agent</h2>
                    <p>자연어로 인프라 데이터를 조회하세요. 서버 현황, CPU/메모리/디스크 사용률, 네트워크 트래픽 등을 질의할 수 있습니다.</p>
                    <div class="chat-welcome-hints">
                        <!-- Plan 65 §2: 버튼 개편. "ㅇㅇ존"은 사용자가 존으로 수정 후 전송하는 프리필
                             (무수정 전송 시 현재는 전 존 폴백 — §4 역질문 배선 시 존 선택 UI로 연결).
                             첫 버튼 "실시간" 표면어는 §1 라우팅 게이트 B안 확정 문구(실시간 API 경로 예약). -->
                        <button class="chat-welcome-hint" data-query="ㅇㅇ존의 모든 서버들에 대해 실시간 CPU 사용률을 조회해줘">CPU 사용률 현황</button>
                        <button class="chat-welcome-hint" data-query="ㅇㅇ존의 모든 서버들 중에서 지난달 1개월 통계 기준 메모리 사용률 평균이 80%를 초과하는 서버 리스트를 출력해줘">고사용 메모리 서버</button>
                        <!-- 월보 추출 2종: 기획 중 — data-query 없이 disabled로 오전송 원천 차단 (Plan 65 §2.2) -->
                        <button class="chat-welcome-hint chat-welcome-hint--disabled" disabled title="기획 중">은행존 월보 데이터 추출</button>
                        <button class="chat-welcome-hint chat-welcome-hint--disabled" disabled title="기획 중">공동존 월보 데이터 추출</button>
                        <button class="chat-welcome-hint chat-welcome-hint--help" data-query="이 에이전트의 사용법과 현재 지원 가능한 소스, 조회 가능한 데이터를 알려줘" data-help="1">❓ 사용법</button>
                    </div>
                </div>
            </div>

            <!-- DB connection warning banner -->
            <div class="db-warning-banner" id="dbWarningBanner">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                    <line x1="12" y1="9" x2="12" y2="13" />
                    <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
                <span id="dbWarningText">DB 서버에 연결할 수 없습니다. MCP 서버 상태를 확인하세요.</span>
            </div>

            <!-- Error alert -->
            <div class="chat-error" id="chatError">
                <div class="chat-error-inner" id="chatErrorText"></div>
            </div>

            <!-- 맨 아래로 이동 플로팅 버튼 (스크롤이 맨 아래가 아닐 때만 표시) -->
            <button class="scroll-to-bottom-btn" id="scrollToBottomBtn" type="button" aria-label="맨 아래로 이동">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
                <!-- 신규 내용 강조 점: .has-new 클래스일 때만 보임 -->
                <span class="scroll-to-bottom-dot" aria-hidden="true"></span>
            </button>

            <!-- Input Bar (Bottom Fixed) -->
            <div class="input-bar">
                <div class="input-bar-inner">
                    <!-- File preview -->
                    <div class="input-file-preview" id="filePreview">
                        <svg viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                        </svg>
                        <span class="input-file-name" id="fileName"></span>
                        <span class="input-file-size" id="fileSize"></span>
                        <button class="input-file-remove" id="removeFile">Remove</button>
                    </div>

                    <!-- Input row -->
                    <div class="input-row">
                        <textarea id="prompt" placeholder="인프라 데이터에 대해 질문하세요..." rows="1"></textarea>
                        <div class="input-actions">
                            <button class="input-btn input-btn--attach" id="attachBtn" title="파일 첨부 (.xlsx, .docx)">
                                <input type="file" id="fileInput" accept=".xlsx,.docx">
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                                </svg>
                            </button>
                            <button class="input-btn input-btn--send" id="sendBtn" title="전송 (Enter)">
                                <svg viewBox="0 0 24 24">
                                    <line x1="22" y1="2" x2="11" y2="13" />
                                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="input-hint">
                        <span><kbd>Enter</kbd> 전송 · <kbd>Shift</kbd> + <kbd>Enter</kbd> 개행 ·
                            <kbd>&uarr;</kbd><kbd>&darr;</kbd> 이전 질의</span>
                        <span>.xlsx, .docx 첨부 가능</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Progress Panel -->
        <div class="progress-panel" id="progressPanel">
            <div class="progress-panel-header">
                <h3>처리 현황</h3>
                <button class="progress-panel-toggle" id="panelToggle" title="패널 접기/펼치기">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </button>
            </div>
            <div class="progress-panel-body" id="progressPanelBody">
                <div class="progress-empty" id="progressEmpty">
                    <svg viewBox="0 0 24 24" width="32" height="32">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <p>질의를 실행하면 처리 과정이 여기에 표시됩니다.</p>
                </div>
                <!-- Pipeline Steps -->
                <div class="progress-pipeline" id="progressPipeline"></div>
            </div>

            <!-- 진행상황 패널 "맨 아래로" 버튼 (§16, 패널이 맨 아래가 아닐 때만 표시) -->
            <button class="scroll-to-bottom-btn scroll-to-bottom-btn--panel" id="progressScrollBtn"
                type="button" aria-label="처리 현황 맨 아래로 이동">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
                <span class="scroll-to-bottom-dot" aria-hidden="true"></span>
            </button>
        </div>
    </div>

    <script src="/static/js/marked.min.js?v=1"></script>
    <script src="/static/js/app.js?v=2"></script>
</body>

</html>
