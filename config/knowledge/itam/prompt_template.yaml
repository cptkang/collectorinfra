section: 'ITAM SQL 식별자 — 테이블은 tcdms로 시작하는 이름 그대로 쓰고, 한글 컬럼 이름은 테이블 별칭을 붙일 때도 백틱으로
  감싼다. 칸 이름은 스키마에 적힌 철자를 그대로 쓴다(비슷한 말로 바꾸지 않는다).

  날짜 문자열 비교 — 이름이 년월일로 끝나는 칸(`취득년월일`·`유지보수계약종료년월일`·`하드웨어지원종료년월일` 등)은 char 문자열이다(YYYYMMDD
  추정). 칸 쪽을 날짜 함수나 CAST로 바꾸지 말고, 비교할 기준 시점을 DATE_FORMAT(…, ''%Y%m%d'')로 같은 형식 문자열로
  만들어 비교한다. 「N개월 안에」는 오늘부터 N개월 뒤까지의 구간, 「이번 분기」는 분기 첫날부터 마지막 날까지의 구간이며 두 경계를 모두 포함한다.

  복합 연결 키는 모든 칸을 함께 건다(한 칸만 걸면 행이 불어난다). 정의 관계 기준 — 서버 계열(`tcdmsif72`·`tcdmsif73`·`tcdmsif75`·`tcdmsif78`·`tcdmsif79`·`tcdmsif80`)은
  `서버호스트명`·`IP주소내용`, 자산 원장 `tcdmsif41`과 그 연결 테이블은 `물품분류번호`·`물품고유번호`, 계약 물품 명세 `tcdmsif12`는
  `계약번호`·`물품세부일련번호`, 스토리지 계열은 `시리얼번호`다. 거의 모든 테이블에 있는 `그룹회사코드`도 연결 키에 함께 거는 것으로 본다(추정).

  코드 칸 — 이름이 구분·여부로 끝나는 char 칸은 코드값이다(추정). 같은 테이블에 이름 칸(구분명)이 있으면 조건과 표시는 이름 칸으로 한다(예:
  `tcdmsif41`의 `자산상태구분명`·`자산분류구분명`, `tcdmsif43`의 `자산유지보수구분명`). 이름 칸이 없는 코드 칸(`tcdmsif80`의
  `자산상태구분`·`노후교체기기구분`·`가상화서버매핑여부` 등)에 리터럴 조건을 거는 것은 코드값 안내 블록이 있을 때만 한다 — 없으면 값을 지어내지
  말고 그 칸으로 묶거나 그대로 보여 준다.

  유효 대상 확인 — 지금 유효한 계약·자산·부점을 물으면 해지·처분·폐점 칸이 있는지 보고 조건에 반영한다: 유지보수 계약은 `유지보수계약해지년월일`,
  계약은 `계약해지여부`, 계약 물품은 `물품해지여부`, 자산은 `처분년월일`, 부점은 `폐점여부`. 해지·처분 일자 칸이 비어 있으면 아직 해지·처분되지
  않은 것으로 본다(추정). 여부 칸의 값은 코드값 안내 블록이 있을 때만 리터럴로 쓴다.

  이름 풀이 조인 — 결과에 부점명·직원명이 필요한데 그 테이블에 이름 칸이 없을 때만 조인한다. 부점코드 칸은 `tcdmsbr01`의 `부점코드`,
  직원번호 칸은 `tcdmshr01`의 `직원번호`로 푼다. 원 테이블의 코드 칸은 비어 있을 수 있으므로(nullable) LEFT JOIN으로
  원 행을 잃지 않는다. `tcdmsif80`은 `담당부점명`·`담당자직원명`·`자산보유부점명`을 이미 가진다.

  서비스 이름 조건 — 서버 테이블에는 `어플리케이션코드` 칸이 없으므로 어플리케이션 코드로 서버를 거르지 않는다. 서비스 이름은 자유 기재 칸(`그룹경로내용`·`용도내용`·`구성항목설명내용`,
  스토리지 할당의 `업무명`)에 LIKE 부분 일치로 건다(추정). 어느 칸에 들어 있는지 정해지지 않았으면 후보 칸을 OR로 묶는다(추정).

  수치·정렬 — 금액·수량·용량 칸(`취득금액`·`잔존장부금액`·`경과년수` 등)은 decimal이라 CAST 없이 정렬·집계한다. 「상위 N」은
  그 칸 내림차순 정렬 뒤 LIMIT N이다. 목록 질의에는 LIMIT을 둔다.

