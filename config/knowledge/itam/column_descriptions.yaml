# 출처 반출 run 20261006-152938 · 원천 근거 run 20261006-152938, 20261007-152223 · 생성 2026-10-07T17:49:19+0900
# 직접 커밋 경로 — D-316 ② · 원천 testdata/itam_bench/closed/knowledge 검증 통과 active 항목만 · 검증 정적 검사만 — 모의 DB 미실행
version: 1
origin: claude_code
descriptions:
  tcdmsif72.서버운영환경구분: 서버가 속한 운영 환경을 나타내는 코드(추정). 이 테이블에 이름 칸이 없어 리터럴 조건은 「### 코드값」
    블록에 이 칸이 있을 때만 건다. 적재본 tcdmsif74에는 같은 뜻의 원문 칸 서버운영환경내용이 있다.
  tcdmsif72.서버유형구분: 서버 유형을 나타내는 코드(추정). 리터럴 조건은 「### 코드값」 블록에 이 칸이 있을 때만 건다. 적재본 tcdmsif74에는
    원문 칸 서버유형내용이 있다.
  tcdmsif72.그룹경로내용: 서버를 분류한 그룹 경로 자유 기재(서버 분류 경로). 서비스·업무 이름이 들어 있을 수 있는 서비스 연결 후보
    칸이다(값 미확인 · 추정).
  tcdmsif72.용도내용: 서버 용도 자유 기재. 서비스 이름이 적혀 있을 수 있는 서비스 연결 후보 칸이다(값 미확인 · 추정).
  tcdmsif72.구성항목설명내용: 구성 항목 설명 자유 기재. 서비스 연결 후보 칸이다(값 미확인 · 추정).
  tcdmsif72.서버식별ID: 서버 행 식별자(추정). 정의 관계의 연결 키가 아니다 — 서버 계열 테이블은 서버호스트명과 IP주소내용 두 칸으로
    잇는다.
  tcdmsif72.물품분류번호: 자산 원장 tcdmsif41 행을 물품고유번호와 함께 가리키는 키의 앞 칸(정의 관계 · 추정). 자산 원장과의
    조인이 조건 없이도 0행이라 연결은 미확정이다.
  tcdmsif72.물품고유번호: 물품분류번호와 함께 자산 원장 tcdmsif41 한 행을 가리키는 키의 뒤 칸(정의 관계 · 추정). 자산 원장과의
    조인이 0행이라 연결은 미확정이다.
  tcdmsif72.담당부점코드: 서버를 맡은 부점의 코드. 부점명은 tcdmsbr01 부점코드로 풀어 얻는다. 담당 부서를 물으면 사람 칸이 아니라
    이 칸을 쓴다.
  tcdmsif72.담당자직원번호: 서버를 맡은 직원의 번호. 이름은 tcdmshr01 직원번호로 푼다. 부서를 묻는 질문에는 쓰지 않는다.
  tcdmsif72.활성화여부: 현행 원장 행의 활성 표시 코드(추정) — 값 뜻은 「### 코드값」 블록이 있어야 안다(활성 여부 규칙 참조).
  tcdmsif72.서버CPU사용률: 수집 시점의 CPU 사용률 기록일 뿐 사용률 질문의 정본이 아니다 — 사용률·추이는 관측 DB로 답한다(D-308).
  tcdmsif80.경과년수: 자산 취득 뒤 지난 햇수(숫자 · 계산 기준일 미확인 · 추정). 노후 서버 질문에서 취득년월일과 함께 후보가 되는
    칸이다.
  tcdmsif80.노후교체기기구분: 노후 교체 대상 기기인지 나타내는 코드(추정). 이 테이블에 이름 칸이 없어 리터럴 조건은 「### 코드값」
    블록에 이 칸이 있을 때만 건다.
  tcdmsif80.자산상태구분: 자산 상태 코드. 이 테이블에는 이름 칸이 없다 — 이름은 자산 원장 tcdmsif41의 자산상태구분명에 있다(추정
    연결).
  tcdmsif80.가상화서버매핑여부: 이 서버가 가상 서버(tcdmsif92)와 연결됐는지 나타내는 여부 칸(추정). 값은 「### 코드값」 블록을
    따른다.
  tcdmsif80.가상화서버참조ID: 가상 서버 tcdmsif92 행을 가리키는 참조 식별자(정의 관계). 가상화관리서버ID와 함께 건다(추정).
  tcdmsif80.자산매핑여부: 서버가 자산 원장과 연결됐는지 나타내는 여부 칸(추정). 값은 「### 코드값」 블록을 따른다.
  tcdmsif80.취득년월일: 자산 취득일 문자열(YYYYMMDD 추정). 기간 조건은 같은 형식 문자열로 비교한다.
  tcdmsif80.유지보수계약종료년월일: 서버 자산의 유지보수 계약 종료일 문자열(YYYYMMDD 추정). 만료 질문의 기준 칸 후보 — 중도
    해지는 유지보수계약해지년월일로 따로 본다(추정).
  tcdmsif80.서버유지보수계약번호: 서버 자산의 유지보수 계약 번호 — 계약 원장 tcdmsif11 계약번호와 같은 체계로 보인다(추정).
  tcdmsif80.구매계약번호: 서버 자산을 산 계약의 번호 — 계약 원장 tcdmsif11 계약번호와 같은 체계로 보인다(추정).
  tcdmsif80.창고자산여부: 전산 창고에 보관 중인 자산인지 나타내는 여부 칸(추정). 값은 「### 코드값」 블록을 따른다.
  tcdmsif80.자산유지보수구분: 자산 유지보수 구분 코드. 이 테이블에는 이름 칸이 없다 — 이름은 tcdmsif43의 자산유지보수구분명에
    있다(추정 연결).
  tcdmsif79.하드웨어지원종료년월일: 서버 하드웨어 지원 종료(EOS)일 문자열(YYYYMMDD 추정). 하드웨어·소프트웨어를 특정하지 않은
    지원 종료 질문은 소프트웨어 쪽 칸과 OR로 함께 본다.
  tcdmsif79.소프트웨어지원종료년월일: 서버 소프트웨어 지원 종료(EOS)일 문자열(YYYYMMDD 추정). 하드웨어 쪽 칸과 별개이며, 특정하지
    않은 지원 종료 질문은 두 칸을 OR로 함께 본다.
  tcdmsif79.서버호스트명: 서버 원장 tcdmsif72와 잇는 키의 한 칸 — IP주소내용과 함께 건다(정의 관계).
  tcdmsif43.유지보수계약종료년월일: 자산별 유지보수 계약 종료일 문자열(YYYYMMDD 추정). 만료 질문의 기준 칸 — 중도 해지는 유지보수계약해지년월일로
    따로 본다.
  tcdmsif43.유지보수계약해지년월일: 유지보수 계약을 중도 해지한 날짜 문자열(YYYYMMDD 추정). 비어 있으면 해지되지 않은 계약으로
    본다(추정).
  tcdmsif43.유지보수희망년월: 유지보수를 희망하는 년월 문자열(YYYYMM 추정).
  tcdmsif43.자산유지보수구분: 유지보수 구분 코드 — 조건·표시는 같은 테이블의 자산유지보수구분명으로 한다.
  tcdmsif43.계약번호: 유지보수 계약 번호 — 물품세부일련번호와 함께 계약 물품 명세 tcdmsif12 행을 가리킨다(정의 관계).
  tcdmsif41.물품분류번호: 물품 분류 기준 tcdmsif46의 키이자 자산 키의 앞 칸 — 물품고유번호와 함께 자산 한 건을 가리킨다(추정).
  tcdmsif41.물품고유번호: 물품분류번호와 함께 자산 원장 한 행을 가리키는 키의 뒤 칸(추정).
  tcdmsif41.자산상태구분: 자산 상태 코드 — 조건·표시는 같은 테이블의 자산상태구분명으로 한다.
  tcdmsif41.처분년월일: 자산 처분일 문자열(YYYYMMDD 추정). 채워져 있으면 처분된 자산으로 본다(추정).
  tcdmsif41.자산보유부점코드: 자산을 보유한 부점의 코드 — 부점명은 tcdmsbr01 부점코드로 푼다.
  tcdmsif41.센터자산구분: 센터 자산 여부·종류를 나타내는 코드(추정). 리터럴 조건은 「### 코드값」 블록에 이 칸이 있을 때만 건다.
  tcdmsif41.교체예정기기여부: 교체 예정으로 등록된 기기인지 나타내는 여부 칸(추정). 등록 시각은 교체예정기기등록일시 칸에 있다.
  tcdmsif41.자산내용년수: 회계상 사용 가능 연수(숫자 · 추정). 취득 뒤 지난 햇수와는 다른 개념이다.
  tcdmsif52.업무명: 스토리지를 할당받은 업무 이름 기재 — 서비스와 서버를 잇는 후보 칸이다(값 미확인 · 추정).
  tcdmsif52.호스트명: 스토리지를 할당받은 서버의 호스트명 — 서버 원장 tcdmsif72의 서버호스트명과 잇는다(정의 관계).
  tcdmsif52.시리얼번호: 스토리지 장비 시리얼 — 장비 현황 tcdmsif51과 잇는 키(정의 관계).
  tcdmsgt82.어플리케이션코드: 어플리케이션(업무 시스템) 코드. 서버 테이블에는 이 칸이 없어 서버와 코드로 바로 잇지 못한다 — 서비스
    이름은 어플리케이션명으로 확인한다.
  tcdmsgt82.주어플리케이션코드: 이 어플리케이션이 속한 주(상위) 어플리케이션의 코드(추정).
  tcdmsgt82.시스템계코드: 시스템 계 구분 코드(추정). 이름 풀이는 같은 테이블의 시스템구분명 칸일 수 있다(추정).
  tcdmsif92.서버호스트명: 가상 서버가 서버로 등록될 때의 호스트명 — 서버 원장 tcdmsif72의 서버호스트명과 잇는다(정의 관계).
  tcdmsif92.실행상태내용: 가상 서버 실행 상태 원문 기재(코드가 아닌 문자열).
  tcdmsif92.호스트참조ID: 가상 서버가 올라간 가상화 호스트 tcdmsif89를 가리키는 참조 식별자(정의 관계).
  tcdmsif73.기준년월일: 수집 기준일 문자열(YYYYMMDD 추정). 과거 시점 질문에만 쓰고 지금 상태는 현행 원장 tcdmsif72로
    답한다.
  tcdmsif90.CPU사용률: 가상화 호스트의 수집 시점 CPU 사용률 기록 — 사용률 질문의 정본이 아니다. 사용률·추이는 관측 DB로 답한다(D-308).
  tcdmsbr01.폐점여부: 폐점된 부점인지 나타내는 여부 칸 — 현재 부점만 볼 때 확인한다(값은 「### 코드값」 블록을 따른다). 폐점일은
    폐점년월일 칸에 있다.
  tcdmsbr01.은행인사부점코드: 인사 시스템 기준 부점 코드(추정). 다른 테이블의 부점코드 칸 풀이는 이 칸이 아니라 부점코드로 한다(정의
    notes).
  tcdmshr01.근무상태구분: 직원 근무 상태 코드(추정). 리터럴 조건은 「### 코드값」 블록에 이 칸이 있을 때만 건다.
