# Polestar DB 구조 프로필
# source: manual — 이 파일은 운영자가 직접 작성/검증한 설정이며, LLM 자동 분석으로 덮어쓰지 않습니다.
# db_id: polestar_cm_yd

source: manual

patterns:
  # === EAV 패턴 ===
  # core_config_prop은 Entity-Attribute-Value 구조로, cmm_resource의 속성을 행 단위로 저장한다.
  # name 컬럼이 속성 타입(Attribute)을 결정하고, stringvalue_short/stringvalue가 값(Value)을 저장한다.
  - type: eav
    entity_table: cmm_resource
    config_table: core_config_prop
    # join_condition: FK 제약이 없으므로 생략. 테이블 간 관계는 value_joins로 정의.
    attribute_column: name
    value_column: stringvalue_short
    lob_value_column: stringvalue
    lob_flag_column: is_lob

    # JOIN 금지 컬럼 — 기존 3중 방어 체계(프롬프트 주석 + 구조 가이드 + validator)에 연동
    # cmm_vendor, cmm_os, cmm_os_param은 레거시 lookup 테이블로 실제 운영에서 사용하지 않음.
    # 해당 데이터는 core_config_prop EAV 속성(Vendor, OSType, OSParameter)으로 관리됨.
    excluded_join_columns:
      - table: cmm_resource
        column: vendor_id
        reason: "벤더 정보는 core_config_prop EAV에서 name='Vendor'로 조회. cmm_vendor JOIN 불필요"
      - table: cmm_resource
        column: os_id
        reason: "OS 정보는 core_config_prop EAV에서 name='OSType'/'OSVerson'으로 조회. cmm_os JOIN 불필요"
      - table: cmm_resource
        column: os_param_id
        reason: "OS 파라미터는 core_config_prop EAV에서 name='OSParameter'로 조회. cmm_os_param JOIN 불필요"

    # 값 기반 조인 (value-based join)
    # FK가 없으므로 이것이 entity-EAV 테이블 간 관계를 정의하는 유일한 수단이다.
    # 예: core_config_prop.name='Hostname'인 행의 stringvalue_short 값('server01')은
    #     cmm_resource.hostname 컬럼의 값('server01')과 동일하다.
    # 이 정보는 LLM이 올바른 WHERE/JOIN 조건을 생성하도록 프롬프트에 삽입된다.
    value_joins:
      - eav_attribute: Hostname
        eav_value_column: stringvalue_short
        entity_column: hostname
        description: "EAV Hostname 속성값 = cmm_resource.hostname"
      - eav_attribute: IPaddress
        eav_value_column: stringvalue_short
        entity_column: ipaddress
        description: "EAV IPaddress 속성값 = cmm_resource.ipaddress"

    # resource_conf_id 기반 직접 조인
    # cmm_resource.resource_conf_id = core_config_prop.configuration_id
    # 각 리소스(server.Server, server.Cpus, server.Memory 등)는 자신의 resource_conf_id를 가지며,
    # 이 값으로 core_config_prop의 해당 configuration_id 그룹에 속하는 EAV 속성을 조회한다.
    direct_join:
      entity_column: resource_conf_id
      config_column: configuration_id
      description: "cmm_resource.resource_conf_id = core_config_prop.configuration_id (리소스별 설정 조인)"

    # 알려진 EAV 속성 목록
    # core_config_prop.name 컬럼에 저장되는 주요 속성값과 한글 동의어.
    # field_mapper의 EAV synonym 매칭과 Redis eav_name_synonyms에 자동 동기화된다.
    # 주의: 코드는 "known_attributes" 키만 읽으므로 모든 resource_type의 속성을 여기에 통합한다.
    known_attributes:
      # --- server.Server / platform.server 속성 ---
      - name: OSType
        description: "운영체제 종류 (예: Linux, Windows) [resource_type: server.Server]"
        synonyms: ["운영체제", "OS종류", "OS 타입", "OS"]
      - name: OSVerson
        description: "운영체제 버전 (주의: Polestar 제품 오탈자 반영) [resource_type: server.Server]"
        synonyms: ["OS버전", "운영체제버전"]
      - name: OSParameter
        description: "OS 파라미터 / 커널 파라미터 (LOB 값 — stringvalue 사용) [resource_type: server.Server]"
        synonyms: ["OS파라미터", "OS 파라미터", "OS설정", "OS 설정", "커널", "커널 파라미터", "커널파라미터", "시스템 파라미터", "커널 설정", "커널 설정값", "sysctl"]
      - name: PatchLevel
        description: "OS 패치 레벨 / 커널 버전 [resource_type: server.Server]"
        synonyms: ["패치레벨", "커널버전", "패치"]
      - name: Vendor
        description: "서버 제조사 (예: Dell, HP) [resource_type: server.Server]"
        synonyms: ["벤더", "제조사", "제조업체"]
      - name: Model
        description: "서버 모델명 [resource_type: server.Server]"
        synonyms: ["모델", "장비모델", "모델명"]
      - name: SerialNumber
        description: "시리얼 번호 [resource_type: server.Server]"
        synonyms: ["시리얼", "S/N", "일련번호", "시리얼번호"]
      - name: Hostname
        description: "호스트명 (EAV, cmm_resource.hostname과 동일 값) [resource_type: server.Server]"
        synonyms: ["EAV호스트명", "서버명", "호스트네임"]
      - name: IPaddress
        description: "IP 주소 (EAV, cmm_resource.ipaddress와 동일 값) [resource_type: server.Server]"
        synonyms: ["EAV IP", "IP"]
      - name: GMT
        description: "시간대 (GMT offset) [resource_type: server.Server]"
        synonyms: ["시간대", "타임존"]
      - name: AgentID
        description: "모니터링 에이전트 ID [resource_type: server.Server]"
        synonyms: ["에이전트ID", "에이전트", "Agent"]
      - name: AgentVersion
        description: "에이전트 버전 [resource_type: server.Server]"
        synonyms: ["에이전트버전", "Agent버전"]
      - name: InstallPath
        description: "에이전트 설치 경로 [resource_type: server.Server]"
        synonyms: ["설치경로", "설치 경로"]
      # --- server.Cpus 속성 (resource_type = 'server.Cpus') ---
      - name: MODEL
        description: "CPU 모델명 (예: Intel Xeon Gold 6248R) [resource_type: server.Cpus]"
        synonyms: ["CPU모델", "CPU 모델", "프로세서", "프로세서모델", "CPU_MODEL"]
      - name: LOGICALCORE
        description: "논리 CPU 코어 수 (하이퍼스레딩 포함) [resource_type: server.Cpus]"
        synonyms: ["논리코어", "논리 코어", "CPU", "CPU코어", "코어수", "코어"]
      - name: PHYSICALCORE
        description: "물리 CPU 코어 수 [resource_type: server.Cpus]"
        synonyms: ["물리코어", "물리 코어", "물리CPU"]
      - name: PHYSICALCPU
        description: "물리 CPU 소켓 수 [resource_type: server.Cpus]"
        synonyms: ["CPU소켓", "소켓", "소켓수", "CORESOCKET"]
      - name: SPEED
        description: "CPU 클럭 속도 MHz (예: 2100.0) [resource_type: server.Cpus]"
        synonyms: ["CPU속도", "클럭", "클럭속도", "CPU클럭"]
      - name: HYPERTHREADING
        description: "하이퍼스레딩 활성 여부 (on/off) [resource_type: server.Cpus]"
        synonyms: ["하이퍼스레딩", "HT"]
      # --- server.Memory 속성 (resource_type = 'server.Memory') ---
      - name: TotalSize
        description: "총 물리 메모리 크기 (예: 62.1 GB) [resource_type: server.Memory] / 전체 디스크 용량 [resource_type: server.Disks]"
        synonyms: ["메모리", "MEMORY", "메모리크기", "총메모리", "메모리용량", "MEM", "디스크용량", "디스크크기"]
      # --- server.VirtualMemory 속성 (resource_type = 'server.VirtualMemory') ---
      - name: SwapTotalSize
        description: "Swap 메모리 총 크기 (예: 3.9 GB) [resource_type: server.VirtualMemory]"
        synonyms: ["스왑", "스왑메모리", "SWAP", "스왑크기"]
      # --- server.Disks 속성 (resource_type = 'server.Disks') ---
      - name: DiskCount
        description: "디스크 수 [resource_type: server.Disks]"
        synonyms: ["디스크수", "디스크개수", "디스크 수"]
      # --- server.NetworkInterface 속성 (resource_type = 'server.NetworkInterface') ---
      - name: IP
        description: "네트워크 인터페이스 IP 주소 [resource_type: server.NetworkInterface]"
        synonyms: ["NIC IP", "인터페이스IP"]
      - name: MAC
        description: "MAC 주소 (예: b4:96:91:0e:bd:a6) [resource_type: server.NetworkInterface]"
        synonyms: ["MAC주소", "맥주소", "MACAddress"]
      - name: BANDW
        description: "대역폭 (예: 10 Gb) [resource_type: server.NetworkInterface]"
        synonyms: ["대역폭", "bandwidth", "네트워크속도"]
      - name: MTU
        description: "MTU 크기 (예: 1500.0) [resource_type: server.NetworkInterface]"
        synonyms: ["MTU"]
      - name: NETMASK
        description: "서브넷 마스크 (예: 255.255.255.0) [resource_type: server.NetworkInterface]"
        synonyms: ["서브넷", "넷마스크", "서브넷마스크"]
      - name: STATUS
        description: "인터페이스 상태 (UP/DOWN) [resource_type: server.NetworkInterface]"
        synonyms: ["NIC상태", "인터페이스상태"]

  # === 계층형 패턴 ===
  # cmm_resource는 서버, CPU, 메모리, 디스크, 네트워크 등 모든 인프라 리소스를 하나의 테이블에
  # parent_resource_id를 통한 계층 구조로 저장한다.
  # resource_type으로 리소스 종류를 구분한다 (예: platform.server, server.Cpu, server.FileSystem).
  - type: hierarchy
    table: cmm_resource
    id_column: id
    parent_column: parent_resource_id
    type_column: resource_type
    name_column: name

query_guide: |
  Polestar DB는 cmm_resource(리소스 계층), core_config_prop(EAV 설정), cmm_metric_stat_m(성능 통계) 3개 테이블로 구성됩니다.

  [★ 공동존 폴스타 전용 — 장비명(서버명)과 호스트명 구분]
  이 시스템(공동존 폴스타)에서는 폴스타에 등록된 장비 식별명과 OS 호스트명이 서로 다른 값입니다.
  - cmm_resource.name     → 폴스타에 등록된 장비 식별명. 사용자가 "서버명", "장비명", "서버 이름" 등으로 지칭하는 컬럼.
  - cmm_resource.hostname → OS에서 인식하는 실제 호스트명. 사용자가 명시적으로 "호스트명", "호스트네임"이라고 할 때만 사용.
  **기본값**: 사용자가 서버를 특정할 때 "호스트명/호스트네임"이라고 명시하지 않으면 반드시 cmm_resource.name 을 사용하세요.
  서버 목록 출력 시에도 name 컬럼을 우선 표시하고, 필요 시 hostname을 함께 출력합니다.

  [★★ hostname / ipaddress 출력은 직접 컬럼 사용 — EAV 금지]
  이 DB에서 호스트명·IP주소의 실제 값은 cmm_resource.hostname / cmm_resource.ipaddress **직접 컬럼**에 있습니다.
  EAV(core_config_prop)의 cc.name = 'Hostname' / 'IPaddress' 속성은 **값이 비어 있어** 조회 시 NULL이 반환됩니다.
  따라서 호스트명·IP주소를 출력할 때는 반드시 r.hostname / r.ipaddress(피벗 시 MAX(CASE WHEN c.resource_type='server.Server' THEN c.hostname END))를 사용하고,
  **cc.name = 'Hostname' / 'IPaddress' 의 stringvalue_short 는 절대 사용하지 마세요.**
  (CPU·메모리·OS종류·버전 등 나머지 속성은 EAV 사용이 맞습니다 — hostname/ipaddress만 직접 컬럼.)

  [★ filter_conditions 필드명 재매핑 — 공동존 폴스타 전용]
  input_parser가 생성한 filter_conditions의 field 값이 무엇이든, 사용자의 원문이 "서버 이름", "서버명", "장비명", "장비 이름"에 해당하면
  SQL에서 cmm_resource.name 컬럼으로 매핑한다. filter_conditions.field = "hostname"이 전달되더라도 예외 없이 적용한다.
  **사용자가 "<값> 서버"(예: "cocm-hdkapp01 서버")처럼 값으로 서버를 지칭하면 그 값은 장비명이므로 WHERE r.name = '<값>' 으로 거른다.**
  **출력 컬럼으로 "호스트네임/IP"를 함께 요청하더라도 서버 식별 필터는 절대 hostname 으로 하지 말 것 (필터=r.name, 출력=r.hostname 은 별개).**
  단, 사용자가 명시적으로 "호스트명/호스트네임이 XXX인 서버"처럼 호스트명 자체로 필터하라고 한 경우에만 cmm_resource.hostname 을 사용한다.
  예: filter_conditions = [{"field": "hostname", "op": "=", "value": "cocm-hdkapp01"}] + 원문 "서버 이름이 cocm-hdkapp01인"
      → WHERE r.name = 'cocm-hdkapp01'  (r.hostname 이 아님)

  [avail_status 값 의미]
  cmm_resource.avail_status 컬럼의 정수 값:
    - 0 = 정상 (UP)
    - 0이 아닌 값(1, 2 등) = 비정상 (DOWN, 알 수 없음 등)
  "정상"인 조건은 avail_status = 0, "비정상"이거나 "정상이 아닌" 조건은 avail_status != 0 으로 생성하세요.
  filter_conditions에 문자열("비정상" 등)이 전달된 경우 avail_status != 0 조건으로 변환하세요.

  [테이블 조인 방법]
  cmm_resource와 core_config_prop의 조인:
    cmm_resource.resource_conf_id = core_config_prop.configuration_id
  이 조인으로 각 리소스의 EAV 설정 속성을 조회할 수 있습니다.

  [주의] cmm_resource.id = core_config_prop.configuration_id 직접 조인은 금지합니다.
  반드시 resource_conf_id를 사용하세요.

  [OSParameter(커널 파라미터) LOB 값 조회 주의]
  OSParameter(커널 파라미터, 시스템 파라미터 등)는 LOB 값으로 core_config_prop.stringvalue에 저장됩니다.
    - COALESCE(cc.stringvalue, cc.stringvalue_short) 사용 — OSParameter는 LOB로 저장될 수 있어 stringvalue_short가 빈 값일 수 있음
    - 필터: core_config_prop.name = 'OSParameter'
  예시 (공동존 폴스타 — 장비명으로 필터):
    SELECT r.name AS server_name, r.hostname, COALESCE(cc.stringvalue, cc.stringvalue_short) AS os_parameter
    FROM polestar.cmm_resource r
    JOIN polestar.core_config_prop cc ON r.resource_conf_id = cc.configuration_id
    WHERE r.resource_type = 'server.Server'
      AND r.name = '조회할_장비명'
      AND cc.name = 'OSParameter'
      AND r.dtime IS NULL;

  [cmm_metric_stat_[h,d,m] — 성능 지표 통계 테이블]
  CPU 사용률, 메모리 사용률, 파일시스템 사용률, 디스크 IO 등 성능 지표를 월별로 집계한 테이블입니다.
  조인: cmm_resource.id = cmm_metric_stat_[h,d,m].resource_id

  주요 컬럼:
    - resource_id: cmm_resource.id와 조인
    - definition_name: 지표 종류 ('Utilization' = 사용률, 'MaxIORate' = 디스크 IO)
    - stat_date: 통계 기준 월 (YYYYMM 형식 문자열, 예: '202601')
    - min_val, avg_val, max_val: 기간 내 최소/평균/최대값

  resource_type별 조회 가능한 성능 지표:
    - 'server.Cpus'        + definition_name = 'Utilization'  → CPU 사용률 (%)
    - 'server.Memory'      + definition_name = 'Utilization'  → 메모리 사용률 (%)
    - 'server.FileSystems' + definition_name = 'Utilization'  → 파일시스템 사용률 (%)
    - 'server.Disks'       + definition_name = 'MaxIORate'    → 디스크 IO

  성능 지표 조회 시 조인 구조:
    1. cmm_resource r: 서브 리소스 행 (Cpus, Memory, FileSystems, Disks)
    2. cmm_resource svr: 서버 행 (r.platform_resource_id = svr.id, svr.resource_type = 'server.Server')
    3. cmm_metric_stat_m s: 성능 통계 (r.id = s.resource_id)
    4. 서브쿼리 hi: 하드웨어 설정 정보 (svr.ipaddress = hi.ipaddress 로 조인)

  [리소스 타입별 EAV 속성]
  cmm_resource의 resource_type에 따라 서로 다른 configuration_id 그룹을 가집니다.
  같은 서버에 속한 리소스들은 platform_resource_id가 동일합니다.

  resource_type별 주요 EAV 속성:
    - platform.server / server.Server: Hostname, IPaddress, Model, Vendor, SerialNumber, OSType, OSVerson, PatchLevel, AgentVersion, GMT
    - server.Cpus: MODEL(CPU모델), LOGICALCORE(논리코어수), PHYSICALCORE(물리코어수), PHYSICALCPU(소켓수), SPEED(클럭MHz), VENDOR(CPU제조사), HYPERTHREADING
    - server.Memory: TotalSize(메모리 크기, 예: 62.1 GB)
    - server.VirtualMemory: SwapTotalSize(스왑크기), TotalPageFileSize(페이지파일)
    - server.Disks: DiskCount(디스크수), TotalSize(전체 디스크용량)
    - server.NetworkInterface: IP, MAC, BANDW(대역폭), MTU, NETMASK, STATUS(UP/DOWN), DUPLEX, TYPE(Ethernet)

  [서버 종합 정보 조회 패턴]
  한 서버의 서버정보 + CPU + 메모리를 한 행으로 조회하려면:
    GROUP BY platform_resource_id로 같은 서버의 모든 리소스를 집계하고,
    MAX(CASE WHEN resource_type = '...' AND name = '...' THEN stringvalue_short END)로 피벗합니다.

  [날짜/시간 및 통계 테이블(cmm_metric_stat_[h,d,m]) 분기 처리]
  사용자가 요청하는 시간 단위에 따라 알맞은 통계 테이블을 조회합니다.
  - 시간 단위 ("현재", "실시간", "최근 N시간") → `cmm_metric_stat_h` 테이블 조인 (stat_date 형식: YYYYMMDDHH, 예: '2026052214')
    * 예: s.stat_date = TO_CHAR(CURRENT_TIMESTAMP - INTERVAL '1 hour', 'YYYYMMDDHH24')
  - 일 단위 ("오늘", "어제", "최근 N일", "특정 일자") → `cmm_metric_stat_d` 테이블 조인 (stat_date 형식: YYYYMMDD, 예: '20260522')
    * 예: s.stat_date = TO_CHAR(CURRENT_DATE - INTERVAL '1 day', 'YYYYMMDD')
  - 월 단위 ("이번 달", "최근 N개월", "특정 월", 시간 미지정) → `cmm_metric_stat_m` 테이블 조인 (stat_date 형식: YYYYMM, 예: '202605')
    * 예: s.stat_date = TO_CHAR(CURRENT_DATE - INTERVAL '1 month', 'YYYYMM')
  주의: 하드코딩된 날짜를 절대 사용하지 않고, 항상 MAX(stat_date) 서브쿼리 또는 CURRENT_DATE 기반의 동적 계산을 사용합니다.

  [계층 구조]
  cmm_resource.resource_type으로 리소스 종류를 구분합니다:
    - platform.server% / server.Server: 서버 (최상위)
    - server.Cpus: CPU 컨테이너, server.Cpu: 개별 CPU 코어
    - server.Memory: 메모리
    - server.FileSystem: 파일시스템
    - server.NetworkInterface: 네트워크 인터페이스
  부모-자식 관계: cmm_resource.parent_resource_id = cmm_resource.id
  같은 서버 소속: cmm_resource.platform_resource_id가 동일

# === 쿼리 예시 (Few-shot) ===
# LLM이 쿼리를 생성할 때 참조할 질문→SQL 쌍.
# 이 예시들은 시스템 프롬프트에 그대로 삽입되어 LLM의 환각을 줄인다.
# 운영자가 필요에 따라 예시를 추가/수정할 수 있다.
query_examples:
  - question: "호스트명, OS종류, 벤더를 조회해줘"
    sql: |
      SELECT
        r.hostname,
        cc_ostype.stringvalue_short AS os_type,
        cc_vendor.stringvalue_short AS vendor
      FROM polestar.cmm_resource r
      LEFT JOIN polestar.core_config_prop cc_ostype
        ON r.resource_conf_id = cc_ostype.configuration_id AND cc_ostype.name = 'OSType'
      LEFT JOIN polestar.core_config_prop cc_vendor
        ON r.resource_conf_id = cc_vendor.configuration_id AND cc_vendor.name = 'Vendor'
      WHERE r.resource_type LIKE 'platform.server%'
        AND r.dtime IS NULL
      LIMIT 100;
    explanation: "resource_conf_id = configuration_id 조인으로 서버의 EAV 속성을 조회"

  - question: "서버별 호스트명, IP, OS버전, 시리얼번호를 조회해줘"
    sql: |
      SELECT
        r.hostname,
        r.ipaddress,
        cc_osver.stringvalue_short AS os_version,
        cc_serial.stringvalue_short AS serial_number
      FROM polestar.cmm_resource r
      LEFT JOIN polestar.core_config_prop cc_osver
        ON r.resource_conf_id = cc_osver.configuration_id AND cc_osver.name = 'OSVerson'
      LEFT JOIN polestar.core_config_prop cc_serial
        ON r.resource_conf_id = cc_serial.configuration_id AND cc_serial.name = 'SerialNumber'
      WHERE r.resource_type LIKE 'platform.server%'
        AND r.dtime IS NULL
      LIMIT 100;
    explanation: "resource_conf_id로 EAV 속성을 추가할 때마다 LEFT JOIN을 추가하는 패턴"

  - question: "서버 수를 조회해줘"
    sql: |
      SELECT COUNT(*) AS server_count
      FROM polestar.cmm_resource r
      WHERE r.resource_type LIKE 'platform.server%'
        AND r.dtime IS NULL
      LIMIT 1;
    explanation: "EAV 조인이 필요 없는 단순 집계 — cmm_resource만 사용"

  - question: "서버별 호스트명, IP, 시리얼번호, CPU모델, CPU코어수, 메모리를 조회해줘"
    sql: |
      SELECT
          COALESCE(c.platform_resource_id, c.id) AS id,
          MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.hostname  END) AS hostname,    -- 직접 컬럼 (EAV 'Hostname' 속성은 비어있어 NULL)
          MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.ipaddress END) AS ipaddress,   -- 직접 컬럼 (EAV 'IPaddress' 속성은 비어있어 NULL)
          MAX(CASE WHEN c.resource_type = 'server.Server' AND cc.name = 'Model'        THEN cc.stringvalue_short END) AS model,
          MAX(CASE WHEN c.resource_type = 'server.Server' AND cc.name = 'SerialNumber' THEN cc.stringvalue_short END) AS serialnumber,
          MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND cc.name = 'MODEL'        THEN cc.stringvalue_short END) AS cpu_model,
          MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND cc.name = 'LOGICALCORE'  THEN cc.stringvalue_short END) AS logicalcore,
          MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND cc.name = 'PHYSICALCORE' THEN cc.stringvalue_short END) AS physicalcore,
          MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND cc.name = 'PHYSICALCPU'  THEN cc.stringvalue_short END) AS coresocket,
          MAX(CASE WHEN c.resource_type = 'server.Memory' AND cc.name = 'TotalSize'    THEN cc.stringvalue_short END) AS mem_size,
          MAX(CASE WHEN c.resource_type = 'server.Server' AND cc.name = 'OSType'       THEN cc.stringvalue_short END) AS ostype,
          MAX(CASE WHEN c.resource_type = 'server.Server' AND cc.name = 'OSVerson'     THEN cc.stringvalue_short END) AS osversion,
          MAX(CASE WHEN c.resource_type = 'server.Server' AND cc.name = 'PatchLevel'   THEN cc.stringvalue_short END) AS os_patchlevel
      FROM polestar.cmm_resource c
      LEFT JOIN polestar.core_config_prop cc
            ON c.resource_conf_id = cc.configuration_id
      WHERE c.resource_type IN ('server.Server','server.Cpus','server.Memory')
        AND c.dtime IS NULL
      GROUP BY COALESCE(c.platform_resource_id, c.id);
    explanation: |
      서버 종합 정보 조회 — GROUP BY platform_resource_id로 같은 서버의 모든 리소스를 집계.
      resource_type별로 CASE WHEN을 사용하여 server.Server(호스트/OS), server.Cpus(CPU), server.Memory(메모리) 속성을 한 행으로 피벗.

  - question: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, 호스트네임, CPU 모델, 메모리 용량을 조회해줘"
    sql: |
      -- ★ 단일 서버 + CPU·메모리(다른 resource_type) 동시 조회: 서버 식별은 HAVING으로 (WHERE 금지)
      -- WHERE에 c.name='...'을 두면 server.Cpus/server.Memory 행이 GROUP BY 전에 걸러져 CPU·메모리가 NULL이 됨
      SELECT
          COALESCE(c.platform_resource_id, c.id) AS id,
          MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.name      END) AS server_name,
          MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.hostname  END) AS hostname,
          MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.ipaddress END) AS ipaddress,
          MAX(CASE WHEN c.resource_type = 'server.Server' AND cc.name = 'OSType'    THEN cc.stringvalue_short END) AS ostype,
          MAX(CASE WHEN c.resource_type = 'server.Server' AND cc.name = 'OSVerson'  THEN cc.stringvalue_short END) AS osversion,
          MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND cc.name = 'MODEL'     THEN cc.stringvalue_short END) AS cpu_model,
          MAX(CASE WHEN c.resource_type = 'server.Memory' AND cc.name = 'TotalSize' THEN cc.stringvalue_short END) AS mem_size
      FROM polestar.cmm_resource c
      LEFT JOIN polestar.core_config_prop cc
            ON c.resource_conf_id = cc.configuration_id
      WHERE c.resource_type IN ('server.Server','server.Cpus','server.Memory')
        AND c.dtime IS NULL
      GROUP BY COALESCE(c.platform_resource_id, c.id)
      HAVING MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.name END) = 'cocm-hdkapp01';
    explanation: |
      단일 서버의 종합 정보(OS/IP/호스트명 + CPU/메모리)를 한 행으로 피벗.
      ★ 서버 식별(장비명)은 WHERE가 아니라 HAVING(집계 후 server.Server 행 기준)으로 적용한다.
      WHERE에 c.name='...'을 두면 server.Cpus/server.Memory 행이 GROUP BY 전에 제거되어 CPU·메모리가 NULL이 된다.
      장비명 대신 "호스트명/호스트네임이 XXX인"이라고 명시한 경우에만 HAVING의 c.name을 c.hostname으로 바꾼다.

  - question: "비정상 서버 목록과 IP를 조회해줘"
    sql: |
      -- 공동존 폴스타: 서버명은 r.name, 비정상은 avail_status != 0
      SELECT
        r.name AS server_name,
        r.hostname AS os_hostname,
        r.ipaddress,
        r.avail_status
      FROM polestar.cmm_resource r
      WHERE r.resource_type = 'server.Server'
        AND r.avail_status != 0
        AND r.dtime IS NULL
      LIMIT 100;
    explanation: "공동존 폴스타 전용 — 서버 식별은 r.name(장비명) 우선, 비정상은 avail_status != 0"

  - question: "장비명이 'SV-WEB-001'인 서버의 가용성 상태와 IP를 조회해줘"
    sql: |
      -- 공동존 폴스타: 서버명/장비명 필터는 cmm_resource.name 사용 (hostname 아님)
      SELECT
        r.name AS server_name,
        r.hostname AS os_hostname,
        r.ipaddress,
        r.avail_status
      FROM polestar.cmm_resource r
      WHERE r.resource_type = 'server.Server'
        AND r.name = 'SV-WEB-001'
        AND r.dtime IS NULL
      LIMIT 10;
    explanation: "공동존 폴스타 전용 — 장비명 필터는 r.name 컬럼 사용, hostname은 OS 호스트명으로 별도 출력"

  - question: "특정 서버의 CPU 리소스를 조회해줘"
    sql: |
      SELECT child.id, child.name, child.resource_type
      FROM polestar.cmm_resource parent
      JOIN polestar.cmm_resource child
        ON child.parent_resource_id = parent.id
      WHERE parent.hostname = '서버명'
        AND child.resource_type = 'server.Cpu'
        AND child.dtime IS NULL
      LIMIT 100;
    explanation: "계층 구조 조회 — parent_resource_id로 자기참조 조인"

  - question: "서버들의 CPU, 메모리 용량 및 사용률 리스트를 조회해줘"
    sql: |
      SELECT
          svr.name AS pname,
          svr.ipaddress AS ipaddress,
          svr.hostname AS hostname,
          TO_DATE(s.stat_date || '01', 'YYYYMMDD') AS stat_date,
          hi.physicalcore,
          hi.mem_size,
          ROUND(MIN(CASE WHEN r.resource_type = 'server.Cpus'   AND s.definition_name = 'Utilization' THEN s.min_val END)::numeric, 2) AS cpu_min,
          ROUND(AVG(CASE WHEN r.resource_type = 'server.Cpus'   AND s.definition_name = 'Utilization' THEN s.avg_val END)::numeric, 2) AS cpu_avg,
          ROUND(MAX(CASE WHEN r.resource_type = 'server.Cpus'   AND s.definition_name = 'Utilization' THEN s.max_val END)::numeric, 2) AS cpu_max,
          ROUND(MIN(CASE WHEN r.resource_type = 'server.Memory' AND s.definition_name = 'Utilization' THEN s.min_val END)::numeric, 2) AS mem_min,
          ROUND(AVG(CASE WHEN r.resource_type = 'server.Memory' AND s.definition_name = 'Utilization' THEN s.avg_val END)::numeric, 2) AS mem_avg,
          ROUND(MAX(CASE WHEN r.resource_type = 'server.Memory' AND s.definition_name = 'Utilization' THEN s.max_val END)::numeric, 2) AS mem_max
      FROM polestar.cmm_resource r
      JOIN polestar.cmm_resource svr
          ON svr.id = r.platform_resource_id
         AND svr.resource_type = 'server.Server'
      JOIN polestar.cmm_metric_stat_m s
          ON r.id = s.resource_id
      LEFT JOIN (
          SELECT
              COALESCE(c.platform_resource_id, c.id) AS id,
              MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.ipaddress END) AS ipaddress,   -- 직접 컬럼 (EAV 'IPaddress'는 비어있어 조인 깨짐)
              MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND cc.name = 'PHYSICALCORE' THEN cc.stringvalue_short END) AS physicalcore,
              MAX(CASE WHEN c.resource_type = 'server.Memory' AND cc.name = 'TotalSize'    THEN cc.stringvalue_short END) AS mem_size
          FROM polestar.cmm_resource c
          LEFT JOIN polestar.core_config_prop cc
              ON c.resource_conf_id = cc.configuration_id
          WHERE c.resource_type IN ('server.Server', 'server.Cpus', 'server.Memory')
            AND c.dtime IS NULL
          GROUP BY COALESCE(c.platform_resource_id, c.id)
      ) hi ON svr.ipaddress = hi.ipaddress
      WHERE r.resource_type IN ('server.Cpus', 'server.Memory')
        AND s.definition_name = 'Utilization'
      GROUP BY svr.name, svr.ipaddress, svr.hostname, TO_DATE(s.stat_date || '01', 'YYYYMMDD'), hi.physicalcore, hi.mem_size
      ORDER BY svr.hostname, stat_date
      LIMIT 100;
    explanation: |
      성능 지표 조회 — cmm_metric_stat_m에서 CPU/메모리 사용률을 조회.
      cmm_resource r(서브 리소스) → cmm_resource svr(서버) → cmm_metric_stat_m s(통계) 3방향 조인.
      하드웨어 설정(코어수, 메모리용량)은 서브쿼리 hi에서 EAV 피벗으로 조회 후 ipaddress로 조인.

  - question: "서버별 월간 CPU, 메모리, 파일시스템, 디스크 IO 성능 통계를 조회해줘"
    sql: |
      SELECT
          svr.name AS pname,
          svr.ipaddress AS ipaddress,
          svr.hostname AS hostname,
          TO_DATE(s.stat_date || '01', 'YYYYMMDD') AS stat_date,
          hi.physicalcore,
          hi.mem_size,
          ROUND(MIN(CASE WHEN r.resource_type = 'server.Cpus'        AND s.definition_name = 'Utilization' THEN s.min_val END)::numeric, 2) AS cpu_min,
          ROUND(AVG(CASE WHEN r.resource_type = 'server.Cpus'        AND s.definition_name = 'Utilization' THEN s.avg_val END)::numeric, 2) AS cpu_avg,
          ROUND(MAX(CASE WHEN r.resource_type = 'server.Cpus'        AND s.definition_name = 'Utilization' THEN s.max_val END)::numeric, 2) AS cpu_max,
          ROUND(MIN(CASE WHEN r.resource_type = 'server.Memory'      AND s.definition_name = 'Utilization' THEN s.min_val END)::numeric, 2) AS mem_min,
          ROUND(AVG(CASE WHEN r.resource_type = 'server.Memory'      AND s.definition_name = 'Utilization' THEN s.avg_val END)::numeric, 2) AS mem_avg,
          ROUND(MAX(CASE WHEN r.resource_type = 'server.Memory'      AND s.definition_name = 'Utilization' THEN s.max_val END)::numeric, 2) AS mem_max,
          ROUND(MIN(CASE WHEN r.resource_type = 'server.FileSystems' AND s.definition_name = 'Utilization' THEN s.min_val END)::numeric, 2) AS fs_min,
          ROUND(AVG(CASE WHEN r.resource_type = 'server.FileSystems' AND s.definition_name = 'Utilization' THEN s.avg_val END)::numeric, 2) AS fs_avg,
          ROUND(MAX(CASE WHEN r.resource_type = 'server.FileSystems' AND s.definition_name = 'Utilization' THEN s.max_val END)::numeric, 2) AS fs_max,
          ROUND(MIN(CASE WHEN r.resource_type = 'server.Disks'       AND s.definition_name = 'MaxIORate'   THEN s.min_val END)::numeric, 2) AS disks_io_min,
          ROUND(AVG(CASE WHEN r.resource_type = 'server.Disks'       AND s.definition_name = 'MaxIORate'   THEN s.avg_val END)::numeric, 2) AS disks_io_avg,
          ROUND(MAX(CASE WHEN r.resource_type = 'server.Disks'       AND s.definition_name = 'MaxIORate'   THEN s.max_val END)::numeric, 2) AS disks_io_max
      FROM polestar.cmm_resource r
      JOIN polestar.cmm_resource svr
          ON svr.id = r.platform_resource_id
         AND svr.resource_type = 'server.Server'
      JOIN polestar.cmm_metric_stat_m s
          ON r.id = s.resource_id
      LEFT JOIN (
          SELECT
              COALESCE(c.platform_resource_id, c.id) AS id,
              MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.ipaddress END) AS ipaddress,   -- 직접 컬럼 (EAV 'IPaddress'는 비어있어 조인 깨짐)
              MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND cc.name = 'PHYSICALCORE' THEN cc.stringvalue_short END) AS physicalcore,
              MAX(CASE WHEN c.resource_type = 'server.Memory' AND cc.name = 'TotalSize'    THEN cc.stringvalue_short END) AS mem_size
          FROM polestar.cmm_resource c
          LEFT JOIN polestar.core_config_prop cc
              ON c.resource_conf_id = cc.configuration_id
          WHERE c.resource_type IN ('server.Server', 'server.Cpus', 'server.Memory')
            AND c.dtime IS NULL
          GROUP BY COALESCE(c.platform_resource_id, c.id)
      ) hi ON svr.ipaddress = hi.ipaddress
      WHERE r.resource_type IN ('server.Cpus', 'server.Memory', 'server.FileSystems', 'server.Disks')
        AND s.definition_name IN ('Utilization', 'MaxIORate')
      GROUP BY svr.name, svr.ipaddress, svr.hostname, TO_DATE(s.stat_date || '01', 'YYYYMMDD'), hi.physicalcore, hi.mem_size
      ORDER BY svr.hostname, stat_date
      LIMIT 100;
    explanation: |
      월간 성능 통계 전체 조회 — CPU/메모리/파일시스템/디스크 IO를 한 행으로 피벗.
      시간 범위 필터가 필요하면 WHERE에 AND TO_DATE(s.stat_date || '01', 'YYYYMMDD') BETWEEN ... AND ... 추가.

  - question: "장비명이 'SV-WEB-001'인 서버의 OS파라미터(커널 파라미터)를 조회해줘"
    sql: |
      -- OSParameter는 LOB일 수 있음 → COALESCE(stringvalue, stringvalue_short) 사용
      -- 공동존 폴스타: 장비명 필터는 r.name 사용
      SELECT r.name AS server_name, r.hostname, COALESCE(cc.stringvalue, cc.stringvalue_short) AS os_parameter
      FROM polestar.cmm_resource r
      JOIN polestar.core_config_prop cc ON r.resource_conf_id = cc.configuration_id
      WHERE r.resource_type = 'server.Server'
        AND r.name = 'SV-WEB-001'
        AND cc.name = 'OSParameter'

        AND r.dtime IS NULL;
    explanation: "OSParameter는 stringvalue(LOB) 사용. 공동존 폴스타에서 장비명 필터는 r.name 컬럼."

# 허용 테이블 목록 — schema_analyzer가 이 목록에 없는 테이블을 relevant_tables에서 제외한다.
# cmm_vendor, cmm_os, cmm_os_param 등 레거시 lookup 테이블은 조회 대상이 아니다.
allowed_tables:
  - cmm_resource
  - core_config_prop
  - cmm_metric_stat_m
  - cmm_metric_stat_d
  - cmm_metric_stat_h

# alarm_query 전용 허용 테이블 — routing_intent=alarm_query 시 이 목록으로 필터링한다.
alarm_allowed_tables:
  - cmm_alarm
  - cmm_alarm_def
  - cmm_alarm_active
  - cmm_resource
  - cmm_alarm_def_noti
  - cmm_alarm_def_noti_user
  - cmm_alarm_def_noti_group
  - cmm_alarm_def_noti_role
  - cmm_alarm_def_noti_rmtype
  - acc_acl_resource_manager_type
  - acc_role
  - acc_user_group

# DB별 컬럼 유사단어 — 글로벌 사전보다 우선 적용
# "서버명/장비명" → cmm_resource.name (공동존 폴스타 전용)
column_synonyms:
