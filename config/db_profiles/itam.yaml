query_guide: '제공된 DB 스키마 분석 결과, 감지할 수 있는 특수한 구조적 패턴 (EAV, 계층형, 복잡한 JOIN 관계) 은 없습니다.


  1. **EAV 패턴 부재**: 스키마는 모든 속성이 테이블의 고정된 열 (column) 로 정의되어 있으며, ''entity'', ''config'',
  ''attribute'', ''value'' 와 같은 EAV 구조를 위한 별도의 테이블이나 동적 열 구조가 존재하지 않습니다. 각 행은 고정된
  스키마를 따릅니다.

  2. **계층형 패턴 부재**: 같은 테이블 내에서 자신을 참조하는 부모-자식 관계 (Self-referencing FK, 예: id -> parent_id)
  나, ''type'' 컬럼을 통한 계층 분류 구조는 발견되지 않았습니다. 모든 테이블은 독립적인 엔티티를 나타내는 것으로 보입니다.

  3. **JOIN 관계 부재**: 제공된 스키마는 단일 테이블의 컬럼 정의만 포함하고 있으며, 테이블 간의 외래 키 (FK) 관계나 주석 (Comment)
  을 통해 연결된 다른 테이블에 대한 정보가 없습니다. 따라서 테이블 간 JOIN 패턴을 추론할 수 없습니다.


  따라서 이 스키마는 표준적인 관계형 데이터 모델 (Relational Model) 을 따르며, 추가적인 메타데이터나 관계 정의가 없으면 위 패턴들은
  적용되지 않습니다.'
