  - {text: "JVM 힙 사용률이 높은 WAS 인스턴스 보여줘", sources: [apm], areas: [was_runtime], from: "FS-02"}
  - {text: "지금 실행 중인 WAS 서비스 목록 보여줘", sources: [apm], areas: [was_activity], from: "FS-04"}
  - {text: "서버별 자산 담당자와 담당 부점 알려줘", sources: [itam], areas: [asset_owner], from: "FS-31"}
  - {text: "DB 서버들의 자산 담당자와 담당 부점 목록 알려줘", sources: [itam], areas: [asset_owner], from: "routing_gold"}
