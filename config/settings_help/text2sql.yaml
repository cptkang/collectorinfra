# 설정 옵션 상세 설명 — Text2SQL (D-191)
# 근거: src/config.py Text2SQLConfig 주석 · plans/61 · plans/67 · plans/69 · plans/82
# 이 그룹은 대부분 기본 off(켜기 전에는 기존 SQL 생성 경로가 무변경)지만, 세 개는
# 예외적으로 기본 on이다 — 관련 테이블 게이트 · 0건 진단 · 급증 조건 조립.

version: 1
group: text2sql

settings:

  TEXT2SQL_SEMANTIC_COMPOSE:
    example: >-
      '김포 서버 CPU 사용률 상위 10건'처럼 스키마와 조인이 정해진 질의는 LLM이 매번 조금씩 다른 SQL을 낸다 — 어떤 날은 조인을 빠뜨려 검증에서 걸린다. 조립
      경로를 켜면 같은 질문에 항상 같은 SQL이 나가고 그 자리의 재시도가 사라진다.
    summary: SQL을 LLM 자유 생성이 아니라 코드가 결정적으로 조립할지.
    behavior: >-
      질문을 의미 질의로 바꾼 뒤, 스키마와 조인이 정해진 형태라면 코드가 직접 SQL을
      만든다. LLM은 같은 질문에도 매번 조금씩 다른 SQL을 내놓는데, 조립 경로는 항상
      같은 결과를 낸다.
    options:
      - value: "false"
        label: 기본
        effect: 기존 LLM 생성 경로를 그대로 쓴다.
      - value: "true"
        effect: >-
          커버되는 질의는 코드가 조립하고, 커버 밖은 TEXT2SQL_SEMANTIC_FALLBACK이 정한
          방식으로 처리한다. 조립된 질의는 결과가 결정적이고 검증 실패가 사라진다.
    performance: 조립 경로는 SQL 생성 LLM 호출이 없어 훨씬 빠르고 비용이 들지 않는다.
    stability: >-
      조립이 커버하는 범위 밖에서 어떻게 처리할지가 관건이다 — 폴백 설정을 함께 정하지
      않으면 커버 밖 질의의 동작이 바뀔 수 있다.
    recommendation: 켜기 전에 폴백 방식을 먼저 정하고, 대표 질의로 회귀를 확인한다.
    related: [TEXT2SQL_SEMANTIC_FALLBACK, TEXT2SQL_FALLBACK_CONFIDENCE_MIN, TEXT2SQL_MULTI_CANDIDATE]

  TEXT2SQL_SEMANTIC_FALLBACK:
    example: >-
      조립이 커버하지 못한 질의를 어떻게 처리할지가 이 값이다. `human`으로 두면 커버 밖 질의가 전부 사람 검토로 넘어가 자동 처리율이 크게 떨어지고, `llm`이면
      기존과 같은 자유 생성으로 돌아간다.
    summary: 결정적 조립이 커버하지 못한 질의를 어떻게 처리할지.
    behavior: >-
      조립 경로가 켜져 있을 때만 의미가 있다. 다중 후보가 꺼져 있으면 후보 관련 선택지는
      기존 LLM 자유 생성으로 자연스럽게 내려간다.
    options:
      - value: candidate_then_human
        label: 기본
        effect: 여러 후보를 만들어 고르고, 신뢰도가 낮으면 사람 검토로 넘긴다.
      - value: llm
        effect: 기존대로 LLM이 한 번에 생성한다. 가장 빠르지만 품질 편차가 크다.
      - value: human
        effect: 커버 밖은 전부 사람 검토로 보낸다. 가장 안전하지만 자동 처리율이 떨어진다.
    performance: 후보 생성은 LLM 호출을 후보 수만큼 쓴다 — 가장 비싼 선택지다.
    stability: 사람 검토로 넘기는 비율이 높으면 자동화의 의미가 줄어든다. 신뢰도 임계와 함께 조정한다.
    related: [TEXT2SQL_SEMANTIC_COMPOSE, TEXT2SQL_MULTI_CANDIDATE, TEXT2SQL_FALLBACK_CONFIDENCE_MIN]

  TEXT2SQL_FALLBACK_CONFIDENCE_MIN:
    example: >-
      0으로 두면 후보 선택 결과를 그대로 실행한다. 0.7로 올리면 애매한 선택이 사람 검토로 넘어가는데, 그 신뢰도가 모델의 자기보고면 실제 정확도와 어긋날 수 있어 정상
      질의가 대량으로 대기에 걸릴 수 있다.
    summary: 후보 선택 신뢰도가 이 값에 못 미치면 사람 검토로 내린다.
    behavior: 다중 후보에서 고른 SQL의 신뢰도를 재고, 임계 미만이면 자동 실행하지 않는다.
    options:
      - value: "0.0"
        label: 기본
        effect: 사실상 게이트를 끈 상태다. 선택된 후보를 그대로 쓴다.
      - value: "0.5~0.7"
        effect: 애매한 선택은 사람에게 넘긴다. 오답은 줄지만 검토 대기가 늘어난다.
      - value: "0.9 이상"
        effect: 거의 모든 질의가 사람 검토로 간다. 자동 처리가 사실상 멈춘다.
    performance: 게이트 자체는 비용이 없다. 다만 검토로 넘어가면 그 건의 자동 처리는 끝난다.
    stability: 신뢰도 점수가 모델의 자기보고인 경우 임계가 기대만큼 작동하지 않을 수 있다 — 실측으로 확인한다.
    related: [TEXT2SQL_SEMANTIC_FALLBACK, TEXT2SQL_SELECTION]

  TEXT2SQL_MULTI_CANDIDATE:
    example: >-
      후보를 3개 만들면 SQL 생성 LLM 호출이 3배가 된다. 정확도가 오르는 대신 응답 시간과 과금도 3배이므로, 정확도 문제가 실제로 관측되는 질의 유형이 있을 때만 켤
      값이다.
    summary: SQL 후보를 여러 개 만들어 그중 하나를 고를지.
    behavior: >-
      한 번에 하나를 만드는 대신 여러 개를 만들고, 결과 일관성이나 LLM 비교로 고른다.
      정확도가 올라가지만 호출 수가 후보 수만큼 늘어난다.
    options:
      - value: "false"
        label: 기본
        effect: 한 번에 하나만 만든다. 가장 빠르고 싸다.
      - value: "true"
        effect: TEXT2SQL_CANDIDATE_COUNT만큼 만들어 고른다. 정확도가 오르지만 비용도 그만큼 든다.
    performance: LLM 호출이 후보 수만큼 늘어난다 — 응답 시간과 과금이 배로 뛴다.
    stability: 후보가 전부 틀리면 고르기도 소용없다. 다양화 전략이 실제로 다른 접근을 만들어 내는지가 관건이다.
    recommendation: 비용을 감당할 수 있고 정확도가 우선인 환경에서만 켠다.
    related: [TEXT2SQL_CANDIDATE_COUNT, TEXT2SQL_CANDIDATE_STRATEGIES, TEXT2SQL_SELECTION, TEXT2SQL_COMPLEXITY_GATE]

  TEXT2SQL_CANDIDATE_COUNT:
    example: >-
      3개면 둘이 같은 답을 내고 하나가 다를 때 다수결이 성립한다. 2개로 줄이면 갈렸을 때 고를 근거가 없어져 선택 전략이 무력해진다.
    summary: 후보를 몇 개 만들지.
    behavior: 다중 후보가 켜져 있을 때만 쓰인다. 이 수만큼 LLM 호출이 나간다.
    options:
      - value: "3"
        label: 기본
        effect: 세 개. 다수결이 성립하는 최소 수다.
      - value: "2"
        effect: 두 개가 갈리면 고를 근거가 약해진다.
      - value: "5 이상"
        effect: 정확도가 조금 더 오를 수 있지만 호출 비용이 그대로 비례해 늘어난다.
    performance: 응답 시간과 비용이 이 값에 정비례한다. 가장 직접적인 비용 레버다.
    stability: 후보가 많아도 선택 전략이 약하면 정확도가 오르지 않는다.
    recommendation: 기본 3에서 시작해 실제 이득을 측정한 뒤 조정한다.
    related: [TEXT2SQL_MULTI_CANDIDATE]

  TEXT2SQL_CANDIDATE_STRATEGIES:
    example: >-
      temperature 방식은 같은 프롬프트를 무작위성만 바꿔 여러 번 부르므로, 모델이 같은 오해를 하고 있으면 세 후보가 나란히 틀린다. multi_prompt는 분할
      정복·실행계획 사고처럼 접근 자체를 다르게 시켜 그 위험을 줄인다.
    summary: 후보를 어떻게 다르게 만들지.
    behavior: 같은 프롬프트를 여러 번 부르면 비슷한 답만 나온다. 의도적으로 다른 접근을 시키는 방식을 고른다.
    options:
      - value: multi_prompt
        label: 기본
        effect: 서로 다른 프롬프트(직접 생성·분할 정복·실행계획 사고)를 써서 접근 자체를 다르게 만든다.
      - value: temperature
        effect: 같은 프롬프트에 무작위성만 올린다. 구현이 단순하지만 비슷한 오답이 여러 번 나오기 쉽다.
    performance: 두 방식의 호출 수는 같다. 프롬프트 방식이 입력 토큰을 조금 더 쓴다.
    stability: 무작위성만으로는 진짜 다른 접근이 나오지 않아 다중 후보의 이득이 줄어든다.
    recommendation: 기본 multi_prompt 유지.
    related: [TEXT2SQL_MULTI_CANDIDATE, TEXT2SQL_CANDIDATE_COUNT]

  TEXT2SQL_COMPLEXITY_GATE:
    example: >-
      '서버 목록 보여줘' 같은 단순 질의는 한 번에 맞히므로 후보를 셋 만들어도 정확도가 오르지 않고 비용만 3배가 된다. 이 게이트를 켜면 그런 질의는 한 번에 처리하고
      복잡한 질의에만 후보를 늘린다.
    summary: 복잡한 질의에만 다중 후보를 쓸지.
    behavior: >-
      단순한 질의는 한 번에 맞히므로 후보를 여러 개 만들 이유가 없다. 이 게이트는 비용
      절감이 아니라 품질을 위한 것이다 — 단순 질의에 후보를 늘려도 정확도가 오르지 않는다.
    options:
      - value: "false"
        label: 기본
        effect: 모든 질의에 같은 방식을 쓴다.
      - value: "true"
        effect: 복잡하다고 판정된 질의만 후보를 여러 개 만든다. 단순 질의는 빠르게 처리된다.
    performance: 단순 질의에서 후보 생성 비용이 사라진다.
    stability: 복잡도 판정이 빗나가면 정작 필요한 질의에 후보가 안 붙는다.
    related: [TEXT2SQL_MULTI_CANDIDATE]

  TEXT2SQL_SELECTION:
    example: >-
      consistency는 후보를 실제로 실행해 결과가 같은 쪽을 고르므로 DB 조회가 후보 수만큼 나간다. llm은 실행 없이 비교하지만 호출 비용이 든다 — hybrid는
      결과 일관성으로 먼저 거르고 갈릴 때만 LLM을 쓴다.
    summary: 여러 후보 중 어느 것을 고를지 정하는 방식.
    behavior: 후보들을 실제로 실행해 결과가 일치하는지 보거나, LLM에게 둘씩 비교시키거나, 두 방법을 함께 쓴다.
    options:
      - value: hybrid
        label: 기본
        effect: 결과 일관성으로 먼저 거르고, 갈리는 경우에만 LLM 비교를 쓴다.
      - value: consistency
        effect: 결과가 같은 후보가 많은 쪽을 고른다. LLM 호출이 없지만 후보를 전부 실행해야 한다.
      - value: llm
        effect: LLM이 후보를 비교해 고른다. 실행 없이 고를 수 있지만 호출 비용이 든다.
    performance: >-
      일관성 방식은 후보 수만큼 DB 조회가 나가고, LLM 방식은 비교 호출이 나간다.
      어느 쪽이 비싼지는 질의 성격에 달렸다.
    stability: 결과 일관성은 "여러 후보가 같은 답을 냈다"는 근거라 LLM 판단보다 신뢰할 만하다.
    recommendation: 기본 hybrid 유지.
    related: [TEXT2SQL_MULTI_CANDIDATE, TEXT2SQL_FALLBACK_CONFIDENCE_MIN]

  TEXT2SQL_MULTI_RELEVANT_GATE:
    summary: 멀티 DB 조회에서 프롬프트에 넣을 테이블을 질의에 관련된 것으로 좁힐지 — 기본 on이다.
    behavior: >-
      멀티 DB 경로는 스키마를 통째로 프롬프트에 실었는데, 공동존처럼 테이블이 많은 DB에서는
      그것만으로 게이트웨이 입력 한도를 넘겨 버렸다. 이 게이트는 프로필의 허용 테이블과
      이번 질의에 걸린 유사어 테이블로 범위를 좁힌다.
    options:
      - value: "true"
        label: 기본
        effect: 관련 테이블만 싣는다. 프로필이 없는 DB나 필터 결과가 비면 전부 유지하므로 조회가 막히지는 않는다.
      - value: "false"
        effect: >-
          스키마 전체를 싣는다. 이는 폐쇄망에서 실제로 발생한 장애(공동존 프롬프트가
          136,707 토큰으로 한도 95,232를 초과)를 재현하는 것과 같다.
    example: >-
      공동존 DB에 질문을 던졌을 때 "입력이 너무 길다"는 실패가 난다면 이 값이 꺼져 있을
      가능성이 높다. 이 항목은 비상 복귀용으로만 끄는 스위치다.
    performance: 프롬프트가 크게 줄어 입력 토큰과 지연이 함께 내려간다.
    stability: 끄면 알려진 장애가 되살아난다. 이 값의 기본 on은 의도된 예외다.
    recommendation: 켠 채로 둔다.
    related: [TEXT2SQL_PROMPT_TOKEN_BUDGET, TEXT2SQL_PATH_PARITY]
    references:
      - docs/02_decision.md (D-159)

  TEXT2SQL_PROMPT_TOKEN_BUDGET:
    example: >-
      예산을 넘기면 유사어·설명 같은 재료부터 잘리고, 그래도 넘으면 호출하지 않고 명시적으로 실패한다. 두 경우 모두 로그에 남으므로 '왜 갑자기 결과 품질이 떨어졌나'를 절단
      기록으로 확인할 수 있다.
    summary: 프롬프트 입력 토큰 예산 — 넘으면 재료를 잘라내고, 그래도 넘으면 호출하지 않고 실패시킨다.
    behavior: >-
      게이트웨이 모델의 실측 입력 한도(95,232 토큰)에 여유를 둔 보수 예산이다. 초과하면
      유사어·설명 같은 재료부터 자르고 다음에 샘플을 자른다. 그래도 넘으면 호출하지 않고
      명시적으로 실패한다 — 잘라낸 사실과 실패 모두 로그에 남는다.
    options:
      - value: "90000"
        label: 기본
        effect: 실측 한도보다 약 5% 여유를 둔 값이다.
      - value: "0 이하"
        effect: 가드를 끈다. 한도를 넘는 프롬프트가 그대로 나가 게이트웨이에서 거절된다.
      - value: "95000 이상"
        effect: 여유가 사라져 토큰 계산 오차만큼 실패가 난다.
    performance: 절단이 일어나면 프롬프트가 작아져 호출은 빨라지지만 근거가 줄어 품질이 떨어진다.
    stability: >-
      침묵 강등을 금지하도록 설계돼 있다 — 잘렸으면 잘렸다고, 실패했으면 실패했다고
      로그에 남는다. 품질 저하가 조용히 일어나지는 않는다.
    recommendation: 쓰는 모델의 실제 한도를 확인하고 그보다 5~10% 낮게 잡는다.
    related: [TEXT2SQL_MULTI_RELEVANT_GATE, LLM_PROVIDER]
    references:
      - docs/02_decision.md (D-159)

  TEXT2SQL_EMPTY_DIAGNOSIS_ENABLED:
    summary: 결과가 0건일 때 어느 조건에서 끊겼는지 짚어 줄지 — 기본 on이다.
    behavior: >-
      0건이 나왔을 때만 조건을 하나씩 누적해 가며 건수를 세어, 어느 조건에서 결과가
      사라졌는지 찾아 응답에 담는다. 결과가 있으면 이 프로브는 한 번도 돌지 않으므로
      정상 경로 비용은 0이다.
    options:
      - value: "true"
        label: 기본
        effect: >-
          "조회 결과가 없습니다" 대신 "김포 조건까지는 120건이었는데 CPU 90% 이상 조건에서
          0건이 됐습니다"처럼 답한다.
      - value: "false"
        effect: 0건 응답이 예전 문구 그대로 나간다. 사용자는 조건이 틀린 건지 데이터가 없는 건지 알 수 없다.
    example: >-
      "김포에서 CPU 90% 넘는 서버"가 0건일 때, 켜져 있으면 지역 조건까지는 데이터가
      있었고 임계 조건에서 끊겼다는 것을 알려 준다. 사용자가 임계를 낮춰 다시 물으면 된다.
    performance: 0건일 때만 COUNT 조회가 최대 TEXT2SQL_EMPTY_DIAGNOSIS_MAX_PROBES회 추가된다.
    stability: 정상 경로는 바이트 단위로 무변경이다 — 0건이 아닐 때는 아무 일도 하지 않는다.
    recommendation: 켠 채로 둔다. 이 값의 기본 on은 의도된 예외다.
    related: [TEXT2SQL_EMPTY_DIAGNOSIS_MAX_PROBES]
    references:
      - docs/02_decision.md (D-176 후속1)

  TEXT2SQL_EMPTY_DIAGNOSIS_MAX_PROBES:
    example: >-
      조건이 여덟 개인 질의에서 상한이 5면 다섯 번까지만 확인하고 '나머지는 측정하지 않았다'를 응답에 밝힌다. 원인 조건이 여섯 번째였다면 못 짚지만, 절단 사실이 표시되므로
      사용자가 조건을 줄여 다시 물을 수 있다.
    summary: 0건 진단에서 조건을 몇 번까지 확인할지.
    behavior: >-
      조건 조합을 전부 확인하는 것은 계산량이 폭발하므로 상한을 둔다. 상한을 넘으면
      측정하지 않고, 잘렸다는 사실을 응답에 함께 밝힌다.
    options:
      - value: "5"
        label: 기본
        effect: 다섯 번까지 확인한다. 조건이 대여섯 개인 일반적인 질의를 대부분 커버한다.
      - value: "2"
        effect: 빠르지만 조건이 많은 질의에서 원인 조건에 닿기 전에 끊긴다.
      - value: "10 이상"
        effect: 더 복잡한 질의도 진단하지만 0건 응답이 그만큼 느려진다.
    performance: 0건일 때만 이 횟수만큼 COUNT 조회가 나간다. 정상 응답에는 영향이 없다.
    stability: 절단은 응답에 명시되므로 조용히 잘리지 않는다.
    recommendation: 기본 5 유지.
    related: [TEXT2SQL_EMPTY_DIAGNOSIS_ENABLED]

  TEXT2SQL_SPIKE_CONDITION_ENABLED:
    example: >-
      '파일시스템 사용률이 갑자기 80% 이상 오른 서버'는 기간 대비 비교 SQL이 필요한데, LLM 자유 생성은 비교 기준 시점을 자주 틀린다. 진입 조건(급증 어휘 + 절대
      임계 + 파일시스템 축 + 폴스타 어댑터 DB + 첫 시도)을 모두 만족할 때만 코드가 조립하므로, 해당하지 않는 질의는 영향받지 않는다.
    summary: >-
      "갑자기 80% 이상 올랐다" 같은 급증 질의를 코드가 직접 조립할지 — 기본 on이다.
    behavior: >-
      기간 대비 상승을 비교하는 SQL은 LLM이 자유 생성하면 자주 틀린다. 진입 조건이
      좁아서(급증 어휘, 절대 임계 명시, 파일시스템 축, 폴스타 어댑터 DB, 첫 시도) 해당하지
      않는 질의는 조립을 시도조차 하지 않는다.
    options:
      - value: "true"
        label: 기본
        effect: 조건에 맞는 급증 질의를 코드가 결정적으로 조립한다. 같은 질문에 항상 같은 SQL이 나온다.
      - value: "false"
        effect: 급증 질의도 LLM 자유 생성으로 처리한다. 결과가 매번 달라질 수 있다.
    performance: 조립되면 SQL 생성 LLM 호출이 생략돼 더 빠르다.
    stability: 진입 조건이 좁아 다른 질의에 영향을 주지 않는다.
    recommendation: 켠 채로 둔다. 이 값의 기본 on은 의도된 예외다.
    related: [TEXT2SQL_SPIKE_DEFAULT_DELTA_PP]
    references:
      - docs/02_decision.md (D-176 후속2)

  TEXT2SQL_SPIKE_DEFAULT_DELTA_PP:
    example: >-
      '디스크가 갑자기 늘었다'처럼 수치를 말하지 않은 질의에 이 값이 쓰인다. 5로 낮추면 평소 변동 폭 안의 서버까지 전부 잡혀 결과가 수백 건이 되고, 50으로 올리면
      서서히 차오르는 디스크를 놓친다. 어떤 값이 쓰였는지는 응답에 함께 표시된다.
    summary: 급증 질의에 수치가 없을 때 쓸 기본 상승 폭(퍼센트포인트).
    behavior: >-
      "갑자기 늘었다"처럼 수치를 말하지 않은 질의에 쓰는 기본값이다. 선언 파일
      (config/change_terms.yaml)이 정본이고 이 값은 운영 override다. 이 값이 쓰이면
      얼마를 기준으로 판단했는지 응답에 함께 밝힌다.
    options:
      - value: "20.0"
        label: 기본
        effect: 20퍼센트포인트 이상 오른 것을 급증으로 본다.
      - value: "5"
        effect: 작은 변동도 급증으로 잡힌다. 결과가 많아져 정작 중요한 변화가 묻힌다.
      - value: "50 이상"
        effect: 큰 변화만 잡힌다. 서서히 나빠지는 추세를 놓친다.
    performance: 임계에 따라 결과 건수가 달라져 응답 크기에 영향을 준다.
    stability: 쓰인 값이 응답에 노출되므로, 사용자가 기준을 모른 채 결과를 해석하는 일은 없다.
    recommendation: 기본 20 유지. 조정이 필요하면 선언 파일 쪽을 먼저 검토한다.
    related: [TEXT2SQL_SPIKE_CONDITION_ENABLED]

  TEXT2SQL_STEPWISE_DERIVATION:
    example: >-
      '지난달 대비 사용률이 많이 오른 서버'처럼 요구가 여러 겹인 질의에서, 한 번에 컬럼을 고르면 기간 축이나 비교 대상을 빠뜨리기 쉽다. 단계적 도출은 항목마다 카탈로그와
      실제 값을 확인하며 좁혀 가지만, 도구 호출이 최대 24회까지 붙어 응답이 훨씬 느려진다.
    summary: 필요한 컬럼을 한 번에 고르지 않고 여러 번 탐색해 가며 도출할지.
    behavior: >-
      질문을 요구로 쪼개고, 항목마다 카탈로그·유사어·실제 값을 확인해 가며 조회 대상을
      누적한다. 커버리지 판정과 SQL 조립은 그대로 결정적으로 유지된다.
    options:
      - value: "false"
        label: 기본
        effect: 한 번에 컬럼을 고른다. 빠르지만 애매한 표현에서 잘못 고를 수 있다.
      - value: "true"
        effect: 여러 번 확인하며 좁혀 간다. 정확도가 오르지만 호출 수와 시간이 크게 늘어난다.
    performance: >-
      도구 호출이 최대 TEXT2SQL_STEPWISE_MAX_TOOL_CALLS회까지 누적된다. 단순 질의
      10초 목표와는 맞지 않는 경로다.
    stability: 세 개의 상한(라운드·호출 수·전체 시간)이 함께 걸려 있어 무한 루프로 빠지지 않는다.
    recommendation: 컬럼 오선택이 실제 문제일 때만 켠다.
    related: [TEXT2SQL_STEPWISE_MAX_ROUNDS, TEXT2SQL_STEPWISE_MAX_TOOL_CALLS, TEXT2SQL_STEPWISE_TIMEOUT_SECONDS]

  TEXT2SQL_STEPWISE_MAX_ROUNDS:
    example: >-
      라운드 상한에 자주 닿는다면 값을 늘리기 전에 왜 수렴하지 않는지를 본다 — 대개 카탈로그에 필요한 정보가 없어 같은 확인을 반복하는 경우다.
    summary: 단계적 도출에서 도구 호출 왕복을 몇 번까지 허용할지.
    behavior: 무한 루프를 막는 상한이다. 상한에 닿으면 그때까지 도출한 내용으로 진행한다.
    options:
      - value: "6"
        label: 기본
        effect: 여섯 번의 왕복. 대부분의 질의는 그 안에 정리된다.
      - value: "2~3"
        effect: 복잡한 질의에서 도출이 끝나기 전에 끊긴다.
      - value: "15 이상"
        effect: 복잡한 질의도 끝까지 가지만 응답 시간이 크게 늘어난다.
    performance: 라운드마다 LLM 호출이 붙는다.
    stability: 상한에 닿는 일이 잦다면 값을 늘리기 전에 왜 수렴하지 않는지를 먼저 본다.
    related: [TEXT2SQL_STEPWISE_DERIVATION, TEXT2SQL_STEPWISE_MAX_TOOL_CALLS]

  TEXT2SQL_STEPWISE_MAX_TOOL_CALLS:
    example: >-
      라운드는 6회인데 한 라운드에서 도구를 여러 번 부를 수 있어, 라운드 상한만으로는 토큰 폭증을 막지 못한다. 호출마다 결과가 프롬프트에 누적되므로 이 상한이 실질적인 비용
      가드다.
    summary: 단계적 도출에서 도구를 누적 몇 번까지 부를지.
    behavior: 라운드 상한과 별개로 총 호출 수를 제한한다 — 한 라운드에서 도구를 여러 번 부를 수 있기 때문이다.
    options:
      - value: "24"
        label: 기본
        effect: 라운드 6회 × 라운드당 평균 4회를 가정한 값이다.
      - value: "10 이하"
        effect: 확인이 부족한 채로 끊긴다.
      - value: "50 이상"
        effect: 토큰 사용량이 급증한다 — 이 상한의 목적 자체가 토큰 폭증 차단이다.
    performance: 호출 하나하나가 프롬프트에 누적돼 입력 토큰이 계속 커진다.
    stability: 라운드 상한만으로는 토큰 폭증을 막지 못해 이 상한이 따로 있다.
    related: [TEXT2SQL_STEPWISE_MAX_ROUNDS]

  TEXT2SQL_STEPWISE_TIMEOUT_SECONDS:
    example: >-
      도구 호출 하나하나에 타임아웃이 있어도, 여러 번 왕복하면 총 시간은 얼마든지 길어진다. 이 값이 그 루프 전체를 감싸는 마지막 상한이다.
    summary: 단계적 도출 전체에 주는 시간(초).
    behavior: >-
      호출 하나하나의 타임아웃만으로는 여러 번 왕복하는 경로를 막지 못한다. 이 값이
      루프 전체를 감싸는 최종 상한이다.
    options:
      - value: "60.0"
        label: 기본
        effect: 1분. 복합 질의 목표(30초)보다 길지만, 이 경로 자체가 느린 경로다.
      - value: "20 이하"
        effect: 도출이 자주 중간에 끊긴다.
      - value: "180 이상"
        effect: 사용자가 3분을 기다린다. 사실상 대화형으로 쓸 수 없는 길이다.
    performance: 이 시간 동안 처리 슬롯이 점유된다.
    stability: 장시간 실행 경로에 전체 타임아웃은 필수다 — 없으면 왕복 수가 늘어나는 순간 무한정 길어진다.
    recommendation: 기본 60초 유지.
    related: [TEXT2SQL_STEPWISE_DERIVATION]

  TEXT2SQL_QUERY_HISTORY_FEWSHOT:
    example: >-
      프롬프트의 예시가 매번 달라지면 모델 쪽 캐시 이점이 사라진다. 정확도가 오르는 대신 응답 시간이 일정하지 않게 되므로, 이력이 충분히 쌓인 뒤에 효과를 측정해 판단한다.
    summary: 프롬프트 예시를 고정 목록 대신 과거 질의 이력에서 골라 넣을지.
    behavior: >-
      검증된 질의-SQL 이력에서 이번 질문과 비슷한 것을 골라 예시로 쓴다. 꺼져 있으면
      프로필에 적힌 고정 예시를 쓴다.
    options:
      - value: "false"
        label: 기본
        effect: 고정 예시를 쓴다. 프롬프트가 항상 같아 캐시 효율이 좋다.
      - value: "true"
        effect: 질문마다 맞춤 예시가 들어간다. 정확도가 오를 수 있지만 프롬프트가 매번 달라진다.
    performance: >-
      유사도 검색이 추가되고 프롬프트가 매번 달라져 캐시 이득이 사라진다. 입력 토큰도
      예시 수만큼 늘어난다.
    stability: 이력이 충분히 쌓이기 전에는 고를 예시가 없어 효과가 없다.
    related: [TEXT2SQL_QUERY_HISTORY_TOP_K, TEXT2SQL_QUERY_HISTORY_MIN_SCORE]

  TEXT2SQL_QUERY_HISTORY_TOP_K:
    example: >-
      예시 하나가 곧 입력 토큰이다. 10개로 올리면 프롬프트가 크게 길어져 토큰 예산을 압박하고, 관련성이 낮은 예시가 섞이면 오히려 엉뚱한 방향으로 유도한다.
    summary: 이력에서 예시를 몇 개까지 뽑을지.
    behavior: 유사도 상위 이 개수만큼 프롬프트에 넣는다. 토큰 증가의 상한이기도 하다.
    options:
      - value: "3"
        label: 기본
        effect: 세 개. 예시가 지나치게 많으면 오히려 모델이 헷갈린다.
      - value: "1"
        effect: 토큰은 아끼지만 하나가 빗나가면 잘못된 방향으로 유도된다.
      - value: "10 이상"
        effect: 프롬프트가 크게 길어진다 — 입력 한도와 비용을 함께 본다.
    performance: 예시 하나가 곧 입력 토큰이다.
    stability: 비슷하지 않은 예시가 섞여 들어가면 오히려 품질이 떨어진다 — 임계와 함께 조정한다.
    related: [TEXT2SQL_QUERY_HISTORY_FEWSHOT, TEXT2SQL_QUERY_HISTORY_MIN_SCORE]

  TEXT2SQL_QUERY_HISTORY_MIN_SCORE:
    example: >-
      임계를 0.1로 낮추면 관련 없는 과거 질의까지 예시로 들어가 프롬프트를 오염시킨다. 반대로 0.7로 올리면 거의 적중하지 않아 기능이 사실상 꺼진 것과 같아진다.
    summary: 이력 예시로 인정할 최소 유사도 — 미만이면 고정 예시로 돌아간다.
    behavior: 어휘·문자열 유사도로 재며, 이 값에 못 미치면 적중 없음으로 보고 기존 고정 예시를 쓴다.
    options:
      - value: "0.35"
        label: 기본
        effect: 어느 정도 비슷한 것만 예시로 쓴다. 안 비슷하면 안전하게 고정 예시로 돌아간다.
      - value: "0.1"
        effect: 거의 다 통과시킨다. 관련 없는 예시가 프롬프트를 오염시킨다.
      - value: "0.7 이상"
        effect: 웬만해선 적중하지 않아 기능이 사실상 꺼진 것과 같아진다.
    performance: 임계가 높으면 검색 결과가 비어 프롬프트가 짧아진다.
    stability: 적중 실패는 안전하게 기존 동작으로 돌아가는 방향이다.
    related: [TEXT2SQL_QUERY_HISTORY_FEWSHOT]

  TEXT2SQL_HYPERNYM_AMBIGUITY:
    example: >-
      '사용률 보여줘'라고만 물으면 CPU 하나로 좁혀져 답이 나가는데, 사용자는 메모리와 디스크를 안 본 것인지 없는 것인지 알 수 없다. 켜면 형제 항목을 함께 채워 그
      오해를 막는다 — 대신 결과가 세 배로 커진다.
    summary: >-
      "사용률"처럼 상위 개념만 말한 질문에서 하위 항목을 모두 채울지.
    behavior: >-
      "사용률 보여줘"라고만 하면 CPU·메모리·디스크 중 하나로 좁혀지는데, 그 하나만
      보여 주면 나머지를 안 본 것인지 없는 것인지 알 수 없다. 켜면 형제 항목을 결정적으로
      함께 채운다. 하위 항목을 명시한 질문은 판정에서 걸러져 동작이 바뀌지 않는다.
    options:
      - value: "false"
        label: 기본
        effect: 좁혀진 하나만 보여 준다.
      - value: "true"
        effect: 상위어만 말한 경우 형제 항목을 함께 보여 준다 — 조용한 오답을 막는다.
    performance: 조회 대상 지표가 늘어 결과가 커진다.
    stability: 상위·하위 관계는 카탈로그 정본(taxonomy)에 선언돼 있어야 동작한다.
    related: [TEXT2SQL_PROMPT_KNOWLEDGE_RENDER]

  TEXT2SQL_GENERIC_LLM_MAPPING:
    example: >-
      프로필이 있는 폴스타 DB는 이 값과 무관하다. 프로필 없는 DB에서 '지난주'를 물었을 때 어느 시간 컬럼으로 해석할지 힌트를 주는 용도이며, 켜면 프롬프트가 조금
      길어지는 대신 기간 해석 실패가 줄어든다.
    summary: 프로필이 없는 DB에서 기간 표현을 해석하도록 범용 힌트를 넣을지.
    behavior: >-
      프로필을 갖춘 DB(폴스타 등)는 선언 기반으로 동작하므로 영향이 없다. 프로필이 없는
      DB에서만 스키마의 시간 컬럼으로 기간을 매핑하는 힌트를 추가로 넣는다.
    options:
      - value: "false"
        label: 기본
        effect: 추가 주입이 없다. 현행 동작 그대로다.
      - value: "true"
        effect: 프로필 없는 DB에서 "지난주" 같은 표현의 해석 정확도가 올라간다.
    performance: 프롬프트가 조금 길어진다. 호출 수는 늘지 않는다.
    stability: 프로필 보유 DB는 영향받지 않는다.
    related: [POLESTAR_DB_IDS]

  TEXT2SQL_PROMPT_KNOWLEDGE_RENDER:
    example: >-
      예제를 코드에 박아 두면 카탈로그가 바뀌어도 예제는 옛 스키마를 가리킨 채 남는다. 켜면 예제가 카탈로그에서 렌더되므로 둘이 함께 움직이고, 같은 게이트로 조인 키 교정과
      검증 규칙도 함께 켜진다.
    summary: 프롬프트의 SQL 예제를 카탈로그 정본에서 만들어 넣을지.
    behavior: >-
      예제를 코드에 박아 두는 대신 카탈로그에서 렌더한다. 같은 게이트로 조인 키 교정과
      검증 규칙이 함께 움직인다 — 예제와 검증은 따로 놀면 안 되기 때문이다.
    options:
      - value: "false"
        label: 기본
        effect: 기존 예제를 그대로 쓴다. 프롬프트가 바이트 단위로 무변경이다.
      - value: "true"
        effect: 카탈로그에서 예제를 렌더하고 조인 키를 교정한다. 카탈로그가 바뀌면 예제도 함께 따라온다.
    performance: 렌더 비용은 무시할 수준이다.
    stability: 예제와 검증 규칙이 함께 켜지도록 묶여 있어, 한쪽만 바뀌어 어긋나는 일은 없다.
    related: [TEXT2SQL_HYPERNYM_AMBIGUITY]

  TEXT2SQL_MULTI_FULL_VALIDATION:
    example: >-
      멀티 DB 조회에서 없는 컬럼을 참조한 SQL이 실행 단계까지 가서 DB 오류로 드러나는 일이 있다. 켜면 실행 전에 걸러지지만, 정상 SQL이 잘못 거부될 수 있으므로 켠
      뒤 거부 로그를 확인해야 한다.
    summary: 멀티 DB 경로도 단일 경로와 같은 수준으로 SQL을 검증할지.
    behavior: >-
      멀티 경로는 간단한 검증만 하고 있었다. 켜면 단일 경로와 같은 전체 검증(테이블·컬럼
      존재 확인, 금지 조인 차단, 어댑터 훅)을 거친다.
    options:
      - value: "false"
        label: 기본
        effect: 간이 검증만 한다. 잘못된 SQL이 실행 단계까지 가서 DB 오류로 드러난다.
      - value: "true"
        effect: 실행 전에 걸러 낸다. 다만 정상 SQL이 잘못 거부될 가능성(위양성)이 있다.
    performance: 검증은 로컬 처리라 비용이 작다. 오히려 실패 SQL의 실행이 줄어 전체로는 이득일 수 있다.
    stability: >-
      위양성이 나면 되던 조회가 막힌다 — 거부 사유가 로그로 계측되므로, 켠 뒤 그 로그를
      확인해 위양성 여부를 판단한다.
    recommendation: 켠 뒤 거부 로그를 관찰하고, 위양성이 없으면 유지한다.
    related: [TEXT2SQL_PATH_PARITY]

  TEXT2SQL_PATH_PARITY:
    example: >-
      같은 질문이 단일 DB 경로에서는 되는데 멀티 DB 경로에서만 실패한다면, 한쪽에만 들어가던 프롬프트 주입이 원인일 수 있다. 켜면 양쪽이 대칭이 되고, 어느 갭이 실제로
      발동했는지는 로그로 확인할 수 있다.
    summary: 단일 경로에만 있던 프롬프트 주입을 멀티 경로에도 넣을지(그 반대도).
    behavior: >-
      한쪽 경로에만 들어가던 것들(어댑터 템플릿, 스키마 한정 규칙, 값 인덱스·양식 피벗
      블록, 선행 스코프 전달)을 반대편에도 넣어 두 경로를 대칭으로 만든다.
    options:
      - value: "false"
        label: 기본
        effect: 양쪽 프롬프트가 바이트 단위로 무변경이다.
      - value: "true"
        effect: >-
          경로 간 품질 차이가 줄어든다. 멀티 경로에서만 나던 오류가 사라질 수 있다.
          어느 갭이 실제로 발동했는지는 로그로 확인할 수 있다.
    performance: 프롬프트가 길어져 입력 토큰이 늘어난다.
    stability: >-
      단일·멀티 비대칭은 이 저장소에서 반복된 결함 원인이다. 한쪽만 고쳐 두면 같은 질문이
      경로에 따라 다르게 처리된다.
    recommendation: 켠 뒤 발동 로그로 실제 갭을 확인하고, 회귀가 없으면 유지한다.
    related: [TEXT2SQL_MULTI_FULL_VALIDATION, TEXT2SQL_MULTI_RELEVANT_GATE]
