# 설정 옵션 상세 설명 — LLM (D-191)
# 근거: src/config.py LLMConfig · docs/02_decision.md (D-127 과금 승인 게이트)

version: 1
group: llm

settings:

  LLM_PROVIDER:
    summary: 질문을 이해하고 SQL·답변을 만드는 언어 모델을 어디서 부를지.
    behavior: >-
      이 값 하나로 응답 품질·속도·비용·데이터가 나가는 범위가 모두 달라진다. 고른 공급자에
      해당하는 설정(base_url·모델명·키)만 실제로 쓰이고 나머지는 무시된다. 1단 deep_agent
      경로에서는 제어 평면이 ORCHESTRATOR_PROVIDER로 따로 지정되며, 이 값은 워커 쪽이다.
    options:
      - value: gemini
        label: 운영
        effect: >-
          Google Gemini API를 호출한다. 품질이 가장 안정적이지만 외부로 나가는 호출이고
          호출당 과금된다. 질문 내용과 스키마 정보가 외부 서비스로 전송되므로 PII 필터가
          함께 걸린다.
      - value: fabrix
        label: 사내 게이트웨이
        effect: >-
          KBGenAI FabriX를 경유한다. 사내 통제 안에서 처리되지만, 게이트웨이의 PII 필터에
          걸려 요청이 차단될 수 있다(차단 원인 덤프는 logs/pii_block/에 남는다).
      - value: ollama
        label: 로컬
        effect: >-
          같은 망의 Ollama 서버로 부른다. 외부 유출도 과금도 없지만, 모델 크기에 따라
          품질 차이가 크고 응답이 느릴 수 있다. 개발·폐쇄망 검증용이다.
      - value: mlx
        label: 맥북 로컬 테스트
        effect: >-
          같은 맥(Apple Silicon)에 따로 띄운 mlx_lm.server를 부른다. 외부 유출도 과금도
          없고 토큰 단위 스트리밍이 실제로 흐른다. 9B급 로컬 모델이라 정확도·지연은 운영과
          다르다 — 기능 검증용이며 그 수치를 운영 기준선으로 쓰지 않는다. 서버가 떠 있지
          않으면 기동은 되고 질의에서 연결 오류가 난다.
    example: >-
      운영 .env는 gemini다. 이 값을 ollama로 바꾸면 과금은 사라지지만 SQL 생성 정확도가
      떨어져 재시도가 늘고, 결과적으로 체감 응답이 더 느려지는 경우가 흔하다 — 모델 교체는
      비용만이 아니라 재시도율까지 함께 봐야 한다.
    performance: >-
      외부 API는 네트워크 왕복과 상대 서버 대기가 붙고, 로컬 모델은 GPU/CPU 자원에 좌우된다.
      작은 로컬 모델은 한 번의 호출은 빨라도 형식 오류로 재시도가 붙어 총 시간이 더 걸리기도 한다.
    stability: >-
      공급자를 바꾸면 프롬프트가 같아도 출력 형태가 달라진다. 유사어 매핑·의도 분류처럼
      LLM 출력에 의존하는 판정이 함께 흔들리므로, 교체 뒤에는 대표 질의로 회귀를 확인한다.
    recommendation: >-
      운영은 gemini 또는 fabrix를 유지한다. 바꾸기 전에 해당 공급자의 키·base_url이
      채워져 있는지 먼저 확인한다 — 비어 있으면 기동은 되고 호출에서 실패한다.
    caveats:
      - gemini·fabrix는 외부 과금 경로다. 테스트 실행도 승인 대상이다(D-127).
      - 알람 워커는 기동 시점의 설정을 붙들고 있어, 설정 리로드로는 질의 경로만 바뀌고 워커는 재시작까지 이전 공급자를 쓴다.
    related: [LLM_MODEL, LLM_GEMINI_MODEL, LLM_FABRIX_CHAT_MODEL, LLM_OLLAMA_BASE_URL, LLM_MLX_BASE_URL, WORKER_PROVIDER_OVERRIDE]
    references:
      - docs/02_decision.md (D-127)
      - docs/pii_filtering_rules.md

  LLM_MODEL:
    example: >-
      8B 모델로 EAV 구조 조회를 시키면 조인을 빠뜨린 SQL이 자주 나온다. 검증에서 걸려 재시도가 붙으므로 호출은 한 번이 아니라 두세 번이 되고, 결국 큰 모델보다
      느려지는 경우가 생긴다 — 모델 크기는 비용만이 아니라 재시도율까지 함께 봐야 한다.
    summary: 오픈소스(Ollama) 경로에서 쓸 모델 이름.
    behavior: >-
      LLM_PROVIDER=ollama일 때만 쓰인다. gemini·fabrix를 쓰는 중이면 이 값을 바꿔도
      아무 일도 일어나지 않는다 — 그쪽은 각각 LLM_GEMINI_MODEL·LLM_FABRIX_CHAT_MODEL이다.
    options:
      - value: "llama3.1:8b"
        label: 기본
        effect: 8B급 모델. 가볍고 빠르지만 복잡한 스키마에서 SQL 생성 정확도가 떨어진다.
      - value: "llama3.1:70b"
        effect: 품질이 크게 올라가지만 GPU 메모리 요구가 커지고 응답이 몇 배 느려진다.
      - value: "qwen2.5-coder:14b"
        effect: 코드·SQL 생성에 특화된 계열. 같은 크기 대비 SQL 품질이 나은 편이다.
    performance: 모델이 클수록 토큰당 생성 시간이 길어진다. 타임아웃(LLM_OLLAMA_TIMEOUT)을 함께 조정해야 한다.
    stability: >-
      Ollama 서버에 그 모델이 실제로 내려받아져 있어야 한다. 없는 이름을 적으면 기동은
      성공하고 첫 질의에서 실패한다.
    recommendation: 사용 가능한 GPU 메모리 안에서 가장 큰 코드 특화 모델을 고른다.
    related: [LLM_PROVIDER, LLM_OLLAMA_BASE_URL, LLM_OLLAMA_TIMEOUT]

  LLM_OLLAMA_BASE_URL:
    example: >-
      GPU 장비를 따로 두고 이 주소만 바꾸면 본체는 그대로 두고 모델만 옮길 수 있다. 다만 주소가 틀려도 기동은 성공하므로, 바꾼 뒤 질의를 한 번 던져 확인해야 한다.
    summary: Ollama 서버 주소.
    behavior: LLM_PROVIDER=ollama일 때 호출 대상이다. 다른 공급자를 쓰는 중이면 무시된다.
    options:
      - value: "http://localhost:11434"
        label: 기본
        effect: 같은 장비에서 도는 Ollama에 붙는다.
      - value: "http://<원격주소>:11434"
        effect: 별도 GPU 장비를 쓴다. 네트워크 왕복이 응답 시간에 더해진다.
    performance: 원격이면 왕복 지연이 매 호출에 얹힌다. 생성 시간에 비하면 대개 작은 몫이다.
    stability: 주소가 틀려도 기동은 되고 질의 시점에 실패한다 — 바꾼 뒤에는 질의를 한 번 던져 확인한다.
    related: [LLM_PROVIDER, LLM_MODEL]

  LLM_OLLAMA_TIMEOUT:
    example: >-
      70B 모델로 긴 프롬프트를 처리하면 생성에 2분 넘게 걸리기도 한다. 타임아웃이 60초면 정상 생성 중인데도 끊기고 재시도가 붙어, 결국 더 오래 걸린 뒤 실패한다.
    summary: Ollama 요청을 얼마나 기다릴지(초).
    behavior: >-
      모델이 크고 프롬프트가 길수록 생성에 오래 걸린다. 이 시간을 넘기면 실패로 처리되고,
      재시도 예산이 남아 있으면 다시 시도한다.
    options:
      - value: "180"
        label: 기본
        effect: 3분. 8B급 모델에 넉넉한 값이다.
      - value: "60 이하"
        effect: >-
          큰 모델이나 긴 프롬프트에서 정상 생성 중인데도 끊긴다. 재시도가 붙으면 오히려
          총 시간이 더 걸린다.
      - value: "300 이상"
        effect: >-
          느린 모델도 완주하지만, 서버가 응답하지 않는 상황에서 사용자가 5분을 기다린 뒤에야
          실패를 본다.
    performance: 길게 잡으면 실패 확정까지 그만큼 걸리고 그동안 처리 슬롯이 점유된다.
    stability: 응답시간 목표(단순 질의 10초)와 이 값의 간극이 크다 — 이 값은 최악의 경우를 위한 상한이지 기대치가 아니다.
    recommendation: 쓰는 모델로 실제 생성 시간을 재고, 그 두 배쯤으로 잡는다.
    related: [LLM_MODEL, LLM_PROVIDER]

  LLM_GEMINI_MODEL:
    example: >-
      모델 세대가 바뀌어 기존 이름이 폐기되면, 설정은 그대로인데 어느 날부터 모든 질의가 실패한다. 기동 시에는 드러나지 않고 첫 질의에서 인증·모델 오류로 나타난다.
    summary: Gemini 경로에서 쓸 모델 이름.
    behavior: LLM_PROVIDER=gemini일 때만 쓰인다. 비워 두면 클라이언트 기본 모델이 쓰인다.
    performance: 모델 등급에 따라 지연과 호출 단가가 함께 달라진다.
    stability: 존재하지 않는 모델명을 적으면 질의 시점에 실패한다. 모델 세대가 바뀌면 이름도 함께 갱신해야 한다.
    recommendation: 사용 중인 계정에서 실제로 접근 가능한 최신 모델명을 적는다.
    caveats:
      - 외부 과금 경로다. 모델을 바꾼 뒤 검증 호출도 승인 대상이다(D-127).
    related: [LLM_PROVIDER, LLM_GEMINI_API_KEY]

  LLM_GEMINI_API_KEY:
    example: >-
      키가 비어 있어도 서버는 정상 기동한다. 첫 질의에서야 인증 실패가 나므로, 배포 직후 질의 한 번으로 확인하는 절차가 필요하다.
    summary: Gemini API 키 — .encenv에서 관리한다.
    behavior: >-
      시크릿이라 이 화면에서 편집할 수 없다. .env를 고쳐도 반영되지 않으며,
      .encenv를 직접 편집한 뒤 재시작해야 한다.
    stability: 키가 비어 있으면 기동은 성공하고 첫 질의에서 인증 실패한다.
    related: [LLM_PROVIDER, LLM_GEMINI_MODEL]

  LLM_FABRIX_BASE_URL:
    example: >-
      주소가 맞아도 요청 내용에 개인정보로 보이는 문자열이 있으면 게이트웨이가 차단한다. 이때 실패는 주소 문제가 아니므로, logs/pii_block/의 덤프를 봐야 원인이
      드러난다.
    summary: FabriX(KBGenAI) 게이트웨이 주소.
    behavior: LLM_PROVIDER=fabrix일 때 호출 대상이다.
    stability: >-
      게이트웨이가 PII 필터를 거느리므로, 주소가 맞아도 요청 내용 때문에 차단될 수 있다.
      차단 진단용 덤프는 logs/pii_block/에 남고 서버 밖으로 나가지 않는다.
    related: [LLM_PROVIDER, LLM_FABRIX_CHAT_MODEL, LLM_FABRIX_API_KEY]
    references:
      - docs/pii_filtering_rules.md

  LLM_FABRIX_CHAT_MODEL:
    example: >-
      게이트웨이가 제공하는 모델 목록에서 특정 모델이 내려가면 그 순간부터 전 질의가 실패한다 — 우리 설정은 그대로이므로 공지를 함께 추적해야 한다.
    summary: FabriX 경로에서 쓸 채팅 모델 이름.
    behavior: LLM_PROVIDER=fabrix일 때만 쓰인다. 게이트웨이가 제공하는 모델 목록 안에서 골라야 한다.
    performance: 모델 등급이 지연과 품질을 좌우한다.
    stability: 게이트웨이에서 그 모델이 내려가면 질의가 전부 실패한다 — 모델 변경 공지를 함께 추적한다.
    related: [LLM_PROVIDER, LLM_FABRIX_BASE_URL]

  LLM_FABRIX_API_KEY:
    example: >-
      이 화면에서 값을 고쳐 저장해도 반영되지 않는다. `.encenv`를 직접 편집하고 서버를 재시작해야 한다 — '분명히 바꿨는데 그대로'인 대표 사례다.
    summary: FabriX API 키 — .encenv에서 관리한다.
    behavior: 시크릿이라 이 화면에서 편집할 수 없다. .encenv를 고치고 재시작해야 반영된다.
    related: [LLM_PROVIDER, LLM_FABRIX_CLIENT_KEY]

  LLM_FABRIX_CLIENT_KEY:
    example: >-
      API 키와 짝을 이루는 값이라 하나만 갱신하면 인증이 실패한다. 벤더에서 재발급받을 때는 두 값을 함께 교체한다.
    summary: FabriX 클라이언트 키 — .encenv에서 관리한다.
    behavior: API 키와 함께 쓰이는 전송 인증 크레덴셜이다. 시크릿이라 이 화면에서 편집할 수 없다.
    related: [LLM_PROVIDER, LLM_FABRIX_API_KEY]

  LLM_FABRIX_LLM_CONFIG:
    summary: FabriX 결정적 경로(SQL 생성·분류 등 중간 호출)의 하이퍼파라미터 프로파일 — JSON 문자열.
    behavior: >-
      LLM_PROVIDER=fabrix일 때 KBGenAI 요청 body의 llmConfig(temperature·top_k·top_p)로
      전송된다(D-194). SQL 생성·의도 분류 등 최종 응답 합성 전의 모든 호출에 적용된다.
      비워 두면 llmConfig 필드 자체를 보내지 않아 D-194 이전 페이로드와 바이트 동일하고,
      FabriX 서버 기본값으로 동작한다. 값은 dict가 아니라 JSON 객체 "문자열"이다 —
      기동 시점에 JSON 유효성을 검증해 오탈자를 명확히 실패시킨다.
    example: >-
      '{"temperature": 0.0}'으로 두면 같은 질문에 같은 SQL이 나올 확률이 올라간다. 반대로
      이 값을 높이면 SQL 형태가 흔들려 검증 실패·재시도가 늘어난다 — SQL 경로는 낮은 온도
      유지가 원칙이다(Known Mistakes: LLM 비결정성).
    performance: >-
      temperature가 높을수록 생성 SQL의 변동성이 커져 검증 재시도(예산 3회)가 붙을 수 있다 —
      호출 수가 늘어 총 응답 시간이 길어진다.
    stability: >-
      JSON 오탈자는 기동 시점에 실패한다(침묵 폴백 금지). 알람 워커는 기동 캡처 config라
      설정 리로드로는 질의 경로만 바뀌고 워커는 재시작까지 이전 값을 쓴다.
    recommendation: >-
      운영은 비워 두거나(서버 기본값) temperature 0.0 부근의 낮은 값으로 고정한다.
      응답 다양성 조정은 이 키가 아니라 LLM_FABRIX_ANSWER_LLM_CONFIG에서 한다.
    related: [LLM_PROVIDER, LLM_FABRIX_ANSWER_LLM_CONFIG, LLM_FABRIX_CHAT_MODEL]
    references:
      - docs/02_decision.md (D-194)

  LLM_FABRIX_ANSWER_LLM_CONFIG:
    summary: FabriX 최종 사용자 응답 합성 전용 하이퍼파라미터 프로파일 — JSON 문자열.
    behavior: >-
      최종 응답을 합성하는 3곳(output_generator 단일 DB · result_aggregator 멀티 DB 최종
      합성 · general_inference — D-009 USER_RESPONSE_TAG 경계와 동일)에서만 쓰인다.
      비워 두면 LLM_FABRIX_LLM_CONFIG로 폴백한다. D-062 중간 합성은 최종 합성의 재료라
      결정적 프로파일을 유지한다.
    example: >-
      '{"temperature": 0.4}'로 두면 같은 데이터라도 답변 문장이 매번 조금씩 달라져 자연스러움이
      올라간다. 다만 표 형식·수치 표현의 변동성도 함께 커지므로 0.3~0.5에서 시작해
      대표 질의로 확인하며 올리는 것이 안전하다(D-194 주의).
    performance: 응답 합성 1회 호출에만 적용되므로 지연 영향은 미미하다.
    stability: >-
      온도를 올리면 표 형식·수치 변동성이 커진다 — 후단에 표 정규화(D-187)·연도 가드(D-186)가
      있지만 과신하지 말 것. JSON 오탈자는 기동 시점에 실패한다.
    recommendation: 비워 두고 시작해, 응답이 딱딱하다는 피드백이 있을 때 0.3~0.5부터 시도한다.
    related: [LLM_FABRIX_LLM_CONFIG, LLM_PROVIDER]
    references:
      - docs/02_decision.md (D-194)

  LLM_OLLAMA_API_KEY:
    example: >-
      Ollama에 직접 붙는 구성이면 비워 두는 것이 정상이다. 앞단에 인증 게이트웨이를 둔 경우에만 필요하며, 비어 있으면 LLM_API_KEY 값으로 보정된다.
    summary: Ollama 게이트웨이 인증 키 — .encenv에서 관리한다.
    behavior: >-
      Ollama 앞단에 인증이 걸린 게이트웨이를 둔 구성에서만 쓴다. 직접 붙는 구성이면
      비워 둔다. 값이 비어 있으면 LLM_API_KEY로 보정된다.
    related: [LLM_PROVIDER, LLM_OLLAMA_BASE_URL]

  LLM_FABRIX_TOTAL_TIMEOUT:
    summary: FabriX 호출 1건이 아무리 오래 걸려도 이 시간(초)에서 강제로 끊는 벽시계 상한.
    behavior: >-
      기존 timeout(300초)은 "읽기 1회당 간격"이라, FabriX가 연결을 유지한 채
      하트비트(STATUS/SYNC)만 계속 보내면 타이머가 매번 리셋되어 호출이 무기한이
      된다 — 2026-09-07 성능테스트에서 1시간 넘는 무한대기의 근본 원인으로 실측
      확정된 경로다(D-198). 이 값은 그와 무관하게 호출 시작부터의 총 경과 시간으로
      끊는다. 발화하면 경과 시간·수신 라인 수·마지막 event_status가 ERROR 로그로
      남아 FabriX 쪽 상태를 판정할 증거가 된다.
    example: >-
      FabriX 모델 큐가 정체된 날, 종전에는 질의가 1시간 넘게 "처리 중"으로 매달려
      사용자가 수동 중단해야 했다. 이 상한이 있으면 300초에서 호출이 실패로 떨어지고
      재시도 예산(3회) 또는 에러 응답으로 이어진다 — 무한이 유한이 된다.
    performance: >-
      정상 응답에는 영향이 없다. 서버 응답 가드(API_QUERY_TIMEOUT 60초 /
      API_FILE_QUERY_TIMEOUT 120초)가 사용자 응답을 먼저 끊으므로, 이 상한이 실제로
      끊는 것은 백그라운드에 남은 잔여 호출이다.
    stability: >-
      너무 낮추면(예: 60초 미만) 대형 프롬프트의 정상 응답까지 끊겨 재시도가 늘어난다.
      SSE 가드의 유령 태스크 수명도 이 값이 보장하므로 0이나 과대값으로 두면 안 된다.
    recommendation: >-
      기본 300초 유지. FabriX 정체가 잦으면 낮추기보다 먼저 ERROR 로그의 수신
      라인·event_status로 게이트웨이 상태를 FabriX 운영 측과 대조한다.
    caveats:
      - 읽기가 완전히 침묵하는 구간에서는 read 타임아웃(300초)만큼 발화가 늦어질 수 있다.
      - ollama·gemini·구 FabriX(OpenAI 호환) 경로에는 적용되지 않는다(D-198 후속).
    related: [API_QUERY_TIMEOUT, API_FILE_QUERY_TIMEOUT, LLM_PROVIDER]
    references:
      - docs/02_decision.md (D-198)

  LLM_MLX_BASE_URL:
    summary: 맥북 로컬 MLX 서버(mlx_lm.server)의 /v1 주소.
    behavior: >-
      LLM_PROVIDER=mlx일 때 호출 대상이다. 다른 공급자를 쓰는 중이면 무시된다. 앱은 모델을
      직접 적재하지 않고 이 주소의 OpenAI 호환 API로 붙는다 — 서버는 앱과 따로 띄운다.
    example: >-
      서버를 --port 8081로 띄웠는데 이 값이 8080이면 기동은 성공하고 첫 질의에서 연결 오류가
      난다. python -m scripts.scenario --preflight가 질의 전에 도달 여부를 알려 준다.
    options:
      - value: "http://127.0.0.1:8080/v1"
        label: 기본
        effect: 같은 맥에서 기본 host·port로 띄운 서버에 붙는다.
      - value: "http://<다른 맥>:8080/v1"
        effect: >-
          다른 맥의 서버를 쓴다. 서버가 인증 없이 열려 있고 CORS가 전부 허용이므로
          신뢰 구간 안에서만 쓴다.
    stability: >-
      서버는 무인증이다. 127.0.0.1이 아닌 주소로 띄우면 같은 망의 누구나 호출할 수 있다.
    recommendation: 서버를 127.0.0.1로 띄우고 기본값을 유지한다.
    related: [LLM_PROVIDER, LLM_MLX_MODEL, ORCHESTRATOR_BASE_URL]
    references:
      - docs/03_setup_guide.md (MLX 로컬 LLM)

  LLM_MLX_MODEL:
    summary: MLX 서버에 요청할 모델 ID — 서버 --model과 같은 값으로 둔다.
    behavior: >-
      비워 두면 default_model을 보내고 서버가 자기 --model로 바꿔 처리한다. 값을 적으면 그 ID로
      요청하는데, 서버에 적재된 모델과 다르면 서버가 그 모델로 가중치를 다시 적재한다.
    example: >-
      워커는 mlx-community/Qwen3.5-9B-OptiQ-4bit, 오케스트레이터는 다른 모델로 두면 두 평면이
      번갈아 호출될 때마다 서버가 3.6~5.3초씩 가중치를 갈아 끼운다. 한 모델로 맞추면 사라진다.
    options:
      - value: "(비움)"
        effect: >-
          default_model을 보낸다. 재적재는 없지만 응답에 실린 모델명도 default_model이라
          산출물에서 어떤 모델로 돌았는지 알 수 없다.
      - value: "mlx-community/Qwen3.5-9B-OptiQ-4bit"
        label: 권장
        effect: 서버 --model과 같게 두면 재적재 없이 산출물에 실제 모델명이 남는다.
    stability: >-
      틀린 ID는 서버를 HF_HUB_OFFLINE=1로 띄웠을 때 첫 요청에서 바로 404로 실패한다. 이 변수
      없이 띄우면 서버가 그 ID를 내려받으려 해 수 GB 다운로드가 조용히 시작될 수 있다.
    related: [LLM_MLX_BASE_URL, ORCHESTRATOR_MODEL]

  LLM_MLX_MAX_TOKENS:
    summary: MLX 서버 요청 1건의 최대 생성 토큰 수.
    behavior: >-
      요청마다 이 값을 보낸다. 보내지 않으면 서버 기본값 512토큰에서 응답이 잘리는데,
      잘린 응답을 감지하는 코드가 없어 조용히 통과한다. ORCHESTRATOR_PROVIDER=mlx일 때
      오케스트레이터 요청도 이 값을 쓴다.
    example: >-
      400줄짜리 표를 만들게 했을 때 이 값을 보내지 않으면 정확히 512토큰(151번째 줄)에서
      끊겼고, 4096으로 보내면 1,492토큰으로 끝까지 나왔다(2026-09-17 실측).
    options:
      - value: "4096"
        label: 기본
        effect: 일반 응답과 중간 규모 표에 충분하다. 최대로 쓰면 생성에 약 86초가 걸린다.
      - value: "512 이하"
        effect: 긴 표·SQL이 중간에서 잘린다.
    performance: 최대치까지 생성하면 초당 약 48토큰이라 4096토큰에 약 86초다.
    related: [LLM_MLX_TIMEOUT, LLM_PROVIDER, ORCHESTRATOR_PROVIDER]

  LLM_MLX_TIMEOUT:
    summary: MLX 서버 요청 1건을 얼마나 기다릴지(초).
    behavior: >-
      이 시간을 넘기면 요청이 실패한다. 서버가 처음 보는 긴 프롬프트는 전부 새로 읽어야
      해서(콜드 prefill) 수 분이 걸릴 수 있고, 같은 앞부분을 다시 보내면 1초 안에 끝난다.
    example: >-
      스키마를 포함한 16K토큰 프롬프트는 서버 기동 직후 첫 요청에 44초, 64K토큰은 203초가
      걸렸고 같은 프롬프트 재요청은 0.4~2.1초였다(2026-09-17 실측). 60초로 두면 첫 질의가
      정상 처리 중에 끊긴다.
    options:
      - value: "600"
        label: 기본
        effect: 약 10만 토큰 프롬프트의 콜드 처리(약 310초)와 최대 생성(약 86초)을 합친 최악을 덮는다.
      - value: "120 이하"
        effect: 서버 기동 직후 첫 질의나 긴 스키마 질의가 정상 처리 중에 끊긴다.
    stability: >-
      요청 전체 상한 API_QUERY_TIMEOUT이 더 짧으면 이 값보다 먼저 끊긴다. 서버를 띄운 뒤
      질의 한 번으로 캐시를 채우고 검증을 시작한다.
    related: [LLM_MLX_MAX_TOKENS, API_QUERY_TIMEOUT]

  LLM_MLX_ENABLE_THINKING:
    summary: MLX 서버 모델의 추론(thinking) 모드 켜기 여부.
    behavior: >-
      요청마다 chat_template_kwargs.enable_thinking으로 보낸다. 모델이 이 변수를 쓰지 않으면
      무시된다. 켜면 모델이 답을 쓰기 전에 추론 텍스트를 만드는데, 앱은 그 추론 필드를 읽지 않는다.
    example: >-
      Qwen3.5-9B에서 이 토글을 보내지 않았더니 43초 동안 2,048토큰을 전부 추론에 쓰고
      응답 본문이 빈 문자열이었다. false로 보내면 같은 질문이 0.4초에 SQL로 답했다(2026-09-17 실측).
    options:
      - value: "false"
        label: 기본
        effect: 추론 없이 바로 답한다. 응답이 빠르고 본문이 비지 않는다.
      - value: "true"
        effect: 생성 예산을 추론에 먼저 써서 응답 본문이 비거나 잘릴 수 있다.
    recommendation: false를 유지한다(D-042 no-think 방침과 같다).
    related: [LLM_MLX_MAX_TOKENS, ORCHESTRATOR_ENABLE_THINKING]
