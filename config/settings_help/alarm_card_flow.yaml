# 설정 옵션 상세 설명 — 알람 카드 읽는 순서 (plans/201 W5 §7.4 P3 · D-354)
# 근거: src/config/services.py AlarmCardFlowConfig · src/api/routes/alarm.py alarm_capabilities · src/static/js/app.js

version: 1
group: alarm_card_flow

settings:

  ALARM_CARD_FLOW_ENABLED:
    summary: 이벤트 알람 카드의 칸을 「무슨 일인가 → 원인이 내 쪽인가 → 무엇을 하나」 순으로 다시 묶을지.
    behavior: >-
      켜면 알람 카드의 기존 칸이 ① 무슨 일인가(요약·패턴 분석·사건 묶음) ② 원인이 내 쪽인가(조사·영향 프로세스·추정 원인)
      ③ 무엇을 하나(권고 조치·추천 질의·확인·「이 알람이 유용했나요?」) 세 묶음으로 옮겨지고, 맨 위에 진행 표시 한 줄
      (인지 → 분석 → 조치)이 붙는다. 인지는 카드가 보일 때, 분석은 조사 결과를 펼쳤을 때, 조치는 확인·인계 요약 복사·추천
      질의 중 하나를 눌렀을 때 켜진다. 진행 상태는 이 브라우저에만 저장되고 서버로 보내지 않는다. 담당 업무와 무관하게
      모든 사용자에게 같다.
    options:
      - value: "false"
        label: 기본
        effect: 알람 카드의 칸 순서와 알람 기능 조회 응답이 종전과 같다.
      - value: "true"
        effect: 칸을 더하거나 빼지 않고 순서와 묶음만 바뀐다. 노이즈 관제 드로어는 바뀌지 않는다.
    caution: >-
      재시작해야 반영된다. 일상 반복 알람의 추천 질의 접기, 조사 결과는 펼칠 때만 조회, 「조사 안 됨 + [조사 시작]」,
      피드백 기능이 꺼졌을 때 피드백 버튼 미표시는 켜도 그대로다.
    example: >-
      CPU 경고 카드는 「① 무슨 일인가」에 요약과 패턴 분석이, 「② 원인이 내 쪽인가」에 조사 칸과 영향 프로세스가,
      「③ 무엇을 하나」에 권고 조치와 [확인] 버튼이 모인다.
