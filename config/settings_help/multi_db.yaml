# 설정 옵션 상세 설명 — 멀티 DB (D-191)
# 근거(코드 실측): src/config.py MultiDBConfig · src/api/routes/query.py
#   (_zone_group_exclusive_or_none · _zone_clarification_or_none · _scope_narrowed_or_none)
#   src/utils/query_gen_common.py(ZONE_CLARIFY_OPTIONS·ZONE_GROUP_EXCLUSIVE_QUESTION)
#   src/routing/execution_groups.py(partition_execution_groups) · src/domain/scope_select.py

version: 1
group: multi_db

settings:

  ZONE_GROUP_EXCLUSIVE:
    summary: 은행존과 공동존을 한 번에 조회하지 못하게 막는다 — 섞이면 에러 대신 존 선택 창을 다시 띄운다.
    behavior: >-
      조회 대상 존은 세 곳이다 — 은행존(polestar_b0) · 공동존 김포(polestar_cm_gp) ·
      공동존 여의도(polestar_cm_yd). 이 값이 켜져 있으면 은행존과 공동존을 **동시에**
      고르는 것만 막는다. 공동존끼리(김포+여의도)는 언제나 함께 조회할 수 있고, 존을
      하나만 고르는 질의는 이 게이트와 무관하다.
      감지는 두 갈래로 결정적으로 이루어진다. ①**선택 목록이 섞인 경우** — 화면에서
      고른 목록이든 API를 직접 호출해 보낸 목록이든 은행존과 공동존이 함께 들어 있으면
      걸린다(화면 게이트는 인가가 아니므로 서버가 다시 본다). ②**질문 문장이 섞인 경우** —
      "은행존"·"은행"·"레거시" 중 하나와 "공동존"·"김포"·"여의도" 중 하나가 **둘 다**
      나오면 걸린다. 한쪽 표면어만 있으면 발동하지 않는다.
      걸리면 요청을 실패시키지 않고 **존 선택 화면을 다시 띄운다**. 이때 나오는 문구는
      *"은행존과 공동존은 동시에 조회할 수 없습니다(담당 영역 분리). 아래에서 조회할 존을
      선택해 주세요. (공동존은 김포/여의도 복수 선택 가능)"* 이고, 사용자가 다시 고르면
      원문 질의가 그대로 재전송되어 이어진다. 양식 파일을 올린 경로에도 같은 게이트가
      대칭으로 걸리며(파일은 보관됐다가 재전송된다), 첫 턴·후속 턴을 가리지 않고 가장
      먼저 판정한다.
    options:
      - value: "true"
        label: 기본 (동시 조회 차단)
        effect: >-
          은행존과 공동존이 섞이면 조회하지 않고 존 선택 창을 다시 띄운다. 선택지는
          활성 DB(ACTIVE_DB_IDS)에 있는 존만 나오며, 은행존을 고르면 공동존 항목이
          함께 선택되지 않는다.
      - value: "false"
        effect: >-
          섞인 대상을 그대로 받아 **여러 존을 순회 조회한다**. 순서는 레지스트리에 선언된
          질의 순서(은행존 → 공동존)를 따르며, 질문에 나온 순서나 라우터 점수와 무관하게
          항상 같다. 존 선택 창 문구도 *"(복수 선택 가능 — 전체는 모두 선택)"* 으로 바뀐다.
    example: >-
      "은행존과 김포 서버 CPU 상위 10건"이라고 물으면, 켜져 있을 때는 조회가 시작되지
      않고 *"은행존과 공동존은 동시에 조회할 수 없습니다"* 라는 문구와 함께 존 선택 창이
      뜬다. 거기서 "은행존"만 고르면 원래 질문이 은행존 대상으로 다시 실행된다.
      꺼져 있으면 같은 질문이 은행존 → 김포 순서로 두 번 조회되고 결과가 합쳐진다.
      한편 존을 아예 말하지 않은 전수 조회("전체 서버 CPU 사용률")는 이 게이트가 아니라
      **범위 사전 선택 역질문**(COMPOSITE_SCOPE_SELECT_ENABLED)이 먼저 "범위를 좁히시겠습니까?"
      를 묻는다 — 답하지 않아도 전체 조회로 진행된다. 그렇게 범위를 좁혀 조회한 뒤에는
      *"은행존은 조회하지 않았습니다. 전체 범위로 다시 조회할까요?"* 라는 사후 패널이 붙어
      되돌릴 수 있다.
    performance: >-
      켜 두면 섞인 요청이 조회 전에 걸리므로 낭비되는 조회가 없다. 끄면 존 수만큼 조회가
      순차로 늘어난다 — 두 존이면 응답 시간이 대략 두 배가 되고, 각 존마다 기본 LIMIT
      (QUERY_DEFAULT_LIMIT)이 따로 걸려 결과량도 함께 늘어난다.
    stability: >-
      기본이 켜짐인 데는 두 가지 근거가 있다. ①담당 조직이 나뉘어 있어 두 존을 한 번에
      보는 실수요가 확인되지 않았다. ②은행존+공동존 조합에서 사내 게이트웨이의 개인정보
      필터가 공동존 쪽 생성 요청을 차단하는 미종결 이슈가 있다 — 끄면 그 조합에서
      조회가 실패할 수 있다. 원인이 해소되면 끄는 것을 재검토할 값이다.
    recommendation: >-
      켠 채로 둔다. 두 존을 함께 봐야 하는 업무가 실제로 생겼고 게이트웨이 필터 이슈가
      해소됐음을 확인한 뒤에만 끈다.
    caveats:
      - 화면에서 막는 것과 별개로 서버가 다시 검사한다 — API를 직접 호출해도 우회되지 않는다.
      - 공동존끼리(김포+여의도)는 이 설정과 무관하게 언제나 함께 조회할 수 있다.
      - 끄더라도 조회 순서는 레지스트리 선언 순서로 고정이다(재현 가능성을 위해 입력 순서에 의존하지 않는다).
    related: [ACTIVE_DB_IDS, COMPOSITE_SCOPE_SELECT_ENABLED, QUERY_DEFAULT_LIMIT, POLESTAR_DB_IDS]
    references:
      - docs/02_decision.md (D-143 후속3 · D-176 후속4)

  ACTIVE_DB_IDS:
    summary: 조회 대상으로 등록할 DB 목록 — 이 값이 실행 경로와 존 선택지를 함께 결정한다.
    behavior: >-
      쉼표로 구분한 DB 식별자 목록이다. 세 가지가 이 값에 달려 있다.
      ①**조회 대상** — 여기 없는 DB는 조회되지 않는다. ②**존 선택 창의 선택지** —
      은행존·공동존 김포·공동존 여의도 중 이 목록에 있는 것만 버튼으로 나온다(셋 다
      없으면 존 선택 창 자체가 뜨지 않는다). ③**실행 경로** — 시멘틱 라우팅과 의도
      오케스트레이션 플래그를 미설정(자동)으로 두면 이 목록의 등록 여부로 켜고 끄기가
      자동 결정된다.
    options:
      - value: "polestar"
        label: 운영 실제값
        effect: 로컬 샌드박스 하나만 등록된 상태다. 존 선택 창은 뜨지 않고 단일 DB 경로로 처리된다.
      - value: "polestar_b0,polestar_cm_gp,polestar_cm_yd"
        effect: 세 존이 모두 조회 대상이 된다. 존 선택 창에 세 버튼이 모두 나오고, 존을 지정하지 않은 질의는 범위 역질문 대상이 된다.
      - value: "(비움)"
        effect: >-
          조회 대상이 없다. 라우팅 플래그를 자동으로 둔 경우 시멘틱 라우팅이 꺼져
          4단(legacy) 경로로 내려간다 — 설정을 바꾼 적이 없는데 동작이 달라지는 대표 경로다.
    example: >-
      여기에 공동존 두 곳을 추가하면, 그 순간부터 "전체 서버" 질의가 두 존을 순회하게
      되고 존 선택 창에 버튼이 두 개 늘어난다. 라우팅 플래그를 명시해 두지 않았다면
      실행 경로까지 함께 바뀐다 — DB를 하나 붙였을 뿐인데 응답 형태가 달라지는 이유가 이것이다.
    performance: 등록된 DB가 늘수록 순회 조회 대상이 늘어난다. 존 하나가 곧 조회 한 번이다.
    stability: >-
      그래프 토폴로지를 결정하므로 변경 영향이 가장 큰 설정 중 하나다. 신규 DB를 편입할
      때는 이 값과 `config/db_registry.yaml` 둘만 고치면 되지만, 폴스타 계열이면
      POLESTAR_DB_IDS에도 함께 넣어야 전용 프롬프트가 적용된다.
    recommendation: >-
      운영 DB를 명시하고, 라우팅 플래그(ENABLE_SEMANTIC_ROUTING·ENABLE_INTENT_ORCHESTRATION)도
      자동에 맡기지 말고 함께 명시한다 — 그래야 DB 구성을 바꿔도 경로가 흔들리지 않는다.
    caveats:
      - 사용자별 인가 목록(allowed_db_ids)이 있으면 그 교집합만 실제 조회 대상이 된다.
      - 알람 워커는 기동 시점의 값을 붙들고 있어, 설정 리로드로는 질의 경로만 바뀌고 워커는 재시작까지 이전 목록을 쓴다.
    related: [ZONE_GROUP_EXCLUSIVE, ENABLE_SEMANTIC_ROUTING, ENABLE_INTENT_ORCHESTRATION, POLESTAR_DB_IDS, AUTH_DEFAULT_ALLOWED_DB_IDS]
