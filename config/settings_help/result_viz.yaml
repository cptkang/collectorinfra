# 설정 옵션 상세 설명 — 조회 결과 그래프 보기 · 값 해석 (plans/160 · D-327)
# 근거: src/config/services.py ResultVizConfig · src/api/routes/result_viz.py

version: 1
group: result_viz

settings:

  RESULT_VIZ_CHART_ENABLED:
    summary: 조회 결과 표에 「그래프로 보기」 버튼을 붙일지.
    behavior: >-
      켜면 답변의 조회 결과가 그래프로 그릴 수 있는 모양일 때(시간 칼럼과 수치 칼럼이 있으면 선
      그래프, 범주 칼럼과 수치 칼럼이 있고 50행 이하면 막대 그래프) 답변 아래에 버튼이 뜬다.
      그래프와 데이터 격자는 버튼을 누를 때 서버에서 받아 오며, 화면 표·CSV와 같은 마스킹을 거친다.
      목록·단일 행·텍스트 위주 결과에는 버튼이 없다.
    options:
      - value: "false"
        label: 기본
        effect: 버튼이 없고 그래프 API가 닫혀 있다(현행과 같다).
      - value: "true"
        effect: 그릴 수 있는 결과에 「그래프로 보기」가 뜬다.
    caution: >-
      그래프 데이터는 서버 메모리의 최근 결과(최대 1,000건)에서 만든다. 서버를 재시작했거나 오래된
      대화를 다시 열면 「결과가 만료되었습니다」가 보인다 — 같은 질문을 다시 실행하면 된다.
    example: >-
      true로 두고 「지난 6시간 힙 메모리 추세 보여줘」라고 물으면 인스턴스별로 나뉜 선 그래프를 볼 수
      있다. 「서버 목록 보여줘」처럼 수치가 없는 결과에는 버튼이 뜨지 않는다.

  RESULT_VIZ_EXPLAIN_ENABLED:
    summary: 그래프 패널의 데이터 격자에서 칼럼 이름·값을 눌러 설명을 볼지.
    behavior: >-
      켜면 격자 머리글을 눌러 칼럼 용어 설명을, 셀을 눌러 그 값의 위치(순위·평균 대비·직전 추세)와
      해석 문장을 볼 수 있다. 끄면 격자는 그대로 보이되 머리글·셀이 링크가 아니다.
    options:
      - value: "false"
        label: 기본
        effect: 격자 머리글·셀을 눌러도 아무 일이 없다.
      - value: "true"
        effect: 용어 사전·값 해석 팝오버가 열린다.
    caution: >-
      그래프 보기(RESULT_VIZ_CHART_ENABLED)가 꺼져 있으면 격자 자체가 없으므로 이 값도 효과가 없다.
    example: >-
      true로 두면 「heap_used_mb」 머리글을 눌렀을 때 용어 사전 설명이 뜨고, 사전에 없는 칼럼은
      「사전 미등재 · LLM 생성」 표시와 함께 생성된 설명이 뜬다.
    related:
      - RESULT_VIZ_CHART_ENABLED
