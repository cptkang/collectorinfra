# 설정 옵션 상세 설명 — 노이즈 게이트: 기본 동작 · 중복/연쇄 억제 (D-191)
# 근거: src/config.py NoiseGateConfig 주석 · docs/28_noise_cancellation_operator_guide.md
# 원칙: 전 기능 기본 비활성 — 켜기 전에는 기존 알람 발송 경로가 바이트 단위로 무변경이다.

version: 1
group: noise_gate

settings:

  NOISE_ENABLE_NOISE_GATE:
    summary: 노이즈 캔슬링 전체 스위치 — 이 값이 꺼져 있으면 아래 억제 설정이 전부 무의미하다.
    behavior: >-
      켜면 들어온 알람을 4단계 티어(PAGE·TICKET·DASHBOARD·SUPPRESS)로 분류하고, 억제할
      것은 억제한 뒤 판단 근거를 감사 파일에 남긴다. 꺼져 있으면 모든 알람이 예전처럼
      그대로 통보된다.
    options:
      - value: "false"
        label: 기본
        effect: 게이트가 동작하지 않는다. 억제·티어 분류·감사가 전부 없다.
      - value: "true"
        effect: 4단계 판단이 동작한다. 통보량이 줄고 판단 근거가 감사 파일에 남는다.
    example: >-
      이 값이 꺼져 있으면 알람 카드의 피드백 버튼(유효·노이즈)을 눌러도 아무 일이
      일어나지 않는다. "피드백 비활성"이 뜨는 원인의 하나가 이것이다.
    performance: 알람마다 판단 로직이 돌지만 대부분 결정적 계산이라 비용이 작다. 실제 비용은 이력 조회·보강 쪽이다.
    stability: >-
      켜는 순간 통보량이 줄어든다 — 그중에 필요한 알람이 섞여 있지 않은지 초기에는
      억제된 목록(감사 파일)을 함께 봐야 한다. 억제된 알람은 화면에 뜨지 않으므로
      감사 파일이 유일한 확인 경로다.
    recommendation: >-
      켤 때는 억제 관련 하위 기능(플래핑·스톰·인히비션)을 한꺼번에 켜지 말고 하나씩
      켜면서 억제 결과를 확인한다.
    related: [NOISE_SUPPRESS_MAX_SEVERITY, NOISE_DECISION_STORE_ENABLED, ALARM_ENABLED]
    references:
      - docs/28_noise_cancellation_operator_guide.md

  NOISE_SUPPRESS_MAX_SEVERITY:
    example: >-
      억제 로직이 '이건 노이즈'라고 판단해도 심각도가 3이면 통보된다. 이 값을 3으로 올리면 그 안전선이 사라져, 판단이 틀렸을 때 진짜 장애 알람이 묻힐 수 있다.
    summary: 어느 심각도까지 억제를 허용할지 — 이보다 높은 알람은 무조건 통보된다.
    behavior: >-
      억제 판단이 아무리 "노이즈"라고 해도, 심각도가 이 값을 넘으면 통보한다.
      심각도 3(심각)은 항상 PAGE로 나간다는 안전선이 여기서 나온다.
    options:
      - value: "2"
        label: 기본
        effect: 경고(2) 이하만 억제 대상이다. 심각(3)은 어떤 신호가 있어도 통보된다.
      - value: "1"
        effect: 주의(1) 이하만 억제한다. 더 보수적이지만 경고 수준의 반복 알람이 그대로 나간다.
      - value: "3"
        effect: >-
          심각 알람까지 억제 대상이 된다. 진짜 장애가 억제될 수 있으므로 권장하지 않는다.
    performance: 영향 없다.
    stability: >-
      이 값은 억제 로직이 잘못 판단했을 때의 최후 방어선이다. 올리는 것은 그 방어선을
      걷어내는 일이다.
    recommendation: 기본 2를 유지한다.
    related: [NOISE_ENABLE_NOISE_GATE, ALARM_MIN_SEVERITY]

  NOISE_REPEAT_INTERVAL_SECONDS:
    example: >-
      디스크가 가득 찬 서버는 조치할 때까지 같은 알람을 계속 낸다. 4시간이면 하루 여섯 번만 상기시키고, 한 시간으로 줄이면 스물네 번이 되어 도배에 가까워진다.
    summary: 같은 알람이 계속 날 때 몇 초마다 한 번씩 다시 통보할지.
    behavior: >-
      해결되지 않은 알람이 반복해서 들어와도 매번 알리지 않는다. 이 간격이 지나면
      한 번 더 알린다 — 잊히지 않게 하되 도배하지 않는 절충이다.
    options:
      - value: "14400"
        label: 기본 (4시간)
        effect: 같은 알람은 4시간에 한 번만 다시 알린다.
      - value: "3600"
        effect: 한 시간마다 상기시킨다. 놓칠 가능성은 줄지만 통보량이 네 배가 된다.
      - value: "86400"
        effect: 하루 한 번. 조용하지만 미해결 상태를 잊기 쉽다.
    performance: 억제되면 통보 발송과 그에 딸린 처리가 생략된다.
    stability: 너무 길게 잡으면 계속 나는 문제를 아무도 다시 보지 않게 된다.
    recommendation: 기본 4시간 유지. 심각도 3은 별도 설정으로 더 짧게 잡을 수 있다.
    related: [NOISE_SEV3_REPEAT_INTERVAL_SECONDS, ALARM_DEDUP_TTL_SECONDS]

  NOISE_SEV3_REPEAT_INTERVAL_SECONDS:
    example: >-
      심각 장애 대응이 길어질 때 4시간마다 오는 재통보는 묻히기 쉽다. 30분으로 줄이면 미해결 상태가 계속 드러나지만, 이미 대응 중인 담당자에게는 방해가 될 수 있다.
    summary: 심각(3) 알람의 재통보 간격 — 일반 간격과 따로 짧게 잡을 수 있다.
    behavior: 기본값은 공통 간격과 같다. 심각 알람만 더 자주 상기시키고 싶을 때 줄인다.
    options:
      - value: "14400"
        label: 기본 (공통과 같음)
        effect: 심각 알람도 4시간에 한 번 재통보한다.
      - value: "1800"
        effect: 30분마다 상기시킨다. 미해결 심각 장애가 묻히지 않는다.
    performance: 간격이 짧을수록 통보가 늘어난다.
    stability: 심각 알람은 대응 중일 가능성이 높다 — 지나치게 짧으면 대응 중인 담당자에게 도배가 된다.
    recommendation: 운영 초기에는 기본값으로 두고, 심각 알람이 묻히는 사례가 나오면 줄인다.
    related: [NOISE_REPEAT_INTERVAL_SECONDS, NOISE_SUPPRESS_MAX_SEVERITY]

  NOISE_DEDUP_SEVERITY_RISE_BYPASS:
    summary: 같은 알람이 재통보 간격 안에 더 높은 심각도로 다시 오면 바로 다시 판정할지.
    behavior: >-
      같은 알람은 재통보 간격 동안 다시 알리지 않는다. 켜 두면 그 사이 심각도가 올라간 경우(예: 경고 2가
      심각 3이 됨)만 예외로 보아 다시 판정한다. 심각도 3은 언제나 즉시 통보(PAGE)다. 같거나 낮은 심각도의
      반복은 지금처럼 간격 동안 알리지 않는다.
    options:
      - value: "true"
        label: 기본
        effect: 심각도가 올라가면 재통보 간격과 무관하게 다시 판정한다. 같은 알람에서 최대 두 번(1→2, 2→3) 더 판정된다.
      - value: "false"
        effect: >-
          종전 동작. 같은 알람의 경고가 통보된 뒤 4시간 안에 심각 3이 와도 중복으로 보고 버린다 — 심각 장애를
          놓칠 수 있다.
    example: >-
      디스크 사용률 경고(심각도 2)가 화면에만 표시된 뒤 30분 만에 같은 디스크가 심각(3)이 되면, 켠 상태에서는 즉시
      PAGE로 알린다. 끈 상태에서는 4시간이 지날 때까지 알리지 않는다.
    performance: 심각도가 오를 때만 판정이 한 번 더 돈다.
    stability: 심각도가 오르내리기를 반복해도 같은 간격 안의 추가 통보는 최대 두 번이다.
    recommendation: 기본(켬) 유지.
    related: [NOISE_REPEAT_INTERVAL_SECONDS, NOISE_SEV3_REPEAT_INTERVAL_SECONDS]

  NOISE_SELF_HEAL_WINDOW_SECONDS:
    example: >-
      배치 작업이 돌면서 CPU가 3분간 치솟았다가 끝나면, 5분 창 안에 해소되므로 자가복구로 보고 통보하지 않는다. 창을 30분으로 늘리면 실제로 30분간 영향이 있었던
      장애까지 자가복구로 묻힌다.
    summary: 알람이 난 뒤 이 시간 안에 스스로 해소되면 자가복구로 본다.
    behavior: >-
      발생과 해소가 짧은 간격으로 붙어 있으면 사람이 개입할 필요가 없었던 일이다.
      그런 쌍을 찾아 통보 판단에 반영한다.
    options:
      - value: "300"
        label: 기본 (5분)
        effect: 5분 안에 해소되면 자가복구로 본다.
      - value: "60"
        effect: 아주 짧은 순간 장애만 자가복구로 인정한다. 대부분의 일시 장애가 그대로 통보된다.
      - value: "1800"
        effect: 30분 안에 해소되면 자가복구로 본다 — 실제로 30분간 영향이 있었던 장애까지 묻힐 수 있다.
    performance: 창이 길수록 판단을 위해 보류하는 상태가 오래 유지된다.
    stability: 자가복구로 판정된 알람은 통보되지 않는다 — 창을 넓히는 것은 그만큼의 장애를 안 알리는 결정이다.
    recommendation: 기본 5분 유지.
    related: [NOISE_DEBOUNCE_SECONDS, NOISE_RESOLVED_TO_DASHBOARD]

  NOISE_DEBOUNCE_SECONDS:
    example: >-
      상태가 안정될 때까지 기다리게 하려고 이 값을 올려도 아무 변화가 없다 — 코드가 읽지 않는다. 일시 진동을 억제하려면 NOISE_FLAPPING_ENABLED를 쓴다.
    summary: 상태가 안정될 때까지 기다리는 시간(초) — 현재 코드가 읽지 않는다.
    behavior: >-
      알람을 바로 처리하지 않고 잠깐 기다려 상태가 확정되면 처리하려는 항목이지만,
      지금 코드에는 이 값을 읽는 곳이 없다.
    performance: 영향 없다(소비되지 않음).
    stability: 영향 없다(소비되지 않음). 일시 진동을 억제하려면 플래핑 쪽 설정을 쓴다.
    related: [NOISE_FLAPPING_ENABLED, NOISE_SELF_HEAL_WINDOW_SECONDS]

  NOISE_FLAPPING_ENABLED:
    summary: 상태가 켜졌다 꺼졌다를 반복하는 알람을 억제할지.
    behavior: >-
      임계선 근처를 오르내리는 지표는 발생·해소를 반복하며 알람을 쏟아낸다. 켜면 그
      진동을 감지해 억제한다. 시작·종료 임계는 별도 항목으로 조정한다.
    options:
      - value: "false"
        label: 기본
        effect: 진동을 억제하지 않는다. 오르내릴 때마다 알람이 나간다.
      - value: "true"
        effect: 진동 상태로 판정되면 억제한다. 임계선에 걸친 서버의 알람 도배가 사라진다.
    example: >-
      CPU 임계가 80%인데 실제 사용률이 79~81%를 오가는 서버는 몇 분마다 발생·해소
      알람을 낸다. 이 기능이 그런 경우를 잡는다.
    performance: 진동 상태 추적을 위한 계산이 붙지만 비용은 작다.
    stability: >-
      진동으로 판정되면 통보가 멈춘다 — 실제로 임계선에 걸쳐 있다는 사실 자체는
      조치 대상이므로, 억제와 별개로 임계값 재조정을 검토해야 한다.
    recommendation: 임계선 진동이 실제 문제일 때 켠다.
    related: [NOISE_FLAP_HIGH_THRESHOLD, NOISE_FLAP_LOW_THRESHOLD]

  NOISE_FLAP_HIGH_THRESHOLD:
    example: >-
      CPU 임계가 80%인 서버의 실제 사용률이 79~81%를 오가면 발생·해소가 몇 분마다 반복된다. 변화율이 20%를 넘으면 진동으로 보고 억제하는데, 임계를 10으로
      낮추면 정상적인 부하 변동도 진동으로 잡힌다.
    summary: 상태 변화 비율이 이 값을 넘으면 진동 상태로 본다(%).
    behavior: 최근 상태 변화의 비율을 재고, 이 값을 넘으면 진동으로 판정해 억제를 시작한다. Nagios의 기본값을 따랐다.
    options:
      - value: "20.0"
        label: 기본
        effect: 변화율 20%를 넘으면 진동으로 본다.
      - value: "10"
        effect: 민감해진다. 몇 번만 오르내려도 진동으로 판정돼 정상 알람이 억제될 수 있다.
      - value: "40 이상"
        effect: 심하게 흔들려야 진동으로 인정한다. 웬만한 진동은 그대로 통보된다.
    performance: 영향 없다.
    stability: 진입 임계(이 값)와 해제 임계(NOISE_FLAP_LOW_THRESHOLD) 사이의 간격이 좁으면 진동 판정 자체가 진동한다.
    recommendation: 기본 20 유지. 해제 임계와 충분한 간격을 둔다.
    related: [NOISE_FLAP_LOW_THRESHOLD, NOISE_FLAPPING_ENABLED]

  NOISE_FLAP_LOW_THRESHOLD:
    example: >-
      진입 20·해제 5면 그 사이에 여유가 있어 판정이 안정적이다. 해제를 18로 올리면 진입과 거의 붙어, 억제가 켜졌다 꺼졌다 하며 오히려 예측하기 어려워진다.
    summary: 변화 비율이 이 값 아래로 내려가면 진동이 끝난 것으로 본다(%).
    behavior: 진동 상태를 해제하는 기준이다. 진입 임계보다 낮게 두어 판정이 왔다 갔다 하지 않게 한다.
    options:
      - value: "5.0"
        label: 기본
        effect: 변화율 5% 아래로 안정되면 진동 해제. 진입(20)과 충분한 간격이 있다.
      - value: "18"
        effect: 진입 임계와 너무 가까워 진동 판정 자체가 흔들린다.
    performance: 영향 없다.
    stability: 두 임계가 가까우면 억제가 켜졌다 꺼졌다 하며 오히려 예측하기 어려워진다.
    recommendation: 진입 임계의 4분의 1 수준을 유지한다.
    related: [NOISE_FLAP_HIGH_THRESHOLD]

  NOISE_INHIBITION_ENABLED:
    summary: 더 심각한 알람이 진행 중일 때 같은 대상의 하위 알람을 음소거할지.
    behavior: >-
      한 서버에 심각 알람이 떠 있는데 같은 서버의 경고 알람이 계속 오면 그 경고는
      새 정보가 아니다. 켜면 상위 심각도가 활성인 동안 하위 알람을 억제한다.
    options:
      - value: "false"
        label: 기본
        effect: 심각도와 무관하게 각각 통보한다.
      - value: "true"
        effect: 상위 알람 대응 중에 하위 잡음이 끼어들지 않는다.
    example: >-
      디스크가 가득 차 심각 알람이 뜬 서버에서 응답 지연 경고가 이어져 나올 때,
      경고는 심각 알람의 증상이므로 따로 알릴 필요가 없다.
    performance: 억제되면 통보 처리가 생략된다.
    stability: >-
      상위 알람과 무관한 별개의 문제가 같은 시간에 발생하면 그것도 함께 묻힌다 —
      창(NOISE_INHIBITION_WINDOW_SECONDS)을 지나치게 넓히지 않는 이유다.
    recommendation: 대응 중 잡음이 실제 문제일 때 켠다.
    related: [NOISE_INHIBITION_WINDOW_SECONDS, NOISE_SUPPRESS_MAX_SEVERITY]

  NOISE_INHIBITION_WINDOW_SECONDS:
    example: >-
      초동 대응이 보통 10분 걸리는데 창이 5분이면 대응 중반부터 하위 알람이 다시 들어온다. 반대로 한 시간으로 늘리면 그동안 발생한 별개의 새 문제까지 가려진다.
    summary: 상위 심각도 알람이 몇 초 동안 "진행 중"으로 간주될지.
    behavior: 이 시간 안에 발생한 상위 알람이 있으면 하위 알람을 음소거한다.
    options:
      - value: "300"
        label: 기본 (5분)
        effect: 5분간 상위 알람이 하위를 음소거한다.
      - value: "60"
        effect: 짧아 실제 대응 시간을 커버하지 못한다 — 대응 중에 하위 잡음이 다시 들어온다.
      - value: "3600"
        effect: 한 시간간 하위 알람이 묻힌다. 별개의 새 문제도 함께 가려진다.
    performance: 창이 길수록 활성 상위 알람을 추적하는 상태가 오래 유지된다.
    stability: 창을 넓히는 것은 그 시간 동안 하위 알람을 안 보겠다는 결정이다.
    recommendation: 실제 초동 대응 시간에 맞춰 정한다. 기본 5분에서 시작한다.
    related: [NOISE_INHIBITION_ENABLED]

  NOISE_STORM_GROUPING_ENABLED:
    summary: 한 서버에서 알람이 한꺼번에 쏟아질 때 대표 하나만 남길지.
    behavior: >-
      같은 서버에서 짧은 시간에 여러 알람이 터지면 대개 원인이 하나다. 켜면 대표 알람
      하나만 통보하고 나머지는 억제한다.
    options:
      - value: "false"
        label: 기본
        effect: 쏟아지는 알람을 모두 통보한다.
      - value: "true"
        effect: 대표 하나만 통보한다. 서버 한 대의 장애가 수십 건의 통보로 번지지 않는다.
    example: 서버가 재부팅되면 프로세스·포트·응답 알람이 동시에 수십 건 터진다 — 담당자에게 필요한 것은 "그 서버가 내려갔다" 하나다.
    performance: 억제된 만큼 통보 처리가 줄어 폭주 상황에서 워커 부담이 크게 감소한다.
    stability: 같은 서버에 정말로 서로 다른 문제가 동시에 났다면 그중 하나만 보인다.
    recommendation: 서버 단위 장애가 잦은 환경에서 켠다.
    related: [NOISE_STORM_WINDOW_SECONDS, NOISE_STORM_THRESHOLD]

  NOISE_STORM_WINDOW_SECONDS:
    example: >-
      재부팅 알람은 1분 안에 몰리지만, 서서히 번지는 장애는 5분에 걸쳐 나온다. 창이 60초면 후자를 스톰으로 묶지 못하고, 600초로 늘리면 그 사이 발생한 무관한 알람까지
      한 사건으로 합쳐진다.
    summary: 스톰을 판정할 시간창(초).
    behavior: 이 창 안에서 같은 서버의 알람 수를 센다.
    options:
      - value: "60"
        label: 기본
        effect: 1분 안의 알람을 묶어 센다.
      - value: "10"
        effect: 매우 짧아 순간적으로 몰린 경우만 잡는다. 몇 분에 걸쳐 번지는 장애는 놓친다.
      - value: "600"
        effect: 10분간의 알람을 한 사건으로 묶는다 — 그 사이의 새 문제도 같은 스톰으로 묶인다.
    performance: 창이 길수록 추적할 상태가 늘어난다.
    stability: 창이 넓으면 서로 다른 사건이 하나로 묶여 대표가 아닌 알람이 전부 가려진다.
    recommendation: 기본 60초 유지.
    related: [NOISE_STORM_THRESHOLD, NOISE_STORM_GROUPING_ENABLED]

  NOISE_STORM_THRESHOLD:
    example: >-
      1분에 다섯 건을 넘으면 스톰으로 본다. 임계를 2로 낮추면 서로 무관한 알람 두 건이 우연히 겹쳐도 스톰으로 묶여, 그중 하나가 대표가 아니라는 이유로 가려진다.
    summary: 창 안에 몇 건을 넘으면 스톰으로 볼지.
    behavior: 이 수를 초과하면 스톰으로 판정하고 대표 외의 알람을 억제한다.
    options:
      - value: "5"
        label: 기본
        effect: 1분에 다섯 건을 넘으면 스톰이다.
      - value: "2~3"
        effect: 민감하다. 서로 무관한 알람 두세 건이 우연히 겹쳐도 스톰으로 묶인다.
      - value: "20 이상"
        effect: 대규모 폭주만 잡는다. 중간 규모의 도배는 그대로 나간다.
    performance: 영향 없다.
    stability: 임계가 낮으면 정상적인 다중 알람이 스톰으로 묶여 중요한 건이 가려진다.
    recommendation: 실제 알람 밀도를 보고 정한다. 기본 5에서 시작한다.
    related: [NOISE_STORM_WINDOW_SECONDS]

  NOISE_DEPENDENCY_SUPPRESSION:
    example: >-
      스위치 하나가 죽으면 그 아래 서버 스무 대가 전부 응답 없음으로 잡힌다. 켜면 스위치 알람 하나만 통보되지만, 토폴로지 정보가 부정확하면 무관한 알람이 연쇄로 오인돼
      억제될 수 있다.
    summary: 상위 장애 때문에 딸려 나온 하위 알람을 억제할지.
    behavior: >-
      스위치가 죽으면 그 아래 서버들이 전부 응답 없음으로 잡힌다. 켜면 토폴로지상
      상위 노드에 장애가 있을 때 하위 알람을 억제한다. 다홉 연쇄 억제의 전제이기도 하다.
    options:
      - value: "false"
        label: 기본
        effect: 하위 알람을 각각 통보한다.
      - value: "true"
        effect: 상위 원인 하나만 통보한다. 연쇄 알람이 사라진다.
    performance: 토폴로지 조회가 붙는다. 결과는 캐시된다.
    stability: >-
      토폴로지 정보가 부정확하면 무관한 알람이 연쇄로 오인돼 억제된다 — 토폴로지 데이터의
      정확도가 이 기능의 전제다.
    recommendation: 토폴로지 데이터가 신뢰할 만할 때 켠다.
    related: [NOISE_MULTI_HOP_CASCADE_ENABLED, NOISE_TOPOLOGY_MAX_HOPS]

  NOISE_MULTI_HOP_CASCADE_ENABLED:
    example: >-
      스위치 → 서버 → 애플리케이션처럼 두 단계 이상 이어진 연쇄는 한 단계 억제로는 중간층이 남는다. 다홉을 켜면 최상위 원인까지 거슬러 올라가는데,
      공동존(PostgreSQL)만 지원하고 은행존(DB2)은 한 단계 억제로 자동 폴백한다 — 존에 따라 동작이 다르다.
    summary: 연쇄 억제를 한 단계가 아니라 여러 단계까지 따라갈지.
    behavior: >-
      의존성 억제(NOISE_DEPENDENCY_SUPPRESSION)와 함께 켜져 있어야 동작한다.
      둘 다 켜져야 다홉 조회가 일어난다.
    options:
      - value: "false"
        label: 기본
        effect: 직접 연결된 한 단계만 본다.
      - value: "true"
        effect: 여러 단계를 거슬러 올라가 원인을 찾는다. 깊은 연쇄까지 정리된다.
    performance: 그래프 탐색이 붙는다. 결과는 하루 단위로 캐시되므로 반복 비용은 작다.
    stability: >-
      PostgreSQL 존(공동존)만 지원한다. 은행존(DB2)은 한 단계 억제로 자동 폴백한다 —
      존에 따라 동작이 다르다는 점을 알고 있어야 한다.
    recommendation: 의존성 억제를 먼저 켜서 검증한 뒤 확장한다.
    related: [NOISE_DEPENDENCY_SUPPRESSION, NOISE_TOPOLOGY_MAX_HOPS, NOISE_TOPOLOGY_CACHE_TTL_SECONDS]

  NOISE_TOPOLOGY_MAX_HOPS:
    example: >-
      다섯 단계면 일반적인 인프라 계층을 커버한다. 10으로 올리면 탐색 대상이 급격히 늘고, 열 단계 위의 장비를 이 알람의 원인이라고 보기도 어려워진다.
    summary: 연쇄를 몇 단계까지 거슬러 올라갈지.
    behavior: 탐색 깊이 상한이다. 순환 구조에 빠지지 않게 하는 안전장치이자 비용 가드다.
    options:
      - value: "5"
        label: 기본
        effect: 다섯 단계까지 본다. 일반적인 인프라 계층 깊이를 커버한다.
      - value: "2"
        effect: 얕게 본다. 깊은 연쇄의 진짜 원인에 닿지 못한다.
      - value: "10 이상"
        effect: 탐색 범위가 넓어져 조회 비용이 늘고, 관련성이 희박한 노드까지 원인 후보가 된다.
    performance: 깊이가 늘면 탐색 대상 노드가 급격히 증가한다.
    stability: 깊게 파고들수록 인과관계가 약해진다 — 열 단계 위의 장비가 이 알람의 원인이라고 보기는 어렵다.
    recommendation: 기본 5 유지.
    related: [NOISE_MULTI_HOP_CASCADE_ENABLED]

  NOISE_TOPOLOGY_CACHE_TTL_SECONDS:
    example: >-
      장비를 새로 붙이거나 연결을 바꾸면 그 반영이 최대 하루 늦는다. 대규모 구성 변경 뒤에는 재시작으로 캐시를 비우는 편이 확실하다.
    summary: 토폴로지 그래프를 몇 초 동안 캐시할지.
    behavior: 정적 연결 정보는 거의 바뀌지 않으므로 길게 잡아 둔다.
    options:
      - value: "86400"
        label: 기본 (24시간)
        effect: 하루 한 번만 다시 읽는다. 조회 비용이 사실상 사라진다.
      - value: "300"
        effect: 5분마다 다시 읽는다. 토폴로지 변경이 빨리 반영되지만 조회가 잦아진다.
    performance: 길게 잡을수록 억제 판단이 빨라진다.
    stability: 장비를 새로 붙이거나 연결을 바꾸면 그 반영이 최대 하루 늦는다.
    recommendation: 기본 24시간 유지. 대규모 구성 변경 뒤에는 재시작으로 캐시를 비운다.
    related: [NOISE_MULTI_HOP_CASCADE_ENABLED]

  NOISE_IMPORTANCE_VALUE_MAP_CSV:
    example: >-
      폴스타 중요도 코드가 1=높음인데 매핑을 `1=낮음`으로 적으면 중요도가 뒤집힌다. 핵심 자산의 알람이 저중요로 판정돼 더 쉽게 억제되므로, 코드 값을 먼저 확인해야 한다.
    summary: 폴스타의 중요도 코드를 사람이 읽는 라벨로 바꾸는 매핑.
    behavior: >-
      "1=낮음,2=보통,3=높음" 형식이다. 비워 두면 전부 보통으로 취급한다 — 중요도가
      판단에 반영되지 않는다는 뜻이다.
    options:
      - value: "(비움)"
        label: 기본
        effect: 모든 자원을 같은 중요도로 본다. 중요 자산과 개발 장비가 동등하게 취급된다.
      - value: "1=낮음,2=보통,3=높음"
        effect: 중요도가 티어 판단에 반영된다. 저중요 자산의 알람이 더 쉽게 억제된다.
    performance: 영향 없다.
    stability: >-
      매핑이 실제 폴스타 코드 체계와 다르면 중요도가 뒤집혀 반영된다 — 중요 자산이
      억제되는 사고로 이어질 수 있으므로 코드 값을 먼저 확인한다.
    recommendation: 폴스타의 실제 중요도 코드를 확인해 정확히 매핑한다.
    related: [NOISE_SUPPRESS_MAX_SEVERITY]

  NOISE_RESOLVED_TO_DASHBOARD:
    example: >-
      해소 이벤트를 화면에 남기면 '있었다가 풀렸다'는 흐름이 보인다. 다만 억제율이 높은 환경에서는 대시보드가 해소 이벤트로 가득 차 정작 볼 알람이 묻힐 수 있다.
    summary: 스스로 해소된 알람을 화면에 남길지, 아예 안 보이게 할지.
    behavior: 해소 이벤트를 대시보드 티어로 표시하면 "있었다가 풀렸다"는 사실이 화면에 남는다.
    options:
      - value: "false"
        label: 기본
        effect: 해소 이벤트를 화면에 띄우지 않는다. 화면이 조용하다.
      - value: "true"
        effect: 대시보드 티어로 남긴다. 무슨 일이 있었는지 흐름이 보인다.
    performance: 켜면 화면으로 나가는 이벤트가 늘어난다.
    stability: 켜면 대시보드가 해소 이벤트로 채워질 수 있다 — 억제율이 높은 환경에서는 특히 그렇다.
    related: [NOISE_SELF_HEAL_WINDOW_SECONDS, NOISE_SSE_SUPPRESSED_ENABLED]

  NOISE_DECISION_STORE_ENABLED:
    example: >-
      억제된 알람은 화면에 뜨지 않으므로, 오억제를 확인할 방법은 이 파일뿐이다. 끄면 게이트가 무엇을 왜 삼켰는지 사후에 알 수 없어 검증 불가능한 블랙박스가 된다.
    summary: 게이트가 내린 판단을 파일에 남길지 — 기본으로 켜져 있다.
    behavior: >-
      어떤 알람을 왜 억제했는지 한 줄씩 기록한다. 억제된 알람은 화면에 뜨지 않으므로,
      오억제를 확인할 방법은 이 파일뿐이다.
    options:
      - value: "true"
        label: 기본
        effect: 판단 근거가 남는다. 주간 리뷰에서 오억제를 점검할 수 있다.
      - value: "false"
        effect: 남기지 않는다. 무엇이 왜 억제됐는지 확인할 방법이 사라진다.
    performance: 알람당 한 줄 append다. 비용이 거의 없다.
    stability: 이 파일이 없으면 게이트는 검증 불가능한 블랙박스가 된다.
    recommendation: 켠 채로 둔다.
    related: [NOISE_DECISION_STORE_PATH, NOISE_RECURRENCE_AUDIT_EVERY_N]

  NOISE_DECISION_STORE_PATH:
    example: >-
      상대 경로는 서버 작업 디렉터리 기준이다. 서비스 등록 방식이 바뀌면 이전 기록이 옛 경로에 남고 새 경로에서 처음부터 쌓이므로, 주간 리뷰에서 기록이 갑자기 짧아진 것처럼
      보인다.
    summary: 게이트 판단 기록을 저장할 파일 경로.
    behavior: 상대 경로는 서버 작업 디렉터리 기준이다.
    performance: 영향 없다.
    stability: >-
      디스크가 가득 차지 않도록 정리 정책이 필요하다. 경로를 바꾸면 이전 기록은 옛
      경로에 그대로 남는다.
    related: [NOISE_DECISION_STORE_ENABLED]

  NOISE_RECURRENCE_AUDIT_EVERY_N:
    example: >-
      같은 알람이 하루 100번 억제되면 기록도 100줄이 쌓인다. 10으로 샘플링하면 파일 증가가 10분의 1로 줄지만, 집계할 때 실제 억제 횟수가 10배라는 점을 감안해야
      한다.
    summary: 재발생 억제 기록을 몇 건에 한 번씩 남길지.
    behavior: >-
      같은 알람이 계속 억제될 때 매번 기록하면 파일이 빠르게 커진다. 1이면 매번,
      10이면 열 번에 한 번 남긴다.
    options:
      - value: "1"
        label: 기본
        effect: 모든 억제를 기록한다. 가장 정확하지만 파일이 빨리 커진다.
      - value: "10"
        effect: 열 번에 한 번만 남긴다. 파일 증가가 크게 줄지만 개별 억제 시점이 사라진다.
    performance: 값을 올리면 파일 쓰기가 그만큼 줄어든다.
    stability: 샘플링하면 억제 횟수 통계가 실제보다 적게 보인다 — 집계할 때 이 값을 감안해야 한다.
    recommendation: 파일 크기가 문제되기 전까지는 기본 1을 유지한다.
    related: [NOISE_DECISION_STORE_ENABLED]

  NOISE_NOISE_CONTEXT_TIMEOUT_SECONDS:
    example: >-
      판단 재료(이력·토폴로지·변경)를 모으는 데 3초를 준다. 1초로 줄이면 재료가 자주 부족한 채로 판단하게 되어 억제 정확도가 떨어지고, 10초로 늘리면 알람 폭주 시
      처리량이 그만큼 떨어진다.
    summary: 억제 판단에 필요한 배경 정보를 모으는 데 주는 시간(초).
    behavior: 이력·토폴로지·변경 등 판단 재료를 모으는 단계의 상한이다. 넘으면 있는 정보만으로 판단한다.
    options:
      - value: "3.0"
        label: 기본
        effect: 3초. 대부분의 조회가 그 안에 끝난다.
      - value: "1"
        effect: 재료가 자주 부족한 채로 판단하게 된다 — 억제 정확도가 떨어진다.
      - value: "10 이상"
        effect: 재료는 충실해지지만 알람 처리가 느려진다. 폭주 시 처리량이 떨어진다.
    performance: 알람 한 건의 처리 시간에 직접 얹힌다.
    stability: 재료가 부족해도 판단은 진행된다 — 다만 근거가 얕아진다.
    recommendation: 기본 3초 유지.
    related: [NOISE_NOISE_CONTEXT_CACHE_TTL_SECONDS]

  NOISE_NOISE_CONTEXT_CACHE_TTL_SECONDS:
    example: >-
      같은 서버의 알람이 1분 간격으로 이어질 때, 5분 캐시면 배경 조회가 한 번만 일어난다. 한 시간으로 늘리면 그 사이 발생한 변경이 판단 재료에 반영되지 않아 억제 결정이
      어긋날 수 있다.
    summary: 판단 배경 정보를 몇 초 동안 재사용할지.
    behavior: 같은 대상에 대한 재료를 짧은 시간 안에 다시 모으지 않는다.
    options:
      - value: "300"
        label: 기본
        effect: 5분간 재사용한다. 알람이 몰릴 때 조회 부담을 크게 줄인다.
      - value: "0"
        effect: 매번 모은다. 항상 최신이지만 폭주 시 부담이 크다.
      - value: "3600"
        effect: 한 시간 재사용한다. 그 사이의 변화가 판단에 반영되지 않는다.
    performance: 적중하면 배경 조회가 통째로 생략된다.
    stability: 길게 잡으면 방금 발생한 상황이 판단 재료에 없어 억제 결정이 어긋날 수 있다.
    recommendation: 기본 300초 유지.
    related: [NOISE_NOISE_CONTEXT_TIMEOUT_SECONDS]

  # ── Plan 54 · D-196: 관제 화면 조회 상한 + 운영자 침묵 규칙 ──

  NOISE_DECISION_STORE_MAX_LINES:
    example: >-
      감사 파일이 수십만 줄로 자라도 관제 화면은 끝에서 이 줄 수만 되짚는다. 값을 크게 잡으면 화면이 느려지고, 너무 작게 잡으면 조회 범위를 24시간으로 놓아도 그만큼밖에 못 본다.
    summary: 관제 화면이 판단 기록 파일 끝에서 되짚는 줄 수 상한.
    behavior: >-
      관제 화면의 집계·조회(퍼널·추이·상위 억제·결정 목록)가 파일 **끝에서** 이 줄 수만
      읽는다. 감사 파일 자체는 그대로 두고 화면 응답만 보호한다. 운영 지표
      (`/alarm/metrics`)는 이 값과 무관하게 전량을 집계한다.
    options:
      - value: "20000"
        label: 기본
        effect: 최근 2만 건까지 화면에 반영된다. 대부분의 운영 규모에서 충분하다.
      - value: "100000"
        effect: 더 멀리 본다. 파일이 크면 화면 응답이 눈에 띄게 느려진다.
      - value: "2000"
        effect: 가볍지만, 알람이 많은 날에는 조회 범위를 24시간으로 놓아도 일부만 보인다.
    performance: 값에 비례해 화면 조회의 파일 읽기 비용이 늘어난다.
    stability: 감사 기록 자체는 이 값과 무관하게 전부 남는다 — 잘리는 것은 화면의 시야뿐이다.
    recommendation: 기본 20000 유지. 화면이 느리면 줄인다.
    related: [NOISE_DECISION_STORE_PATH, NOISE_DECISION_STORE_ENABLED]

  # ── plans/153 W1 · D-325: 판정 기록에 AI 분석 서술 저장 ──

  NOISE_DECISION_ANALYSIS_TEXT_ENABLED:
    example: >-
      유지보수 창 안에서 억제된 알람을 관제 화면 결정 추적에서 열면, 켜져 있을 때는 「발생 원인과 처리」 칸 아래에 AI가 알람 문구만 보고 추정한 원인·권고가 함께 보인다. 꺼져 있으면 그 칸에 「이 판단이 기록될 때는 AI 추정을 저장하지 않았습니다」가 나온다.
    summary: 판정 기록에 AI 분석 서술(요약·추정 원인·권고 조치)을 함께 저장할지 — 기본으로 꺼져 있다.
    behavior: >-
      켜면 게이트 앞에서 이미 만든 AI 분석의 요약·추정 원인·권고 조치를 각 500자로 잘라 판정
      기록에 `analysis`로 덧붙인다. 억제(SUPPRESS)된 알람에도 저장된다. **추가 LLM 호출은 없고**
      판정(티어·사유·우선순위·단계)은 바뀌지 않는다. AI 분석이 실패한 알람은 대체 문구를
      저장하지 않고 실패 표시만 남긴다. 끄면 판정 기록이 종전과 완전히 같다.
    options:
      - value: "false"
        label: 기본
        effect: AI 서술을 저장하지 않는다. 관제 화면의 AI 추정 칸은 「저장하지 않았습니다」로 보인다.
      - value: "true"
        effect: 관제 화면 결정 추적에 AI 추정 원인·권고가 보이고, 목록에 추정 원인 열이 채워진다.
    performance: 판정 기록 한 줄이 최대 약 1,500자 늘어난다 — 관제 화면이 되짚는 파일 읽기 양도 그만큼 는다.
    stability: >-
      AI 서술은 노이즈 판정 전에 알람 문구만으로 만든 것이라 억제 판단과 어긋날 수 있다. 화면은
      결정적 처리 안내를 위에, AI 추정을 아래에 출처 표시와 함께 둔다. 사용자 화면 응답에서는
      마스킹을 거친다.
    recommendation: 관제 화면에서 원인·권고를 함께 보고 싶을 때 켠다.
    related: [NOISE_DECISION_STORE_ENABLED, NOISE_DECISION_STORE_MAX_LINES]

  NOISE_SILENCE_ENABLED:
    example: >-
      운영자가 관제 화면에서 만든 침묵 규칙을 게이트가 실제로 적용할지 결정한다. 꺼두면 규칙을 만들어도 알람은 그대로 나가므로, 점검 중이라 생각하고 방치하면 시끄럽다. 반대로 켜두고 만료 없는 습관이 생기면 진짜 장애가 조용히 묻힌다.
    summary: 운영자가 건 침묵 규칙을 게이트가 적용할지 — 기본으로 꺼져 있다.
    behavior: >-
      켜면 알람 처리 시 활성 침묵 규칙과 대조해, 걸리는 알람을 SUPPRESS로 억제한다
      (기록은 남는다). 끄면 규칙을 **조회조차 하지 않아** 판단이 종전과 완전히 같다.
      **심각도 3은 어떤 규칙으로도 침묵되지 않는다** — 규칙보다 앞선 단계에서 통보가 확정된다.
    options:
      - value: "false"
        label: 기본
        effect: 규칙을 만들 수는 있으나 게이트가 적용하지 않는다. 화면이 그 사실을 알려준다.
      - value: "true"
        effect: 규칙이 실제로 알람을 억제한다. 만료가 있으므로 영구 침묵은 생기지 않는다.
    performance: 규칙 목록을 짧게 캐시해 알람마다 파일을 다시 읽지 않는다.
    stability: >-
      침묵은 사람이 직접 거는 억제라 오억제의 책임 소재가 분명하다. 생성·해제가 감사에
      남고 만료가 강제되므로, 잊힌 규칙이 계속 알람을 삼키는 상황은 생기지 않는다.
    recommendation: 점검·배포 기간에만 켠다.
    related: [NOISE_SILENCE_MAX_DURATION_SECONDS, NOISE_SUPPRESS_MAX_SEVERITY]
    references:
      - docs/28_noise_cancellation_operator_guide.md

  NOISE_SILENCE_STORE_PATH:
    example: >-
      침묵 규칙은 이 파일에 덧붙이기만 하고 지우지 않는다. 해제해도 원 기록이 남으므로, 나중에 "그때 무엇을 왜 조용히 시켰나"를 되짚을 수 있다. 경로를 바꾸면 기존 규칙은 옛 파일에 남아 더 이상 적용되지 않는다.
    summary: 침묵 규칙을 저장할 파일 경로.
    behavior: >-
      규칙 생성·해제를 한 줄씩 덧붙이고, 조회할 때 재생해 현재 상태를 만든다.
      파일을 고쳐 쓰지 않으므로 감사가 온전히 남는다.
    performance: 영향 없다.
    stability: 경로를 바꾸면 기존 활성 규칙이 함께 사라진 것처럼 동작한다(옛 파일에 남는다).
    related: [NOISE_SILENCE_ENABLED]

  NOISE_SILENCE_MAX_DURATION_SECONDS:
    example: >-
      규칙 1건이 존속할 수 있는 최대 기간이다. 이 값을 넘는 침묵은 생성 단계에서 거부된다. 길게 잡을수록 "걸어두고 잊는" 침묵이 생기기 쉽고, 그 사이의 진짜 장애는 조용히 묻힌다.
    summary: 침묵 규칙 1건의 최대 존속 기간 — 만료 없는 침묵을 막는다.
    behavior: >-
      침묵 생성 요청의 지속 시간이 이 값을 넘으면 거부한다(만료 없는 침묵은 애초에 만들 수 없다).
      기존 규칙에는 소급되지 않는다.
    options:
      - value: "604800"
        label: 기본
        effect: 최대 7일. 장기 점검도 담기지만 잊고 방치하기엔 짧다.
      - value: "86400"
        effect: 최대 1일. 더 안전하지만 주말 점검마다 다시 걸어야 한다.
    performance: 영향 없다.
    stability: 길게 잡을수록 잊힌 침묵이 진짜 장애를 삼킬 여지가 커진다.
    recommendation: 기본 7일 유지.
    related: [NOISE_SILENCE_ENABLED]

  NOISE_SILENCE_CACHE_TTL_SECONDS:
    example: >-
      알람 1건마다 규칙 파일을 다시 읽지 않도록 짧게 캐시한다. 운영자가 규칙을 만들거나 해제한 뒤 최대 이 시간만큼 반영이 늦는다.
    summary: 활성 침묵 규칙 목록을 재사용하는 시간.
    behavior: >-
      알람 처리 경로에서 규칙 목록을 이 시간만큼 재사용한다. 그동안 만들어진 규칙은
      아직 적용되지 않는다.
    options:
      - value: "10"
        label: 기본
        effect: 10초. 규칙 변경이 거의 즉시 반영되면서 파일 읽기도 줄인다.
      - value: "0"
        effect: 매번 읽는다. 즉시 반영되지만 알람이 몰릴 때 파일 읽기가 늘어난다.
      - value: "60"
        effect: 1분 재사용. 급히 건 침묵이 그만큼 늦게 듣는다.
    performance: 값이 클수록 파일 읽기가 줄어든다.
    stability: 너무 길면 "침묵을 걸었는데 알람이 계속 온다"는 혼선이 생긴다.
    recommendation: 기본 10초 유지.
    related: [NOISE_SILENCE_ENABLED]

  # ── plans/162 · D-330: 마지막 관문 PAGE 필요성 재판정 ──

  NOISE_PAGE_REVIEW_MODE:
    summary: PAGE로 정해진 알람을 마지막에 한 번 더 보고, 이미 통보된 사건의 반복이면 TICKET으로 내릴지.
    behavior: >-
      앞 단계가 PAGE로 정한 알람만 결정적 규칙으로 다시 본다(AI 판단 없음). 같은 알람의 열린 사건 반복,
      같은 서버에서 먼저 통보된 사건이 진행 중이고 이번 심각도가 그보다 높지 않을 때, 같은 존·같은 알람이
      여러 서버에서 동시에 울릴 때의 대표 외 서버는 TICKET으로 내린다. 새 사건의 첫 PAGE, 심각도 상승,
      앱 영향(APM fatal), 오래 해소되지 않은 사건의 리마인더, 운영자가 지정한 알람은 그대로 PAGE다.
      억제가 아니라 강등이며 판정 기록은 그대로 남는다. 워커는 재기동 때 판정 기록 끝부분으로 진행 중
      사건을 다시 채운다.
    options:
      - value: "off"
        label: 기본
        effect: 다시 보지 않는다. 지금과 같다.
      - value: "shadow"
        effect: 판정은 그대로 두고 「내렸을 것」만 판정 기록(page_review 근거)에 남긴다. 켜기 전 효과 측정용이다.
      - value: "enforce"
        effect: 규칙에 걸린 PAGE를 TICKET으로 내린다. 사유는 「PAGE 재판정 — …」으로 남고 원래 단계·사유도 함께 기록된다.
    example: >-
      09:12에 PAGE로 나간 서버 CPU 경고가 해소되지 않은 채 13:20에 다시 통보 간격을 넘겨 들어오면, enforce에서는
      「PAGE 재판정 — 진행 중 사건 반복(최초 PAGE 09:12)」 사유로 TICKET이 된다.
    performance: 추가 외부 조회는 없다. 워커 메모리에 진행 중 PAGE를 지문·서버·알람명별로 둔다(상한 있음).
    stability: >-
      심각도 3 반복도 강등 대상이다 — 결정(D-330)에 따라 shadow로 측정한 뒤 enforce로 올린다. 판정 기록이
      꺼져 있으면 재기동 때 복원할 재료가 없어 첫 알람이 다시 PAGE로 나간다(현행과 같은 보수 동작).
    recommendation: shadow로 시작해 「내렸을 PAGE」 비율을 확인한 뒤 enforce로 올린다.
    related: [NOISE_PAGE_REVIEW_HOST_WINDOW_MINUTES, NOISE_PAGE_REVIEW_FANOUT_WINDOW_MINUTES, NOISE_PAGE_REVIEW_REMINDER_HOURS, NOISE_PAGE_REVIEW_ALWAYS_PAGE_CSV, NOISE_DECISION_STORE_ENABLED]

  NOISE_PAGE_REVIEW_HOST_WINDOW_MINUTES:
    summary: 같은 서버에서 먼저 PAGE로 나간 사건을 「진행 중」으로 보는 시간(분).
    behavior: >-
      같은 존·같은 서버의 다른 알람이 이 시간 안에 PAGE로 나갔고 아직 해소되지 않았으면, 이번 알람(심각도가
      그 PAGE 이하)을 TICKET으로 내린다.
    options:
      - value: "30"
        label: 기본
        effect: 30분 안의 같은 서버 사건을 하나로 본다.
      - value: "10"
        effect: 짧게 본다. 같은 서버 연쇄 알람이 PAGE로 더 많이 나간다.
      - value: "60"
        effect: 길게 본다. 무관한 두 번째 장애도 TICKET이 될 수 있다.
    example: 서버 메모리 경고가 PAGE로 나간 뒤 20분 만에 같은 서버의 스왑 경고(같은 심각도)가 오면 TICKET이 된다.
    performance: 추가 비용은 없다.
    stability: 이번 알람의 심각도가 먼저 나간 PAGE보다 높으면 내리지 않는다.
    recommendation: 기본 30분 유지.
    related: [NOISE_PAGE_REVIEW_MODE]

  NOISE_PAGE_REVIEW_FANOUT_WINDOW_MINUTES:
    summary: 같은 존·같은 알람명이 여러 서버에서 「동시에」 울렸다고 보는 시간(분).
    behavior: >-
      이 시간 안에 같은 존·같은 알람명으로 PAGE가 대표 서버 수 상한만큼 나갔으면, 그 밖의 서버에서 온 같은
      알람은 TICKET으로 내린다.
    options:
      - value: "10"
        label: 기본
        effect: 10분 안의 같은 알람을 한 묶음으로 본다.
      - value: "3"
        effect: 거의 동시에 울린 것만 묶는다.
    example: 공동존 서버 30대에서 5분 사이에 같은 NTP 동기화 경고가 오면 첫 서버만 PAGE, 나머지는 TICKET이다.
    performance: 추가 비용은 없다.
    stability: 대표 서버의 PAGE에 묶음 전체의 대응을 맡기는 방식이라, 서버별로 원인이 다르면 늦게 알 수 있다.
    recommendation: 기본 10분 유지.
    related: [NOISE_PAGE_REVIEW_MODE, NOISE_PAGE_REVIEW_FANOUT_PAGE_MAX]

  NOISE_PAGE_REVIEW_FANOUT_PAGE_MAX:
    summary: 동시 발생 묶음에서 PAGE로 남길 대표 서버 수.
    behavior: 창 안 대표 PAGE 서버가 이 수 이상이면 그 밖의 서버에서 온 같은 알람을 TICKET으로 내린다.
    options:
      - value: "1"
        label: 기본
        effect: 첫 서버만 PAGE다.
      - value: "3"
        effect: 처음 세 서버까지 PAGE다. 규모를 빨리 알 수 있지만 호출이 늘어난다.
    example: 값이 2면 같은 알람이 서버 10대에서 울릴 때 먼저 온 2대만 PAGE로 나간다.
    performance: 추가 비용은 없다.
    stability: 늘릴수록 동시 발생 묶음의 PAGE가 늘어난다.
    recommendation: 기본 1 유지.
    related: [NOISE_PAGE_REVIEW_FANOUT_WINDOW_MINUTES]

  NOISE_PAGE_REVIEW_REMINDER_HOURS:
    summary: 해소되지 않은 사건을 다시 PAGE로 알리는 간격(시).
    behavior: >-
      같은 알람의 사건이 해소되지 않은 채 마지막 PAGE로부터 이 시간이 지나면 반복이어도 내리지 않고 PAGE로 다시
      알린다. 판정 기록 근거에 미해소 지속 시간이 남는다. 재기동 때는 max(이 값, 24)시간 분량의 판정 기록으로
      진행 중 사건을 복원한다.
    options:
      - value: "24"
        label: 기본
        effect: 하루에 한 번 다시 알린다.
      - value: "8"
        effect: 근무 교대마다 다시 알린다.
    example: 월요일 09:00에 PAGE로 나간 디스크 경고가 해소되지 않으면 화요일 09:00 이후 첫 통보가 다시 PAGE다.
    performance: 길수록 워커가 진행 중 사건을 오래 기억한다(상한 있음).
    stability: 너무 길면 오래 묵은 장애를 놓친다.
    recommendation: 기본 24시간 유지.
    related: [NOISE_PAGE_REVIEW_MODE]

  NOISE_PAGE_REVIEW_REOPEN_QUIET_MINUTES:
    summary: 해소된 뒤 이 시간(분) 안에 다시 울리면 새 사건이 아니라 같은 사건의 재발로 본다.
    behavior: 해소 뒤 이 시간 안의 재발은 열린 사건 반복으로 보고 TICKET으로 내린다. 이 시간이 지나면 새 사건의 첫 PAGE다.
    options:
      - value: "30"
        label: 기본
        effect: 해소 뒤 30분 안의 재발을 같은 사건으로 본다.
      - value: "0"
        effect: 해소되면 바로 새 사건이다. 해소·재발이 잦은 알람의 PAGE가 늘어난다.
    example: CPU 경고가 10:00에 해소되고 10:15에 다시 울리면 기본값에서는 TICKET, 10:45에 울리면 PAGE다.
    performance: 추가 비용은 없다.
    stability: 너무 길면 진짜 재발을 늦게 안다.
    recommendation: 기본 30분 유지.
    related: [NOISE_PAGE_REVIEW_MODE]

  NOISE_PAGE_REVIEW_IDLE_CLOSE_MINUTES:
    summary: 해소 이벤트가 오지 않는 출처(제니퍼)의 사건을 마지막으로 본 뒤 이 시간(분)이 지나면 닫힌 것으로 본다.
    behavior: >-
      제니퍼는 해소 이벤트를 보내지 않아 한 번 PAGE로 나간 사건이 닫히지 않는다. 그래서 같은 알람이 진짜로 다시
      발생해도 리마인더 시간 동안 열린 사건 반복으로 보고 TICKET으로 내린다. 값을 주면 그 사건을 마지막으로 본 뒤
      (통보된 알람과 중복으로 버려진 재발 모두 포함) 이 시간 동안 소식이 없을 때 닫힌 것으로 보고, 다음 PAGE를 새
      사건으로 다룬다. 해소 이벤트가 오는 폴스타 알람에는 영향이 없다. 재기동 때도 판정 기록으로 같은 규칙을 적용한다.
      재통보 창(NOISE_REPEAT_INTERVAL_SECONDS · 심각도3은 NOISE_SEV3_REPEAT_INTERVAL_SECONDS, 기본 4시간 — 마지막 통보
      기준 고정창) 안의 재발은 판정까지 가지 않고 「봤음」만 남기므로, 이 값은 재통보 창이 끝난 뒤의 재통보에만
      효력이 있다. 그래서 값은 재통보 창과 함께 본다.
      R3(동시 발생)는 시간 창 규칙이라 무소식 닫힘과 무관하다 — 값은 동시 발생 창(NOISE_PAGE_REVIEW_FANOUT_WINDOW_MINUTES)보다
      크게 둔다.
      NOISE_RECURRENCE_AUDIT_EVERY_N이 1보다 크면 버려진 재발이 일부만 기록되므로, 재기동 복원에서는 실시간보다 일찍
      닫힐 수 있다.
    options:
      - value: "0"
        label: 기본
        effect: 끔. 제니퍼 사건은 리마인더 시간까지 열린 것으로 본다. 지금과 같다.
      - value: "60"
        effect: 제니퍼 알람이 1시간 동안 오지 않다가 재통보 창이 끝난 뒤 다시 오면 새 사건의 첫 PAGE다.
    example: >-
      값이 60이고 재통보 창이 기본 4시간이면, 10:00에 PAGE로 나간 제니퍼 응답 지연 알람이 10:20까지 반복되다(재통보
      창에 걸려 버려짐) 멈춘 뒤 14:30에 다시 울릴 때 PAGE다(끄면 같은 사건의 반복이라 TICKET). 10:00~14:00 사이의
      재발은 이 값과 무관하게 재통보 창에 걸려 버려진다. 반복이 13:50까지 이어졌다면 14:30 재발은 아직 1시간이 안
      지났으므로 TICKET이다.
    performance: 추가 비용은 없다.
    stability: 너무 짧으면 간헐적으로 반복되는 같은 장애가 매번 PAGE로 나간다. 너무 길면 진짜 재발을 늦게 안다.
    recommendation: 기본 0. 값은 내부망 2회차에서 제니퍼 알람의 재발 간격 분포를 재통보 창과 함께 본 뒤 정한다.
    related: [NOISE_PAGE_REVIEW_MODE, NOISE_PAGE_REVIEW_REOPEN_QUIET_MINUTES, NOISE_PAGE_REVIEW_REMINDER_HOURS, NOISE_REPEAT_INTERVAL_SECONDS]

  NOISE_PAGE_REVIEW_ALWAYS_PAGE_CSV:
    summary: 재판정과 무관하게 언제나 PAGE로 둘 알람명 글롭 목록(쉼표 구분).
    behavior: 알람명이 목록의 글롭(* · ? 사용)에 하나라도 맞으면 강등 규칙에 걸려도 PAGE로 둔다. 대소문자를 구분한다.
    options:
      - value: ""
        label: 기본
        effect: 지정 없음. 규칙대로 재판정한다.
      - value: "*Down*,디스크*"
        effect: 알람명에 Down이 들어가거나 디스크로 시작하는 알람은 반복이어도 PAGE다.
    example: 값을 「서비스 중단*」으로 두면 서비스 중단 알람은 30분 안에 같은 서버에서 다시 와도 PAGE로 나간다.
    performance: 추가 비용은 없다.
    stability: 넓은 글롭(*)을 넣으면 재판정이 사실상 꺼진다.
    recommendation: 반복돼도 매번 호출해야 하는 알람만 좁게 적는다.
    related: [NOISE_PAGE_REVIEW_MODE]

  NOISE_COLLECTION_FAILED_PAGE_SEV3_ONLY:
    summary: 중요도·유지보수 같은 부가 신호를 가져오지 못한 알람을 심각도 3일 때만 PAGE로 보낼지.
    behavior: >-
      부가 신호 수집이 실패하면(DB 지연·미등록 DB 등) 지금은 심각도 1 이상을 모두 보수적으로 PAGE로 보낸다.
      켜면 심각도 3만 PAGE이고, 그 밖은 중요도 「보통」으로 보고 유지보수·침묵 규칙·매트릭스를 그대로 탄다
      (심각도 2는 TICKET, 심각도 1은 DASHBOARD). 수집 실패 판정에는 판정 기록 근거에 collection_failed 표지가 남는다.
    options:
      - value: "false"
        label: 기본
        effect: 수집 실패 시 심각도 1 이상은 PAGE다. 지금과 같다.
      - value: "true"
        effect: 수집 실패여도 심각도 3만 PAGE다. 심각도 2 이하는 매트릭스 결과로 나간다.
    example: >-
      ITAM DB 응답이 늦어 부가 신호를 못 읽은 서버 메모리 경고(심각도 2)는 꺼져 있으면 PAGE, 켜면 TICKET이다.
      PAGE 재판정 모드가 shadow이고 이 값이 꺼져 있으면 판정은 PAGE 그대로 두고 근거(collection_failed_sev3_only)에
      「켰으면 나왔을 티어」만 남긴다.
    performance: 추가 비용은 없다. shadow 기록은 같은 입력으로 판정을 한 번 더 계산한다(외부 조회 없음).
    stability: >-
      수집이 실패한 알람의 중요도를 모른 채 「보통」으로 보므로, 실제 중요도가 높은 심각도 2 알람이 TICKET으로 나갈 수
      있다. 수집 실패율 메타경보(NOISE_META_ALERT_COLLECTION_FAILED_RATIO)를 함께 켜 원인을 고친다.
    recommendation: PAGE 재판정 shadow로 「켰으면 나왔을 티어」를 확인한 뒤 켠다(D-330 ③).
    related: [NOISE_META_ALERT_COLLECTION_FAILED_RATIO, NOISE_PAGE_REVIEW_MODE]

  NOISE_APM_SEV3_POLICY_ENABLED:
    summary: 제니퍼 알람이 심각도 3일 때도 제니퍼 유형 정책 표를 따를지.
    behavior: >-
      지금은 심각도 3이면 출처와 관계없이 「심각도3 단락」에서 곧바로 PAGE다. 켜면 제니퍼 유형 정책 표
      (config/apm_noise_policy.yaml)로 판정하는 제니퍼 알람만 달라진다 — 표에서 notify가 page인 유형은 PAGE,
      그 밖(표에 없는 유형·default 행)은 TICKET이다. 판정 단계는 그대로 「심각도3 단락」이고 뒤 억제 단계로는
      가지 않는다(DASHBOARD·억제로 내려가지 않는다). 판정 기록 근거(apm_sev3_policy)에 정책 티어와 적용 행이 남는다.
    options:
      - value: "false"
        label: 기본
        effect: 심각도 3은 출처와 관계없이 PAGE다. 지금과 같다.
      - value: "true"
        effect: 제니퍼 정책 경로의 심각도 3은 page 유형만 PAGE, 그 밖은 TICKET이다. 폴스타 알람과 정책 표를 못 읽은 제니퍼 알람은 지금처럼 PAGE다.
    example: >-
      제니퍼 FATAL로 들어온 표 밖 유형(심각도 3)은 꺼져 있으면 PAGE, 켜면 TICKET이다. 표에 notify page로 적힌
      OUTOFMEMORY는 켜도 PAGE다.
    performance: 추가 비용은 없다(이미 계산한 정책 신호만 읽는다).
    stability: >-
      정책 표의 유형 키가 실제 정규화 유형과 다르면 PAGE여야 할 유형이 TICKET이 된다. 켜기 전에 PAGE·TICKET으로
      나뉠 유형 키를 표와 대조한다(D-336 주의). 제니퍼 유형 정책(NOISE_APM_NOISE_POLICY_ENABLED)이 꺼져 있으면 효과가 없다.
    recommendation: PAGE 재판정을 shadow → enforce로 옮기는 시점에 함께 켠다(D-336 ④).
    related: [NOISE_APM_NOISE_POLICY_ENABLED, NOISE_PAGE_REVIEW_MODE]
