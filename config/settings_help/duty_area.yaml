# 설정 옵션 상세 설명 — 담당 업무 지정 (plans/201 W1 · D-354)
# 근거: src/config/services.py DutyAreaConfig · src/api/duty_area_support.py · config/duty_areas.yaml

version: 1
group: duty_area

settings:

  DUTY_AREA_ENABLED:
    summary: 사용자마다 담당 업무(서버/OS·WAS/미들웨어·DB 등)를 지정할 수 있게 할지.
    behavior: >-
      켜면 회원가입 화면에 담당 업무 선택(선택 사항 · 여러 개 가능)이 나오고, 관리자 「사용자 관리」
      탭에 「담당」 열과 「담당 업무 현황」 카드(지정률 · 미지정만 보기 · 일괄 지정 · 매핑 점검)가
      생긴다. 담당을 지정하지 않은 사용자에게는 질의응답 탭 상단에 지정 안내가 한 번 보인다.
      영역 목록은 config/duty_areas.yaml이 정본이다. 담당 업무는 권한이 아니라 중점이라 무엇도
      숨기지 않는다.
    options:
      - value: "false"
        label: 기본
        effect: 담당 선택·열·카드·안내가 없고 사용자 정보 응답에 담당 항목이 실리지 않는다(종전 동작).
      - value: "true"
        effect: 가입 시 선택과 관리자 지정(일괄 포함)이 열린다. 사용자 본인이 바꾸는 경로는 없다.
    caution: >-
      재시작해야 반영된다. 이미 저장된 담당 값은 꺼도 지워지지 않는다 — 다시 켜면 그대로 쓰인다.
      config/duty_areas.yaml에서 빠진 영역 코드는 읽을 때 무시되고 서버 로그에 경고가 남는다.
    example: >-
      켠 뒤 관리자가 「사용자 관리」 탭에서 여러 사용자를 체크하고 「서버/OS」를 골라 「일괄 지정」을
      누르면, 사용자마다 수정 감사 기록(이전값 → 새값)이 남는다.

  DUTY_ALARM_FOCUS_ENABLED:
    summary: 알람 화면에서 내 담당 업무와 관련된 알람을 강조할지(담당 업무 지정이 켜져 있어야 동작).
    behavior: >-
      켜면 알람 카드에 「내 담당 · 발생」(알람이 담당 영역에서 났다)·「내 담당 · 단서」(알람 정보로 본 원인
      단서가 담당 영역을 가리킨다) 배지와 「단서 · 알람 정보만 봄(조사 전)」 줄이 붙고, 「내 담당 먼저」 토글로
      같은 티어 안에서 담당 카드를 앞에 둘 수 있다. 추천 질의는 담당 영역 것이 앞에 온다(개수는 같다).
      단서는 제니퍼 이벤트 유형과 영향 프로세스 종류에서만 만든다 — 표는 config/duty_areas.yaml cause_hints가
      정본이다. 관리자 「담당 업무 현황」 카드에는 제니퍼 이벤트 유형 점검이 더해진다.
    options:
      - value: "false"
        label: 기본
        effect: 배지·단서·토글이 없고 알람 SSE와 사용자 정보 응답이 종전과 같다.
      - value: "true"
        effect: DUTY_AREA_ENABLED도 true일 때만 강조가 켜진다. 무엇도 숨기지 않고 티어 순서도 바꾸지 않는다.
    caution: >-
      재시작해야 반영된다. 단서는 원인 판정이 아니다 — 조사 결과가 있으면 조사 결과를 따른다.
      DB 담당은 발생 강조가 거의 없다(DB 자원 알람이 드물다) — 주로 단서(SQL 응답 지연 등)로 강조된다.
    example: >-
      제니퍼 BAD_RESPONSE_TIME_SQL 알람은 DB 담당자에게 「내 담당 · 단서」 배지와 「SQL 응답 지연」 근거가 보인다.

  DUTY_WELCOME_HINTS_ENABLED:
    summary: 질의응답 첫 화면의 예시 질문 버튼을 내 담당 업무 문구로 바꿀지(담당 업무 지정이 켜져 있어야 동작).
    behavior: >-
      켜면 담당 업무가 지정된 사용자의 첫 화면 예시 버튼이 담당 영역 문구로 바뀌고, 버튼 위에 「서버/OS 담당 추천」처럼
      영역 이름이 붙는다. 여러 영역이면 선언 순서대로 영역마다 최대 3개, 모두 합쳐 최대 6개다. 「사용법」 버튼은 늘 끝에
      남는다. 문구는 config/duty_areas.yaml welcome_queries가 정본이고, 검증 근거(verified_by — 골드셋 항목·결정적
      조립기·실행 확인)가 있는 문구만 쓴다. 근거가 없거나 검증 대기(pending)인 문구는 읽을 때 빠지고 서버 로그에
      경고가 남는다. 담당이 지정되지 않았거나 담당 영역에 쓸 문구가 없으면 종전 버튼 그대로다.
    options:
      - value: "false"
        label: 기본
        effect: 첫 화면 예시 버튼과 사용자 정보 응답이 종전과 같다.
      - value: "true"
        effect: DUTY_AREA_ENABLED도 true일 때만 담당 영역 문구로 바뀐다. 무엇도 숨기지 않는다 — 예시 버튼만 바뀐다.
    caution: >-
      재시작해야 반영된다. 문구를 고치거나 검증 근거를 채운 뒤에도 재시작해야 한다. DB 영역은 DB 내부 지표(세션·락 등)를
      수집하지 않으므로 그런 문구를 넣지 않는다. 폐쇄망에서만 확인할 수 있는 문구는 사람이 실행해 본 뒤
      verified_by에 closed_net:날짜를 적고 pending을 지운다.
    example: >-
      서버/OS 담당 사용자에게는 「ㅇㅇ존에서 최근 3개월간 경고 이상 알람이 가장 많이 발생한 상위 10개 서버를 알려줘」 같은
      버튼이 보이고, 누르면 입력창에 채워져 존 이름만 고쳐 보내면 된다.

  DUTY_ACTION_ASSIST_ENABLED:
    summary: 조사 결과에서 담당 영역의 다음 확인 질의·점검 순서를 앞세우고 알람 카드에 인계 요약 복사를 붙일지(담당 업무 지정이 켜져 있어야 동작).
    behavior: >-
      켜면 ① 조사 「질의응답에서 확인」 문장이 담당 영역 순으로 묶여 영역 이름이 붙고(개수는 같다 · 새 질의를 만들지 않는다),
      ② 플레이북 조사 브리핑의 「권고」 아래에 담당 영역 점검 순서가 접힌 채 붙고(담당 미지정이거나 담당 영역 문안이 없으면 공통
      순서 1벌), ③ 알람 카드에 [인계 요약 복사]가 생겨 알람(서버·시각·유형)·영역별 점검 결과·근거 단계·조사 화면 주소를 정해진
      양식 글로 클립보드에 넣는다. 문안 정본은 config/duty_areas.yaml requery_axes·checklists다.
    options:
      - value: "false"
        label: 기본
        effect: 질의 순서·조사 브리핑·알람 카드와 사용자 정보 응답이 종전과 같다.
      - value: "true"
        effect: DUTY_AREA_ENABLED도 true일 때만 켜진다. 무엇도 숨기지 않고 시스템이 대신 실행하는 것은 없다.
    caution: >-
      재시작해야 반영된다. 점검 순서는 사람이 확인하는 순서이고 시스템이 실행하지 않는다. 인계 요약은 조사 결과를 펼쳐 본
      카드에서만 영역별 점검 결과를 담는다(복사할 때 새로 조회하지 않는다). 문안은 초안이며 피드백으로 고친다.
    example: >-
      DB 담당자가 응답 지연 조사 결과를 펼치면 「권고」 아래에 「점검 순서 — DB」가 접혀 있고, 카드의 [인계 요약 복사]를 누르면
      서버·시각·유형과 영역별 상태가 담긴 글이 복사돼 메신저에 붙여 넣을 수 있다.
