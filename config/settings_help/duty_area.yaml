# 설정 옵션 상세 설명 — 담당 업무 지정 (plans/201 W1 · D-354)
# 근거: src/config/services.py DutyAreaConfig · src/api/duty_area_support.py · config/duty_areas.yaml

version: 1
group: duty_area

settings:

  DUTY_AREA_ENABLED:
    summary: 사용자마다 담당 업무(서버/OS·WAS/미들웨어·DB 등)를 지정할 수 있게 할지.
    behavior: >-
      켜면 회원가입 화면에 담당 업무 선택(선택 사항 · 여러 개 가능)이 나오고, 관리자 「사용자 관리」
      탭에 「담당」 열과 「담당 업무 현황」 카드(지정률 · 미지정만 보기 · 일괄 지정 · 매핑 점검)가
      생긴다. 담당을 지정하지 않은 사용자에게는 질의응답 탭 상단에 지정 안내가 한 번 보인다.
      영역 목록은 config/duty_areas.yaml이 정본이다. 담당 업무는 권한이 아니라 중점이라 무엇도
      숨기지 않는다.
    options:
      - value: "false"
        label: 기본
        effect: 담당 선택·열·카드·안내가 없고 사용자 정보 응답에 담당 항목이 실리지 않는다(종전 동작).
      - value: "true"
        effect: 가입 시 선택과 관리자 지정(일괄 포함)이 열린다. 사용자 본인이 바꾸는 경로는 없다.
    caution: >-
      재시작해야 반영된다. 이미 저장된 담당 값은 꺼도 지워지지 않는다 — 다시 켜면 그대로 쓰인다.
      config/duty_areas.yaml에서 빠진 영역 코드는 읽을 때 무시되고 서버 로그에 경고가 남는다.
    example: >-
      켠 뒤 관리자가 「사용자 관리」 탭에서 여러 사용자를 체크하고 「서버/OS」를 골라 「일괄 지정」을
      누르면, 사용자마다 수정 감사 기록(이전값 → 새값)이 남는다.

  DUTY_ALARM_FOCUS_ENABLED:
    summary: 알람 화면에서 내 담당 업무와 관련된 알람을 강조할지(담당 업무 지정이 켜져 있어야 동작).
    behavior: >-
      켜면 알람 카드에 「내 담당 · 발생」(알람이 담당 영역에서 났다)·「내 담당 · 단서」(알람 정보로 본 원인
      단서가 담당 영역을 가리킨다) 배지와 「단서 · 알람 정보만 봄(조사 전)」 줄이 붙고, 「내 담당 먼저」 토글로
      같은 티어 안에서 담당 카드를 앞에 둘 수 있다. 추천 질의는 담당 영역 것이 앞에 온다(개수는 같다).
      단서는 제니퍼 이벤트 유형과 영향 프로세스 종류에서만 만든다 — 표는 config/duty_areas.yaml cause_hints가
      정본이다. 관리자 「담당 업무 현황」 카드에는 제니퍼 이벤트 유형 점검이 더해진다.
    options:
      - value: "false"
        label: 기본
        effect: 배지·단서·토글이 없고 알람 SSE와 사용자 정보 응답이 종전과 같다.
      - value: "true"
        effect: DUTY_AREA_ENABLED도 true일 때만 강조가 켜진다. 무엇도 숨기지 않고 티어 순서도 바꾸지 않는다.
    caution: >-
      재시작해야 반영된다. 단서는 원인 판정이 아니다 — 조사 결과가 있으면 조사 결과를 따른다.
      DB 담당은 발생 강조가 거의 없다(DB 자원 알람이 드물다) — 주로 단서(SQL 응답 지연 등)로 강조된다.
    example: >-
      제니퍼 BAD_RESPONSE_TIME_SQL 알람은 DB 담당자에게 「내 담당 · 단서」 배지와 「SQL 응답 지연」 근거가 보인다.
