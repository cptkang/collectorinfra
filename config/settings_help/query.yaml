# 설정 옵션 상세 설명 — 쿼리 정책 (D-191)
# 근거: src/config.py QueryConfig
# DB 레벨 제한(타임아웃·최대 행수)은 MCP 서버 소관이며 여기서 다루지 않는다.

version: 1
group: query

settings:

  QUERY_DEFAULT_LIMIT:
    summary: SQL을 만들 때 붙이는 기본 LIMIT — 한 번에 가져올 행 수의 상한이다.
    behavior: >-
      질문에 건수 조건이 없으면 이 값이 LIMIT으로 들어간다. 조회 결과는 화면 표시뿐 아니라
      요약을 만드는 LLM 프롬프트로도 들어가므로, 이 값은 응답 시간과 토큰 비용에 직접 얹힌다.
    options:
      - value: "1000"
        label: 기본
        effect: 대부분의 조회에 충분하고, 광역 질의가 DB를 통째로 훑는 것을 막는다.
      - value: "100 이하"
        effect: >-
          매우 가볍고 빠르지만, 서버가 수백 대인 환경에서는 상위 일부만 보고 "전체를 봤다"고
          오해하기 쉽다. 잘렸다는 사실이 결과만 봐서는 잘 드러나지 않는다.
      - value: "5000 이상"
        effect: >-
          누락은 줄지만 전송량·메모리·요약 토큰이 함께 커진다. 복합 질의에서 대상별로
          이 상한이 각각 적용되므로 총량이 곱으로 늘어난다.
    example: >-
      "전체 서버 디스크 사용률" 같은 질문은 조건이 없어 이 상한이 그대로 걸린다. 1000으로
      두면 1000대까지만 보이고, 그보다 많은 환경에서는 나머지가 조용히 빠진다.
    performance: >-
      DB 부하·네트워크 전송량·LLM 입력 토큰이 모두 이 값에 비례한다. 응답이 느리다는
      민원이 특정 유형 질의에 몰려 있다면 이 값부터 본다.
    stability: >-
      너무 크면 한 건의 광역 질의가 DB와 응답 시간을 통째로 잡아먹는다. 너무 작으면
      "데이터가 없다"가 아니라 "잘렸다"인데, 사용자에게는 그 차이가 보이지 않는다.
    recommendation: 기본 1000을 유지한다. 관리 대상 서버 수가 그보다 많다면 실제 규모에 맞춰 올린다.
    related: [QUERY_MAX_RETRY_COUNT, COMPOSITE_MAX_TARGETS]

  QUERY_SUFFICIENCY_REQUIRED_THRESHOLD:
    example: >-
      '서버명·IP·CPU·메모리·디스크'를 요구한 질의에서 세 항목만 매핑되면 비율은 0.6이다. 임계가 0.7이면 부족하다고 보고 SQL을 다시 만들며, 0.5면 그대로
      통과해 두 칸이 빈 표가 나간다.
    summary: 확실한 매핑(힌트·유사어)이 이 비율 이상 맞아야 조회 결과를 충분하다고 본다.
    behavior: >-
      질문에서 뽑은 항목이 실제 컬럼에 얼마나 대응됐는지를 비율로 재고, 이 값에 못 미치면
      결과가 부족하다고 판단해 SQL 생성으로 되돌아간다.
    options:
      - value: "0.7"
        label: 기본
        effect: 요청한 항목의 70% 이상이 매핑돼야 통과한다. 일부 누락은 허용하되 절반 이하는 다시 시도한다.
      - value: "0.9 이상"
        effect: 거의 완전한 매핑을 요구한다. 재시도가 늘어 응답이 느려지고, 원래 없는 데이터를 계속 찾게 될 수 있다.
      - value: "0.4 이하"
        effect: 대부분 통과시킨다. 빠르지만 절반이 빈 표가 그대로 답으로 나간다.
    performance: 임계를 높이면 재시도가 늘고, 재시도 하나는 SQL 생성 LLM 호출 하나다.
    stability: >-
      데이터 자체가 없는 항목을 요구하는 질문에서는 임계를 높여도 회복되지 않는다 —
      재시도 예산만 소모하고 같은 결과로 끝난다.
    recommendation: 기본 0.7 유지. 빈 칸이 많은 답이 자주 나오면 조금 올리고, 응답이 느려지는지 함께 본다.
    related: [QUERY_SUFFICIENCY_OPTIONAL_THRESHOLD, QUERY_MAX_RETRY_COUNT]

  QUERY_SUFFICIENCY_OPTIONAL_THRESHOLD:
    example: >-
      이 값을 낮춰 빈 칸이 있는 결과를 통과시키려 해도 판정은 달라지지 않는다 — 코드가 읽지 않는다. 실제로 판정에 쓰이는 것은
      QUERY_SUFFICIENCY_REQUIRED_THRESHOLD 하나다.
    summary: LLM 추론으로 붙인 매핑에 적용하는 완화된 충분성 임계 — 현재 코드가 읽지 않는다.
    behavior: >-
      확실한 매핑보다 느슨한 기준을 적용하려는 항목이지만, 지금 코드에는 이 값을 읽는
      곳이 없다. 값을 바꿔도 판정은 달라지지 않는다.
    performance: 영향 없다(소비되지 않음).
    stability: 영향 없다(소비되지 않음).
    related: [QUERY_SUFFICIENCY_REQUIRED_THRESHOLD]

  QUERY_MAX_RETRY_COUNT:
    example: >-
      재시도가 부족해 보여 이 값을 5로 올려도 실제 상한은 코드에 박힌 3 그대로다. 값이 바뀐 것처럼 보이는데 동작은 그대로라, 이 항목을 만지는 것 자체가 시간 낭비가
      된다.
    summary: SQL 재생성 재시도 예산 — 현재는 코드에 하드코딩된 3이 쓰인다.
    behavior: >-
      검증 실패·실행 오류·데이터 부족으로 SQL 생성 단계로 되돌아가는 횟수의 상한을
      의도한 항목이다. 다만 지금 실제로 쓰이는 값은 코드에 박힌 3이며, 이 설정은
      읽히지 않는다.
    performance: 영향 없다(소비되지 않음). 실제 재시도 상한은 3으로 고정이다.
    stability: >-
      이 값을 늘려 응답 실패를 줄이려는 시도는 통하지 않는다. 재시도 정책을 바꾸려면
      코드 수정이 필요하다.
    related: [QUERY_DEFAULT_LIMIT, MAX_REPLAN]

  QUERY_INTENT_LLM_ASSIST:
    example: >-
      유사어 등록 도중 '응 그렇게 해줘'라고 답하면 규칙으로는 예/아니오를 확정하지 못한다. 꺼져 있으면 한 번 더 되묻고, 켜면 LLM이 한 번 해석해 진행한다 — 다만
      SQL 실행 승인 자리에서는 애매한 대답을 '예'로 읽을 위험이 함께 들어온다.
    summary: 애매한 사용자 의사 표현("그렇게 해줘" 같은)을 LLM으로 한 번 더 분류할지.
    behavior: >-
      유사어 등록이나 SQL 실행 승인처럼 예/아니오가 필요한 자리에서, 결정적 규칙으로
      판정하지 못한 입력만 LLM에 한 번 물어 회복한다. 꺼져 있어도 결정적 판정은 그대로
      동작하고, 확정하지 못한 입력은 되묻거나(등록) 거부한다(승인).
    options:
      - value: "false"
        label: 기본
        effect: >-
          규칙으로 판정되지 않는 입력은 되묻거나 거부한다. 승인 쪽은 거부가 기본이라
          애매한 대답으로 실행이 진행되는 일이 없다.
      - value: "true"
        effect: 확정 불가 입력만 LLM 호출 1회로 해석한다. 되묻는 횟수가 줄지만 판정에 비결정성이 들어온다.
    performance: 켜도 확정 불가 입력에서만 호출이 붙어 평균 비용 증가는 작다.
    stability: >-
      승인 판정은 안전 실패(fail-closed)가 원칙이다. LLM이 애매한 대답을 "예"로 읽는
      가능성을 들이는 것이므로, 승인 게이트를 함께 쓰는 환경에서는 신중히 켠다.
    recommendation: 되묻는 횟수가 실제로 불편할 때만 켠다.
    related: [ENABLE_SQL_APPROVAL, ENABLE_STRUCTURE_APPROVAL]

  QUERY_FORM_MEMORY_TTL_DAYS:
    example: >-
      월간 보고서 양식을 채우면서 '이 열은 메모리 사용률입니다'라고 한 번 확인해 주면 일주일간 그 결정이 재사용된다. 그 사이 양식의 열 의미가 바뀌었다면 잘못된 매핑이
      그대로 쓰이므로, 기본값이 짧게 잡혀 있다.
    summary: 양식 채우기에서 사용자가 확인해 준 매핑을 며칠간 기억할지. 0이면 기능을 끈다.
    behavior: >-
      양식 필드와 DB 컬럼의 대응을 사용자가 한 번 확정하면 그 결정을 재사용한다.
      사용할 때마다 만료가 연장된다(쓰는 동안은 유지된다).
    options:
      - value: "7"
        label: 기본
        effect: 일주일간 기억한다. 짧게 잡은 이유는, 잘못 굳은 매핑이 감사 자료에 계속 오기재되는 비용이 다시 묻는 비용보다 크기 때문이다.
      - value: "0"
        effect: 기능을 끈다. 매번 확인을 받으므로 오기재 위험은 없지만 반복 작업이 번거로워진다.
      - value: "30 이상"
        effect: 편해지지만, 스키마가 바뀌거나 잘못 확정한 매핑이 한 달 내내 그대로 쓰인다.
    performance: 재사용되면 확인 절차가 생략돼 양식 처리 속도가 눈에 띄게 빨라진다.
    stability: 만료의 대가는 패널 재답변 한 번이고, 부패한 기억의 대가는 잘못된 산출물이다 — 짧은 쪽이 안전하다.
    recommendation: 기본 7일 유지.
    related: []
