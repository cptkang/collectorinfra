# 설정 옵션 상세 설명 — 문서 RAG (plans/126 · 교체 절차 docs/32_rag_retrieval_runbook.md)
# 근거: src/config.py RagConfig · plans/126 §3.1a(플랫폼 파라미터) · §3.1b(자산 수명) · §4.1a(접속 세트)
# ⚠ 검색 품질 파라미터(HyDE·top_k·유사도 임계·리랭크)는 **이 화면에 없다** — 사내 GenAI 플랫폼에서만
#    바꿀 수 있고, 바꾸면 자산 ID가 새로 발급된다. 조정이 필요하면 플랫폼 담당자에게 요청한다.

version: 1
group: rag

settings:

  RAG_ENABLED:
    summary: 사내 문서(전산관리규정·아키텍처 설계문서)를 검색해 답하는 기능을 켤지.
    behavior: >-
      끄면 문서 검색 경로가 아예 없다(현행 동작과 같다). 켜면 관리자 「문서 검색 시험」 탭과
      운영자 API로 문서를 조회할 수 있다. **이것만으로는 일반 채팅이 문서를 찾지 않는다** —
      채팅 질문을 문서로 보내는 것은 별도 스위치 RAG_CHAT_ROUTING_ENABLED 가 정한다.
    options:
      - value: "false"
        label: 기본
        effect: 문서 검색을 쓰지 않는다.
      - value: "true"
        effect: 접속 정보가 입력된 문서군에 대해 검색·답변이 동작한다.
    caution: >-
      켜도 접속 4종(주소·토큰·클라이언트 키·자산 ID)이 비어 있으면 그 문서군은 비활성이고,
      화면과 로그가 어느 값이 비었는지 알려준다.
    example: >-
      false 로 두면 관리자 화면의 「문서 검색 시험」 탭에서도 "문서 검색이 설정되지 않았습니다"가
      나온다. 접속 정보를 모두 넣은 뒤 true 로 바꾸면 그때부터 조회가 된다.

  RAG_HQ_MANUAL_ENDPOINT:
    summary: 전산관리규정 문서군의 검색 주소(전문).
    behavior: >-
      GenAI 플랫폼 화면의 주소를 **통째로 복사해** 넣는다. 주소는 발급마다 달라지므로
      일부만 고쳐 쓰면 안 된다(호스트와 경로가 함께 바뀐 사례가 있다).
    caution: 값은 화면에서 마스킹되어 보이지만 편집은 된다. 4개 값을 항상 함께 교체한다.
    example: >-
      http://kbgenai-chat-trrn.cloudengineering.com/generative-ai-connector/kb0/<발급 난수>/1/retrieval
      — 주소를 직접 조립해 넣으면 404가 난다(호스트와 경로가 발급마다 다르다).

  RAG_HQ_MANUAL_TOKEN:
    summary: 전산관리규정 문서군 호출에 쓰는 API 토큰.
    behavior: 리트리벌 발급 건마다 다른 값이다. 채팅·문서에 옮겨 적지 말고 이 칸에만 넣는다.
    caution: 붙여넣을 때 줄바꿈·앞뒤 공백이 섞이면 인증이 실패한다.
    example: >-
      플랫폼 화면에서 복사해 붙여넣는다. 다른 문서군의 토큰을 넣으면 인증 오류(401·403)가 나고,
      관리자 화면에는 끝 4자만 보인다.

  RAG_HQ_MANUAL_CLIENT_KEY:
    summary: 전산관리규정 문서군 호출에 쓰는 클라이언트 키.
    behavior: 토큰과 같은 발급 건의 값이어야 한다. 서로 다른 발급분을 섞으면 인증이 실패한다.
    example: >-
      토큰과 같은 발급 화면에서 함께 복사한다. 토큰만 새로 바꾸고 이 값을 그대로 두면 인증이 실패한다.

  RAG_HQ_MANUAL_RETRIEVAL_ID:
    summary: 전산관리규정 문서군의 자산 ID(가장 자주 바뀌는 값).
    behavior: >-
      문서가 추가·수정되거나 청킹이 다시 되거나 검색 파라미터가 바뀌면 **새 ID가 발급되고
      기존 ID는 폐기**된다. 폐기된 ID로 조회하면 "문서 색인이 갱신되어 조회할 수 없습니다"가
      사용자에게 나가고 관리자 화면에 배너가 뜬다.
    caution: 앞 14자리는 발급 시각으로 보인다(예 20260928181958 = 2026-09-28 18:19:58).
    example: >-
      20260928181958_9c84fa6da4684dee9fb4c2f3c21566bd — 규정 문서를 한 건 고치면 이 값이 새로 발급되고,
      옛 값으로 조회하면 사용자에게 "문서 색인이 갱신되어 조회할 수 없습니다"가 나간다.

  RAG_ARCH_DOCS_ENDPOINT:
    summary: 아키텍처 설계문서 문서군의 검색 주소(전문).
    behavior: 규정 문서군과 **다른 주소**다. 문서군마다 따로 발급된다.
    example: >-
      규정 문서군과 다른 주소가 발급된다. 두 칸에 같은 주소를 넣으면 두 문서군이 같은 내용을 답한다.

  RAG_ARCH_DOCS_TOKEN:
    summary: 아키텍처 설계문서 문서군 호출에 쓰는 API 토큰.
    behavior: 규정 문서군의 토큰과 다르다. 문서군별로 따로 넣는다.
    example: >-
      설계문서용으로 따로 발급된 토큰을 넣는다(규정 문서군 토큰과 섞지 않는다).

  RAG_ARCH_DOCS_CLIENT_KEY:
    summary: 아키텍처 설계문서 문서군 호출에 쓰는 클라이언트 키.
    behavior: 같은 발급 건의 토큰과 짝이다.
    example: >-
      설계문서 발급 건의 클라이언트 키. 토큰과 짝이 맞아야 한다.

  RAG_ARCH_DOCS_RETRIEVAL_ID:
    summary: 아키텍처 설계문서 문서군의 자산 ID.
    behavior: 규정 문서군과 독립적으로 회전한다(한쪽만 폐기될 수 있다).
    caution: 한쪽이 폐기돼도 살아 있는 문서군으로는 계속 답한다(그 사실을 답변에 밝힌다).
    example: >-
      20260929160345_4d8f9941f6dd4790ae430edad1869b06 — 설계문서만 재청킹하면 이 값만 바뀌고
      규정 문서군은 그대로 동작한다(한쪽만 교체하면 된다).

  RAG_COLLECTIONS_FILE:
    summary: 문서군의 설명·표면어를 담은 정본 파일 경로.
    behavior: 비우면 `config/rag_collections.yaml`을 읽는다. 문서군을 새로 추가할 때만 건드린다.
    example: >-
      비워 두면 config/rag_collections.yaml 을 읽는다. 문서군 설명을 시험적으로 바꿔 보려면
      사본 경로를 넣는다.

  RAG_TIMEOUT:
    summary: 검색 호출 1건을 기다리는 시간(초).
    behavior: 이 시간 안에 응답이 오지 않으면 그 문서군은 실패로 처리하고 사유를 보여준다.
    example: 12 — 단순 질의 10초 목표 안에서 답변 생성 시간을 남기는 값.

  RAG_TOTAL_TIMEOUT:
    summary: 검색 호출 1건의 전체 제한 시간(초).
    behavior: >-
      응답이 조금씩 흘러와도 이 시간이 지나면 끊는다. 위 읽기 상한만으로는 무한정 기다리게 된
      사례가 있어 둘을 함께 둔다.
    caution: RAG_TIMEOUT 보다 크게 둔다.
    example: >-
      20 — 응답이 조금씩 흘러오며 끝나지 않는 경우에도 20초에 끊는다. RAG_TIMEOUT(12)보다 크게 둔다.

  RAG_MAX_COLLECTIONS_PER_TURN:
    summary: 한 질문에서 동시에 찾아볼 문서군 수 상한.
    behavior: >-
      두 문서군을 함께 지정하면 둘 다 검색하고 유사도 순으로 섞어 근거로 쓴다. 상한을 올리면
      문서군 수만큼 호출이 늘어난다.
    example: 2 — 지금 등록된 문서군이 2개다.

  RAG_MAX_DOC_CHARS:
    summary: 문서 1건에서 근거로 쓸 본문의 최대 글자 수.
    behavior: 넘으면 잘라내고 "일부만 근거로 썼다"는 사실을 답변 끝에 밝힌다.
    caution: 너무 작게 두면 근거가 끊겨 답이 부실해진다.
    example: >-
      4000 이면 4,000자가 넘는 문서 본문은 잘라 쓰고 답변 끝에 "일부만 근거로 썼다"고 밝힌다.

  RAG_MAX_CONTEXT_CHARS:
    summary: 한 질문에서 근거로 쓸 전체 글자 수 예산.
    behavior: >-
      초과분은 유사도가 낮은 문서부터 뺀다(품질 판정이 아니라 예산 처리이며 그 사실을 밝힌다).
      검색 결과가 문서군당 3건이라 정상 상황에서는 예산을 넘지 않는다.
    example: >-
      24000 — 문서군 2개 × 3건 × 4,000자의 최악값과 같게 둔 값이라 정상 상황에서는 근거가 빠지지 않는다.

  RAG_ANSWER_MAX_CHARS:
    summary: 생성할 답변의 길이 상한.
    behavior: 답변이 길수록 응답이 늦어진다. 규정 인용은 짧게 쓰는 편이 읽기에도 좋다.
    example: >-
      1200 이면 답변이 A4 반 장 정도다. 2000 으로 올리면 응답이 눈에 띄게 늦어진다.

  RAG_CACHE_TTL:
    summary: 같은 질문을 다시 물었을 때 검색 결과를 재사용하는 시간(초).
    behavior: >-
      0이면 매번 새로 검색한다. 자산 ID가 폐기되면 캐시는 즉시 버려지므로 낡은 내용이
      계속 나오지는 않는다.
    example: >-
      300 이면 같은 질문을 5분 안에 다시 물을 때 검색을 다시 하지 않는다. 0 으로 두면 매번 검색한다.

  RAG_EMPTY_RETRIES:
    summary: 검색 결과가 하나도 없을 때 다시 검색하는 횟수.
    behavior: >-
      문서 검색 서비스는 질문마다 가상 답변(HyDE)을 새로 만들어 검색하기 때문에, 같은 질문도
      가끔 결과가 0건으로 나온다. 고른 문서군이 모두 0건이면 이 횟수만큼 다시 검색한다.
      오류·타임아웃·색인 폐기는 다시 하지 않는다. 다시 검색해도 전체 시간 상한(RAG_TOTAL_TIMEOUT)은
      넘지 않는다.
    example: >-
      1 이면 0건일 때 한 번 더 검색한다(기본). 0 으로 두면 다시 검색하지 않는다.

  RAG_DOC_URL_BASE:
    summary: 참고 문서 링크의 앞부분 주소.
    behavior: >-
      검색 결과의 문서 경로가 상대 경로라 이 값이 있어야 링크를 만들 수 있다. 비우면 링크 없이
      파일명과 부제만 보여준다.
    example: >-
      http://portal.example/docs 처럼 두면 참고 문서에 링크가 붙는다. 비우면 파일명과 부제만 보인다.

  RAG_CHAT_ROUTING_ENABLED:
    summary: 일반 채팅에서 사내 규정·설계문서 내용을 묻는 질문을 문서 검색으로 보낼지.
    behavior: >-
      켜면 채팅 질문을 작업으로 나눌 때 「사내 문서」 담당이 목록에 오르고, 규정·절차·설계 근거를
      묻는 질문은 등록된 문서군에서 찾아 문서 근거와 출처로 답한다. 서버 수치·목록·발생 알람 같은
      조회 질문은 종전 경로 그대로다. RAG_ENABLED 와 둘 다 켜져야 동작한다.
    options:
      - value: "false"
        label: 기본
        effect: 채팅에서는 문서를 찾지 않는다. 문서 조회는 관리자 「문서 검색 시험」 탭과 운영자 API로만 한다.
      - value: "true"
        effect: 채팅에서 규정·설계 질문이 문서 검색으로 간다(민감 문서군은 채팅에 오르지 않는다).
    caution: >-
      서버를 다시 시작해야 반영된다(질문 분해 지시문이 바뀌는 값이다). 켜기 전에 관리자 「문서 검색
      시험」 탭에서 실제 검색·답변이 되는지 먼저 확인한다. 사용자별로 문서 조회를 막거나 열려면
      「사용자 관리」의 「조회 가능 소스」에서 「사내 문서」를 고른다.
    example: >-
      true 로 두고 재시작하면 채팅에 "계정 신청은 누가 승인하나요?"라고 물었을 때 규정 문서에서
      찾아 참고 문서와 함께 답한다. false 면 같은 질문을 문서에서 찾지 않는다.

  RAG_SENSITIVE_ALLOWED_USERS:
    summary: 민감으로 표시된 문서군을 볼 수 있는 일반 사용자 목록(쉼표 구분).
    behavior: >-
      문서군 정본에서 민감으로 표시한 문서군은 기본적으로 관리자만 볼 수 있다. 여기에 사용자
      이름을 넣으면 그 사람도 볼 수 있다. **비우면 관리자 외에는 아무도 못 본다** — 민감 자료는
      닫힘이 기본값이다.
    caution: >-
      지금 등록된 두 문서군(전산관리규정·아키텍처 설계문서)은 민감으로 표시되지 않았으므로 이
      설정과 무관하다. 앞으로 민감 문서군을 추가할 때 쓴다.
    example: >-
      kim,lee 로 두면 두 사람이 민감 문서군까지 조회할 수 있다. 비워 두면 관리자만 본다.
