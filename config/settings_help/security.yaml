# 설정 옵션 상세 설명 — 보안 마스킹 (D-191)
# 근거: src/config.py SecurityConfig 주석 · docs/pii_filtering_rules.md

version: 1
group: security

settings:

  SECURITY_SENSITIVE_COLUMNS:
    example: >-
      인증 DB를 조회하는 질의에 `password_hash` 컬럼이 딸려 나오면, 이 목록에 `password`가 있으므로 값이 가려진 채 화면과 LLM 프롬프트로 간다.
      목록을 비우면 해시가 그대로 외부 LLM 요청에 실린다.
    summary: 이름이 여기 해당하면 값을 통째로 가리는 컬럼 목록.
    behavior: >-
      조회 결과에 이 이름의 컬럼이 있으면 값을 마스킹 문자열로 바꿔 화면·문서·LLM 프롬프트
      어디에도 원문이 나가지 않게 한다. 비밀번호·토큰·주민번호·카드번호 계열이 기본으로 들어 있다.
    options:
      - value: '["password","token","api_key", ...]'
        label: 기본 22종
        effect: 자격증명·식별번호 계열을 폭넓게 가린다. 대부분의 환경에서 그대로 쓸 수 있다.
      - value: "[]"
        effect: 아무것도 가리지 않는다. 비밀번호 컬럼이 그대로 화면과 LLM 프롬프트로 나간다.
    performance: 컬럼 이름 비교라 비용이 사실상 없다.
    stability: >-
      이름 기준이라 실제로 민감한데 이름이 다른 컬럼은 걸리지 않는다. 새 스키마를 편입할
      때 민감 컬럼 이름이 이 목록과 맞는지 확인해야 한다.
    recommendation: 기본 목록을 유지하고, 사내 명명 규칙에 맞는 이름을 추가한다. 줄이지 않는다.
    caveats:
      - .env에 적을 때는 JSON 배열 형식이어야 한다 — ["a","b"] 처럼 쓴다.
    related: [SECURITY_PARTIAL_MASK_COLUMNS, SECURITY_MASK_PATTERN]

  SECURITY_PARTIAL_MASK_COLUMNS:
    example: >-
      담당자 이메일이 결과에 섞일 때, 전체 마스킹은 '연락처가 있는지'조차 못 보게 만든다. 부분 마스킹으로 두면 형식은 남아 '값은 있다'가 보이면서 누구인지는 감춰진다.
    summary: 전부 가리지 않고 일부만 가릴 컬럼 목록.
    behavior: >-
      값의 형태는 남기고 식별 가능한 부분만 가린다. 이메일·전화번호처럼 "누구인지는
      감추되 데이터가 있다는 것은 보여야" 하는 컬럼에 쓴다.
    options:
      - value: "[]"
        label: 기본
        effect: 부분 마스킹을 쓰지 않는다.
      - value: '["email","phone"]'
        effect: 해당 컬럼을 부분적으로 가린다. 값의 존재와 형식은 보이고 원문은 감춰진다.
    performance: 비용이 사실상 없다.
    stability: 전체 마스킹 목록에도 같은 컬럼이 있으면 그쪽이 더 강한 처리다.
    caveats:
      - .env에 적을 때는 JSON 배열 형식이어야 한다.
    related: [SECURITY_SENSITIVE_COLUMNS]

  SECURITY_MASK_PATTERN:
    example: >-
      빈 문자열로 두면 가려진 칸과 원래 데이터가 없는 칸이 화면에서 똑같이 보인다. 사용자는 '데이터가 없다'고 결론 내리고, 실제로는 가려진 것이라는 사실을 알 방법이 없다.
    summary: 가려진 값 대신 표시할 문자열.
    behavior: 마스킹된 자리에 이 문자열이 들어간다. 사용자가 "가려졌다"는 것을 알아볼 수 있어야 한다.
    options:
      - value: "***MASKED***"
        label: 기본
        effect: 가려졌다는 사실이 분명히 드러난다.
      - value: '""'
        effect: 빈 값으로 보인다. 데이터가 없는 것과 구분되지 않아 오해를 부른다.
    performance: 영향 없다.
    stability: 빈 문자열이나 공백은 "데이터 없음"과 혼동된다 — 눈에 띄는 문자열을 쓴다.
    recommendation: 기본값 유지.
    related: [SECURITY_SENSITIVE_COLUMNS]

  SECURITY_MASK_IP:
    example: >-
      인프라 조회에서 IP는 곧 서버 식별자다. 이 값을 켜면 'CPU 90% 넘는 서버'의 결과에서 어느 장비인지 알 수 없게 되어 조회 자체가 쓸모없어진다 — 외부 공유용
      산출물에만 한시적으로 고려한다.
    summary: IP 주소를 가릴지.
    behavior: 조회 결과의 IP 주소를 마스킹한다. 인프라 조회에서는 IP가 곧 대상 식별자라 가리면 결과를 쓰기 어려워진다.
    options:
      - value: "false"
        label: 기본
        effect: IP를 그대로 보여준다. 서버를 식별해야 하는 인프라 조회 용도에 맞는다.
      - value: "true"
        effect: IP를 가린다. 어떤 서버인지 알 수 없어져 조회 결과의 실용성이 크게 떨어진다.
    performance: 영향이 미미하다.
    stability: 켜면 조사·대조 작업이 사실상 불가능해진다. 외부 공유용 산출물에만 한시적으로 고려한다.
    recommendation: 기본 false 유지.
    related: [SECURITY_MASK_EMAIL]

  SECURITY_MASK_EMAIL:
    example: >-
      담당자 이메일이 결과에 나오는 환경에서 켜면 연락처가 가려진다. 다만 담당자 식별이 업무에 필요하다면 전체 마스킹보다 SECURITY_PARTIAL_MASK_COLUMNS
      쪽이 실무에 맞는다.
    summary: 이메일 주소를 가릴지.
    behavior: 조회 결과의 이메일을 마스킹한다. 담당자 연락처가 결과에 섞이는 환경에서 검토할 만하다.
    options:
      - value: "false"
        label: 기본
        effect: 이메일을 그대로 보여준다.
      - value: "true"
        effect: 이메일을 가린다. 담당자 식별이 필요한 업무에서는 부분 마스킹 쪽이 낫다.
    performance: 영향이 미미하다.
    stability: 전부 가리는 대신 SECURITY_PARTIAL_MASK_COLUMNS로 부분 마스킹하는 편이 실무에 맞는 경우가 많다.
    related: [SECURITY_PARTIAL_MASK_COLUMNS, SECURITY_MASK_IP]

  SECURITY_PII_FILTER_LOG_ENABLED:
    example: >-
      '어제까지 되던 질의가 오늘 안 된다'는 신고에서, 게이트웨이가 개인정보로 판단해 막은 것이 원인인 경우가 있다. 이 로그가 있으면 어떤 유형이 어디서 걸렸는지 바로
      보이고, 없으면 그냥 '실패'로만 남는다.
    summary: 게이트웨이의 개인정보 필터가 요청을 차단했을 때 그 사실을 로그로 남길지.
    behavior: >-
      FabriX가 프롬프트나 응답을 개인정보로 판단해 막으면, 어떤 유형이 어디서 걸렸는지
      경고 한 줄을 남긴다. 차단이 일어날 때만 발화하므로 평시 로그량에는 영향이 없다.
    options:
      - value: "true"
        label: 기본
        effect: 차단 원인을 로그로 볼 수 있다. 왜 특정 질의만 실패하는지 알아내는 유일한 실마리인 경우가 많다.
      - value: "false"
        effect: 차단이 조용히 일어난다. 사용자에게는 그냥 실패로 보이고 원인을 알 수 없다.
    performance: 차단 시에만 기록하므로 평시 비용이 없다.
    stability: 끄면 "특정 질문만 안 된다"는 신고를 조사할 방법이 사라진다.
    recommendation: 켠 채로 둔다.
    related: [SECURITY_PII_FILTER_LOG_UNMASK, SECURITY_PII_BLOCK_DUMP_ENABLED, LLM_PROVIDER]
    references:
      - docs/pii_filtering_rules.md

  SECURITY_PII_FILTER_LOG_UNMASK:
    example: >-
      타임스탬프 `20260831153045`가 계좌번호로 오인돼 차단되는 상황을 판정하려면 실제 값을 봐야 한다. 그때만 잠깐 켜고, 끝나면 되돌린다 — 켜 둔 채 잊으면
      로그가 개인정보 보관처가 된다.
    summary: 위 로그에 감지된 문자열을 원문 그대로 남길지 — 기본은 마스킹이다.
    behavior: >-
      켜면 무엇이 개인정보로 오인됐는지 실제 값으로 확인할 수 있다. 타임스탬프가 계좌번호로
      오인되는 것 같은 오탐을 판정할 때 필요하다. 대신 로그에 실제 개인정보가 남을 수 있다.
    options:
      - value: "false"
        label: 기본
        effect: 형태만 남기고 값은 가린다. 무엇이 걸렸는지는 알 수 있지만 원문은 남지 않는다.
      - value: "true"
        effect: 원문을 남긴다. 오탐 판정에는 필수적이지만, 로그가 개인정보 보관처가 된다.
    performance: 영향 없다.
    stability: >-
      켜 둔 것을 잊으면 로그 파일이 개인정보를 계속 축적한다. 진단이 끝나면 반드시 되돌린다.
    recommendation: 평시 false. 오탐을 판정하는 동안만 한시적으로 켠다.
    caveats:
      - 켜 둔 채로 방치하면 로그 자체가 개인정보 유출 경로가 된다.
    related: [SECURITY_PII_FILTER_LOG_ENABLED]

  SECURITY_PII_BLOCK_DUMP_ENABLED:
    example: >-
      로그 한 줄로는 '계좌번호 패턴이 걸렸다'까지만 알 수 있다. 덤프를 보면 프롬프트의 어느 대목이 그 패턴이었는지 짚을 수 있어, 스크럽 설정을 어떻게 조정할지 판단할 수
      있다.
    summary: 차단이 일어났을 때 보낸 프롬프트와 응답 전문을 파일로 덤프할지.
    behavior: >-
      덤프는 logs/pii_block/에 마스킹 없이 저장되며 서버 밖으로 나가지 않는다. 로그 한 줄로는
      알 수 없는 "정확히 어느 대목이 걸렸나"를 확인하는 용도다.
    options:
      - value: "true"
        label: 기본
        effect: 차단 시 전문을 남긴다. 원인 규명이 훨씬 빨라진다.
      - value: "false"
        effect: 남기지 않는다. 로그 한 줄에 적힌 유형 정보만으로 조사해야 한다.
    performance: 차단 시에만 파일을 쓴다. 평시 비용은 없다.
    stability: >-
      덤프 파일에는 마스킹되지 않은 원문이 들어 있다. 저장 위치의 접근 권한과 보존 기간을
      운영 정책에 포함해야 한다.
    recommendation: 켠 채로 두되, logs/pii_block/의 접근 통제와 정리 주기를 정해 둔다.
    caveats:
      - 덤프는 무마스킹이다. 디렉터리 권한 관리가 함께 필요하다.
    related: [SECURITY_PII_FILTER_LOG_ENABLED]

  SECURITY_PII_SCRUB_SAMPLES:
    example: >-
      스키마를 파악하려고 실제 행 몇 건을 프롬프트에 넣는데, 거기 담당자 이메일이 들어 있으면 게이트웨이가 요청 전체를 막는다. 스크럽을 켜면 형식만 남기고 값을 가려 그
      차단을 예방한다.
    summary: 프롬프트에 넣기 전에 샘플 데이터의 개인정보를 미리 지울지 — 차단 예방용이다.
    behavior: >-
      스키마를 파악하려고 실제 행 몇 건을 프롬프트에 넣는데, 거기 섞인 이메일·연락처·
      타임스탬프가 게이트웨이 필터에 걸려 질의 전체가 막히는 일이 있다. 미리 형식을
      보존한 채 가려서 그 차단을 예방한다.
    options:
      - value: "true"
        label: 기본
        effect: 샘플의 개인정보를 미리 가린다. 차단이 크게 줄어든다.
      - value: "false"
        effect: 원본 그대로 보낸다. 데이터 형태를 모델이 더 정확히 보지만, 필터에 걸릴 확률이 올라간다.
    performance: 샘플 몇 건에 대한 문자열 처리라 비용이 작다.
    stability: 끄면 "어제까지 되던 질의가 오늘 막힌다"는 형태의 산발적 실패가 늘어난다.
    recommendation: 켠 채로 둔다.
    related: [SECURITY_PII_SCRUB_SUSPECT_DATES, SECURITY_PII_FILTER_LOG_ENABLED]

  SECURITY_PII_SCRUB_SUSPECT_DATES:
    example: >-
      계좌번호 유사 패턴 때문에 차단이 실제로 발생할 때만 켠다. 켜면 날짜 표기가 바뀌어 모델에 전달되므로, 기간 해석이 중요한 질의에서는 부작용을 함께 확인해야 한다.
    summary: 날짜·타임스탬프를 계좌번호로 오인당하지 않게 무해화할지.
    behavior: >-
      숫자가 길게 이어진 타임스탬프가 계좌번호 패턴으로 잡혀 차단되는 오탐이 있다.
      켜면 구분자를 바꿔 그 오인을 피한다. 기본이 off인 이유는 정상 날짜 표기까지
      건드리기 때문이다.
    options:
      - value: "false"
        label: 기본
        effect: 날짜를 그대로 보낸다.
      - value: "true"
        effect: >-
          날짜·타임스탬프의 구분자를 바꿔 계좌번호 오인을 피한다. 계좌번호 유사 패턴 때문에
          차단이 실제로 발생할 때만 켠다.
    performance: 문자열 치환이라 비용이 작다.
    stability: 모델에 전달되는 날짜 표기가 달라지므로, 날짜 해석이 필요한 질의에 영향이 갈 수 있다.
    recommendation: 계좌번호 오탐 차단이 실제로 관측될 때만 켠다.
    related: [SECURITY_PII_SCRUB_SAMPLES]
