# 설정 옵션 상세 설명 — 알람 (D-191)
# 근거: src/config.py AlarmConfig 주석 · docs/28_noise_cancellation_operator_guide.md
#       docs/02_decision.md (D-184 dead-letter · D-188 서버 식별 · D-131 ⑤ 미소비 등재)

version: 1
group: alarm

settings:

  ALARM_ENABLED:
    summary: 서버가 뜰 때 알람 워커를 함께 띄울지 — 이 값이 꺼져 있으면 알람이 한 건도 처리되지 않는다.
    behavior: >-
      켜면 애플리케이션 프로세스 안에서 알람 워커가 Redis 스트림을 소비하기 시작한다.
      알람 수신부(TCP)는 별도 프로세스라 이 값과 무관하게 계속 받아 쌓지만, 처리하는
      쪽이 없으면 스트림에만 쌓이고 화면에는 아무것도 뜨지 않는다.
    options:
      - value: "false"
        label: 기본
        effect: 워커를 띄우지 않는다. 알람이 들어와도 처리되지 않고 스트림에 쌓인다.
      - value: "true"
        effect: 워커가 스트림을 소비해 분석·억제 판단·통보까지 진행한다.
    example: >-
      "알람이 안 뜬다"는 신고에서 가장 먼저 확인할 값이다. 수신부는 정상이고 Redis에도
      데이터가 있는데 화면이 비어 있다면, 대개 이 값이 false다.
    performance: 워커가 상시 스트림을 폴링하므로 유휴 상태에서도 약간의 자원을 쓴다.
    stability: >-
      이 값은 기동 시 1회 읽힌다. 설정 리로드로는 워커가 새로 뜨지 않으므로 재시작이 필요하다.
      또한 워커는 기동 시점의 LLM·DB 설정을 붙들고 있어, 그쪽을 리로드해도 워커는 이전 값을 쓴다.
    recommendation: 알람 기능을 쓰는 환경에서는 true. 켠 뒤에는 노이즈 게이트 쪽 설정도 함께 확인한다.
    related: [ALARM_REDIS_STREAM_KEY, NOISE_ENABLE_NOISE_GATE, ALARM_MIN_SEVERITY]
    references:
      - docs/28_noise_cancellation_operator_guide.md

  ALARM_MIN_SEVERITY:
    example: >-
      이 값이 2면 주의(1) 알람은 워커가 아예 보지 않는다 — 노이즈 게이트가 억제한 것과 달리 통계에도 남지 않으므로 '주의 알람이 얼마나 오는지'조차 알 수 없다. 억제와
      미수신은 다른 상태다.
    summary: 어느 심각도부터 처리할지 — 이보다 낮은 알람은 워커가 아예 보지 않는다.
    behavior: >-
      0은 해소, 1은 주의, 2는 경고, 3은 심각이다. 이 값보다 낮은 알람은 스트림에서
      읽더라도 처리하지 않고 버린다. 노이즈 게이트의 억제 판단보다 앞에 있는 관문이다.
    options:
      - value: "2"
        label: 기본 (경고 이상)
        effect: 경고와 심각만 처리한다. 주의 수준의 잡음이 들어오지 않는다.
      - value: "0"
        effect: >-
          해소 알람까지 전부 처리한다. 해소 이벤트를 화면에 반영해야 하는 구성에서 쓰지만,
          처리량이 크게 늘어난다.
      - value: "3"
        effect: 심각만 처리한다. 경고 단계의 조기 신호를 놓친다.
    performance: 값을 낮출수록 워커가 처리하는 건수가 늘고, 이력 조회·프로세스 보강 호출도 함께 늘어난다.
    stability: >-
      너무 높이면 조기 경보를 놓치고, 너무 낮추면 노이즈 게이트가 걸러야 할 물량이
      급증한다. 억제 로직으로 거르는 것과 아예 안 보는 것은 다르다 — 여기서 버린 알람은
      통계에도 남지 않는다.
    recommendation: 기본 2 유지. 해소 이벤트를 화면에서 다뤄야 한다면 0을 검토한다.
    related: [NOISE_SUPPRESS_MAX_SEVERITY, ALARM_ENABLED]

  ALARM_REDIS_STREAM_KEY:
    example: >-
      수신부는 `alarm:raw`에 넣는데 워커 쪽만 이름을 바꾸면, 수신부는 정상 적재하고 워커는 빈 스트림을 읽는다. 양쪽 모두 오류를 내지 않아 '알람이 안 뜬다'로만
      드러난다 — 수신부는 별도 프로세스·별도 설정 파일이라 함께 고쳐야 한다.
    summary: 알람 원문이 들어오는 Redis 스트림 이름.
    behavior: >-
      수신부(별도 프로세스)가 여기에 넣고 워커가 여기서 읽는다. 양쪽이 같은 이름을
      가리켜야 하며, 한쪽만 바꾸면 알람이 한 건도 처리되지 않는다.
    options:
      - value: "alarm:raw"
        label: 기본
        effect: 수신부 기본값과 같다. 그대로 두는 것이 안전하다.
    performance: 영향 없다.
    stability: >-
      수신부는 noise_gate/alarm_server가 자기 설정으로 읽는다 — 이 화면에서 바꾸면
      양쪽이 어긋난다. 바꿔야 한다면 수신부 설정도 함께 고치고 두 프로세스를 모두 재시작한다.
    recommendation: 기본값 유지.
    caveats:
      - 수신부는 별도 프로세스·별도 설정 파일이다. 한쪽만 바꾸면 알람이 조용히 멈춘다.
    related: [ALARM_REDIS_CONSUMER_GROUP, ALARM_ENABLED]

  ALARM_REDIS_CONSUMER_GROUP:
    example: >-
      운영 중에 그룹 이름을 바꾸면 새 그룹으로 인식돼 읽기 시작 지점이 달라지고, 이전 그룹에 확인되지 않은 메시지가 남는다. 바꿀 이유가 거의 없는 값이다.
    summary: 스트림을 읽는 소비자 그룹 이름.
    behavior: >-
      같은 그룹에 속한 소비자들이 메시지를 나눠 갖는다. 그룹을 바꾸면 새 그룹으로
      인식돼 읽기 시작 지점이 달라질 수 있다.
    performance: 영향 없다.
    stability: >-
      운영 중에 그룹 이름을 바꾸면 이전 그룹의 미확인 메시지가 남는다. 바꿀 이유가
      거의 없는 값이다.
    recommendation: 기본값 유지.
    related: [ALARM_REDIS_STREAM_KEY]

  ALARM_DEDUP_TTL_SECONDS:
    example: >-
      네트워크 재전송으로 같은 알람이 두 번 도착해도 5분 안이면 한 번만 처리된다. 이 값을 한 시간으로 늘리면 실제로 재발한 알람까지 중복으로 묻히므로, 반복 억제는 노이즈
      게이트 쪽(NOISE_REPEAT_INTERVAL_SECONDS)에서 다루는 편이 맞다.
    summary: 같은 알람이 다시 들어왔을 때 몇 초 동안 재처리하지 않을지.
    behavior: >-
      알람 식별자를 기준으로, 이 시간 안에 같은 것이 또 오면 처리하지 않는다.
      노이즈 게이트의 억제 판단과는 다른 층이다 — 이쪽은 같은 메시지의 중복 배달을 막는다.
    options:
      - value: "300"
        label: 기본
        effect: 5분. 재전송이나 중복 배달로 같은 알람이 두 번 처리되는 것을 막는다.
      - value: "0"
        effect: 중복 억제를 끈다. 재전송이 그대로 두 건으로 처리된다.
      - value: "3600 이상"
        effect: 한 시간 이상 같은 알람을 무시한다. 실제로 재발한 알람까지 묻힐 수 있다.
    performance: 억제되면 이후 처리(이력 조회·보강·통보)가 통째로 생략된다.
    stability: 길게 잡으면 진짜 재발이 가려진다. 반복 알람 억제는 노이즈 게이트 쪽 설정으로 다루는 편이 맞다.
    recommendation: 기본 300초 유지.
    related: [NOISE_REPEAT_INTERVAL_SECONDS, NOISE_DEBOUNCE_SECONDS]

  ALARM_DEAD_LETTER_STREAM_KEY:
    example: >-
      폴스타가 심각도를 `주의`라는 한글 라벨로 보내면서 숫자 변환에 실패해 알람이 전량 조용히 폐기된 사고가 있었다. 이 스트림이 그때 원문과 사유를 남겨 두므로, '알람이 안
      뜬다'를 조사할 때 가장 먼저 볼 곳이다.
    summary: 워커가 처리하지 못한 메시지를 원문 그대로 보관하는 스트림.
    behavior: >-
      처리 중 예외가 나면 메시지를 확인 처리하고 버리는데, 버리기 전에 원문과 사유를
      여기에 남긴다. 이 장치가 없던 시절, 심각도가 한글 라벨로 들어와 숫자 변환에
      실패하면서 알람이 전량 조용히 폐기된 사고가 있었다.
    options:
      - value: "alarm:dead"
        label: 기본
        effect: 처리 실패 메시지가 여기 쌓인다. "알람이 안 뜬다"를 조사할 때 가장 먼저 볼 곳이다.
    performance: 실패 시에만 기록하므로 평시 비용이 없다.
    stability: >-
      이 기능은 항상 동작하며 끄는 스위치가 없다. 침묵 폐기를 막는 것이 목적이기 때문이다.
    recommendation: 기본값 유지. 정기적으로 이 스트림에 쌓인 것이 있는지 확인한다.
    related: [ALARM_DEAD_LETTER_MAXLEN]
    references:
      - docs/02_decision.md (D-184)

  ALARM_DEAD_LETTER_MAXLEN:
    example: >-
      형식 오류로 알람이 대량 폐기되는 상황에서는 1000건이 금방 찬다. 원인이 된 첫 메시지가 밀려나기 전에 조사를 시작해야 하므로, 이 스트림에 쌓인 것이 있으면 빨리
      확인하는 편이 낫다.
    summary: 실패 보관 스트림에 몇 건까지 남길지(근사 상한).
    behavior: 이 수를 넘으면 오래된 것부터 밀려난다. 정확한 개수가 아니라 대략적인 상한이다.
    options:
      - value: "1000"
        label: 기본
        effect: 최근 1000건까지 보관한다. 조사에 충분하고 메모리도 부담되지 않는다.
      - value: "100 이하"
        effect: 대량 실패가 발생하면 원인이 된 초기 메시지가 금방 밀려난다.
      - value: "10000 이상"
        effect: 더 오래 보관하지만 Redis 메모리를 그만큼 쓴다.
    performance: Redis 메모리 사용량이 이 값에 비례한다.
    stability: 실패가 폭주하는 상황에서는 가장 중요한 첫 실패가 밀려나기 쉽다 — 조사는 빨리 시작하는 편이 낫다.
    recommendation: 기본 1000 유지.
    related: [ALARM_DEAD_LETTER_STREAM_KEY]

  ALARM_HISTORY_ENABLED:
    example: >-
      매일 새벽 3시에 배치 때문에 나는 CPU 알람은 이력을 보면 '일 주기 반복'으로 판정된다. 이력 조회를 끄면 그 알람이 매번 처음 보는 알람처럼 취급되어 억제 판단의
      근거가 사라진다.
    summary: 같은 알람의 과거 발생 이력을 조회해 분석에 함께 쓸지.
    behavior: >-
      알람이 들어오면 그 알람이 과거에 언제 얼마나 발생했는지 조회해, 주기적으로
      반복되는 것인지 이번에 처음 난 것인지를 판단 재료로 쓴다.
    options:
      - value: "true"
        label: 기본
        effect: 이력을 조회해 패턴(일·주·월 주기, 급증 여부)을 함께 본다. 판단 품질이 올라간다.
      - value: "false"
        effect: >-
          이번 알람만 보고 판단한다. DB 조회가 빠지므로 처리가 빨라지지만, 매일 같은
          시각에 나는 배치 알람도 처음 보는 알람처럼 취급된다.
    performance: 알람마다 DB 조회가 한 번 붙는다. 결과는 ALARM_HISTORY_CACHE_TTL_SECONDS 동안 재사용된다.
    stability: 폴스타 DB에 닿지 못하면 이력 조회가 실패하지만, 그 경우에도 알람 처리 자체는 계속된다.
    recommendation: 켠 채로 둔다. 패턴 정보가 억제 판단의 핵심 근거다.
    related: [ALARM_HISTORY_LOOKBACK_DAYS, ALARM_HISTORY_MAX_ROWS, ALARM_HISTORY_CACHE_TTL_SECONDS]

  ALARM_HISTORY_LOOKBACK_DAYS:
    example: >-
      월말 정산 배치처럼 한 달에 한 번 나는 알람은 90일을 봐야 세 번 관측돼 주기로 인정된다. 30일로 줄이면 한 번밖에 안 보여 주기 판정이 되지 않고 매번 새 알람으로
      처리된다.
    summary: 이력을 며칠까지 거슬러 조회할지.
    behavior: >-
      기본 90일은 일·주·월 주기를 각각 세 번씩 관측할 수 있는 최소 기간으로 정한 값이다.
      주기를 판정하려면 최소 세 번은 봐야 하기 때문이다.
    options:
      - value: "90"
        label: 기본
        effect: 3개월. 월 단위 주기까지 세 번 관측할 수 있다.
      - value: "30"
        effect: 일·주 주기는 잡히지만 월 주기는 한 번밖에 안 보여 판정이 되지 않는다.
      - value: "180"
        effect: 월 주기 작업이 많은 환경에 맞다. 조회 범위가 두 배가 되므로 행수 상한도 함께 본다.
    performance: 기간이 길수록 조회 대상 행이 늘어난다. ALARM_HISTORY_MAX_ROWS가 실제 상한을 결정한다.
    stability: >-
      기간을 늘려도 행수 상한에 먼저 걸리면 오래된 구간이 잘린다 — 두 값을 함께 조정해야
      의도한 기간이 실제로 조회된다.
    recommendation: 기본 90일 유지. 월 주기 배치가 많으면 180으로 올리고 행수 상한도 함께 올린다.
    related: [ALARM_HISTORY_MAX_ROWS, ALARM_HISTORY_ENABLED]

  ALARM_HISTORY_MAX_ROWS:
    example: >-
      하루 10건씩 나는 빈발 알람은 90일이면 900건이다. 상한이 500이면 최근 50일치만 조회돼 주기 판정이 왜곡되는데, 잘렸다는 표시는 남으므로 그 신호를 보고 조정하면
      된다.
    summary: 이력 조회로 가져올 행 수의 상한.
    behavior: >-
      기본 2000은 하루 10건씩 나는 빈발 알람을 90일치 담을 수 있는 크기(900건)에
      여유를 둔 값이다. 상한에 걸리면 잘렸다는 표시가 함께 남는다.
    options:
      - value: "2000"
        label: 기본
        effect: 빈발 알람도 90일치를 담는다.
      - value: "500 이하"
        effect: 빈발 알람에서 잘려 최근 며칠만 보이게 된다 — 주기 판정이 왜곡된다.
      - value: "10000 이상"
        effect: 잘림은 없어지지만 조회 시간과 메모리가 늘어난다.
    performance: 조회 시간·전송량이 이 값에 비례한다. 알람이 몰릴 때 부담이 커진다.
    stability: 잘림이 발생하면 그 사실이 표시되므로 조용히 왜곡되지는 않는다 — 다만 그 표시를 보고 조정해야 한다.
    recommendation: 기본 2000 유지. 조회 기간을 늘렸다면 함께 올린다.
    related: [ALARM_HISTORY_LOOKBACK_DAYS]

  ALARM_HISTORY_CACHE_TTL_SECONDS:
    example: >-
      알람이 분당 수십 건 몰릴 때 캐시가 없으면 같은 알람의 이력을 매번 DB에서 읽는다. 5분 캐시면 그 폭주 구간의 DB 부하가 거의 사라지지만, 그 사이 발생한 알람은
      이력에 반영되지 않아 급증 판정이 조금 늦어진다.
    summary: 이력 조회 결과를 몇 초 동안 재사용할지. 0이면 캐시하지 않는다.
    behavior: 같은 알람이 짧은 간격으로 반복될 때 매번 DB를 치지 않도록 결과를 잠깐 보관한다.
    options:
      - value: "300"
        label: 기본
        effect: 5분간 재사용한다. 알람 폭주 시 DB 부하를 크게 줄인다.
      - value: "0"
        effect: 매번 조회한다. 항상 최신이지만 폭주 시 DB에 부담이 몰린다.
      - value: "3600"
        effect: 한 시간 재사용한다. 그 사이에 발생한 알람이 이력에 반영되지 않는다.
    performance: 적중하면 DB 조회가 통째로 생략된다. 알람이 몰리는 상황에서 효과가 가장 크다.
    stability: 길게 잡으면 방금 발생한 알람이 이력에 없는 것으로 보여 급증 판정이 늦어진다.
    recommendation: 기본 300초 유지.
    related: [ALARM_HISTORY_ENABLED, ALARM_BURST_THRESHOLD_24H]

  ALARM_BURST_THRESHOLD_24H:
    example: >-
      하루 두세 번 나는 정상 주기 알람이 있는 환경에서 임계를 3으로 낮추면, 그 알람이 매일 급증으로 판정된다. 급증 표시가 흔해지면 진짜 이상 상황이 그 사이에 묻힌다.
    summary: 24시간 안에 몇 건 이상이면 급증으로 볼지.
    behavior: 같은 알람이 하루 안에 이 횟수 이상 발생하면 급증으로 판정해 분석에 반영한다.
    options:
      - value: "5"
        label: 기본
        effect: 하루 다섯 건 이상이면 급증으로 본다.
      - value: "2~3"
        effect: 민감해진다. 하루 두세 번 나는 정상적인 주기 알람도 급증으로 잡힌다.
      - value: "20 이상"
        effect: 웬만해서는 급증으로 판정되지 않는다 — 실제 이상 상황도 평소처럼 처리된다.
    performance: 판정 자체는 비용이 없다.
    stability: 임계가 낮으면 정상 주기 알람이 계속 급증으로 잡혀 신호 가치가 떨어진다.
    recommendation: 실제 알람 빈도 분포를 보고 정한다. 기본 5에서 시작한다.
    related: [ALARM_HISTORY_ENABLED, ALARM_HISTORY_LOOKBACK_DAYS]

  ALARM_ENRICH_TIMEOUT_SECONDS:
    example: >-
      이력 조회와 프로세스 조회를 합쳐 5초가 상한이다. 프로세스 API 타임아웃이 3초이므로 이력이 2초 넘게 걸리면 프로세스 정보가 빠진 채 알람이 나간다 — 보강 실패가
      알람 자체를 막지는 않는다.
    summary: 알람 보강(이력·프로세스·메트릭 조회) 전체에 주는 시간(초).
    behavior: >-
      개별 조회 타임아웃과 별개로 보강 단계 전체를 감싸는 상한이다. 넘으면 그때까지
      모은 정보로 진행한다 — 보강 실패가 알람 처리 자체를 막지는 않는다.
    options:
      - value: "5"
        label: 기본
        effect: 5초. 개별 조회(프로세스 3초)보다 여유를 둔 값이다.
      - value: "2 이하"
        effect: 보강이 자주 잘려 프로세스 정보 없는 알람이 늘어난다.
      - value: "30 이상"
        effect: 보강은 대부분 완주하지만, 알람 폭주 시 워커가 한 건에 오래 묶인다.
    performance: 알람 한 건의 처리 시간 상한이 사실상 이 값에 좌우된다. 폭주 시 처리량에 직접 영향을 준다.
    stability: 보강은 실패해도 알람은 나간다 — 이 값은 "얼마나 기다렸다 포기할지"를 정할 뿐이다.
    recommendation: 기본 5초 유지. 개별 조회 타임아웃의 합보다 크게 잡는다.
    related: [ALARM_PROCESS_API_TIMEOUT_SECONDS, ALARM_HISTORY_ENABLED]

  ALARM_PROCESS_ENRICH_ENABLED:
    example: >-
      CPU 90% 알람에 '어떤 프로세스가 쓰고 있는지'가 함께 오면 초동이 크게 빨라진다. 다만 ALARM_PROCESS_API_BASE_URLS_CSV가 비어 있으면 켜도
      조용히 동작하지 않는다 — '프로세스 정보가 안 붙는다'의 원인은 대개 그쪽이다.
    summary: CPU·메모리 알람에 어떤 프로세스가 자원을 쓰고 있었는지 붙일지.
    behavior: >-
      폴스타 REST API로 해당 서버의 상위 프로세스를 조회해 알람에 함께 실는다.
      base_url이 설정되지 않은 DB에서는 자동으로 비활성된다.
    options:
      - value: "true"
        label: 기본
        effect: 프로세스 정보가 알람에 붙는다. "CPU가 높다"에서 "무엇 때문에 높다"로 정보가 올라간다.
      - value: "false"
        effect: 심각도와 값만 알린다. 외부 호출이 사라져 처리가 빨라진다.
    performance: 알람마다 외부 API 호출이 한 번 붙는다. 타임아웃은 3초로 짧게 잡혀 있다.
    stability: >-
      ALARM_PROCESS_API_BASE_URLS_CSV가 비어 있으면 켜도 동작하지 않는다 — 조용히 비활성되므로
      "프로세스 정보가 안 붙는다"의 원인은 대개 그쪽이다.
    recommendation: 켜 두고, base_url이 각 DB에 대해 설정돼 있는지 확인한다.
    related: [ALARM_PROCESS_API_BASE_URLS_CSV, ALARM_PROCESS_API_TIMEOUT_SECONDS, ALARM_PROCESS_TOP_N]

  ALARM_PROCESS_API_BASE_URLS_CSV:
    example: >-
      은행존 주소에 포트를 빠뜨리거나 `=` 기호를 놓치면 그 항목이 조용히 무시된다. 오류가 나지 않고 그 존만 프로세스 보강이 빠지므로, 설정 후 실제 알람으로 확인해야
      한다.
    summary: DB별 프로세스 조회 API 주소 — "db_id=주소" 형식의 쉼표 목록.
    behavior: >-
      운영 호스트 주소는 코드에 두지 않고 여기에만 넣는다. 매핑이 없는 DB에서는
      프로세스 보강이 조용히 비활성된다.
    options:
      - value: "(비움)"
        label: 기본
        effect: 프로세스 보강이 모든 DB에서 동작하지 않는다.
      - value: "polestar_cm_gp=http://<주소>,polestar_b0=http://<주소>:9010"
        effect: 나열한 DB에서 프로세스 보강이 동작한다. 존마다 주소와 포트가 다를 수 있다.
    performance: 주소가 원격일수록 왕복 지연이 보강 시간에 얹힌다.
    stability: >-
      형식이 잘못된 항목(= 기호 없음)은 조용히 무시된다. 오타를 내면 그 DB만 보강이
      빠지고 오류는 나지 않는다 — 설정 후 실제 알람으로 확인해야 한다.
    caveats:
      - 내부망 http이며 인증이 없다. 주소 자체가 접근 통제 경계 안에 있어야 한다.
    related: [ALARM_PROCESS_ENRICH_ENABLED]

  ALARM_PROCESS_API_TIMEOUT_SECONDS:
    example: >-
      보강 전체 상한이 5초인데 이 값을 10으로 올리면, 프로세스 조회 하나가 전체 예산을 다 써 이력 정보까지 함께 빠질 수 있다. 개별 타임아웃은 전체보다 충분히 작아야
      한다.
    summary: 프로세스 조회를 얼마나 기다릴지(초).
    behavior: 이력 조회보다 짧게 잡혀 있다 — 추가 외부 호출이라 알람 처리를 오래 붙잡으면 안 되기 때문이다.
    options:
      - value: "3"
        label: 기본
        effect: 3초. 정상 응답은 대개 1초 안에 온다.
      - value: "1"
        effect: 조금만 느려도 프로세스 정보가 빠진다.
      - value: "10 이상"
        effect: 느린 서버도 기다리지만, 응답하지 않는 서버 때문에 전체 보강 타임아웃까지 소모한다.
    performance: 알람 한 건의 처리 시간에 그대로 얹힌다.
    stability: 보강 전체 타임아웃(기본 5초)보다 크게 잡으면 이 값이 무의미해진다.
    recommendation: 기본 3초 유지. ALARM_ENRICH_TIMEOUT_SECONDS보다 작게 둔다.
    related: [ALARM_ENRICH_TIMEOUT_SECONDS, ALARM_PROCESS_ENRICH_ENABLED]

  ALARM_PROCESS_TOP_N:
    example: >-
      원인 프로세스는 대개 상위 한두 개 안에 있다. 20으로 올리면 메신저 쪽지 제목·본문이 길어져 잘리고, 정작 중요한 상위 프로세스가 화면 밖으로 밀릴 수 있다.
    summary: 상위 몇 개 프로세스를 알람에 표시할지.
    behavior: 자원 사용량 순으로 정렬해 앞에서부터 이 개수만 싣는다.
    options:
      - value: "5"
        label: 기본
        effect: 다섯 개. 원인 프로세스는 대개 상위 한두 개 안에 있다.
      - value: "1~2"
        effect: 알람이 짧아지지만, 여러 프로세스가 합쳐서 자원을 쓰는 경우를 놓친다.
      - value: "20 이상"
        effect: 알람 메시지가 길어져 통보 채널에서 읽기 어려워진다.
    performance: 표시 개수라 조회 비용에는 큰 차이가 없다.
    stability: 통보 채널의 메시지 길이 제한을 넘기면 잘릴 수 있다.
    recommendation: 기본 5 유지.
    related: [ALARM_PROCESS_ENRICH_ENABLED]

  ALARM_PROMETHEUS_ENABLED:
    example: >-
      이 값을 켜도 주소 설정(ALARM_PROMETHEUS_BASE_URLS_CSV)과 타임아웃은 현재 코드가 읽지 않는다 — 기능을 실제로 쓰려면 그 배선 상태를 먼저
      확인해야 한다.
    summary: Prometheus 메트릭을 알람 분석에 함께 조회할지.
    behavior: >-
      node_exporter를 직접 보지 않고 앞단 Prometheus의 조회 API를 읽기 전용으로 부른다.
      옵트인이며, 꺼져 있으면 조회 경로에 아예 들어가지 않는다.
    options:
      - value: "false"
        label: 기본
        effect: Prometheus를 조회하지 않는다. 기존 동작과 같다.
      - value: "true"
        effect: 메트릭을 함께 본다. 폴스타가 수집하지 않는 세부 지표까지 근거로 쓸 수 있다.
    performance: 알람마다 외부 조회가 하나 더 붙는다.
    stability: >-
      주소 설정(ALARM_PROMETHEUS_BASE_URLS_CSV)과 타임아웃 항목은 현재 코드가 읽지 않는다 —
      이 기능을 실제로 쓰려면 그 배선 상태를 먼저 확인해야 한다.
    recommendation: 배선이 확인되기 전에는 기본 off를 유지한다.
    related: [ALARM_PROMETHEUS_BASE_URLS_CSV, ALARM_PROMETHEUS_TIMEOUT_SECONDS]
    references:
      - docs/27_prometheus_integration_guide.md

  ALARM_PROMETHEUS_BASE_URLS_CSV:
    example: >-
      주소를 채워도 조회 대상이 달라지지 않는다 — 코드가 이 값을 읽지 않기 때문이다.
    summary: DB별 Prometheus 주소 — 현재 코드가 읽지 않는다.
    behavior: >-
      "db_id=주소" 형식으로 설계된 항목이지만, 지금 코드에 이 값을 읽는 곳이 없다.
      값을 채워도 조회 대상이 달라지지 않는다.
    performance: 영향 없다(소비되지 않음).
    stability: 영향 없다(소비되지 않음).
    related: [ALARM_PROMETHEUS_ENABLED]

  ALARM_PROMETHEUS_TIMEOUT_SECONDS:
    example: >-
      타임아웃을 조정해도 동작에 변화가 없다 — 소비처가 없다.
    summary: Prometheus 조회 타임아웃 — 현재 코드가 읽지 않는다.
    behavior: 정의만 있고 소비처가 없다. 값을 바꿔도 동작은 달라지지 않는다.
    performance: 영향 없다(소비되지 않음).
    stability: 영향 없다(소비되지 않음).
    related: [ALARM_PROMETHEUS_ENABLED]

  ALARM_NOTIFICATION_CHANNELS_CSV:
    example: >-
      이 값을 비우면 알람이 화면에는 뜨지만 메신저로는 아무것도 가지 않는다. 화면을 보고 있지 않은 야간에는 사실상 알람이 없는 것과 같아진다.
    summary: 알람을 어느 채널로 보낼지 — 쉼표로 여러 개를 적을 수 있다.
    behavior: >-
      현재 실제로 쓸 수 있는 채널은 worKB뿐이다. 형식은 나중에 채널이 늘어날 것을
      감안해 쉼표 목록으로 유지하고 있다.
    options:
      - value: workb
        label: 기본
        effect: worKB로 발송한다.
      - value: "(비움)"
        effect: 아무 데도 보내지 않는다. 화면에는 뜨지만 통보는 나가지 않는다.
    performance: 채널이 늘어나면 발송 호출도 그만큼 늘어난다.
    stability: 지원하지 않는 채널 이름을 적으면 그 채널은 무시된다.
    recommendation: 기본값 유지.
    related: [ALARM_WEBHOOK_URL, WORKB_BASE_URL]

  ALARM_WEBHOOK_URL:
    example: >-
      알람 본문에는 서버 등록명·IP·프로세스 목록 같은 내부 정보가 담긴다. 외부 주소를 넣으면 그 정보가 그대로 나가므로, 전송 대상이 신뢰 경계 안인지 확인해야 한다.
    summary: 범용 웹훅 주소 — 비어 있으면 웹훅 채널이 자동으로 무시된다.
    behavior: 알람을 임의의 HTTP 엔드포인트로 보내는 통로다. 주소가 없으면 그 채널은 없는 것처럼 취급한다.
    options:
      - value: "(비움)"
        label: 기본
        effect: 웹훅을 쓰지 않는다.
      - value: "http://<수신처>/hook"
        effect: 알람이 그 주소로 POST된다.
    performance: 발송마다 외부 호출이 하나 붙는다.
    stability: >-
      수신처가 응답하지 않으면 타임아웃까지 기다린다. 알람이 몰릴 때 발송이 밀릴 수 있다.
      알람 본문에는 서버명·IP 등 내부 정보가 담기므로 전송 대상이 신뢰 경계 안인지 확인한다.
    caveats:
      - 알람 본문에 내부 인프라 정보가 담긴다 — 외부 주소를 넣지 않는다.
    related: [ALARM_WEBHOOK_TIMEOUT_SECONDS, ALARM_NOTIFICATION_CHANNELS_CSV]

  ALARM_WEBHOOK_TIMEOUT_SECONDS:
    example: >-
      수신처가 죽은 상태에서 이 값이 30초면 알람 한 건마다 30초가 소모된다. 알람이 열 건 몰리면 5분이 발송에만 묶여 그동안 새 알람 처리가 밀린다.
    summary: 웹훅 발송을 얼마나 기다릴지(초).
    behavior: 이 시간을 넘기면 발송 실패로 처리한다. 실패해도 다른 채널 발송은 계속된다.
    options:
      - value: "10"
        label: 기본
        effect: 10초. 느린 수신처도 대체로 수용한다.
      - value: "3 이하"
        effect: 빠르게 포기한다. 수신처가 조금만 느려도 알람을 놓친다.
      - value: "30 이상"
        effect: 수신처가 죽었을 때 발송 하나가 30초를 잡아먹는다 — 알람 폭주 시 치명적이다.
    performance: 발송 대기 동안 워커가 묶인다.
    stability: 수신처 장애가 알람 처리 전체를 지연시키지 않도록 짧게 잡는 편이 안전하다.
    recommendation: 기본 10초 또는 그보다 짧게.
    related: [ALARM_WEBHOOK_URL]

  ALARM_SERVER_IDENTITY_TIMEOUT_SECONDS:
    example: >-
      알람 템플릿이 서버 이름과 IP를 주지 못할 때 호스트명으로 폴스타를 역조회해 채운다. 실패해도 알람은 나가지만 서버 이름 칸이 비어 보이므로, 담당자가 어느 장비인지 바로
      알기 어려워진다.
    summary: 호스트명으로 폴스타 등록 서버 정보를 역조회할 때 기다리는 시간(초).
    behavior: >-
      알람 템플릿이 서버 이름과 IP를 못 주는 경우가 있어, 호스트명으로 폴스타에 등록된
      서버 정보를 찾아 채운다. 항상 동작하며 끄는 스위치가 없다 — 실패하면 그냥 넘어간다.
    options:
      - value: "3.0"
        label: 기본
        effect: 3초. 단순 조회라 대개 훨씬 빨리 끝난다.
      - value: "1 이하"
        effect: DB가 조금만 느려도 서버 이름·IP가 비어 있는 알람이 나간다.
      - value: "10 이상"
        effect: 조회 성공률은 오르지만 알람 처리가 그만큼 지연된다.
    performance: 캐시가 적중하면 조회 자체가 생략된다.
    stability: 실패해도 알람은 나간다 — 서버 이름이 비어 보일 뿐이다.
    recommendation: 기본 3초 유지.
    related: [ALARM_SERVER_IDENTITY_CACHE_TTL_SECONDS]
    references:
      - docs/02_decision.md (D-188)

  ALARM_SERVER_IDENTITY_CACHE_TTL_SECONDS:
    example: >-
      서버 이름과 IP는 자주 바뀌지 않아 한 시간 캐시가 안전하다. 다만 IP를 재할당한 직후에는 그 시간 동안 옛 IP가 알람에 표시된다.
    summary: 역조회한 서버 정보를 몇 초 동안 재사용할지. 0이면 캐시하지 않는다.
    behavior: 같은 서버에서 알람이 반복될 때 매번 DB를 치지 않도록 Redis에 보관한다.
    options:
      - value: "3600"
        label: 기본
        effect: 한 시간 재사용한다. 서버 이름·IP는 자주 바뀌지 않으므로 길게 잡아도 무리가 없다.
      - value: "0"
        effect: 매번 조회한다. 알람이 몰릴 때 DB 부하가 늘어난다.
    performance: 적중하면 조회가 생략돼 알람 처리가 빨라진다.
    stability: 서버 정보가 변경되면 그 시간 동안 옛 값이 쓰인다. IP 변경이 잦은 환경에서는 짧게 잡는다.
    recommendation: 기본 3600초 유지.
    related: [ALARM_SERVER_IDENTITY_TIMEOUT_SECONDS]

  ALARM_DEFAULT_TEST_DB_ID:
    example: >-
      알람 분석 테스트 API에서 대상을 생략했을 때만 쓰인다. 실제 알람 처리 경로는 이 값을 보지 않으므로, 여기를 바꿔도 운영 동작은 달라지지 않는다.
    summary: 알람 분석 테스트 API에서 대상 DB를 생략했을 때 쓸 기본 DB.
    behavior: 테스트 호출 전용 기본값이다. 실제 알람 처리 경로에는 영향을 주지 않는다.
    performance: 영향 없다.
    stability: 존재하지 않는 DB 식별자를 넣으면 테스트 호출만 실패한다.
    recommendation: 테스트에 주로 쓰는 DB로 맞춰 둔다.
    related: [ACTIVE_DB_IDS]
