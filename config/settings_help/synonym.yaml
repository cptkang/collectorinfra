# 설정 옵션 상세 설명 — 동의어 매칭 (D-191)
# 근거: src/config.py SynonymMatchConfig 주석 · plans/61 트랙 B(D-075) · D-084

version: 1
group: synonym

settings:

  SYNONYM_FUZZY_MATCH:
    summary: 사용자가 쓴 말이 등록된 유사어와 정확히 같지 않아도 이어 줄지.
    behavior: >-
      기본은 **정확히 일치할 때만** 매칭한다. 켜면 한글 자모를 분해해 비교하고,
      한두 글자 차이(편집거리)와 부분어까지 후보로 본다. 켜기 전에는 기존 정확일치
      경로가 그대로 실행된다.
    options:
      - value: "false"
        label: 기본
        effect: 등록된 표현과 글자가 정확히 같아야 매칭된다. 오타나 줄임말은 매칭되지 않는다.
      - value: "true"
        effect: >-
          "메모리사용률"·"메모리 사용율"·"메모리사용" 같은 표기 흔들림을 같은 것으로
          본다. 대신 무관한 말이 잘못 걸릴 수 있어 신뢰도 임계로 거른다.
    example: >-
      "메모리사용율"(오타)을 물었을 때, 꺼져 있으면 매칭 실패로 LLM이 컬럼을 추측하게
      된다. 켜면 등록된 "메모리 사용률"에 이어지고, 신뢰도가 임계 미만이면 확정하지 않고
      후보로만 제시한다.
    performance: 후보 비교가 늘어나지만 문자열 연산이라 비용이 작다. 오히려 매칭 실패로 인한 재시도가 줄어든다.
    stability: 잘못 걸린 매칭은 엉뚱한 컬럼 조회로 이어진다 — 신뢰도 임계를 함께 조정한다.
    recommendation: 표기 흔들림으로 인한 조회 실패가 실제로 관측되면 켠다.
    related: [SYNONYM_MATCH_CONFIDENCE_MIN, SYNONYM_SEMANTIC_MATCH, SYNONYM_GOVERNANCE]

  SYNONYM_MATCH_CONFIDENCE_MIN:
    example: >-
      '메모리사용율'과 '메모리 사용률'은 유사도가 높아 0.85 임계를 넘는다. 반면 '메모리'와 '메시지'처럼 글자만 비슷한 경우는 임계 아래로 떨어져 확정되지 않고 후보로만
      제시된다 — 임계를 0.6으로 낮추면 후자도 확정돼 엉뚱한 컬럼을 조회하게 된다.
    summary: 유연 매칭 결과를 확정으로 인정할 최소 신뢰도.
    behavior: >-
      이 값 이상이면 확정 매핑으로 쓰고, 미만이면 확정하지 않고 후보로만 제시하거나
      LLM 판단에 넘긴다 — 애매한 것을 조용히 확정하지 않는다.
    options:
      - value: "0.85"
        label: 기본
        effect: 상당히 비슷할 때만 확정한다. 오매칭이 드물다.
      - value: "0.6"
        effect: 느슨해져 매칭률이 오르지만, 무관한 컬럼에 이어질 위험이 커진다.
      - value: "0.95 이상"
        effect: 거의 정확일치만 확정한다 — 유연 매칭을 켠 의미가 줄어든다.
    performance: 임계 자체는 비용이 없다. 확정되지 않으면 LLM 판단이 붙어 호출이 늘 수 있다.
    stability: 오매칭은 잘못된 조회로 이어지고, 그 결과는 "데이터가 이상하다"로 보인다 — 임계를 낮출 때는 신중히.
    related: [SYNONYM_FUZZY_MATCH, SYNONYM_SEMANTIC_CONFIDENCE_MIN]

  SYNONYM_VALUE_RETRIEVAL:
    summary: 스키마 이름뿐 아니라 실제 저장된 값까지 색인해 검색할지.
    behavior: >-
      자원 유형이나 EAV 속성명처럼 **데이터에 들어 있는 값**을 인덱싱해 두고 질의어와
      대조한다. 컬럼 이름만으로는 닿지 않는 표현을 이어 준다.
    options:
      - value: "false"
        label: 기본
        effect: 스키마 메타(테이블·컬럼·등록 유사어)만 본다.
      - value: "true"
        effect: >-
          실제 값까지 본다. "리눅스 서버"처럼 값에만 존재하는 표현이 매칭되지만,
          인덱싱을 위한 조회가 추가되고 캐시가 커진다.
    example: >-
      자원 유형 컬럼에 "LINUX"·"WINDOWS" 같은 값이 들어 있다면, 켜져 있을 때 "리눅스
      서버 목록" 질의가 그 값으로 바로 이어진다. 꺼져 있으면 LLM이 값 형식을 추측해야 한다.
    performance: 최초 인덱싱에 조회가 필요하고 캐시 용량이 늘어난다. 이후 매칭 자체는 빠르다.
    stability: 값이 자주 바뀌는 컬럼은 인덱스가 낡을 수 있다 — 스키마 캐시 갱신 주기와 함께 본다.
    related: [SYNONYM_FUZZY_MATCH, SCHEMA_CACHE_ENABLED]

  SYNONYM_SEMANTIC_MATCH:
    example: >-
      이 값을 켜도 매칭 결과는 달라지지 않는다 — 아직 구현되지 않았기 때문이다. 아래 백엔드·모델 경로 설정도 같은 상태이므로, 지금은 유연
      매칭(SYNONYM_FUZZY_MATCH)이 실질적인 마지막 단이다.
    summary: 임베딩으로 의미가 가까운 표현까지 이을지 — 현재는 자리만 예약된 상태다.
    behavior: >-
      정확일치 → 유연 매칭 → 임베딩 순서의 마지막 단으로 설계됐지만 **아직 구현되지
      않았다**. 켜도 매칭 동작이 달라지지 않으며, 백엔드 요건이나 의존성이 갖춰지지
      않으면 경고 한 번만 남기고 매칭 없이 지나간다.
    options:
      - value: "false"
        label: 기본
        effect: 임베딩 단계를 쓰지 않는다.
      - value: "true"
        effect: 켜지지만 실제 매칭은 일어나지 않는다(미구현). 모델·의존성이 없으면 경고만 남는다.
    performance: 실질 영향이 없다(미구현).
    stability: 구현 전까지는 이 값을 켜도 기대한 효과가 없다 — 아래 백엔드 설정들도 같은 상태다.
    recommendation: 기본 off 유지.
    related: [SYNONYM_SEMANTIC_BACKEND, SYNONYM_SEMANTIC_MODEL_PATH, SYNONYM_SEMANTIC_CONFIDENCE_MIN]

  SYNONYM_SEMANTIC_BACKEND:
    example: >-
      local은 모델을 프로세스 메모리에 상주시키므로 서버 메모리 여유가 필요하고, vllm은 별도 서버 한 대가 더 필요하다 — 다만 의미 매칭이 구현되기 전까지는 어느 쪽을
      골라도 동작이 같다.
    summary: 임베딩을 어디서 계산할지 — 프로세스 안에서 직접 할지, 별도 서버에 맡길지.
    behavior: 의미 매칭이 구현되면 쓰일 선택지다. 지금은 값을 바꿔도 매칭 동작이 달라지지 않는다.
    options:
      - value: local
        label: 기본
        effect: 반입한 모델을 프로세스 안에 올려 CPU로 계산한다. 별도 서버가 필요 없지만 메모리를 상주 점유한다.
      - value: vllm
        effect: 별도 vLLM 서버에 임베딩 모델을 올려 호출한다. 본체 메모리는 아끼지만 서버 하나가 더 필요하다.
    performance: local은 요청마다 CPU를 쓰고, vllm은 왕복 지연이 붙는다.
    stability: 어느 쪽이든 모델 경로나 서버 주소가 비면 미가용으로 처리된다.
    related: [SYNONYM_SEMANTIC_MODEL_PATH, SYNONYM_SEMANTIC_VLLM_BASE_URL]

  SYNONYM_SEMANTIC_MODEL_PATH:
    example: >-
      허브 모델 이름(`intfloat/multilingual-e5-small`)을 적으면 동작하지 않는다 — 폐쇄망이라 내려받지 않기 때문이다. 반입한 디렉터리의 절대 경로여야
      한다.
    summary: local 백엔드가 쓸 임베딩 모델 디렉터리 경로.
    behavior: >-
      폐쇄망 원칙상 런타임에 내려받지 않는다. 반입한 모델 디렉터리를 가리켜야 하고,
      비어 있으면 미가용으로 처리된다.
    options:
      - value: "(비움)"
        label: 기본
        effect: local 백엔드가 동작하지 않는다.
    performance: 모델 크기가 메모리 상주량과 계산 시간을 좌우한다.
    stability: 모델을 바꾸면 신뢰도 임계를 다시 맞춰야 한다 — 모델마다 점수 분포가 다르다.
    related: [SYNONYM_SEMANTIC_BACKEND, SYNONYM_SEMANTIC_CONFIDENCE_MIN, NOISE_EMBEDDING_MODEL_PATH]

  SYNONYM_SEMANTIC_VLLM_BASE_URL:
    example: >-
      주소만 채우고 모델명을 비우면 미가용으로 처리된다. 둘은 한 쌍이라 하나만으로는 켜지지 않는다.
    summary: vllm 백엔드의 임베딩 엔드포인트.
    behavior: OpenAI 호환 `/v1` 주소다. 모델명과 함께 둘 다 채워져야 가용으로 본다.
    options:
      - value: "(비움)"
        label: 기본
        effect: vllm 백엔드가 미가용이다.
    stability: 주소만 있고 모델명이 비면 동작하지 않는다 — 둘은 한 쌍이다.
    related: [SYNONYM_SEMANTIC_VLLM_MODEL, SYNONYM_SEMANTIC_BACKEND]

  SYNONYM_SEMANTIC_VLLM_MODEL:
    example: >-
      vLLM에 서빙된 임베딩 모델명과 정확히 같아야 한다. 채팅 모델명을 잘못 넣으면 호출은 되지만 임베딩이 나오지 않는다.
    summary: vllm 백엔드에 서빙된 임베딩 모델 이름.
    behavior: 주소와 함께 둘 다 채워져야 가용으로 본다.
    stability: 서빙 중인 이름과 정확히 같아야 한다.
    related: [SYNONYM_SEMANTIC_VLLM_BASE_URL]

  SYNONYM_SEMANTIC_VLLM_VERIFY_SSL:
    example: >-
      사설 인증서를 쓰는 폐쇄망 vLLM에 붙일 때 false로 둔다. 오케스트레이터 쪽 ORCHESTRATOR_VERIFY_SSL과 같은 성격이므로 대개 함께 설정한다.
    summary: 임베딩 서버 접속 시 인증서를 검증할지.
    behavior: 사설 인증서를 쓰는 폐쇄망 vLLM에 붙일 때 끄기 위한 값이다.
    options:
      - value: "true"
        label: 기본
        effect: 검증한다. 사설 인증서면 연결이 실패한다.
      - value: "false"
        effect: 검증을 건너뛴다. 폐쇄망 전제에 기대는 선택이다.
    related: [SYNONYM_SEMANTIC_VLLM_BASE_URL, ORCHESTRATOR_VERIFY_SSL]

  SYNONYM_SEMANTIC_CONFIDENCE_MIN:
    example: >-
      모델마다 유사도 점수 분포가 다르다. 한 모델에서 0.65가 적정이어도 다른 모델에서는 같은 값이 무관한 단어까지 통과시킬 수 있으므로, 모델 교체 시 반드시 다시
      측정한다.
    summary: 임베딩 매칭을 확정으로 인정할 최소 코사인 유사도.
    behavior: 미만이면 확정하지 않고 후보로 제시하거나 LLM에 넘긴다. 의미 매칭이 구현되면 쓰인다.
    options:
      - value: "0.65"
        label: 기본
        effect: 중간 정도 유사도부터 확정한다.
    stability: 이 값은 모델에 종속된다 — 모델을 바꾸면 반드시 재측정한다.
    related: [SYNONYM_SEMANTIC_MATCH, SYNONYM_MATCH_CONFIDENCE_MIN]

  SYNONYM_MAX_SYNONYM_SUPPLEMENT_TABLES:
    example: >-
      테이블이 많은 공동존에서 이 값을 40으로 올리면 스키마 설명만으로 프롬프트가 크게 불어나 입력 한도(TEXT2SQL_PROMPT_TOKEN_BUDGET)에 닿는다. 그때는
      절단이 일어나 오히려 필요한 정보가 빠질 수 있다.
    summary: 유사어로 끌어온 보완 테이블을 몇 개까지 프롬프트에 실을지.
    behavior: >-
      질의어에 걸린 유사어가 가리키는 테이블을 스키마 정보에 추가로 넣는다.
      이 값은 그 개수 상한이다 — 원래 코드에 박혀 있던 상수를 설정으로 꺼낸 것이다.
    options:
      - value: "15"
        label: 기본
        effect: 최대 15개 테이블을 보완한다.
      - value: "5"
        effect: 프롬프트 토큰이 줄지만 필요한 테이블이 빠져 조회가 실패할 수 있다.
      - value: "40 이상"
        effect: 리콜은 오르지만 프롬프트가 크게 길어져 입력 한도와 비용을 압박한다.
    performance: 테이블 하나가 곧 스키마 설명 토큰이다 — 입력 토큰에 직접 비례한다.
    stability: 고정 규칙이 아니라 튜닝 대상 파라미터다. 낮추면 토큰과 리콜이 함께 내려간다.
    related: [TEXT2SQL_PROMPT_TOKEN_BUDGET, TEXT2SQL_MULTI_RELEVANT_GATE]

  SYNONYM_GOVERNANCE:
    summary: 유사어에 출처·사용 횟수·최종 사용일 같은 메타를 붙여 관리할지.
    behavior: >-
      켜면 유사어마다 어디서 등록됐는지, 얼마나 쓰였는지를 추적하고, 같은 말이 여러
      컬럼을 가리킬 때의 우선순위 규칙을 적용한다. 꺼져 있으면 저장·매칭 경로가 무변경이다.
    options:
      - value: "false"
        label: 기본
        effect: 메타를 추적하지 않는다. 유사어 사전이 커져도 정리 근거가 남지 않는다.
      - value: "true"
        effect: >-
          메타가 쌓여 나중에 오래된 유사어를 정리할 수 있다. 같은 용어가 여러 컬럼에
          걸릴 때 우선순위로 판정한다.
    example: >-
      LLM이 자동 등록한 유사어가 쌓이면 사전이 오염될 수 있다. 켜 두면 "어디서 등록됐고
      최근에 쓰인 적 있는가"를 볼 수 있어 정리 판단의 근거가 생긴다.
    performance: 저장 시 메타가 함께 기록된다 — 비용은 작다.
    stability: 사전 오염은 조용히 진행돼 나중에 원인을 찾기 어렵다 — 자동 등록을 쓰는 환경이라면 켜 두는 편이 낫다.
    related: [SYNONYM_DECAY_DAYS, SYNONYM_FUZZY_MATCH]

  SYNONYM_DECAY_DAYS:
    example: >-
      오래된 유사어를 정리하려고 이 값을 줄여도 자동 정리는 일어나지 않는다 — 코드가 읽지 않기 때문이다.
    summary: 오래 쓰이지 않은 유사어를 정리할 기준 일수 — 현재 코드가 읽지 않는다.
    behavior: >-
      거버넌스를 켜고 명시적으로 정리를 호출할 때 쓰려던 값이지만, 지금 코드에는
      이 값을 읽는 곳이 없다.
    performance: 영향 없다(소비되지 않음).
    stability: 영향 없다(소비되지 않음). 자동 정리는 일어나지 않는다.
    related: [SYNONYM_GOVERNANCE]
