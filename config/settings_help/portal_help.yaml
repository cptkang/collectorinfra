# 설정 옵션 상세 설명 — 포탈 도움말 (plans/142 · D-315)
# 근거: src/config/services.py PortalHelpConfig · src/orchestration/portal_help.py

version: 1
group: portal_help

settings:

  PORTAL_HELP_ENABLED:
    summary: 채팅에서 AIOps 포탈 자체의 기능·화면 용어·사용 방법을 묻는 질문에 매뉴얼로 답할지.
    behavior: >-
      켜면 채팅 질문을 작업으로 나눌 때 「포탈 도움말」 담당이 목록에 오르고, 포탈 기능의 사용
      방법이나 화면 용어를 묻는 질문은 사용자·관리자 매뉴얼에서 찾아 근거 절과 함께 답한다.
      「포탈 매뉴얼에서 … 알려줘」처럼 포탈 이름을 지목한 명령도 매뉴얼로 바로 간다.
      서버 수치·알람 건수 같은 조회 질문은 종전 경로 그대로다. 매뉴얼 색인 파일이 없으면
      켜져 있어도 동작하지 않는다.
    options:
      - value: "true"
        label: 기본
        effect: 포탈 사용법·화면 용어 질문이 매뉴얼 근거로 답해진다.
      - value: "false"
        effect: >-
          포탈 도움말 담당이 목록에 오르지 않는다(종전 동작). 포탈 이름을 지목한 명령에는
          「지금 쓸 수 없다」는 안내만 나간다.
    caution: >-
      관리자 매뉴얼 내용은 관리자 권한 사용자에게만 근거로 쓰인다. 매뉴얼을 고친 뒤에는
      매뉴얼 빌드로 색인(help_index.json)을 다시 만들어야 답에 반영된다.
    example: >-
      켠 상태에서 「노이즈 캔슬링의 '수신 알람'은 무엇인지 설명하라」고 물으면 매뉴얼의 해당 절을
      근거로 답한다. 끄면 같은 질문은 일반 추론으로 답해져 포탈 용어와 다른 설명이 나올 수 있다.
