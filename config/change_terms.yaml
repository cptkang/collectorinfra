# 변화·급증 어휘 선언 (Plan 82 Wave 8·9 · D-176 후속1·후속2)
#
# **정책은 코드가 아니라 이 파일에 있다**(하네스 문서 표 29 G · `middleware_signatures.yaml` 선례).
# 어휘 추가·임계 조정에 코드 변경이 필요하면 그것은 설계 실패다.
#
# 두 소비처가 이 파일 하나를 공유한다:
#   Wave 8 (`src/domain/empty_answer.py`)  — 원문에 변화 어휘가 있는데 조회 조건에 대응이
#                                            없으면 "미반영"으로 알린다(G-4 · 침묵 금지).
#   Wave 9 (`src/db_adapters/polestar/spike_sql.py`) — 급증 의도·임계를 읽어 비교 SQL을 조립한다.
#
# 필드
#   spike_terms             급증·변화를 뜻하는 표면어(부분 문자열 매칭 · 정규화 없이 원문 대조)
#   default_delta_pp        질의에 수치가 없을 때 쓰는 기본 차분 임계(%p). **응답에 항상 노출**한다
#                           — 시스템이 고른 값을 사용자가 모른 채 결과를 믿으면 안 된다(§6.12 ②).
#   default_baseline        기준 기간 단위. 현재 `month`만 열려 있다 — 주 단위는 일별 통계
#                           보존기간이 확인되지 않아 차단 경로다(§6.12 ③ · U17 미실행).
#   explicit_delta_patterns 질의가 임계를 명시했을 때 그 수치를 뽑는 정규식(첫 캡처 그룹 = %p).
#                           기본값보다 **우선**한다.
#   week_terms              주 단위 비교 요청 표면어 — 차단 사유를 붙이기 위해 식별한다.

version: 1

spike_terms:
  - "갑자기"
  - "급증"
  - "급등"
  - "급상승"
  - "치솟"
  - "폭증"
  - "확 늘"
  - "확 올라"
  - "spike"
  - "surge"

# 사용자 확정 U18 — +20%p. 절대 임계(예: 80%)가 병행 게이트라 저사용 노이즈는 이미 배제된다(§6.10 ①).
default_delta_pp: 20

# 사용자 확정 U15=(b) — 월 단위 한정.
default_baseline: month

# ⚠ "80% 이상**으로** 상승"은 도달 수준(절대 임계)이지 차분이 아니다. 부정 전방탐색으로
#   "…으로/까지 상승"을 배제하지 않으면 절대 임계 80을 차분 80%p로 오독한다(요구 4 원문이 이 형태다).
explicit_delta_patterns:
  - '(\d+(?:\.\d+)?)\s*%\s*[pP]\s*(?:이상|넘게|초과|이상으로)?\s*(?:상승|증가|올라|높아|급증)'
  - '(\d+(?:\.\d+)?)\s*%\s*(?:이상|넘게|초과)?\s*(?!으로|까지)(?:상승|증가|올라|높아|급증)'
  - '대비\s*(\d+(?:\.\d+)?)\s*%\s*[pP]'

# 주 단위 비교 요청 — 열려 있지 않다. 식별해서 **사유 + 월 단위 대체 제안**을 낸다(약속 후 침묵 누락 금지).
week_terms:
  - "1주일 전"
  - "일주일 전"
  - "1주 전"
  - "지난주 대비"
  - "전주 대비"
  - "주간 대비"
  - "주 단위"

# 절대 임계("80% 이상") 추출 — 차분(%p)과 **다른 축**이다. 급증 판정은 둘을 병행해야
# 저사용 파일시스템(5→10%, 2배)이 상위를 점령하지 않는다(§6.10 ①).
#   1행: "80% 이상**으로** 상승" — 도달 수준이 명시된 형태
#   2행: "80% 이상인" — 뒤에 상승 동사가 오지 않으면 절대 임계다
absolute_threshold_patterns:
  - '(\d+(?:\.\d+)?)\s*%(?![pP])\s*(?:이상|초과|넘는|넘게)\s*(?:으로|까지)'
  - '(\d+(?:\.\d+)?)\s*%(?![pP])\s*(?:이상|초과|넘는|넘게)(?!\s*(?:으로|까지|상승|증가|올라|높아|급증))'

# 급증 결정적 조립의 **적용 범위**. 이번 범위는 파일시스템 사용률뿐이다(SPEC Ask first).
filesystem_terms:
  - "파일시스템"
  - "파일 시스템"
  - "filesystem"
  - "file system"

# 질의에 이 축이 함께 있으면 "파일시스템만 판정했다"는 사실을 응답에 표기한다(침묵 축소 금지).
other_metric_terms:
  - "cpu"
  - "메모리"
  - "memory"
  - "네트워크"
  - "network"
