[project]
name = "apm-gateway"
version = "0.1.0"
description = "APM(제니퍼) Open API 게이트웨이 — 읽기 전용 MCP 서버 · 이벤트 폴러 (plans/87 · D-274 · D-195)"
requires-python = ">=3.11"

# 루트 venv를 공유한다(mcp_server 전례 — 둘 다 ≥3.11). pyyaml은 루트 pyproject에 직접 선언이 없고
# 전이 의존으로 설치돼 있다(2026-09-29 실측 6.0.3) — 게이트웨이만 따로 배포할 때를 위해 여기 선언한다.
dependencies = [
    "mcp[cli]<2",            # FastMCP 서버 + SSE — <2 고정(D-181: 2.x는 mcp.server.fastmcp 제거)
    "httpx>=0.27.0",         # 제니퍼 Open API 호출(GET 허용목록 · 리다이렉트 비추종)
    "uvicorn",               # SSE ASGI 서빙(전송 Bearer 미들웨어 조립)
    "pyyaml>=6.0",           # 게이트웨이 정책 파일(config/*.yaml)
    "redis>=5.0",            # 이벤트 폴러 — alarm:raw XADD · 커서 · 멱등 키
    "pydantic>=2",           # 도구 인자 설명(Field) — mcp의 필수 의존이라 이미 설치돼 있다(직접 import라 선언)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
apm-gateway = "apm_gateway.__main__:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["apm_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
