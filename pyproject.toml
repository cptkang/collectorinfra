[project]
name = "collectorinfra"
version = "0.1.0"
description = "인프라 데이터 조회 에이전트 - 자연어로 인프라 DB를 질의하고 문서를 생성하는 AI 에이전트"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # 에이전트 프레임워크
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # MCP 클라이언트 (DBHub 모드)
    "mcp",

    # DB 직접 연결 (direct 모드)
    "asyncpg>=0.29.0",

    # 체크포인트
    "langgraph-checkpoint-sqlite",

    # API 서버
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",

    # 유틸리티
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "sqlparse>=0.5.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "redis[hiredis]>=5.0.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
document = [
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
]
gemini = [
    "langchain-google-genai>=2.0.0",
]
# deepagents Track B (D-037 / Plan 49): 실제 패키지 오케스트레이션 경로 (opt-in).
# deepagents 0.6.10 → langchain-core>=1.4.7 / langchain>=1.3.9 (1.x). 오케스트레이터는
# vLLM(langchain-openai ChatOpenAI) 또는 Gemini(langchain-google-genai). 폐쇄망은 wheel 반입.
deepagents = [
    "deepagents>=0.6.10",
    "langchain>=1.3.9",
    "langchain-core>=1.4.7",
    "langchain-openai>=1.1.13",
]
postgres-checkpoint = [
    "langgraph-checkpoint-postgres",
]
# E5-4 임베딩 의미 검색 (D-084 / Plan 61 트랙 B): 폐쇄망 오프라인 반입 모델 CPU 상주 (opt-in).
# 활성화는 SYNONYM_SEMANTIC_MATCH=true + 백엔드 요건(SYNONYM_SEMANTIC_BACKEND 참조) 설정 필요.
# vllm 백엔드(별도 vLLM 서버 /v1/embeddings)만 쓸 경우 sentence-transformers 없이 numpy만 필수.
# Plan 60 B-7 알람 임베딩(§15.3 L-2/L-4, AlarmEmbeddingProvider)도 **이 그룹으로 커버**된다 —
# 동일 sentence-transformers·numpy만 lazy 의존하므로 신규 optional 그룹 불요(중복 방지).
# torch는 sentence-transformers가 끌어온다. 필수 dependencies 편입 금지(폐쇄망 wheel 반입).
semantic = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
# 구조화 출력 백엔드 (D-169 / Plan 79 트랙 E-3): LLM 응답을 pydantic 계약으로 받고
# 검증 오류를 모델에 되먹여 재질의한다 (opt-in). 미설치 시 기존 정규식 파싱으로 graceful 강등.
# STRUCTURED_OUTPUT_BACKEND=instructor 로 활성화. 폐쇄망은 wheel 반입 필요
# (기반 의존 11종 중 10종 기설치 — 신규는 aiohttp 계열 ≈7종).
structured = [
    "instructor>=1.15.4",
]
# E3 2차(D-113): STL 분해 이상탐지 (opt-in). 미설치 시 순수 Python HW로 graceful 폴백.
# 폐쇄망은 wheel 반입·보안 협의 필요(운영 반영 전 행정 절차).
stl = [
    "statsmodels>=0.14",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff>=0.4.0",
    "mypy>=1.10",
]
e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
]

[project.scripts]
collectorinfra = "src.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# noise_gate는 최상위 독립 패키지지만 본체와 **같은 프로세스·같은 venv**에서 돌아간다
# (src/api가 AlarmWorker를 in-process 기동) — 별도 venv·별도 프로세스인 sre_agent/mcp_server와
# 다른 점이라 본체 배포에 함께 포함한다.
include = ["src*", "noise_gate*"]
exclude = ["noise_gate.tests*", "noise_gate.scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
# noise_gate/tests는 별도 폴더지만 본체와 같은 venv·같은 rootdir이라 함께 수집한다
# (sre_agent/mcp_server는 자체 venv라 각자 디렉토리에서 별도 실행).
testpaths = ["tests", "noise_gate/tests"]
asyncio_mode = "auto"
