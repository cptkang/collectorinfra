[project]
name = "collectorinfra"
version = "0.1.0"
description = "인프라 데이터 조회 에이전트 - 자연어로 인프라 DB를 질의하고 문서를 생성하는 AI 에이전트"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # 에이전트 프레임워크
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # MCP 클라이언트 (DBHub 모드)
    "mcp",

    # DB 직접 연결 (direct 모드)
    "asyncpg>=0.29.0",

    # 체크포인트
    "langgraph-checkpoint-sqlite",

    # API 서버
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",

    # 유틸리티
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "sqlparse>=0.5.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "redis[hiredis]>=5.0.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
document = [
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
]
gemini = [
    "langchain-google-genai>=2.0.0",
]
# deepagents Track B (D-037 / Plan 49): 실제 패키지 오케스트레이션 경로 (opt-in).
# deepagents 0.6.10 → langchain-core>=1.4.7 / langchain>=1.3.9 (1.x). 오케스트레이터는
# vLLM(langchain-openai ChatOpenAI) 또는 Gemini(langchain-google-genai). 폐쇄망은 wheel 반입.
deepagents = [
    "deepagents>=0.6.10",
    "langchain>=1.3.9",
    "langchain-core>=1.4.7",
    "langchain-openai>=1.1.13",
]
postgres-checkpoint = [
    "langgraph-checkpoint-postgres",
]
# E5-4 임베딩 의미 검색 (D-084 / Plan 61 트랙 B): 폐쇄망 오프라인 반입 모델 CPU 상주 (opt-in).
# 활성화는 SYNONYM_SEMANTIC_MATCH=true + 백엔드 요건(SYNONYM_SEMANTIC_BACKEND 참조) 설정 필요.
# vllm 백엔드(별도 vLLM 서버 /v1/embeddings)만 쓸 경우 sentence-transformers 없이 numpy만 필수.
semantic = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff>=0.4.0",
    "mypy>=1.10",
]
e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
]

[project.scripts]
collectorinfra = "src.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
