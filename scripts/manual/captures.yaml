# 매뉴얼 캡처 장면 (plans/116 §4.5). 실행: scripts/manual/capture.py
#
#   id        → src/static/manual/img/<id>.png
#   login     user(demo_user) | admin | 없음(로그인 전 화면)
#   steps     goto·click·hover·fill·press·check·select·upload·send·send_nowait·wait·scroll·eval
#             assert_visible·assert_hidden — 요소 자신의 display 단언(이미지 불변 · 역할별 링크 노출 V-2)
#   clip      잘라낼 요소(없으면 뷰포트 전체) · pad 여백(px)
#   callouts  [번호, 셀렉터] — 매뉴얼 「화면 요소」 표의 번호와 같다. 대상이 없으면 캡처 실패
#   theme     dark 면 다크 테마
#   routes    응답 가로채기 [{url, sse|json, status, method}] — Redis·조사 서비스 없이 화면 상태를 만든다(capture._route)
captures:
  # ── 사용자: 시작하기 ─────────────────────────────────────
  - id: login
    steps:
      - goto: /login
      - fill: ["#userId", "demo_user"]
    callouts: [[1, "#userId"], [2, "#password"], [3, "#loginBtn"], [4, "a[href='/register']"]]
  - id: register
    steps:
      - goto: /register
      - fill: ["#userId", "hong_gildong"]
      - fill: ["#username", "홍길동"]
      - fill: ["#department", "인프라운영팀"]
    callouts: [[1, "#userId"], [2, "#username"], [3, "#password"], [4, "#department"], [5, "#registerBtn"]]
  - id: main-welcome
    login: user
    callouts: [[1, ".chat-welcome-hint:nth-child(1)"], [2, ".chat-welcome-hint--help"], [3, "#prompt"]]
  - id: main-layout
    login: user
    steps:
      - click: "#historyToggle"
      - send: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
    callouts: [[1, "header"], [2, "#historyPanel"], [3, ".chat-messages"], [4, "#progressPanel"], [5, ".input-row"]]
  - id: header
    login: user
    steps:
      - assert_visible: "#userManualLink"   # V-2 — 일반 사용자는 사용자 매뉴얼만
      - assert_hidden: "#adminManualLink"
      - assert_hidden: "#adminEntryLink"
    clip: header
    pad: 0
    callouts: [[1, "#statusBadge"], [2, "#userDisplayName"], [3, "#userLogoutBtn"], [4, "#themeToggle"], [5, "#noiseConsoleLink"], [6, "#manualMenu"]]
  - id: header-manual
    login: admin
    height: 300
    steps:
      - click: "#manualMenu > summary"
      - wait: 300
      - assert_visible: "#adminManualLink"   # V-2 — 관리자는 둘 다(Admin 링크와 같은 분기)
      - assert_visible: "#adminEntryLink"
      - assert_visible: "#introLink"   # plans/124 — 누구나 보인다
    callouts: [[1, "#manualMenu > summary"], [2, "#userManualLink"], [3, "#adminManualLink"], [4, "#introLink"]]
  - id: header-status
    login: user
    steps:
      - hover: "#statusBadge"
      - wait: 400
    clip: header
    pad: 0
    height: 900
  - id: main-dark
    login: user
    theme: dark
    steps:
      - send: "2026년 6월 메모리 사용률 평균이 높은 순서로 상위 3대 서버를 보여줘"
    callouts: [[1, "#themeToggle"]]
  # ── 사용자: 질의하기 ─────────────────────────────────────
  - id: query-input
    login: user
    steps:
      - fill: ["#prompt", "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"]
    clip: ".input-bar"
    callouts: [[1, "#prompt"], [2, "#attachBtn"], [3, "#sendBtn"], [4, "#dbScopeChip"], [5, ".input-hint"]]
  - id: query-streaming
    login: user
    steps:
      - send_nowait: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
      - wait: 2600
    callouts: [[1, ".message--agent:last-child .message-bubble"], [2, "#sendBtn"], [3, "#progressPanel"]]
  - id: progress-panel
    login: user
    steps:
      - send: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
      - scroll_top: "#progressPanel .progress-panel-body"
    clip: "#progressPanel"
    pad: 0
  - id: answer-table
    login: user
    steps:
      - send: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
      - eval: "(() => { const t = document.querySelector('.message--agent:last-child .response-text table tbody tr:nth-child(12)'); if (t) t.scrollIntoView({block: 'start'}); })()"
      - wait: 300
    callouts: [[1, ".message--agent:last-child .response-text table"], [2, ".message--agent:last-child .message-meta"], [3, ".message--agent:last-child .message-download--csv"]]
  - id: answer-sql
    login: user
    steps:
      - send: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
      - click: ".message--agent:last-child .message-sql-toggle"
      - eval: "(() => { const t = document.querySelector('.message--agent:last-child .message-sql-toggle'); if (t) t.scrollIntoView({block: 'center'}); })()"
      - wait: 300
    callouts: [[1, ".message--agent:last-child .message-sql-toggle"], [2, ".message--agent:last-child .message-sql-code"]]
  - id: answer-file
    login: user
    steps:
      - send: "전체 서버 목록을 엑셀로 만들어줘"
    callouts: [[1, ".message--agent:last-child .message-download"]]
  - id: answer-synonym
    login: user
    steps:
      - send: "vcore, cpu, core은 동의어이다. 캐시에 등록하라."
  # ── 사용자: 결과 그래프·용어 사전·값 해석·표 넓게 보기(plans/160 · D-327) ─────────
  # `capture-viz` 서버(두 플래그 on · LLM 주소 닫힘 = LLM 호출 0 — snapshot.py). 힙 추세는 손 제작 재생 파일
  # (fixtures/queries/3ee6ec6113ecd276.json · `handmade` 사유 — 로컬 제니퍼는 라이선스가 없어 녹화 불가)
  - id: result-chart-line
    server: capture-viz
    login: user
    steps:
      - send: "지난 6시간 힙 메모리 추세 보여줘"
      - click: ".message--agent:last-child .result-viz-toggle"
      - wait: ".message--agent:last-child .result-viz-chart canvas"
      - wait: 800
      - eval: "document.querySelector('.message--agent:last-child .result-viz-toggle').scrollIntoView({block: 'start'})"
      - wait: 300
    callouts: [[1, ".message--agent:last-child .result-viz-toggle"], [2, ".message--agent:last-child .result-viz-chart"], [3, ".message--agent:last-child table.result-viz-grid"]]
  - id: result-chart-bar
    server: capture-viz
    login: user
    steps:
      - send: "2026년 5월 서버별 CPU 사용률 평균이 높은 상위 5대를 보여줘"
      - click: ".message--agent:last-child .result-viz-toggle"
      - wait: ".message--agent:last-child .result-viz-chart canvas"
      - wait: 800
      - eval: "document.querySelector('.message--agent:last-child .result-viz-toggle').scrollIntoView({block: 'start'})"
      - wait: 300
    callouts: [[1, ".message--agent:last-child .result-viz-toggle"], [2, ".message--agent:last-child .result-viz-chart"]]
  # 머리글은 사전 적중 칼럼(heap_used_mb — config/result_glossary.yaml)이라 LLM 이 필요 없다
  - id: result-glossary
    server: capture-viz
    login: user
    steps:
      - send: "지난 6시간 힙 메모리 추세 보여줘"
      - click: ".message--agent:last-child .result-viz-toggle"
      - wait: ".message--agent:last-child table.result-viz-grid"
      - wait: 800
      - eval: "document.querySelector('.message--agent:last-child .result-viz-grid-title').scrollIntoView({block: 'start'})"
      - wait: 300
      - click: ".message--agent:last-child table.result-viz-grid thead button[data-rv-col='heap_used_mb']"
      - wait: ".result-viz-pop .result-viz-badge"
      - wait: 300
    callouts: [[1, ".message--agent:last-child table.result-viz-grid thead button[data-rv-col='heap_used_mb']"], [2, ".result-viz-pop"]]
  # 값 해석의 LLM 문장 자리는 LLM 주소가 닫혀 있어 「해석 문장 없음 — LLM 호출 실패(…)」로 찍힌다(계산값은 결정적)
  - id: result-interpret
    server: capture-viz
    login: user
    steps:
      - send: "지난 6시간 힙 메모리 추세 보여줘"
      - click: ".message--agent:last-child .result-viz-toggle"
      - wait: ".message--agent:last-child table.result-viz-grid"
      - wait: 800
      - eval: "document.querySelector('.message--agent:last-child .result-viz-grid-title').scrollIntoView({block: 'start'})"
      - wait: 300
      - click: ".message--agent:last-child table.result-viz-grid tbody tr:nth-child(5) button[data-rv-col='heap_used_mb']"
      - wait: ".result-viz-pop .result-viz-pop-llm"
      - wait: 300
    callouts: [[1, ".message--agent:last-child table.result-viz-grid tbody tr:nth-child(5) button[data-rv-col='heap_used_mb']"], [2, ".result-viz-pop .result-viz-facts"], [3, ".result-viz-pop .result-viz-pop-llm"]]
  # 답 본문 표 해설(plans/160 §8) — 코드가 원본 행으로 렌더한 답 표에 밑줄 링크가 붙는다.
  # 월간 통계 추세는 손 제작 재생 파일(fixtures/queries/720fee46a68a27bf.json · 서버·값 가상)
  - id: result-answer-table-explain
    server: capture-viz
    login: user
    steps:
      - send: "svr-db-01 서버의 메모리 사용률 6개월 추세 보여줘"
      - wait: ".message--agent:last-child .response-text table[data-rv-explain] tbody button"
      - click: ".message--agent:last-child .response-text table tbody tr:nth-child(3) button[data-rv-col='mem_max_pct']"
      - wait: ".result-viz-pop .result-viz-pop-llm"
      - wait: 300
    callouts: [[1, ".message--agent:last-child .response-text table thead button[data-rv-col='stat_month']"], [2, ".message--agent:last-child .response-text table tbody tr:nth-child(3) button[data-rv-col='mem_max_pct']"], [3, ".result-viz-pop"], [4, ".message--agent:last-child .result-viz-toggle"]]
  # 질의 이력은 기본 접힘 — 처리 현황만 접으면 둘 다 접힌 상태다
  - id: table-wide-panels
    server: capture-viz
    login: user
    steps:
      - click: "#panelToggle"
      - send: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, CPU 모델, 메모리 용량을 조회해줘"
      - eval: "document.querySelector('.message--agent:last-child .response-text table').scrollIntoView({block: 'center'})"
      - wait: 300
    callouts: [[1, "#historyToggle"], [2, "#panelToggle"], [3, ".message--agent:last-child .response-text table"]]
  - id: table-expand-btn
    server: capture-viz
    login: user
    steps:
      - click: "#historyToggle"
      - send: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, CPU 모델, 메모리 용량을 조회해줘"
      - eval: "document.querySelector('.message--agent:last-child .result-table-wrap').scrollIntoView({block: 'center'})"
      - wait: ".message--agent:last-child .table-expand-btn:not([hidden])"
      - wait: 300
    callouts: [[1, ".message--agent:last-child .table-expand-btn"]]
  - id: table-expand-overlay
    server: capture-viz
    login: user
    steps:
      - click: "#historyToggle"
      - send: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, CPU 모델, 메모리 용량을 조회해줘"
      - eval: "document.querySelector('.message--agent:last-child .result-table-wrap').scrollIntoView({block: 'center'})"
      - wait: ".message--agent:last-child .table-expand-btn:not([hidden])"
      - click: ".message--agent:last-child .table-expand-btn"
      - wait: ".table-expand-overlay"
      - wait: 300
    callouts: [[1, ".table-expand-overlay table thead"], [2, ".table-expand-close"]]
  # ── 사용자: 조회 범위와 역질문 ───────────────────────────
  # 존 장면은 전 존 권한인 관리자로 찍고 대화 영역만 잘라 낸다(사례 계정은 샌드박스 권한만 — run_capture.py)
  - id: scope-chip
    server: capture-zones
    login: admin
    steps:
      - click: "#dbScopePick"
      - wait: "#dbScopePopover:not([hidden])"
      - wait: 400
    clip: ".chat-main"
    pad: 0
    callouts: [[1, "#dbScopePick"], [2, "#dbScopePopover"]]
  - id: zone-clarify
    server: capture-zones
    login: admin
    steps:
      - send: "ㅇㅇ존 서버 CPU 사용률"
      - wait: ".zone-clarify-items"
    clip: ".chat-main"
    pad: 0
    callouts: [[1, ".zone-clarify-items"], [2, ".zone-clarify-confirm"]]
  # plans/147 — 제니퍼 소스 되묻기·칩은 소스 ≥2 APM 활성 배포에서 파이프라인(집계기)이 만든다 → 재생 서버로
  # 못 찍는다. `server: apm-harness` 장면은 run_capture 가 찍지 않고, scripts/manual/apm_harness.py(실 라우트 +
  # 결정적 그래프 + 모의 게이트웨이 · LLM 0)를 띄운 뒤 capture.py --server apm-harness 로 찍는다(사용법은 그 파일).
  # 인증은 대역(토큰 유무)이라 login 대신 토큰을 넣고 들어간다. 질문은 녹화 재생이 아니므로 send 대신
  # fill·click 으로 보낸다(녹화 가드 test_capture_queries_have_recordings 는 재생 장면의 send 만 본다)
  - id: apm-source-clarify
    server: apm-harness
    steps:
      - goto: /login
      - eval: "localStorage.setItem('user_token', 'manual-harness')"
      - goto: /
      - wait: "#apmScopeChip:not([hidden])"
      - fill: ["#prompt", "WAS 응답시간 알려줘"]
      - click: "#sendBtn"
      - wait: ".apm-source-clarify"
      - wait_answer: null
      - check: ".apm-source-clarify input[value='cm_prd']"
    clip: ".chat-main"
    pad: 0
    callouts: [[1, ".apm-source-clarify .zone-clarify-items"], [2, ".apm-source-clarify .zone-clarify-confirm"], [3, "#apmScopePick"]]
  - id: apm-scope-inherit
    server: apm-harness
    steps:
      - goto: /login
      - eval: "localStorage.setItem('user_token', 'manual-harness')"
      - goto: /
      - wait: "#apmScopeChip:not([hidden])"
      - fill: ["#prompt", "WAS 응답시간 알려줘"]
      - click: "#sendBtn"
      - wait: ".apm-source-clarify"
      - wait_answer: null
      - check: ".apm-source-clarify input[value='cm_prd']"
      - click: ".apm-source-clarify .zone-clarify-confirm"
      - wait: "#apmScopeChip[data-state='selected']"
      - wait_answer: null
      - fill: ["#prompt", "힙 사용률은?"]
      - click: "#sendBtn"
      - wait: "#apmScopeChip[data-state='inherited']"
      - wait_answer: null
    clip: ".chat-main"
    pad: 0
    callouts: [[1, "#apmScopePick"], [2, "#apmScopeClear"], [3, ".message--agent:last-child .message-bubble"]]
  - id: apm-scope-popover
    server: apm-harness
    steps:
      - goto: /login
      - eval: "localStorage.setItem('user_token', 'manual-harness')"
      - goto: /
      - wait: "#apmScopeChip:not([hidden])"
      - click: "#apmScopePick"
      - wait: "#apmScopePopover:not([hidden])"
      - check: "#apmScopePopover input[value='cm_prd']"
      - wait: 300
    clip: ".chat-main"
    pad: 0
    callouts: [[1, "#apmScopePick"], [2, "#apmScopePopover .zone-clarify-items"], [3, "#apmScopePopover .apm-scope-confirm"]]
  # ── 사용자: 양식 채우기 ─────────────────────────────────
  - id: file-attached
    login: user
    steps:
      - upload: ["#fileInput", 서버목록_양식.xlsx]
      - fill: ["#prompt", "첨부한 양식에 전체 서버 정보를 넣어서 엑셀 파일로 만들어줘"]
    clip: ".input-bar"
    callouts: [[1, "#filePreview"], [2, "#removeFile"], [3, "#prompt"]]
  - id: form-result
    login: user
    steps:
      - upload: ["#fileInput", 서버목록_양식.xlsx]
      - send: "첨부한 양식에 전체 서버 정보를 넣어서 엑셀 파일로 만들어줘"
    callouts: [[1, ".message--agent:last-child .message-download"]]
  - id: form-file-card
    login: user
    steps:
      - upload: ["#fileInput", 서버목록_양식.xlsx]
      - send: "첨부한 양식에 전체 서버 정보를 넣어서 엑셀 파일로 만들어줘"
      - eval: "(() => { const c = [...document.querySelectorAll('.message--user .message-file-card')].pop(); if (c) c.scrollIntoView({block: 'center'}); })()"
      - wait: 300
    callouts: [[1, ".message--user:nth-last-child(2) .message-file-card"]]
  - id: form-clarify
    login: user
    steps:
      - upload: ["#fileInput", 서버담당_양식.xlsx]
      - send: "첨부한 양식에 전체 서버 정보를 넣어서 파일로 만들어줘"
      - eval: "(() => { const r = document.querySelector('.form-fill-row'); if (r) r.scrollIntoView({block: 'center'}); })()"
      - wait: 300
    callouts: [[1, ".form-fill-label"], [2, ".form-fill-action"]]
  # ── 사용자: 대화와 이력 ─────────────────────────────────
  - id: multiturn
    login: user
    steps:
      - send: "cocm-hdkapp01 서버의 IP 주소와 OS 종류를 보여줘"
      - send: "해당 서버의 메모리 용량도 보여줘"
  - id: history-threads
    login: user
    steps:
      - send: "2026년 6월 메모리 사용률 평균이 높은 순서로 상위 3대 서버를 보여줘"
      - click: "#historyToggle"
      - wait: 600
    clip: "#historyPanel"
    pad: 0
    callouts: [[1, ".history-mode-btn[data-mode='threads']"], [2, "#historySearch"], [3, "#historyClearBtn"], [4, "#historyList"]]
  - id: history-queries
    login: user
    steps:
      - send: "2026년 6월 메모리 사용률 평균이 높은 순서로 상위 3대 서버를 보여줘"
      - send: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
      - click: "#historyToggle"
      - click: ".history-mode-btn[data-mode='queries']"
      - wait: 400
    clip: "#historyPanel"
    pad: 0
    callouts: [[1, ".history-mode-btn[data-mode='queries']"], [2, "#historyList"]]
  # ── 사용자: 이벤트 알람(관리자 계정 — 전 존 수신 · 머리글은 잘라 낸다) · 노이즈 관제 ──
  - id: header-alarm
    login: admin
    steps:
      - hover: "#alarmReceiveToggle"
      - wait: 400
    clip: header
    pad: 0
    callouts: [[1, "#alarmReceiveToggle"], [2, "#alarmViewLevel"]]
  - id: alarm-list
    login: admin
    steps:
      - click: ".view-tab[data-view='alarm']"
      - wait: 1500
      - alarm_replay: {only: incident}
      - wait: ".message--alarm"
      - wait: 1500
    clip: ".alarm-view, #alarmView, main"
    pad: 0
    callouts: [[1, ".alarm-level-filter"], [2, "#alarmSearch"], [3, "#alarmList .message--alarm"]]
  - id: alarm-feedback
    login: admin
    steps:
      - click: ".view-tab[data-view='alarm']"
      - wait: 1500
      - alarm_replay: {}
      - wait: ".message--alarm .alarm-feedback-section"
      - wait: 1000
      - scroll: "#alarmList .message--alarm .alarm-feedback-section"
    clip: "#alarmList .message--alarm:has(.alarm-feedback-section)"
    pad: 8
