# 매뉴얼 기능 manifest (plans/116 §4.6) — "모든 기능"의 기계 판독 정본.
#
# 항목 필드
#   id          U-NN(사용자) / A-NN(관리자). 매뉴얼 절 앵커는 소문자(u-11)
#   title       절 제목
#   anchors     화면에 실존해야 할 요소 — "#id" 또는 레이블 문자열. files 안에서 grep 으로 찾는다
#   files       anchors 를 찾을 파일(저장소 상대 경로)
#   captures    이 절이 싣는 캡처 ID(captures.yaml). no_ui 이면 비어도 된다
#   cases       사용자 절의 프롬프트 사례 ID(cases.yaml)
#   case_na     사례가 성립하지 않는 사유(순수 UI 항목) — cases 와 둘 중 하나는 있어야 한다(사용자만)
#   no_ui       화면 버튼 없이 채팅·API 로 쓰는 기능
#
# ignore: 역방향 감시(화면 버튼·탭 id 중 manifest 미등재)에서 제외할 id — 사유 필수

_idx: &IDX [src/static/index.html, src/static/js/app.js]
_login: &LOGIN [src/static/login.html]
_reg: &REG [src/static/register.html]
_noise: &NOISE [src/static/noise.html, src/static/js/noise.js]
_anoise: &ANOISE [src/static/admin/noise.html, src/static/js/noise.js]
_dash: &DASH [src/static/admin/dashboard.html, src/static/js/admin.js]
_dbs: &DBS [src/static/admin/dashboard.html, src/static/js/admin-db-structure.js]
_alogin: &ALOGIN [src/static/admin/login.html]

