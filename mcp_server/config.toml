[server]
name = "dbhub-server"
host = "0.0.0.0"
port = 9099
transport = "sse"     # 네트워크 transport (별도 VM이므로 sse 필수)
log_level = "info"
# execute_sql 저수준 도구 노출 여부. 본체 NL→SQL 파이프라인(src/dbhub/client.py)이
# execute_sql 도구를 런타임 호출하므로 이 배치에서는 노출한다(true). SREAgent/HolmesGPT
# 전용 배치는 별도 config에서 false로 두어 고수준 도구만 사용한다(계획 §3/§6 — 코드 기본값 false).
expose_execute_sql = true
# execute_sql에 폴스타 도메인 deny(D-022/D-028)를 적용할지 여부. 이 검증은 폴스타 스키마를
# 전제하므로(CMM_* deny 등) 폴스타를 서빙하지 않는 배치에서는 false로 옵트아웃한다.
# 값은 mcp_server/.env의 POLESTAR_DOMAIN_GUARD로 오버라이드 가능.
polestar_domain_guard = true
# 폴스타 고수준 도구 8종 등록 여부. 폴스타 소스가 없는 배치는 false로 도구 표면을 줄인다.
# 값은 mcp_server/.env의 EXPOSE_POLESTAR_TOOLS로 오버라이드 가능.
expose_polestar_tools = true
# 폴스타 실시간 프로세스 API base_url (process_snapshot 도구용). 비면 도구가 오류 반환.
# 값은 mcp_server/.env의 PROCESS_API_BASE_URL로 오버라이드 가능.
process_api_base_url = ""

# ============================================================
# Prometheus (PromQL 도구 — Plan 06 §3 · D-119)
# ============================================================
# url·auth_header는 보안상 .env로 오버라이드 (PROMETHEUS_URL·PROMETHEUS_AUTH_HEADER).
# 미설정 시 고수준 PromQL 도구는 명시적 오류를 반환한다(침묵 폴백 금지).
[prometheus]
url = ""
# 인증 헤더 전체 값 (예: "Bearer <token>"). 비면 인증 헤더를 붙이지 않는다.
auth_header = ""
# 서버가 강제하는 쿼리 timeout(초) — 원시 패스스루 포함 모든 PromQL HTTP 호출에 적용.
query_timeout = 30
# 원시 PromQL 패스스루(instant/range/labels/metadata/series) 노출 여부.
# 기본 false — 고수준 hostname 앵커 도구만. 탐색적 조사 배치에서만 true 옵트인.
# 값은 mcp_server/.env의 EXPOSE_RAW_PROMQL로 오버라이드 가능.
expose_raw_promql = false

# ============================================================
# OpenMetrics (exporter 직접 스크레이프·폴스타 브리지 — plans/92 · D-210 · docs/27 §10)
# ============================================================
# 기본값은 현행 동작과 비트 동일이다 — om_* 도구 미등록 · /metrics 라우트 부재 · prom_* 스키마 불변.
[openmetrics]
# om_metric_instant·om_metric_catalog 도구 등록 여부 (EXPOSE_OPENMETRICS_TOOLS). 배치 표면 스위치(D-122).
expose_openmetrics_tools = false
# 스크레이프 1회에 서버가 강제하는 timeout(초) (OPENMETRICS_SCRAPE_TIMEOUT)
scrape_timeout = 10
# 응답 본문 상한(바이트). 넘으면 오류 — node_exporter 전량은 수백 KB~수 MB (OPENMETRICS_MAX_BODY_BYTES)
max_body_bytes = 4194304
# 도구 1회 반환 시리즈 상한. 넘으면 절단하고 truncated=true를 싣는다 (OPENMETRICS_MAX_SERIES)
max_series = 200
# ── PromQL 병행(S1) — PROMETHEUS_URL이 설정된 배치에서만 의미가 있다 ──
# prom_metric_instant source="auto"의 강등 정책: off(강등 없음) | on_unavailable | on_empty (OPENMETRICS_FALLBACK_POLICY)
fallback_policy = "off"
# Prometheus nodename 커버리지 캐시 TTL(초) (OPENMETRICS_COVERAGE_TTL_SECONDS)
coverage_ttl_seconds = 600
# 교차 검증 value_drift 상대 허용 오차 (OPENMETRICS_CROSS_CHECK_TOLERANCE)
cross_check_tolerance = 0.05
# stale 판정 기준 스크레이프 주기(초) (OPENMETRICS_SCRAPE_INTERVAL_HINT)
scrape_interval_hint = 15
# ── 폴스타 → OpenMetrics 브리지(B-2) — GET /metrics 를 Prometheus가 스크레이프한다 ──
# 라우트 등록 여부 (EXPOSE_POLESTAR_EXPORTER). 전송 인증은 MCP_BEARER_TOKEN 미들웨어를 그대로 탄다.
expose_polestar_exporter = false
# 브리지 응답 캐시 TTL(초). 원천이 시간 통계라 스크레이프마다 SQL을 치지 않는다 (OPENMETRICS_BRIDGE_CACHE_SECONDS)
bridge_cache_seconds = 300

# 스크레이프 허용목록 — hostname은 폴스타 server_name(도구 인자와 같은 값). 목록 밖 hostname은 HTTP 0회로 거부된다.
# LLM은 URL을 넘기지 못한다. 타깃별 인증 헤더는 1차 범위 밖이다(plans/92 §4.7 [v3]).
# [[openmetrics.targets]]
# hostname = "svr-web-01"
# url = "http://localhost:9102/metrics"   # 픽스처 mock(0.0.4) · /metrics-om 은 OpenMetrics 1.0 · node_exporter는 9101
# kind = "exporter"                        # exporter | federate(url = Prometheus 주소 → /federate?match[]={nodename=…})
# os_hostname = "svr-web-01"               # 선택 — node_uname_info 신원 대조 기준(폴스타 OS hostname)

# 브리지가 읽는 폴스타 소스 — name은 아래 [[sources]] 이름, zone은 선택 라벨.
# [[openmetrics.bridge_sources]]
# name = "polestar_cm_gp"
# zone = "gongjon"

# ============================================================
# 데이터소스 정의
# ============================================================
# 여기서 정의한 name 값이 MCP 프로토콜의 source 식별자로 사용된다.
#
# [연동 설정 체크리스트] — 소스를 추가/변경할 때 아래 3곳을 반드시 맞춰야 한다:
#
#  ① 여기 (mcp_server/config.toml)  ← 기준점
#     → [[sources]] name = "소스명"  으로 소스를 정의
#
#  ② MCP 서버 환경변수 (mcp_server/.env)
#     → {소스명을 대문자로}_CONNECTION 으로 DB 연결 문자열 설정
#     → 예: name="polestar" → POLESTAR_CONNECTION=postgresql://...
#     → 연결 문자열이 비어있거나 주석 처리된 소스는 자동 비활성
#
#  ③ 클라이언트 환경변수 (프로젝트 루트 .env)
#     → 단일 DB 모드: DBHUB_SOURCE_NAME=소스명     (여기 name과 정확히 일치해야 함)
#     → 멀티 DB 모드: ACTIVE_DB_IDS=소스명1,소스명2  (쉼표 구분, 여기 name과 정확히 일치해야 함)
#
# ※ 소스명이 하나라도 불일치하면 "알 수 없는 소스" 에러 발생
# ============================================================

# === PostgreSQL (Docker :5433) ===
[[sources]]
name = "infra_db"   # → mcp_server/.env: INFRA_DB_CONNECTION
type = "postgresql"
# connection은 .env에서 오버라이드 (보안상 TOML에 직접 기재하지 않음)
readonly = true
query_timeout = 30
max_rows = 10000
pool_min_size = 1
pool_max_size = 5

# === DB2 (Docker :50000) ===
[[sources]]
name = "infra_db2" # → mcp_server/.env: INFRA_DB2_CONNECTION
type = "db2"
# connection은 .env에서 오버라이드
readonly = true
query_timeout = 30
max_rows = 10000

# === Polestar (개발: Docker :5434 PostgreSQL / 운영: 실제 DB2) ===
[[sources]]
name = "polestar"   # → mcp_server/.env: POLESTAR_CONNECTION
type = "postgresql"
# connection은 .env에서 오버라이드
readonly = true
query_timeout = 30
max_rows = 10000
pool_min_size = 1
pool_max_size = 3

# === 멀티 DB (운영 환경용, 개발 시 비활성) ===
[[sources]]
name = "cloud_portal" # → mcp_server/.env: CLOUD_PORTAL_CONNECTION
type = "postgresql"
readonly = true
query_timeout = 30
max_rows = 10000

[[sources]]
name = "itsm"       # → mcp_server/.env: ITSM_CONNECTION
type = "postgresql"
readonly = true
query_timeout = 30
max_rows = 10000

[[sources]]
name = "polestar_b0"
type = "db2"
readonly = true
query_timeout = 30
max_rows = 10000

[[sources]]
name = "polestar_cm_gp"
type = "postgresql"
readonly = true
query_timeout = 30
max_rows = 10000
pool_min_size = 1
pool_max_size = 3

[[sources]]
name = "polestar_cm_yd"
type = "postgresql"
readonly = true
query_timeout = 30
max_rows = 10000
pool_min_size = 1
pool_max_size = 3

# === 자산관리 ITAM (MariaDB — plans/95 · 개발: Docker :3307 testdata/itam / 운영: 게이트 G-2·G-3 확정 후) ===
# 로컬 샌드박스와 운영이 소스명 하나를 공유한다(polestar 선례). 연결 계정은 SELECT 전용이어야 한다(D-003).
[[sources]]
name = "itam"       # → mcp_server/.env: ITAM_CONNECTION
type = "mariadb"
readonly = true
query_timeout = 30
max_rows = 10000
pool_min_size = 1
pool_max_size = 3
