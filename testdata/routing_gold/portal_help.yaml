# 포탈 기능 도움말 골든셋 (plans/142 §7 · W5)
#
# 목적: 「이 포탈의 기능·화면 용어·사용 방법」 질문(양성)이 `portal_help`로 가고, 같은 낱말을 쓰는
#   데이터 조회·실제 등록 요청·포탈 밖 일반 개념 질문(음성)은 종전 담당에 남는지 잰다.
#
# 채점기:
#   M-1 검색 회수율 recall@4(결정적 · LLM 0) — tests/test_portal_help_gold.py
#       양성마다 실 색인(src/static/manual/help_index.json)을 역할 필터(role)대로 검색해 상위 4건 안에
#       기대 절(expect.sections — 어느 하나)이 있는지 본다. 음성은 `redirect: false`인 항목만 G-5
#       되돌림 불성립(`portal_redirect_match` → None)을 단언한다(role 이 있으면 그 역할 · 없으면 두 권).
#   M-2 라우팅(로컬 MLX 두 평면 · 2단 intent_planner 노드 — 계층 A 단락·G-5 되돌림 포함)
#       — scripts/eval_portal_help.py. 양성 → `portal_help` 단일 task 비율 · 음성 → `portal_help`가
#       계획에 든 비율(오탐). `expect.agents`(음성)는 종전 담당이며 참고로만 본다(오탐 판정과 무관).
#
# 필드:
#   polarity : positive | negative
#   role     : user | admin — 검색 역할 필터(admin = 두 권 · user = 사용자 매뉴얼만 · G-2).
#              (음성) 있으면 되돌림 판정 역할(V-2 — 되돌림은 호출자 역할로 매칭) · 없으면 두 권.
#   category : (음성) data_lookup(같은 낱말의 데이터 조회) · real_registration(실제 등록·관리 요청) ·
#              general_concept(포탈 밖 일반 개념·사용법)
#   expect.sections : (양성) 기대 근거 절 `<manual>:<section_id>` — 실 색인 section_id로 실측해 적었다.
#   expect.agents   : (음성) 종전 담당 후보(참고)
#   redirect : (음성) false면 결정적 G-5 되돌림이 성립하지 않아야 한다.
#   prior    : (2턴) 앞 턴 — 노드 상태 `conversation_context`(turn_count 2 · 앞 턴 요약)로 주입한다.
#              요약 문구는 수기 작성이다(런타임 context_resolver 산출물 아님).
#
# 양성 문장은 매뉴얼에 실제 있는 기능만 쓴다(사용자 매뉴얼 14 · 관리자 매뉴얼 6 — 요청 예시 2건 ·
# 2턴 2건 포함). 대표 W0 문항은 pu-01(등록 오인 재현)·pu-02(1단 직답 오답)·pu-03(G-5 되돌림 미성립).

