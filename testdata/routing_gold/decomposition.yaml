# 분해(의도 계획) 골든셋 — 순차 의존 회귀 (D-203 · plans/88 §4.6 · W4)
#
# 목적: `intent_planner._llm_decompose`가 "앞 조회 결과가 뒤 조회의 대상"인 질의를 **2개 이상 task +
#   input_from 배선**으로 분해하는지 판정한다. 라우팅 골든셋(routing.yaml)은 의도·DB 선택만 보고
#   분해 구조는 보지 않는다 — 순차가 한 task로 뭉개져도 잡히지 않았다(plans/88 R-6).
#
# 판정 규칙(scripts/eval_routing.py --decomposition):
#   task_count_ok : 산출 task 수 >= expect.min_tasks
#   edge_ok       : expect.edges의 (agent_from → agent_to) 쌍마다, 뒤 task의 input_from이 앞 task를 가리킨다
#   agents_ok     : expect.agents ⊆ 산출 agent 집합
#   single_ok     : expect.min_tasks == 1 인 케이스는 task 1개(오탐 방지 — 단일이 정답인 질의)
#
# ⚠ 실 LLM 호출은 D-127 건별 승인 + RUN_E2E=1 이후에만. --dry-run은 정합성만, --mock은 목업.
#   (로컬 MLX 두 평면 루프백이면 RUN_E2E 없이 돈다 — D-240 부기 · `local_mlx_mode()`)
#
# 노드 단위 평가(plans/121 TP-0.2 · `--decomposition --node`) — `intent_planner` 노드 함수를 통째로 부른다
# (사전 처리 계층 A 포함). 함수 단위 모드(`--decomposition`)는 core 항목만 읽는다(판정·출력 불변).
#   suite: node      — 노드 모드 전용 항목(사전 처리 단락·상태 주입이 있어 함수 단위로는 뜻이 없다)
#   parsed: {...}    — 파서 출력 동결값(`ParsedRequirements` 키만). input_parser LLM 변동을 배제한다.
#                      없으면 "파서가 아무것도 뽑지 못한" 출력(기본값 + original_query)으로 돈다.
#   state: {...}     — 노드 입력 상태 주입(`AgentState` 키 — 예: selected_db_ids · mapped_db_ids ·
#                      conversation_context). user_query·parsed_requirements는 query·parsed로 준다.
#   expect.request_type — 작업 유형 초안 코드(plans/121 §4.2). 노드 모드는 제품 분해 출력에 유형 칸이 없어
#                      **채점 불가**로만 표기하고, 사전 실험(`--decomposition --node --type-experiment` ·
#                      TP-0.8)은 초안 프롬프트 출력과 대조해 채점한다(사전 처리 단락 항목은 실험에서도 채점 불가).
#                      ⚠ **모든 request_type 라벨은 사용자 검수 전이다**(TP-0.8 · G-31 입력 — 근거는 각 note).
#                      §4.2 정의로 명백한 항목에만 단다. `select_then_detail`(선별 → 상세)과 `cross_domain`
#                      (한 영역 → 다른 영역)은 §4.2 정의가 겹친다 — 선별 뒤 **영역이 바뀌는** 항목(d-002 알람 →
#                      지표 · d-003 사용률 → 제조사)은 라벨을 달지 않았고, d-101(사용률 → 알람)의 기존 라벨도
#                      같은 겹침에 걸린다(검수 대상).
#   unscored: "<사유>" — 채점 불가 선언(합격·불합격과 따로 센다 · core 항목에는 둘 수 없다).
# 노드 모드 지표: node F1(agent 다중집합) · edge F1(input_from 간선의 agent 쌍) · 형식 오류율(LLM 출력 파싱
#   실패·무효 분해 — 구조 오답과 분리) · pass^k(`--repeat k`, 모든 회차 통과).
# ⚠ `parsed` 예시는 **수기 작성**이다(파서 실측 아님) — 골드 확충(묶음 C) 때 MLX 파서 출력으로 교체·검수한다.

version: 1
items:
  - id: d-001
    query: "CPU 사용률이 높은 서버를 찾아 그 서버들의 최근 1개월 CPU 사용률을 보여줘"
    expect:
      min_tasks: 2
      agents: [data_query, data_query]
      edges: [[data_query, data_query]]
      request_type: select_then_detail
    critical: sequential
    note: >
      plans/88 예시 질의 — data→data 순차. 한 task로 뭉개지면 R-1·R-2.
      request_type(사용자 검수 전 · TP-0.8): select_then_detail — 1단계 선별(CPU 높은 서버) → 2단계 선별 대상의
      상세·추이(1개월 CPU)로 §4.3 루틴 요약("조건으로 대상을 선별한 뒤, 선별된 대상의 상세·추이를 조회")과
      같다. 두 단계가 같은 영역(사용률)이라 cross_domain("다른 영역")이 아니고 비교 축이 없어 compare도 아니다.

  - id: d-002
    query: "현재 활성 상태인 심각 알람이 있는 서버들의 최근 1개월 메모리 사용률을 보여줘"
    expect:
      min_tasks: 2
      agents: [alarm_query, data_query]
      edges: [[alarm_query, data_query]]
    critical: sequential
    note: "프롬프트 예시 3-1 동형 — alarm→data 순차(D-086 회귀 기준선)."

  - id: d-003
    query: "디스크 사용률 상위 5대를 뽑고 그 중 메모리 사용률이 가장 높은 서버의 제조사를 알려줘"
    expect:
      min_tasks: 2
      agents: [data_query, data_query]
      edges: [[data_query, data_query]]
    critical: sequential
    note: "순위형 후속('그 중 … 가장') — 선별 집합 내 순위 산정은 앞 결과 스코프가 있어야 맞는다."

  - id: d-004
    query: "김포 운영 서버 목록을 찾아줘"
    expect:
      min_tasks: 1
      agents: [data_query]
      edges: []
      request_type: lookup
    critical: single
    note: >
      표지('찾아')가 있지만 단일이 정답 — 재분해 오탐이 실행 경로를 바꾸지 않는지(§7 S5).
      request_type(사용자 검수 전 · TP-0.8): lookup — 목록 조회 1단계(§4.2). 정렬·상한·집계·기간·비교 축이
      없다. 위치어는 DB 선택 신호일 뿐 유형이 아니다(§4.2 "유형은 소스를 말하지 않는다").

  - id: d-005
    query: "전체 서버의 OS 종류와 버전을 보여줘"
    expect:
      min_tasks: 1
      agents: [data_query]
      edges: []
      request_type: lookup
    critical: single
    note: >
      전역 범위 단일 질의 — 순차로 잘못 쪼개지면 안 된다.
      request_type(사용자 검수 전 · TP-0.8): lookup — 서버별 OS 종류·버전 목록 1단계(§4.2). 건수·합계·평균 같은
      집계어가 없어 aggregate가 아니고, 정렬·상한·기간도 없다.

  # ── 노드 모드 전용 (plans/121 TP-0.2 · suite: node) — 새 필드 예시 몇 건. 확충은 묶음 C ──────────
  - id: d-101
    query: "메모리 사용률이 90%를 넘는 서버를 추려서 그 서버들에 최근 1주일 동안 발생한 알람 이력을 보여줘"
    suite: node
    parsed:
      query_targets: ["메모리 사용률", "알람 이력"]
      filter_conditions: [{field: "메모리 사용률", operator: ">", value: 90}]
      time_range: {relative: "최근 1주일"}
    expect:
      min_tasks: 2
      agents: [data_query, alarm_query]
      edges: [[data_query, alarm_query]]
      request_type: select_then_detail
    critical: sequential
    note: >
      선별 → 상세(data→alarm 순차). 파서 출력은 수기 동결 예시. request_type은 §4.2 초안 코드 —
      TP-2.2 전이라 채점 불가로만 표기되고 구조(task·간선)는 채점한다.

  - id: d-102
    query: "이 에이전트 사용법 알려줘"
    suite: node
    expect:
      min_tasks: 1
      agents: [general_inference]
      edges: []
      request_type: usage_help
    critical: single
    note: "사전 처리 ③.8(사용법 문의) 단락 — LLM 0회. 함수 단위 모드로는 관측되지 않는 경로다."

  - id: d-103
    query: "디스크 사용률이 80% 넘는 서버 목록 보여줘"
    suite: node
    state:
      selected_db_ids: [polestar_cm_gp]
    expect:
      min_tasks: 1
      agents: [data_query]
      edges: []
    critical: single
    note: >
      존 역질문 재진입 턴(②.5 — 사용자가 존을 고른 뒤 같은 질의가 다시 온다). 단일 의도라 현행 단락이
      정답이다. 복합 재진입(F-3 · N-1)은 TP-1.2가 스냅샷 상태 키를 만든 뒤 그 키로 추가한다.

  - id: d-104
    query: "심각 알람이 뜬 서버들의 최근 30분 CPU 추이를 프로메테우스 기준으로 뽑아줘"
    suite: node
    unscored: "비SQL 시스템(Prometheus) — 분해 담당 목록에 Prometheus 처리기가 없다(TP-10.5 전 · requested_source는 TP-2.2 전)"
    note: >
      출력 칸이 생긴 뒤의 기대: alarm_query → Prometheus 처리기 순차(요청 소스 = Prometheus). 지금은
      관찰만 한다(폴스타 SQL로 조용히 대체되는지 — plans/121 §2.7.2 (B)).
