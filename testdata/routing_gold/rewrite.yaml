# 재작성 골든셋 — 슬롯 단위 채점 (plans/107 W0 · 서버·LLM 0)
#
# 목적: `merge_frame`·`rewrite_needed`·렌더·`verify_rewrite`를 **파서·라우터 출력 스냅샷**만으로
#   결정적으로 채점한다. E2E(서버 왕복) 회귀는 여기 두지 않는다 — plans/94 §19가 소유한다
#   (§2.4 오염 4건 중 3건은 94 카탈로그 F-01·F-03·F-04·A-01 / B-10·A-02 / G-02에 이미 단언이 있다).
#
# 채점기: tests/test_nodes/test_plan107_rewrite_gold.py
#   state   : 노드가 받는 상태 스냅샷(1·2단 격리 입력이면 original_user_query·is_composite 포함)
#   expect  :
#     gate              : rewrite_needed 사유(pass_through | non_utterance_source | unresolved_slot)
#     slots             : {슬롯: {source, value?}} — 부분 일치(나열한 키만 본다)
#     absent_slots      : 프레임에 없어야 하는 슬롯
#     original_contains : 프레임 원문(IntentFrame.original_query)에 있어야 하는 표면어
#     render_contains / render_not_contains : 병기 블록(render_canonical_block) 판정
#     verify            : {rewritten, result} — verify_rewrite 결과(레지스트리 위치 표면어 사용)
#     augment_skipped   : true면 augment+enforce 설정에서도 get_prompt_query가 원문을 그대로 돌려준다
#
# 범주(plans/107 §5 W0): ①오염 재현 ②지시어 후속 ③위치 전환 ④되묻기 재개 ⑤멀티 의도·순차 의존
#   ⑥멀티 DB(축소 금지) ⑦게이트 통과

version: 1
items:
  # ── ① §2.4 오염 4건 ──────────────────────────────────────────────
  - id: rw-001
    category: contamination
    case: "2026-07-16 명시 위치와 직전 위치 병합 — '은행존 알람'이 김포로 재작성"
    state:
      user_query: "은행존 알람 현황"
      target_databases: [{db_id: polestar_b0}]
      db_scope_source: hint
      parsed_requirements: {query_targets: ["알람"], original_query: "은행존 알람 현황"}
      conversation_context: {previous_location: "김포 운영", previous_entities: []}
    expect:
      gate: pass_through
      slots: {"targets.db_ids": {source: utterance, value: [polestar_b0]}}
      verify: {rewritten: "김포 은행 공동존 알람 현황", result: "fail:location_leak"}

  - id: rw-002
    category: contamination
    case: "2026-08-04 상한 샘플을 스코프로 오인 — 지시어 없는 후속이 직전 4대로 축소"
    state:
      user_query: "OS 종류 확인"
      target_databases: [{db_id: polestar_cm_gp}]
      db_scope_source: classified
      parsed_requirements:
        query_targets: ["OS 종류"]
        filter_conditions:
          - {field: hostname, operator: "IN", value: [web01, web02, web03, web04]}
        original_query: "OS 종류 확인"
      conversation_context:
        previous_entities:
          - {field: hostname, value: web01}
          - {field: hostname, value: web02}
          - {field: hostname, value: web03}
          - {field: hostname, value: web04}
    expect:
      gate: pass_through
      absent_slots: ["targets.hosts"]
      verify: {rewritten: "web01, web02, web03, web04 서버의 OS 종류 확인", result: "fail:scope_shrink"}

  - id: rw-003
    category: contamination
    case: "2026-08-05 상호배타 재선택 후 미선택 존 위치어 누출 — 구조로 해소(D-154 · G-7)"
    state:
      user_query: "은행존 모든 서버들 OS종류"
      raw_user_query: "은행존 및 공동존 여의도 센터의 모든 서버들 OS종류"
      display_query: "은행존 모든 서버들 OS종류"
      selected_db_ids: [polestar_b0]
      target_databases: [{db_id: polestar_b0}]
      db_scope_source: selected
      parsed_requirements: {query_targets: ["OS 종류"], original_query: "은행존 모든 서버들 OS종류"}
    expect:
      gate: non_utterance_source
      slots: {"targets.db_ids": {source: clarification_answer, value: [polestar_b0]}}
      render_contains: ["사용자 선택", "WHERE 조건으로 쓰지 않는다"]
      render_not_contains: ["여의도"]
      verify: {rewritten: "은행존 및 공동존 여의도 서버 OS종류", result: "fail:location_leak"}

  - id: rw-004
    category: contamination
    case: "2026-07-24 라우터 정제가 '모든'을 탈락 — 프레임 원문은 재작성문이 아니라 원문"
    state:
      user_query: "은행존 서버 호스트명 조회"
      original_user_query: "은행존 모든 서버 호스트명 조회"
      is_composite: false
      target_databases: [{db_id: polestar_b0}]
      parsed_requirements: {query_targets: ["호스트명"], original_query: "은행존 서버 호스트명 조회"}
    expect:
      gate: pass_through
      original_contains: ["모든"]

  # ── ② 지시어 후속 ──────────────────────────────────────────────
  - id: rw-005
    category: demonstrative
    case: "지시어 후속 — 파서가 식별자를 싣지 않아도 직전 엔티티를 승계(D-055)"
    state:
      user_query: "그 서버 메모리는?"
      target_databases: [{db_id: polestar_cm_gp}]
      parsed_requirements: {query_targets: ["메모리"], original_query: "그 서버 메모리는?"}
      conversation_context: {previous_entities: [{field: hostname, value: web01}]}
    expect:
      gate: non_utterance_source
      slots: {"targets.hosts": {source: context_inherited, value: [web01]}}
      render_contains: ["직전 대화에서 이어받음"]

  - id: rw-006
    category: demonstrative
    case: "지시어 후속 — 맥락 파싱(R5)이 식별자를 섞어 넣어도 출처는 승계로 판정"
    state:
      user_query: "해당 서버 OS"
      target_databases: [{db_id: polestar_cm_gp}]
      parsed_requirements:
        query_targets: ["OS"]
        filter_conditions: [{field: hostname, operator: "=", value: cocm-hdkapp01}]
        original_query: "해당 서버 OS"
      conversation_context: {previous_entities: [{field: hostname, value: cocm-hdkapp01}]}
    expect:
      gate: non_utterance_source
      slots: {"targets.hosts": {source: context_inherited, value: [cocm-hdkapp01]}}
      verify: {rewritten: "cocm-hdkapp01 서버 OS", result: "pass"}

  # ── ③ 위치 전환 ──────────────────────────────────────────────
  - id: rw-007
    category: location_switch
    case: "직전 김포 → 이번 여의도 — 발화 명시값이 승계값을 대체(병합 금지)"
    state:
      user_query: "여의도 서버 CPU 사용률"
      target_databases: [{db_id: polestar_cm_yd}]
      db_scope_source: hint
      parsed_requirements: {query_targets: ["CPU 사용률"], original_query: "여의도 서버 CPU 사용률"}
      conversation_context: {previous_location: "김포 운영", previous_db_ids: [polestar_cm_gp]}
    expect:
      gate: pass_through
      slots: {"targets.db_ids": {source: utterance, value: [polestar_cm_yd]}}
      verify: {rewritten: "김포 여의도 서버 CPU 사용률", result: "fail:location_leak"}

  # ── ④ 되묻기 재개 ──────────────────────────────────────────────
  - id: rw-008
    category: clarification_resume
    case: "존 역질문 답변 — 구조화 필드(selected_db_ids)로만 들어온다(자연어 재조합 금지)"
    state:
      user_query: "전체 서버 OS 종류 알려줘"
      selected_db_ids: [polestar_cm_gp]
      target_databases: [{db_id: polestar_cm_gp}]
      parsed_requirements: {query_targets: ["OS 종류"], original_query: "전체 서버 OS 종류 알려줘"}
    expect:
      gate: non_utterance_source
      slots: {"targets.db_ids": {source: clarification_answer, value: [polestar_cm_gp]}}
      render_contains: ["사용자 선택"]

  # ── ⑤ 멀티 의도·순차 의존 ──────────────────────────────────────
  - id: rw-009
    category: composite
    case: "복합 계획 — 병기하지 않는다(task 스코프 축소 D-092·D-094 보호)"
    state:
      user_query: "CPU 사용률이 높은 서버 목록"
      original_user_query: "CPU 사용률이 높은 서버를 찾아 그 서버들의 프로세스를 분석해줘"
      is_composite: true
      target_databases: [{db_id: polestar_cm_gp}]
      parsed_requirements: {query_targets: ["CPU 사용률"], original_query: "CPU 사용률이 높은 서버 목록"}
    expect:
      augment_skipped: true

  # ── ⑥ 멀티 DB(축소 금지) ──────────────────────────────────────
  - id: rw-010
    category: multi_db
    case: "두 존 비교 — 대상 DB 둘 다 프레임에 남는다(plans/79 §1.1 멀티 DB 축소 금지)"
    state:
      user_query: "김포와 여의도 서버의 CPU 사용률을 비교해줘"
      target_databases: [{db_id: polestar_cm_gp}, {db_id: polestar_cm_yd}]
      db_scope_source: hint
      parsed_requirements:
        query_targets: ["CPU 사용률"]
        original_query: "김포와 여의도 서버의 CPU 사용률을 비교해줘"
    expect:
      gate: pass_through
      slots: {"targets.db_ids": {source: utterance, value: [polestar_cm_gp, polestar_cm_yd]}}
      verify: {rewritten: "김포 여의도 서버 CPU 사용률 비교", result: "pass"}

  # ── ⑦ 게이트 통과 ──────────────────────────────────────────────
  - id: rw-011
    category: pass_through
    case: "모호하지 않은 질의 — 전부 발화 출처라 원문을 건드리지 않는다(P-9)"
    state:
      user_query: "김포 서버 CPU 사용률 상위 10건"
      target_databases: [{db_id: polestar_cm_gp}]
      db_scope_source: hint
      parsed_requirements:
        query_targets: ["CPU 사용률"]
        limit: 10
        original_query: "김포 서버 CPU 사용률 상위 10건"
    expect:
      gate: pass_through
      slots:
        "targets.db_ids": {source: utterance}
        "limit": {source: utterance, value: 10}
      augment_skipped: true

  - id: rw-012
    category: pass_through
    case: "시스템 기본값(LIMIT 상향 등)은 슬롯으로 만들지 않는다 — 게이트를 오염시키지 않게"
    state:
      user_query: "전체 서버 호스트명"
      resolved_limit: 10000
      target_databases: [{db_id: polestar_cm_gp}]
      db_scope_source: classified
      parsed_requirements: {query_targets: ["호스트명"], original_query: "전체 서버 호스트명"}
    expect:
      gate: pass_through
      absent_slots: ["limit"]
