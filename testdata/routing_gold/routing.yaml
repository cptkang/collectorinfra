# 라우팅 골든셋 — 의도 분류 · DB 선택 회귀 (Plan 80 WU-05 / S-1)
#
# 목적: 트랙 A(A-1 규칙 5 제거 등)가 **회귀를 냈는지** 판정한다.
#   ★ 최우선 감시 대상은 **멀티 DB 축소**(plans/79 §1.1 불변식 · §8 ⑩) —
#     임계를 올리거나 파싱이 깨지면 2순위·3순위 DB가 조용히 잘려 단일 선택이 된다.
#
# 판정 규칙(scripts/eval_routing.py):
#   intent_match     : 산출 intent == expect.intent
#   db_recall        : expect.databases ⊆ 산출 db_id 집합            ← 축소 감지의 본체
#   db_precision     : 산출 db_id 집합 ⊆ expect.databases ∪ allow_extra
#   multi_preserved  : expect.min_databases 이상이 살아남았는가
#   db_forbidden     : 산출 db_id 집합 ∩ expect.forbid_databases = ∅   ← 답변 영역 충돌(T5) 감지
#   chain            : 산출 chain == expect.chain(답변 영역 순서)      ← 교차 체인 신호(plans/102 D8)
#                      라우터 chain은 ROUTER_CAPABILITY_OWNERSHIP_ENABLED on일 때만 출력된다 — off면
#                      채점하지 않고 결과·요약에 「채점 불가」로 남긴다(통과로 세지 않음)
#   key_type · probe : 값 유효성만 검증 — 라우터 출력에 없어 「라우터 단계 채점 불가(H-2 소관)」로 표기
#
# ⚠ 실 LLM 호출은 **D-127 건별 승인 + RUN_E2E=1** 이후에만.
#
# 케이스 선정 근거:
#   - 단일 DB 기본형(회귀 기준선)
#   - **멀티 DB 3건**(불변식 ⑩ 직접 감시) — 위치 분기 · 도메인 교차 · 명시 복수 지정
#   - 의도 분기 전부(alarm_query · cache_management · general_inference)
#   - A-1 노출 확대 케이스(모호 질의 — 저신뢰 후보가 실제로 출력되는지)
#   - 관측/자산 경계 케이스(plans/95 W-8 · G-8 기본 가정 (가)) — 사양·사용률은 폴스타,
#     계약·금액·지원 종료·자산 상태는 자산관리. 자산 DB에도 사용률 컬럼이 있어 오선택이 조용하다
#   - 교차 시스템 케이스(plans/102 H-1 · critical: cross_system) — 자산 단독(R1) · 모니터링 단독(R2) ·
#     폴스타→자산(R3) · 자산→폴스타(R4) · IP 앵커(R5) · 식별자 프로브(R6) · 소유 모호(G-1 server_spec).
#     질의 문장은 라우터·분해 프롬프트 예시와 **다르게** 둔다(few-shot 복사로 통과하는 것을 막는다)
#
# 항목 묶음(suite · plans/121 TP-0.6):
#   (없음) = core   — 정적 core 점수(core26). 기본 모드(`_llm_classify` 단독 · 등록 DB 전부 · DB 설명 없음)는
#                     core만 채점한다. core 항목에는 unscored를 둘 수 없다(정적 점수에 섞지 않는다).
#   system          — 시스템 수준 소스 판단 케이스(Prometheus · 폴스타 REST · ITAM · 기권 · 명시 소스 불가).
#                     `--runtime-prompt-conditions` 모드만 읽는다. core 점수·합격률과 따로 요약한다.
#   unscored: "<사유>" — 채점 불가 선언. 합격·불합격과 따로 센다(통과로 세지 않는다). 출력 칸이 아직 없는
#                     기대값은 지금 어휘로 적으면 틀린 기대가 되므로 expect를 비워 두고 note에 적는다.
#                     비SQL 시스템은 TP-2.2(분해 출력 `requested_source`) 전이라 전부 채점 불가다.
#   런타임 모드는 기대 DB(expect.databases)가 활성 집합 밖이면 그 항목을 「채점 불가(기대 DB 비활성)」로
#   따로 센다 — 로컬(`ACTIVE_DB_IDS=polestar,itam`)에서는 존 DB 항목을 `--active-dbs`로 주입해야 채점된다.

version: 1
items:
  # ── 단일 DB · data_query ────────────────────────────────────────────
  - id: r-001
    query: "여의도 개발 서버들의 CPU 사용률을 보여줘"
    expect:
      intent: data_query
      databases: [polestar_cm_yd]
      min_databases: 1
    note: "위치어(여의도)→db_id 매핑. _LOCATION_DB_HINTS 경로."

  - id: r-002
    query: "김포 운영 서버 목록과 메모리 사양 알려줘"
    expect:
      intent: data_query
      databases: [polestar_cm_gp]
      min_databases: 1

  - id: r-003
    query: "은행존 서버의 디스크 사용량 조회"
    expect:
      intent: data_query
      databases: [polestar_b0]
      min_databases: 1

  # ── 멀티 DB ★ 불변식 ⑩ 직접 감시 ────────────────────────────────────
  - id: r-010
    query: "김포와 여의도 서버의 CPU 사용률을 비교해줘"
    expect:
      intent: data_query
      databases: [polestar_cm_gp, polestar_cm_yd]
      min_databases: 2
    critical: multi_db
    note: "명시 복수 지정. 하나로 줄면 즉시 회귀 — 사용자가 두 곳을 요구했다."

  - id: r-011
    query: "전체 존의 서버 대수와 VM 대수를 합쳐서 알려줘"
    expect:
      intent: data_query
      databases: [polestar_b0, polestar_cm_gp, polestar_cm_yd, cloud_portal]
      min_databases: 2
    critical: multi_db
    note: "도메인 교차(폴스타+가상화). 부분 매칭 허용하되 2개 미만이면 축소."

  - id: r-012
    query: "인시던트가 발생한 서버들의 자산 정보와 현재 사양을 보여줘"
    expect:
      intent: data_query
      databases: [itsm, itam]
      min_databases: 2
    critical: multi_db
    note: "ITSM→ITAM 교차. sub_query_context가 DB별로 분리돼야 한다."

  - id: r-013
    query: "공동존의 vm 중 최대 cpu와 최대 memory 서버 top 10을 정리해줘"
    expect:
      intent: data_query
      databases: [polestar_cm_gp, polestar_cm_yd]
      forbid_databases: [polestar_b0]
      min_databases: 2
    critical: multi_db
    note: >
      존 단위 위치어(공동존 = 김포 + 여의도 · 레지스트리 locations) — plans/113. 이 하네스는
      라우터 **LLM 분류(`_llm_classify`)만** 채점한다. 3단 노드 출력은 F-1 결정적 고정이 LLM과
      무관하게 두 DB를 보장하므로(tests/test_semantic_routing/test_router_hint_pinning.py), 이
      케이스의 실패는 운영 오라우팅이 아니라 분류 LLM이 존 단위 표면어를 한 DB로 좁힌다는
      신호다. 로컬 MLX 9B 실측(2026-09-22): polestar_cm_gp 1곳 — **실 LLM에서는 실패가 예상된다**.
      F-4(라우터 프롬프트 존 단위 규칙·예시 보강)는 같은 날 측정 후 기각했다 — 이 질의에 효과가 없고
      r-073이 회귀했다(plans/113 §9 · 부록 C). 운영 모델·소유표 on 환경 재측정 전까지 이 실패는 정상이다.

  # ── 의도 분기 ───────────────────────────────────────────────────────
  - id: r-020
    query: "현재 활성 상태인 심각 알람 목록 보여줘"
    expect:
      intent: alarm_query
      min_databases: 1

  - id: r-021
    query: "이번 달 CPU 임계값 초과 알람 이력 조회"
    expect:
      intent: alarm_query
      min_databases: 1

  - id: r-030
    query: "polestar DB의 스키마 캐시를 갱신해줘"
    expect:
      intent: cache_management
      databases: []
      min_databases: 0

  - id: r-031
    query: "조회 가능한 DB 목록과 설명을 알려줘"
    expect:
      intent: cache_management
      databases: []
      min_databases: 0

  - id: r-040
    query: "안녕하세요, 오늘 날씨 어때요?"
    expect:
      intent: general_inference
      databases: []
      min_databases: 0
    note: "최후 수단 클래스. 여기로 과잉 분류되면 A-4 편중 완화가 역효과."

  # ── A-1 노출 확대 케이스 (저신뢰가 실제로 출력되는가) ────────────────
  - id: r-050
    query: "서버 상태 좀 확인해줘"
    expect:
      intent: data_query
      min_databases: 1
    critical: low_confidence
    note: >
      모호 질의 — A-1(규칙 5 제거)로 이제 저신뢰 후보도 출력돼야 한다.
      relevance_score 분포에서 0.3~0.5 대역이 관측되는지 S-2가 확인한다.

  - id: r-051
    query: "그 장비 정보"
    expect:
      intent: data_query
      min_databases: 1
    critical: low_confidence
    note: "지시어 질의. 후보가 0건이면 기본 DB 폴백으로 떨어지는지 관측."

  # ── 관측/자산 경계 (plans/95 W-8 · 함정 T5 · G-8 기본 가정 (가)) ─────────
  - id: r-060
    query: "서버 CPU 사용률 상위 10대 보여줘"
    expect:
      intent: data_query
      forbid_databases: [itam]
      min_databases: 1
    critical: boundary
    note: >
      자산 DB(TCDMSIF80)에도 CPU 사용률 컬럼이 있어 두 DB 모두 정당한 후보다. G-8 (가)는 관측 DB가 정본 —
      itam이 선택되면 연계 스냅샷 숫자가 나와 답이 조용히 달라진다.

  - id: r-061
    query: "서버별 메모리 용량과 CPU 코어 수를 알려줘"
    expect:
      intent: data_query
      forbid_databases: [itam]
      min_databases: 1
    critical: boundary
    note: "사양 축도 관측 DB 정본(G-8 (가)). 자산 DB의 용량 컬럼으로 새면 안 된다."

  - id: r-062
    query: "유지보수 계약이 이번 분기에 만료되는 서버 목록"
    expect:
      intent: data_query
      databases: [itam]
      min_databases: 1
    critical: boundary
    note: "자산 축(유지보수 계약 만료) — plans/95 §6-1 ②."

  - id: r-063
    query: "하드웨어 지원 종료일(EOL)이 6개월 이내인 서버 알려줘"
    expect:
      intent: data_query
      databases: [itam]
      min_databases: 1
    critical: boundary
    note: "자산 축(EOS/EOL) — plans/95 §6-1 ①."

  - id: r-064
    query: "경과년수 5년 이상 노후 서버의 취득금액 보여줘"
    expect:
      intent: data_query
      databases: [itam]
      min_databases: 1
    critical: boundary
    note: "자산 축(경과년수·취득금액) — plans/95 §6-1 ③."

  # ── 교차 시스템 (plans/102 H-1 · §3.1 소유표 · D8 체인) ─────────────────────
  - id: r-070
    query: "DB 서버들의 자산 담당자와 담당 부점 목록 알려줘"
    expect:
      intent: data_query
      databases: [itam]
      forbid_databases: [polestar, polestar_b0, polestar_cm_gp, polestar_cm_yd]
      min_databases: 1
      chain: []
    critical: cross_system
    note: "R1 자산 단독(asset_owner) — 자산 축 질의는 자산관리만 조회한다."

  - id: r-071
    query: "여의도 개발 서버들의 가용 상태와 OS 버전 현황"
    expect:
      intent: data_query
      databases: [polestar_cm_yd]
      forbid_databases: [itam]
      min_databases: 1
      chain: []
    critical: cross_system
    note: "R2 모니터링 단독(server_status) — 자산관리를 조회하지 않는다."

  - id: r-072
    query: "김포 운영 서버 중 메모리 사용률이 85% 이상인 서버들의 무상 보증 만료일"
    expect:
      intent: data_query
      databases: [polestar_cm_gp, itam]
      min_databases: 2
      chain: [server_usage, asset_contract]
    critical: cross_system
    note: "R3 폴스타→자산 — 사용률 조건이 자산 조회 대상을 정한다(순서 있는 chain)."

  - id: r-073
    query: "하드웨어 지원 종료일이 이미 지난 은행존 서버들에 현재 발생 중인 알람"
    expect:
      intent: alarm_query
      databases: [itam, polestar_b0]
      min_databases: 2
      chain: [asset_lifecycle, alarm]
    critical: cross_system
    note: "R4 자산→폴스타 — 지원 종료 조건이 알람 조회 대상을 정한다. 원문 순차 표지 없음(X-T9)."

  - id: r-074
    query: "10.20.30.41 서버의 유지보수 계약 금액과 계약 기간"
    expect:
      intent: data_query
      databases: [itam]
      min_databases: 1
      chain: []
      key_type: ipv4
      probe: false
    critical: cross_system
    note: "R5 IP 앵커 — 사용자가 준 IP가 키다. 단일 소유 영역이라 프로브 발동 조건(§3.4 a·c) 불성립."

  - id: r-075
    query: "svr-web-01 서버의 자산 상태와 최근 1시간 CPU 사용률을 같이 보여줘"
    expect:
      intent: data_query
      databases: [itam]
      min_databases: 2
      chain: []
      key_type: hostname
      probe: true
    critical: cross_system
    note: >
      R6 식별자 프로브 — 필요한 영역이 두 시스템에 걸치고(§3.4 발동 조건 a) 명시 식별자가 있다.
      두 영역은 같은 식별자로 각각 조회할 뿐 서로의 대상을 정하지 않으므로 chain은 빈 목록이다.

  - id: r-076
    query: "svr-db-02 서버의 메모리 용량과 CPU 코어 수"
    expect:
      intent: data_query
      forbid_databases: [itam]
      min_databases: 1
      chain: []
      key_type: hostname
      probe: true
    critical: cross_system
    note: >
      G-1 소유 모호(server_spec) — **사용자 미확정 · 기본 가정(폴스타) 기준**. G-1이 확정되면 expect를
      갱신한다. 명시 식별자 + 소유 모호 영역이라 프로브 발동 조건(§3.4 c) 성립.

  # ── 시스템 수준 소스 판단 (plans/121 TP-0.6 · suite: system — 정적 core 점수에 넣지 않는다) ──────
  # 질의는 합성 문장이다(운영 데이터·PII 없음). 비SQL 시스템(Prometheus·폴스타 REST)과 기권·소스 불가는
  # 라우터·분해 출력에 소스 칸이 없어(TP-2.2 `requested_source` 전) 전부 채점 불가로 선언한다 — 런타임
  # 모드는 이 항목들의 실제 분류를 `observed`로만 남긴다(침묵 대체 관찰 · F-11).
  - id: r-080
    query: "프로메테우스에 쌓인 지표로 웹 서버들의 지난 30분 CPU 사용률 추이를 보여줘"
    suite: system
    critical: system_prometheus
    unscored: "비SQL 시스템(Prometheus) — 라우터·분해 출력에 요청 소스 칸이 없다(TP-2.2 전 · 처리기 TP-10.5 전)"
    note: >
      출력 칸이 생긴 뒤의 기대: 요청 소스 = Prometheus. 비활성이면 소스 불가 사유를 알리고 폴스타 SQL로
      조용히 대체하지 않는다(plans/121 §2.7.2 (B) · N-11).

  - id: r-081
    query: "폴스타 실시간 API로 앱 서버들에서 지금 돌고 있는 프로세스 목록을 가져와줘"
    suite: system
    critical: system_rest
    unscored: "비SQL 시스템(폴스타 실시간 REST) — 라우터 출력에 소스 칸이 없다(TP-2.2 전)"
    note: >
      출력 칸이 생긴 뒤의 기대: 요청 소스 = 폴스타 실시간 프로세스 REST(분해 담당 process_query). 라우터는
      DB만 고르므로 지금은 어떤 DB를 골라도 판정할 수 없다.

  - id: r-082
    query: "ITAM 자산관리 DB에서 설치 지역 정보가 비어 있는 서버 자산을 보여줘"
    suite: system
    critical: system_itam
    expect:
      intent: data_query
      databases: [itam]
      forbid_databases: [polestar, polestar_b0, polestar_cm_gp, polestar_cm_yd]
      min_databases: 1
    note: "명시 소스(ITAM) — SQL 시스템이라 채점한다. 설치 지역은 자산 원장 속성이다(폴스타 위치어 아님)."

  - id: r-083
    query: "인사 시스템에서 이번 달 직원 연차 사용 현황을 조회해줘"
    suite: system
    critical: system_abstain
    unscored: "기권(보유 소스 없음) — 라우터·분해 출력에 기권 칸이 없다(TP-9.7 소스 판단 절차 · TP-2.2 전)"
    note: >
      출력 칸이 생긴 뒤의 기대: 조회할 소스 0개 → 기권(보유하지 않은 데이터라고 알린다). 지금은 첫 활성 DB
      폴백(`classify_dbs`)이나 일반 응답으로 흘러도 구분할 칸이 없다.

  - id: r-084
    query: "ITSM DB에서 지난주 등록된 변경 요청 건수를 알려줘"
    suite: system
    critical: system_unavailable
    unscored: "명시 소스 불가(등록·비활성 DB) — 라우터 출력에 소스 불가 칸이 없다(TP-1.11a 노트 · TP-2.2 전)"
    note: >
      itsm은 레지스트리에 등록돼 있으나 로컬 `.env` 기준 비활성이다. 정적 모드(등록 DB 전부)면 itsm을 고를 수
      있고, 런타임 조건(활성 집합)에서는 고를 수 없어 다른 DB로 조용히 대체될 수 있다 — 기대는 소스 불가 안내.
