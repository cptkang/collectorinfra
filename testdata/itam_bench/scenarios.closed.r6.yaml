# ITAM 질의 벤치 시나리오 — 폐쇄망(운영) **6회차 전용** 신규 세트 (plans/150 W9 · G-5 (a) · D-301 ①)
#
# ★ **초안 · 사용자 검토 대상**(135 G-1 선례 — 우리가 초안을 쓰고 사용자가 검토한 뒤 확정한다).
#   기존 `scenarios.closed.yaml`(ITAM-101~118)은 지우지 않고 **회귀 세트로 보존**한다 — **6회차 run에는 쓰지 않는다.**
#   그 18건은 5회 반복됐고 지식 자산(K1·K2·K4)·정의 문구가 그 실행 결과로 고쳐져 왔다. 6회차는 처음 보는 사용자
#   프롬프트로만 돌려 「일반화」를 잰다. 기존 18건·K2 질문과의 문구 겹침은
#   `tests/test_scripts/test_itam_bench_plan150_r6_overlap.py`가 막는다(r6 안의 주제 이음은 의도한 대조라 보지 않는다).
#
# 작성 규칙: 자산관리 포탈 사용자가 칠 법한 말 · 테이블·컬럼·SQL 용어·사람 이름 없음(로더 린트). 서비스 이름은 G-5 답
# 3개(무인공과금·법원공탁금·그린뱅크)만 쓴다 — 이 파일은 커밋 대상이라 그 밖의 업무 이름·값 리터럴은 넣지 않는다
# (D-301 · D-308 · D-321).
#
# 구성(32건 · 다중 턴 212·213·232): A 18건(ITAM-201~218 — 단일 테이블·서비스·코드값·범위 밖) + B 14건(ITAM-219~232 — 조인 군).
# - 오라클(정답 SQL `testdata/scenarios/oracles/ITAM-2NN.mariadb.sql` · 값 리터럴 없음 · 날짜는 앵커 자리표):
#   정답 모양이 정해진 범주만 — tcdmsif80 단독 계약·취득·노후(201~204 · 212 턴2) · tcdmsif79 지원 종료(205) ·
#   tcdmsif72 집계(206·207·218) · 조인 불필요 대조군 227(tcdmsif80 부서 이름 집계). 모의 DB(3308)에서는 구문·실행만
#   확인했다 — **내부망 `--check-oracle --env closed`에서 0행·오류가 나면 그 턴은 `observe`로 되돌린다**(146 W5 (1)).
# - 관찰: 서비스 개념·코드값·범위 밖·다중 턴 1턴, 그리고 **조인 군 전부**. 조인 키 연결은 내부망에서 한 번도 확정되지
#   않았고 모의 DB 건수는 근거가 못 된다(plans/150 F14 ⑤) — 탐침 P09~P18이 연결을 확정한 ★(220·223·225·229)만 7회차
#   오라클 후보다.
#
# 판정 칸(plans/150 W9 7 · W2 (6)(7)): 파일 머리 `require_judgement: true` — `observe.no_data: true`(216)가 아닌 모든 턴에
# `gold_tables`·`key_columns`가 있어야 로더가 받는다. 이름 검사는 closed 정책 ∪ `closed/itam_schema.json`이다(정책 밖 칸은
# 반출에서 `unclassified`로 가려지지만 판정은 테이블·칸 이름·행 수·조인 표지만 쓴다).
# - `gold_tables`가 목록의 목록이면 허용 경로 묶음이다(첫 묶음이 기준).
# - `join_keys`는 정의 `related`의 키 쌍이다(`그룹회사코드`는 요구하지 않고 기록만). 판정기는 쌍의 두 테이블을 함께 쓴
#   SQL에만 그 쌍을 본다 — 허용 경로의 키 쌍도 함께 적었다(쓰지 않은 경로의 쌍은 건너뛴다).
# - `key_columns` 항목이 목록이면 「같은 뜻」 후보다. 서비스 이름 칸은 서버 원장의 자유 기재 두 칸(그룹경로내용·
#   구성항목설명내용 — 지식 가이드 서비스 연결 1순위)이다.
# 실행: `python -m scripts.itam_bench --run --env closed --scenarios testdata/itam_bench/scenarios.closed.r6.yaml`
# (오라클 확인은 `--check-oracle` · 근거 묶음은 `--evidence <run> --scenarios <이 파일>`). `--compare`는 시나리오 파일이
# 다르면 run을 짝짓지 않는다 — 5→6회차는 범주별 지표로만 비교하고 「프롬프트 세트 교체」를 적는다.
version: 1
db_id: itam
require_judgement: true

aliases:
  # scenarios.closed.yaml host_key와 같은 목록(4회차 결과 열 별칭 포함)
  host_key: &host_key [서버호스트명, sevrHostName, 호스트명, 서버명, 호스트, 서버, hostname, host_name, server_name,
    server_hostname, server_host, host]
  count_value: &count_value [n, 서버수, 서버 수, 대수, 건수, count, cnt, server_count]
  # 서비스 이름 조건 칸(서버 원장 자유 기재 두 칸 — 「같은 뜻」 후보)
  service_name_columns: &service_name_columns [그룹경로내용, 구성항목설명내용]

scenarios:
  # ── A. 단일 테이블·서비스·코드값·범위 밖(18) ───────────────────────────────────────────

  - id: ITAM-201
    title: "다음 달 말까지 유지보수 계약 종료 — 마트 단독 · 6회차 초안"
    category: maintenance
    env: [closed]
    traps: [date_text, mart_only]
    key_columns: [유지보수계약종료년월일]
    gold_tables: [tcdmsif80]
    turns:
      - send: {query: "다음 달 말까지 유지보수 계약이 끝나는 서버 목록 보여줘"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다 · 관찰 메모: 서버 원장 조인 없이 마트 하나로 답하는가(W3)
          oracle: {id: ITAM-201, compare: keyset, key: [*host_key], db_ids: [itam]}

  - id: ITAM-202
    title: "유지보수 계약 이미 종료 서버 수 — 과거 경계 · 6회차 초안"
    category: maintenance
    env: [closed]
    traps: [date_text, mart_only]
    key_columns: [유지보수계약종료년월일]
    gold_tables: [tcdmsif80]
    turns:
      - send: {query: "유지보수 계약이 이미 끝난 서버가 몇 대야?"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다 · 건수 질문 — 목록으로 답하면 행 수로(count_rows_ok)
          count_rows_ok: true
          oracle: {id: ITAM-202, compare: value, value: *count_value, db_ids: [itam]}

  - id: ITAM-203
    title: "취득 8년 초과 서버 수 — 연수 변형 · 6회차 초안"
    category: lifecycle
    env: [closed]
    traps: [date_text, boundary_exclusive, mart_only]
    key_columns: [[취득년월일, 경과년수]]
    gold_tables: [tcdmsif80]
    turns:
      - send: {query: "자산관리에서 취득한 지 8년 넘은 서버 몇 대인지 알려줘"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다 · 「넘은」 = 경계 제외 · 건수 질문(count_rows_ok)
          # 관찰 메모(경계 함정): 허용 칸 경과년수(정수 내림 연수)로 풀면 「8년 넘은」 ≈ 경과년수 >= 8이다. `> 8`이면 9년 이상만 세어
          # 날짜 기준 오라클과 크게 어긋난다 — fail이면 SQL의 칸·부등호부터 본다(plans/150 검증 의견)
          count_rows_ok: true
          oracle: {id: ITAM-203, compare: value, value: *count_value, db_ids: [itam]}

  - id: ITAM-204
    title: "서버 취득금액 총합 — 합계 · 6회차 초안"
    category: amount
    env: [closed]
    traps: [sum_not_argmax, mart_only]
    key_columns: [취득금액]
    gold_tables: [tcdmsif80]
    turns:
      - send: {query: "자산관리에 등록된 서버 취득금액 총합 알려줘"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다 · 금액은 합계만 기록한다(plans/135 §3.5.6)
          oracle:
            id: ITAM-204
            compare: value
            value: [total_amount, 취득금액, 합계, 총합, 취득금액합계, 취득금액 합계, 총취득금액, 총 취득금액, sum_amount,
              total_acquisition_amount, acquisition_amount, total, sum, amount]
            db_ids: [itam]

  - id: ITAM-205
    title: "올해 안 하드웨어 지원 종료 — HW 단독 · 6회차 초안"
    category: eol
    env: [closed]
    traps: [date_text, year_end_boundary]
    key_columns: [하드웨어지원종료년월일]
    gold_tables: [tcdmsif79]
    turns:
      - send: {query: "올해 안에 하드웨어 지원이 끝나는 서버 있어?"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다 · 관찰 메모: 소프트웨어 칸을 OR로 섞지 않는가
          oracle: {id: ITAM-205, compare: keyset, key: [*host_key], db_ids: [itam]}

  - id: ITAM-206
    title: "운영체제 버전별 서버 수 — 집계 축 변경 · 6회차 초안"
    category: spec
    env: [closed]
    traps: [group_aggregate]
    key_columns: [운영체제버전내용]
    gold_tables: [[tcdmsif72], [tcdmsif80]]
    turns:
      - send: {query: "운영체제 버전별로 서버 몇 대씩인지 보여줘"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다 · 오라클 테이블은 K2 k2-server-count-by-os(tcdmsif72)와 맞췄다
          # 운영체제 버전 칸은 키로 쓰지 않는다 — 그룹 수(count)로 대조
          oracle: {id: ITAM-206, compare: count, db_ids: [itam]}

  - id: ITAM-207
    title: "설치 지역별 서버 대수 — 새 집계 축 · 6회차 초안"
    category: inventory
    env: [closed]
    traps: [group_aggregate]
    key_columns: [설치지역내용]
    gold_tables: [[tcdmsif72], [tcdmsif80]]
    turns:
      - send: {query: "자산관리 기준으로 설치 지역별 서버 대수 알려줘"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다 · 설치 지역 칸은 72·80 모두 있다 — 그룹 수(count)로 대조
          oracle: {id: ITAM-207, compare: count, db_ids: [itam]}

  - id: ITAM-208
    title: "서비스 서버 IP 목록 — 서비스 연결 일반화 · 6회차 초안"
    category: service
    env: [closed]
    traps: [service_concept]
    key_columns: [IP주소내용, *service_name_columns]
    gold_tables: [tcdmsif72]
    turns:
      - send: {query: "무인공과금 쪽 서버 IP 목록 뽑아줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "새 서비스 핵심어를 서버 원장 자유 기재 칸에 부분 일치로 거는가 · 결과 건수(탐침 150 P07A와 짝)"
            no_data: false

  - id: ITAM-209
    title: "서비스 서버 중 1년 안 지원 종료 — 2테이블 조인 · 6회차 초안"
    category: service
    env: [closed]
    traps: [service_concept, join_3col, date_text]
    key_columns: [*service_name_columns, [하드웨어지원종료년월일, 소프트웨어지원종료년월일]]
    gold_tables: [tcdmsif72, tcdmsif79]
    join_keys:
      - [tcdmsif72.서버호스트명, tcdmsif79.서버호스트명]
      - [tcdmsif72.IP주소내용, tcdmsif79.IP주소내용]
    turns:
      - send: {query: "무인공과금 서버 중에 1년 안에 지원 끝나는 거 있어?"}
        expect:
          db_ids: [itam]
          observe:
            what: "서비스 조건 + 지원 종료 테이블 조인(두 칸 키) · 0행이면 탐침 150 P02·P03 건수와 짝지어 원인을 가른다(103 대조)"
            no_data: false

  - id: ITAM-210
    title: "서비스 서버 운영체제 버전 — 다른 서비스 핵심어 · 6회차 초안"
    category: service
    env: [closed]
    traps: [service_concept]
    key_columns: [운영체제버전내용, *service_name_columns]
    gold_tables: [tcdmsif72]
    turns:
      - send: {query: "법원공탁금 업무에 쓰는 서버들 운영체제 버전 알려줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "서비스 핵심어를 서버 원장 자유 기재 칸에 부분 일치로 거는가 · 운영체제 버전 칸을 고르는가(탐침 150 P07B와 짝)"
            no_data: false

  - id: ITAM-211
    title: "서비스 업무 스토리지 할당 합계 — 스토리지 업무 · 6회차 초안"
    category: service
    env: [closed]
    traps: [service_concept, storage_service]
    key_columns: [업무명, 장비할당량]
    gold_tables: [tcdmsif52]
    turns:
      - send: {query: "그린뱅크 업무에 할당된 스토리지 용량 합계 알려줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "스토리지 할당의 업무 이름 칸에 핵심어 부분 일치(W5) · 장비 현황을 잇지 않고 할당 하나로 합계를 내는가"
            no_data: false

  - id: ITAM-212
    title: "멀티턴 — 6년 초과 서버 중 유지보수 잔여 수 · 21건 이상 표본 승계 · 6회차 초안"
    category: multiturn
    env: [closed]
    traps: [succession, sample_succession, date_text, mart_only]
    key_columns: [[취득년월일, 경과년수]]
    gold_tables: [tcdmsif80]
    turns:
      - send: {query: "도입한 지 6년 넘은 서버 목록 보여줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "1턴 노후 서버 목록(결과가 21건 이상이면 2턴은 표본만 기억된다)"
            no_data: false
      - send: {query: "그 서버들 중에 유지보수 계약이 아직 남아 있는 건 몇 대야?"}
        expect:
          db_ids: [itam]
          key_columns: [유지보수계약종료년월일]
          gold_tables: [tcdmsif80]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다 · 앞 조건을 다시 걸어 전체 범위로 세는가(W1 · G-1 (a))
          count_rows_ok: true
          oracle: {id: ITAM-212, compare: value, value: *count_value, db_ids: [itam]}

  - id: ITAM-213
    title: "멀티턴 — 서비스 서버의 담당 부서 · 이름 다른 키 · 6회차 초안"
    category: multiturn
    env: [closed]
    traps: [service_concept, succession, org_not_person, join_name_differs]
    key_columns: [*service_name_columns]
    gold_tables: [tcdmsif72]
    turns:
      - send: {query: "법원공탁금 업무를 돌리는 서버들이 뭐가 있는지 알려줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "1턴 서비스 서버 목록"
            no_data: false
      - send: {query: "그 서버들 담당 부서도 같이 알려줘"}
        expect:
          db_ids: [itam]
          key_columns: [[부점명, 담당부점명]]
          # 기준: 서버 원장 → 부점(담당부점코드 → 부점코드) · 허용: 서버 원장 → 서버 통합 현황의 담당부점명(P05로 확정)
          gold_tables: [[tcdmsif72, tcdmsbr01], [tcdmsif72, tcdmsif80]]
          join_keys:
            - [tcdmsif72.담당부점코드, tcdmsbr01.부점코드]
            - [tcdmsif72.서버호스트명, tcdmsif80.서버호스트명]
            - [tcdmsif72.IP주소내용, tcdmsif80.IP주소내용]
          observe:
            what: "앞 서비스 결과를 승계하는가 · 부서 이름 경로(이름이 다른 키 칸 · 사람 칸이 아닌 조직 칸)"
            no_data: false

  - id: ITAM-214
