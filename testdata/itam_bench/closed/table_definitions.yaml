# ITAM 테이블 관리 정보 정의 — 내부망(closed) 108테이블 · **초안**
#
# 출처: 내부망 벤치 반출 카탈로그 run `20261006-152938`(`results/itam_bench/20261006-152938/schema_catalog.yaml`
#       — 구조·이름만 · 값 0 · 누출 관문 통과). 같은 run에서 만든 스키마는 옆 파일 `itam_schema.json`(앱 스키마
#       캐시 형식)이다.
# 작성: 2026-10-06 · 컬럼 이름만 보고 쓴 초안이다(테이블 주석·데이터 값 미확인 · 카탈로그 의미 보유 0).
#       「(추정)」 표시는 이름으로만 판단한 것이다. 내부망 테이블 정의서와 대조해 고친다(D-301 부기 G-7).
# 용도: `plans/139` v1.1 — 질의 시 LLM이 이 정의를 보고 조회 대상 테이블을 고르고, 고른 테이블로만 SQL을 만든다.
#       런타임 소비 코드는 아직 없다(plans/139 W3·W4 구현 전). 2회차 정답 SQL·`gold_tables` 작성 근거로도 쓴다.
#
# 필드
#   group      업무 영역(아래 groups)
#   kind       테이블 성격
#                현행     — 지금 상태를 관리하는 원장(서버·네트워크·가상화는 `활성화여부`가 있는 쪽)
#                수집적재 — 현행과 컬럼이 거의 같고 `활성화여부`가 없는 쌍둥이(수집 원본 적재본 추정)
#                수집이력 — `기준년월일`(또는 `기준년월`) + 수집이력ID로 날짜별로 쌓는 이력(추이·과거 시점 질문)
#                변경이력 · 신청·처리 · 점검 · 매핑(두 대상 연결) · 기준·코드 · 로그 · 게시판 · 통계 · 설정
#   manages    이 테이블이 관리하는 정보(1~2문장)
#   key_columns 질문과 맞춰 볼 대표 컬럼(실존 컬럼 · 최대 10)
#   related    연결 후보 {테이블: 연결 컬럼} — 이름이 같은 컬럼으로 추정한 것이다. 선언 FK 0 · 관계 자산 0이라
#              **값 겹침은 확인하지 않았다**(D-294 ② 기준 ≥ 0.9 미측정).
#   notes      주의(개인정보·비밀값·컬럼 표기 차이 등)
#   allowed    `false`만 적는다 — 승인 프로필 `allowed_tables`(99개) 밖인 9개. 나머지는 조회 대상이다.
#
# 공통 컬럼: 모든 테이블에 `그룹회사코드`, 대부분에 시스템 감사 컬럼 4종(`시스템등록사용자번호`·`시스템등록처리일시`·
# `시스템최종사용자번호`·`시스템최종처리일시`)이 있다 — key_columns에서 뺐다.
# 기본키: 반출 카탈로그에 기본키 표시가 없다(108테이블 모두) — NOT NULL 앞쪽 컬럼이 자연키로 보인다.

