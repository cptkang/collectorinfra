# K3 — ITAM 컬럼 설명 원천 (plans/143 W3 · D-316 · 작성 스킬 .claude/skills/itam-knowledge)
# 설명 정본 파일로 빌드되어 Redis에 설명이 없는 컬럼만 채운다(내부망 설명·운영자 편집 우선 — plans/143 §4.5).
# 범위: 1회차(20261006-152938) 시나리오·실패 턴에 걸린 테이블에서 이름만으로 뜻이 모호한 칸(코드·여부·구분·
# 날짜·식별자·서비스 연결 후보). 항목당 ≤ 200자 · 값 0. 이름만 보고 판단한 의미는 (추정).
# 2회차(20261007-152223)로 tcdmsif72의 물품분류번호·물품고유번호·활성화여부를 다시 썼다.
