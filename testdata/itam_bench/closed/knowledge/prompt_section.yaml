# K4 — ITAM DB 전용 규칙 섹션 원천 (plans/143 W3 · D-316 · 작성 스킬 .claude/skills/itam-knowledge)
# 통과한 active `text`를 연결 → config/knowledge/itam/prompt_template.yaml 섹션(≤ 6,000자 · 펜스 SQL ≤ 5블록).
# 1회차(20261006-152938)는 모의 DB 실행 검증이 없어 SQL 펜스 없이 규칙 문장만 둔다. K6 파생 규칙(활성 여부 ·
# 수집 이력 기준일 · 적재본 선택 금지)은 되풀이하지 않는다. 값 0.
# 2회차(20261007-152223 · 실행 검증 없음 — 펜스 0 유지)로 s01·s03·s04·s05·s07·s09를 다시 썼다.
# 3회차(20261007-174622 · plans/146 W4)로 s04·s07·s09를 다시 쓰고 s10(이름 일치)을 더했다 — 펜스 0 유지
# (정답 SQL은 K2 예시로 둔다).
# 4회차(20261008-133613 · plans/149 W1)로 s07을 다시 썼다(서비스 조건 순서 반전 · 용도 칸 범위) — 펜스 0 유지.
version: 1
items:
  # 이력: 2회차(20261007-152223)에 큰따옴표 별칭이 반복됐다.
  - id: s01-identifiers
    origin: claude_code
    evidence: 20261007-152223
    status: active
    text: >-
      ITAM SQL 식별자 — 테이블은 tcdms로 시작하는 이름 그대로 쓰고, 한글 컬럼 이름은 테이블 별칭을 붙일 때도
      백틱으로 감싼다. 칸 이름은 스키마에 적힌 철자를 그대로 쓴다(비슷한 말로 바꾸지 않는다).
      결과 별칭은 큰따옴표로 감싸지 않는다 — MariaDB에서 큰따옴표는 문자열이다. 별칭은 백틱으로 감싸거나
      따옴표 없는 영문 이름으로 쓴다.
  - id: s02-date-text
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      날짜 문자열 비교 — 이름이 년월일로 끝나는 칸(`취득년월일`·`유지보수계약종료년월일`·`하드웨어지원종료년월일` 등)은
      char 문자열이다(YYYYMMDD 추정). 칸 쪽을 날짜 함수나 CAST로 바꾸지 말고, 비교할 기준 시점을
      DATE_FORMAT(…, '%Y%m%d')로 같은 형식 문자열로 만들어 비교한다.
      「N개월 안에」는 오늘부터 N개월 뒤까지의 구간, 「이번 분기」는 분기 첫날부터 마지막 날까지의 구간이며
      두 경계를 모두 포함한다.
  # 이력: `tcdmsif72`–`tcdmsif41` 0행 조인 관측은 2회차(20261007-152223) 내부망 run이다. 쓴 칸을 모르는 이유는 반출 가림이다.
  - id: s03-join-keys
    origin: claude_code
    evidence: 20261007-152223
    status: active
    text: >-
      복합 연결 키는 모든 칸을 함께 건다(한 칸만 걸면 행이 불어난다). 정의 관계 기준 —
      서버 계열(`tcdmsif72`·`tcdmsif73`·`tcdmsif75`·`tcdmsif78`·`tcdmsif79`·`tcdmsif80`)은 `서버호스트명`·`IP주소내용`,
      자산 원장 `tcdmsif41`과 그 연결 테이블은 `물품분류번호`·`물품고유번호`,
      계약 물품 명세 `tcdmsif12`는 `계약번호`·`물품세부일련번호`, 스토리지 계열은 `시리얼번호`다.
      거의 모든 테이블에 있는 `그룹회사코드`도 연결 키에 함께 거는 것으로 본다(추정).
      서버 원장 `tcdmsif72`와 자산 원장 `tcdmsif41`의 조인은 조건 없이도 0행이었다(쓴 칸은 미확인 — 연결 키 미확정) — 서버 단위 자산·취득·유지보수 질문은
      `tcdmsif80` 하나로 답하고 자산 원장 계열과 잇지 않는다.
  # 이력: 3회차(20261007-174622)에 활성 칸에 같은 칸 등호 OR NULL 아님의 항진 조건을 걸었다 — 항진 조건 문장의 근거.
  - id: s04-code-columns
    origin: claude_code
    evidence: 20261007-174622
    status: active
    text: >-
      코드 칸 — 이름이 구분·여부로 끝나는 char 칸은 코드값이다(추정). 같은 테이블에 이름 칸(구분명)이 있으면
      조건과 표시는 이름 칸으로 한다(예: `tcdmsif41`의 `자산상태구분명`·`자산분류구분명`, `tcdmsif43`의 `자산유지보수구분명`).
      이름 칸이 없는 코드 칸(`tcdmsif80`의 `자산상태구분`·`노후교체기기구분`·`가상화서버매핑여부` 등)에 리터럴 조건을 거는 것은
      프롬프트의 「### 코드값」 블록에 그 칸이 있을 때만 한다 — 없으면 값을 지어내지 말고 그 칸으로 묶거나 그대로 보여 준다.
      이름 칸은 같은 테이블에 있을 때만 쓴다 — `tcdmsif80`에는 `자산상태구분명`이 없다.
      현행 원장의 `활성화여부`도 이 원칙을 따른다(활성 여부 규칙 참조). 블록이 없을 때 활성 칸 조건은 아예 쓰지 않는다 —
      같은 칸에 등호 조건과 NULL 아님 조건을 OR로 묶은 항진 조건도 쓰지 않는다(거르는 효과 없이 지어낸 값만 남는다).
  - id: s05-validity
    origin: claude_code
    evidence: 20261007-152223
    status: active
    text: >-
      유효 대상 확인 — 지금 유효한 계약·자산·부점을 물으면 해지·처분·폐점 칸이 있는지 보고 조건에 반영한다:
      유지보수 계약은 `유지보수계약해지년월일`, 계약은 `계약해지여부`, 계약 물품은 `물품해지여부`,
      자산은 `처분년월일`, 부점은 `폐점여부`. 해지·처분 일자 칸이 비어 있으면 아직 해지·처분되지 않은 것으로 본다(추정).
      여부 칸의 값은 프롬프트의 「### 코드값」 블록에 그 칸이 있을 때만 리터럴로 쓴다(활성 여부는 활성 여부 규칙 참조).
  - id: s06-name-resolution
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      이름 풀이 조인 — 결과에 부점명·직원명이 필요한데 그 테이블에 이름 칸이 없을 때만 조인한다.
      부점코드 칸은 `tcdmsbr01`의 `부점코드`, 직원번호 칸은 `tcdmshr01`의 `직원번호`로 푼다.
      원 테이블의 코드 칸은 비어 있을 수 있으므로(nullable) LEFT JOIN으로 원 행을 잃지 않는다.
      `tcdmsif80`은 `담당부점명`·`담당자직원명`·`자산보유부점명`을 이미 가진다.
  # 이력: 등호 조건 0행·서비스 이름 직접 부분 일치 0행·`tcdmsgt82` 대조의 행 반환은 2회차(20261007-152223)에 처음,
  # 3회차(20261007-174622)에 다시 관측했다(질문 문구를 서버 칸·`용도내용`·스토리지 업무명에 그대로 건 턴 모두 0행).
  # 4회차(20261008-133613 · plans/149 W1 · G-3 (a))에 순서를 뒤집었다 — 3회차 직접 일치 0행은 「문구 전체」를 건 결과였고,
  # 핵심어만 두 칸에 OR로 직접 건 턴은 행을 돌려줬으며, `tcdmsgt82` 두 단계를 탄 턴은 모두 0행이었다.
  # 같은 회차에 `용도내용`을 서비스 단서로 쓴 턴이 0행이었다 — 「용도를 지목할 때만」 문장의 근거.
  - id: s07-service-filter
    origin: claude_code
    evidence: 20261008-133613
    status: active
    text: >-
      서비스 이름 조건 — 서버 테이블에는 `어플리케이션코드` 칸이 없으므로 어플리케이션 코드로 서버를 거르지 않는다.
      1순위: 질문의 고유 핵심어를 서버 원장의 자유 기재 칸 `그룹경로내용`·`구성항목설명내용`에 OR로 묶어 LIKE 부분 일치로
      직접 건다(이렇게 건 조회가 행을 돌려줬다). 2순위: 1순위가 0행일 때만 `tcdmsgt82`의 `어플리케이션명`을 핵심어로
      부분 일치 조회해 서비스 이름을 찾고, 그 `어플리케이션명`을 같은 두 칸에 LIKE 부분 일치로 댄다(추정).
      서비스별로 묶는 집계는 처음부터 2순위 모양(`어플리케이션명`을 두 칸에 부분 일치로 대조해 묶음)으로 쓴다.
      질문 문구 전체를 서버 칸에 그대로 건 부분 일치는 0행이었다 — 핵심어만 건다.
      서버 원장의 `용도내용`은 질문이 용도를 지목할 때만 쓰고, 서비스 조건에는 쓰지 않는다.
      스토리지의 업무 이름은 현행 할당 `tcdmsif52`의 `업무명`으로 본다.
  - id: s08-numbers
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      수치·정렬 — 금액·수량·용량 칸(`취득금액`·`잔존장부금액`·`경과년수` 등)은 decimal이라 CAST 없이 정렬·집계한다.
      「상위 N」은 그 칸 내림차순 정렬 뒤 LIMIT N이다. 목록 질의에는 LIMIT을 둔다.
  # 이력: 수집 이력 `tcdmsif73`·`tcdmsif90`으로 만든 사용률 추이 SQL이 1회차(20261006-152938)·2회차(20261007-152223)
  # 연속 오답으로 판정됐다(관측 DB 정본 · D-308). 3회차(20261007-174622)에는 가상 서버 목록 질문의 선택 목록에
  # 사용률 칸을 실었다 — 목록 문장의 근거.
  - id: s09-utilization
    origin: claude_code
    evidence: 20261007-174622
    status: active
    text: >-
      사용률 — CPU·메모리·스토리지 사용률 칸(`서버CPU사용률`·`CPU사용률`·`메모리사용률` 등)으로 사용률·추이를 답하는 SQL은
      만들지 않는다(정본은 관측 DB). 수집 이력 `tcdmsif73`·`tcdmsif90`으로도 사용률 추이 SQL을 만들지 않는다.
      목록·현황 질문의 선택 목록에도 사용률 칸을 싣지 않는다(사용률은 관측 DB에서 본다).
  # 이력: 3회차(20261007-174622)에 업무·용도 이름을 등호·IN·질문 문구 전체로 건 턴이 모두 0행이었다.
  - id: s10-name-match
    origin: claude_code
    evidence: 20261007-174622
    status: active
    text: >-
      이름 칸 일치 — 업무명·용도·어플리케이션명 같은 이름 칸(`업무명`·`용도구분명`·`어플리케이션명` 등)은 등호나 IN으로 걸지 않고,
      질문 문구 전체를 넣지도 않는다. 질문에서 고유한 핵심어만 뽑아 LIKE 부분 일치로 건다.
      「서비스」「업무」「시스템」「스토리지」 같은 일반어는 검색어에서 뺀다.
