version: 1
items:
  - id: g01-families
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      자산관리(ITAM) DB는 MariaDB이며 테이블 이름은 tcdms 뒤에 업무 군 접두와 번호가 붙는다.
      tcdmsif 군은 전산기기 신청·계약·IP·장애·자산 원장·스토리지·네트워크·서버·가상화를,
      tcdmsam 군은 도입 대상·소프트웨어 사용 신청·라이선스·불법 소프트웨어 점검·전산 창고를,
      tcdmscm 군은 게시판·첨부 파일·관리자 메뉴·배치·공통코드(추정)·메시지·부점별 통계를,
      tcdmsgt 군은 월별 IP·기기 연계 현황과 어플리케이션(업무 시스템) 목록을,
      tcdmshr 군은 직원 인사 정보를, tcdmsbr 군은 부점(부서) 조직 정보를 담는다.
      조회는 조회 대상으로 등록된 테이블만 쓴다.
  - id: g02-kinds
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      같은 대상이 현행 원장·수집 이력·수집 적재본으로 나뉜 군이 있다(서버·스토리지·네트워크·가상화).
      지금 상태(현재 목록·대수)는 현행 원장으로 답한다 — 서버 `tcdmsif72`, 스토리지 `tcdmsif51`,
      스토리지 서버 할당 `tcdmsif52`, 네트워크 `tcdmsif61`, 서버 설치 소프트웨어 `tcdmsif75`,
      가상화 호스트 `tcdmsif89`, 가상 서버 `tcdmsif92`.
      수집 이력 테이블은 기준 일자마다 행을 보관하므로 과거 시점을 물을 때만 쓰고,
      수집 적재본은 현행 원장의 수집 원본이라 조회에 고르지 않는다.
  # 이력: 「자산 원장 계열과 잇지 않는다」의 근거는 g05의 2회차(72↔41 조건 없음 0행)·3회차(72↔43 기간 조건 동반 0행) 내부망 조인 관측이다.
  # 3회차(20261007-174622)에 `tcdmsif80`에 없는 `활성화여부`·`자산상태구분명`을 써 실행 오류가 났고,
  # 재시도는 `활성화여부`를 얻으려 `tcdmsif72`를 조인했다 — 「없는 칸」·「조인하지 않는다」 문장의 근거.
  # 4회차(20261008-133613)에 취득금액 상위 질문이 서버 원장 물품 키로 `tcdmsif41`을 이어 0행, `tcdmsif80` 단독으로
  # 다시 써 행을 얻었다(2·3·4회차 연속 0행) — 「물품 키로 잇지 않는다」·서비스 조건 예외 문장의 근거.
  - id: g03-server
    origin: claude_code
    evidence: 20261008-133613
    status: active
    text: >-
      서버 원장은 `tcdmsif72`다 — 호스트명·IP·운영 환경·용도·설치 지역·운영체제·벤더/모델·CPU/메모리/디스크
      사양·담당 부점/직원을 가지며 `활성화여부` 칸이 있다.
      `tcdmsif80`은 서버 통합 현황으로 서버별 운영체제·모델·담당자/부점·자산(물품·취득·잔존 장부금액·상태·노후
      교체)·구매/유지보수 계약을 한 행에 모은 마트 성격(추정)이다. `tcdmsif80`에는 `활성화여부`·`자산상태구분명` 칸이 없다 —
      자산 상태는 이름 칸 없이 코드 칸 `자산상태구분`만 있다. `서버호스트명`·`IP주소내용`도 `tcdmsif80`에 있다.
      서버 단위 취득금액·취득일·경과 연수·유지보수 계약 기간은 `tcdmsif80` 하나로 답한다 — `취득금액`·`취득년월일`·`경과년수`,
      `유지보수계약시작년월일`·`유지보수계약종료년월일`·`유지보수계약해지년월일`. 이렇게 `tcdmsif80`만으로 답하는 질문에
      서버 원장 `tcdmsif72`를 조인하지 않고(서비스 조건이 함께 있을 때만 잇는다 — 아래 자산 항목),
      물품 키로 자산 원장 계열과도 잇지 않는다(아래 자산 항목의 관측).
      운영체제별 집계는 `운영체제타입내용`(버전은 `운영체제버전내용`)을 축으로 한다. 「N년 이상」은 경계를 포함한다.
      서버 설치 소프트웨어는 `tcdmsif75`, 수집 서버와 자산 원장의 매핑 결과는 `tcdmsif78`이다.
  # 이력: 세 칸 조인이 행을 돌려준 관측은 2회차(20261007-152223) 내부망 run이다. 쓴 칸을 모르는 이유는 반출 가림이다.
  - id: g04-eos
    origin: claude_code
    evidence: 20261007-152223
    status: active
    text: >-
      서버 지원 종료(EOS)일은 `tcdmsif79`의 `하드웨어지원종료년월일`·`소프트웨어지원종료년월일` 두 칸이다.
      서버 원장과는 `서버호스트명`·`IP주소내용`으로 잇고(정의 관계), 양쪽에 모두 있는 `그룹회사코드`까지 세 칸을
      함께 건다(추정) — `tcdmsif72`와 세 칸으로 이은 조인은 행을 돌려줬다(쓴 칸은 미확인).
      하드웨어·소프트웨어를 특정하지 않은 지원 종료 질문은 두 칸 중 하나라도 조건에 드는 행을 고른다(OR).
      스토리지 장비의 지원 종료는 `tcdmsif58`(`시리얼번호`로 `tcdmsif51`과 연결)이고, 네트워크 장비는
      `tcdmsif61`의 `하드웨어지원종료내용`·`소프트웨어지원종료내용`(문자열 기재)이다.
  # 이력: `tcdmsif72`↔`tcdmsif41` 조건 없는 0행은 2회차(20261007-152223) 내부망 run(쓴 칸은 반출 가림으로 미확인),
  # `tcdmsif72`↔`tcdmsif43`을 물품 두 칸과 `그룹회사코드`로 이은 0행(기간 조건 동반)은 3회차(20261007-174622) run이다.
  # 4회차(20261008-133613)에 `tcdmsif72`↔`tcdmsif41` 물품 키 조인이 다시 0행이었고, 매핑 `tcdmsif78`을 거쳐
  # `tcdmsif41`·`tcdmsif43`으로 이은 4단 조인도 서비스 조건(같은 조건 단독은 행 반환)과 함께 0행이었다 —
  # 「78 경유 후보」 문장을 걷고 `tcdmsif80` 단독 + 서비스 조건 때만 `서버호스트명` 연결로 바꿨다(행 배수는 탐침 P07).
  - id: g05-asset-maintenance
    origin: claude_code
    evidence: 20261008-133613
    status: active
    text: >-
      전산 자산 원장은 `tcdmsif41`이며 자산 한 건은 `물품분류번호`와 `물품고유번호` 두 칸으로 가리킨다(추정).
      서버 원장 `tcdmsif72`도 이 두 칸을 가진다. 그러나 서버 원장에서 물품 키로 `tcdmsif41`·`tcdmsif43`에 잇는 조인은
      매핑 `tcdmsif78`을 거친 경우까지 모두 0행이었고 두 원장의 연결 키는 미확정이다 — 서버 단위 질문에는 이 연결을 쓰지 않는다.
      서버 단위 유지보수 계약·취득금액·취득일은 `tcdmsif80` 한 테이블로 답한다 — 계약 칸
      `서버유지보수계약번호`·`유지보수계약시작년월일`·`유지보수계약종료년월일`·`유지보수계약해지년월일`, 취득 칸 `취득금액`·`취득년월일`.
      서비스 조건이 함께 필요하면 `tcdmsif80`과 서버 원장 `tcdmsif72`를 `서버호스트명`과 `그룹회사코드`로 잇고 서비스 조건은
      `tcdmsif72` 쪽에 건다(추정 — 한 서버에 행이 여럿이면 결과 행이 불어날 수 있다).
      자산 원장 기준의 자산별 유지보수 계약은 `tcdmsif43`(`유지보수계약시작년월일`·`유지보수계약종료년월일`·`유지보수계약해지년월일`)이다.
      계약 원장은 `tcdmsif11`, 계약별 물품 명세는 `tcdmsif12`(`계약번호`·`물품세부일련번호`로 연결)다.
      자산 전출입 이력은 `tcdmsif42`, 물품 분류 기준은 `tcdmsif46`이다.
  # 이력: 등호 0행·직접 부분 일치 0행·`tcdmsgt82` 대조 집계의 행 반환은 2회차(20261007-152223)에 처음 관측했고,
  # 3회차(20261007-174622)에 질문 문구를 서버 자유 기재 칸·`용도내용`·스토리지 업무명에 그대로 건 턴이 모두 0행,
  # `tcdmsgt82` 대조 집계만 행을 돌려줬다. `용도내용`에 서비스 핵심어 자체가 없음도 3회차 관측이다.
  # 4회차(20261008-133613 · plans/149 W1 · G-3 (a))에 순서를 뒤집었다 — 3회차의 직접 일치 0행은 「문구 전체」를 건
  # 결과였고, 4회차에 핵심어만 두 칸에 OR로 직접 건 턴이 행을 돌려준 반면 `tcdmsgt82` 두 단계를 탄 턴은 모두 0행이었다.
  # 서비스별 집계(`어플리케이션명` 대조)는 4회차에도 행을 돌려줬다. `용도내용`을 서비스 단서로 쓴 턴(위반)도 0행이었다.
  # 85행의 정답 여부는 탐침·오라클로 확정할 후보다(plans/149 W6).
  - id: g06-service
    origin: claude_code
    evidence: 20261008-133613
    status: active
    text: >-
      서비스(업무 시스템) 목록은 어플리케이션 테이블 `tcdmsgt82`(`어플리케이션코드`·`어플리케이션명`)이다.
      서버 테이블(`tcdmsif72`·`tcdmsif80`)에는 `어플리케이션코드` 칸이 없으므로 서비스와 서버를 코드로 바로 잇지 못한다.
      서비스 이름으로 서버를 찾을 때는 순서대로 푼다. 1순위 — 질문에서 고유한 핵심어만 뽑아 서버 원장 `tcdmsif72`의
      자유 기재 칸 `그룹경로내용`·`구성항목설명내용`에 OR로 묶어 LIKE 부분 일치로 직접 건다(이렇게 건 조회가 행을 돌려줬다).
      2순위 — 1순위가 0행일 때만 `tcdmsgt82`의 `어플리케이션명`에서 핵심어를 부분 일치로 찾고, 찾은 `어플리케이션명`을
      같은 두 칸에 부분 일치로 댄다(추정). 서비스별 서버 수처럼 서비스마다 묶는 집계는 처음부터 2순위 모양으로 쓴다 —
      `어플리케이션명`을 서버 두 칸에 부분 일치로 대조해 묶은 집계는 행을 돌려줬다.
      질문 문구 전체를 서버 칸에 그대로 건 조회(등호·부분 일치 모두)는 0행이었다.
      서버 원장의 `용도내용`은 서비스 단서로 쓰지 않는다 — 질문이 용도를 지목할 때만 쓴다.
      스토리지의 업무 이름은 현행 할당 `tcdmsif52`의 `업무명`이다(수집 이력이 아니다). `tcdmsif52`는 `호스트명`으로
      서버 원장의 `서버호스트명`과 잇는다(정의 관계).
  - id: g07-org-person
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      부서(부점)는 사람과 다른 칸이다. 담당 부서를 물으면 `담당부점코드`·`담당부점명` 같은 부점 칸을 고르고
      `담당자직원번호`·`담당자직원명` 같은 사람 칸을 고르지 않는다.
      다른 테이블의 부점코드 칸은 부점 정보 `tcdmsbr01`의 `부점코드`로 부점명을 풀고, 직원번호 칸은 직원 인사 정보
      `tcdmshr01`의 `직원번호`로 이름을 푼다.
  # 이력: 2회차(20261007-152223)에 「### 코드값」 블록 없이 활성 조건 값을 턴마다 다르게 지어냈다
  # (건 칸은 반출 가림이라 `활성화여부`로 추정) — `활성화여부`도 같다는 규칙의 근거.
  - id: g08-virtual
    origin: claude_code
    evidence: 20261007-152223
    status: active
    text: >-
      가상화는 데이터센터 `tcdmsif83` → 군집 `tcdmsif86` → 호스트(물리 서버) `tcdmsif89` → 가상 서버(VM) `tcdmsif92`
      순으로 이어지고, VM별 IP 목록은 `tcdmsif94`다. `tcdmsif92`의 `서버호스트명`은 서버 원장의 `서버호스트명`과
      대응한다(정의 관계). 서버 통합 현황 `tcdmsif80`의 `가상화서버참조ID`·`가상화서버매핑여부`도 가상 서버 연결
      후보다(추정). 여부·구분 코드 칸으로 거를 때는 프롬프트의 「### 코드값」 블록에 그 칸이 없으면 값을 지어내지 않는다 — `활성화여부`도 같다.
  # 이력: 사용률 추이 질문을 1회차(20261006-152938)는 `tcdmsif90`, 2회차(20261007-152223)는 `tcdmsif73`으로
  # ITAM SQL을 만들어 답해 두 회차 모두 오답으로 판정됐다(정본은 관측 DB · D-308).
  - id: g09-utilization
    origin: claude_code
    evidence: 20261007-152223
    status: active
    text: >-
      서버·가상화 테이블에 CPU·메모리·스토리지 사용률 칸이 있지만 사용률의 정본이 아니다 — 사용률·추이 질문은
      ITAM SQL을 만들지 않고 관측 DB로 넘긴다.
      서버 수집 이력 `tcdmsif73`과 가상화 호스트 수집 이력 `tcdmsif90`도 같다 — 사용률 추이를 이 이력으로 답하지 않는다.
