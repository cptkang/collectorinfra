version: 1
items:
  - id: g01-families
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      자산관리(ITAM) DB는 MariaDB이며 테이블 이름은 tcdms 뒤에 업무 군 접두와 번호가 붙는다.
      tcdmsif 군은 전산기기 신청·계약·IP·장애·자산 원장·스토리지·네트워크·서버·가상화를,
      tcdmsam 군은 도입 대상·소프트웨어 사용 신청·라이선스·불법 소프트웨어 점검·전산 창고를,
      tcdmscm 군은 게시판·첨부 파일·관리자 메뉴·배치·공통코드(추정)·메시지·부점별 통계를,
      tcdmsgt 군은 월별 IP·기기 연계 현황과 어플리케이션(업무 시스템) 목록을,
      tcdmshr 군은 직원 인사 정보를, tcdmsbr 군은 부점(부서) 조직 정보를 담는다.
      조회는 조회 대상으로 등록된 테이블만 쓴다.
  - id: g02-kinds
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      같은 대상이 현행 원장·수집 이력·수집 적재본으로 나뉜 군이 있다(서버·스토리지·네트워크·가상화).
      지금 상태(현재 목록·대수)는 현행 원장으로 답한다 — 서버 `tcdmsif72`, 스토리지 `tcdmsif51`,
      스토리지 서버 할당 `tcdmsif52`, 네트워크 `tcdmsif61`, 서버 설치 소프트웨어 `tcdmsif75`,
      가상화 호스트 `tcdmsif89`, 가상 서버 `tcdmsif92`.
      수집 이력 테이블은 기준 일자마다 행을 보관하므로 과거 시점을 물을 때만 쓰고,
      수집 적재본은 현행 원장의 수집 원본이라 조회에 고르지 않는다.
  - id: g03-server
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      서버 원장은 `tcdmsif72`다 — 호스트명·IP·운영 환경·용도·설치 지역·운영체제·벤더/모델·CPU/메모리/디스크
      사양·담당 부점/직원·자산 키를 가지며 `활성화여부` 칸이 있다.
      `tcdmsif80`은 서버 통합 현황으로 서버별 운영체제·모델·담당자/부점·자산(물품·취득·잔존 장부금액·상태·노후
      교체)·구매/유지보수 계약을 한 행에 모은 마트 성격(추정)이라, 서버 단위 질문은 이 테이블 하나로 답할 수 있는
      경우가 많다. 다만 `tcdmsif80`에는 `활성화여부` 칸이 없다.
      운영체제별 집계는 `운영체제타입내용`(버전은 `운영체제버전내용`)을 축으로 한다.
      취득금액·취득일·경과 연수는 `tcdmsif80`의 `취득금액`·`취득년월일`·`경과년수`, 자산 원장 `tcdmsif41`의
      `취득금액`·`취득년월일`에 있다. 「N년 이상」은 경계를 포함한다.
      서버 설치 소프트웨어는 `tcdmsif75`, 수집 서버와 자산 원장의 매핑 결과는 `tcdmsif78`이다.
  - id: g04-eos
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      서버 지원 종료(EOS)일은 `tcdmsif79`의 `하드웨어지원종료년월일`·`소프트웨어지원종료년월일` 두 칸이다.
      서버 원장과는 `서버호스트명`·`IP주소내용`으로 잇고(정의 관계), 양쪽에 모두 있는 `그룹회사코드`까지 세 칸을
      함께 거는 복합 키로 본다(추정).
      하드웨어·소프트웨어를 특정하지 않은 지원 종료 질문은 두 칸 중 하나라도 조건에 드는 행을 고른다(OR).
      스토리지 장비의 지원 종료는 `tcdmsif58`(`시리얼번호`로 `tcdmsif51`과 연결)이고, 네트워크 장비는
      `tcdmsif61`의 `하드웨어지원종료내용`·`소프트웨어지원종료내용`(문자열 기재)이다.
  - id: g05-asset-maintenance
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      전산 자산 원장은 `tcdmsif41`이며 자산 한 건은 `물품분류번호`와 `물품고유번호` 두 칸으로 가리킨다(추정 —
      다른 테이블의 두 칸이 이 원장을 가리키는 것으로 보이나 값 겹침은 미확인). 서버 원장 `tcdmsif72`도 이 두 칸을 가진다.
      자산별 유지보수 계약은 `tcdmsif43`(`유지보수계약시작년월일`·`유지보수계약종료년월일`·`유지보수계약해지년월일`)이고,
      서버 단위로는 `tcdmsif80`에도 같은 이름의 유지보수 계약 기간 칸이 있다.
      계약 원장은 `tcdmsif11`, 계약별 물품 명세는 `tcdmsif12`(`계약번호`·`물품세부일련번호`로 연결)다.
      자산 전출입 이력은 `tcdmsif42`, 물품 분류 기준은 `tcdmsif46`이다.
  - id: g06-service
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      서비스(업무 시스템) 목록은 어플리케이션 테이블 `tcdmsgt82`(`어플리케이션코드`·`어플리케이션명`)이다.
      서버 테이블(`tcdmsif72`·`tcdmsif80`)에는 `어플리케이션코드` 칸이 없으므로 서비스와 서버를 코드로 바로 잇지 못한다.
      서비스 이름으로 서버를 찾을 때의 후보 칸은 서버 원장의 `그룹경로내용`·`용도내용`·`구성항목설명내용`과
      스토리지 할당 `tcdmsif52`의 `업무명`이다(어느 칸에 서비스 이름이 들어 있는지는 값 미확인 — 추정).
      `tcdmsif52`는 `호스트명`으로 서버 원장의 `서버호스트명`과 잇는다(정의 관계).
      후보 칸은 자유 기재 문자열이라 서비스 이름은 부분 일치 조건이 필요할 수 있다(추정).
  - id: g07-org-person
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      부서(부점)는 사람과 다른 칸이다. 담당 부서를 물으면 `담당부점코드`·`담당부점명` 같은 부점 칸을 고르고
      `담당자직원번호`·`담당자직원명` 같은 사람 칸을 고르지 않는다.
      다른 테이블의 부점코드 칸은 부점 정보 `tcdmsbr01`의 `부점코드`로 부점명을 풀고, 직원번호 칸은 직원 인사 정보
      `tcdmshr01`의 `직원번호`로 이름을 푼다.
  - id: g08-virtual
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      가상화는 데이터센터 `tcdmsif83` → 군집 `tcdmsif86` → 호스트(물리 서버) `tcdmsif89` → 가상 서버(VM) `tcdmsif92`
      순으로 이어지고, VM별 IP 목록은 `tcdmsif94`다. `tcdmsif92`의 `서버호스트명`은 서버 원장의 `서버호스트명`과
      대응한다(정의 관계). 서버 통합 현황 `tcdmsif80`의 `가상화서버참조ID`·`가상화서버매핑여부`도 가상 서버 연결
      후보다(추정). 여부·구분 코드 칸으로 거를 때는 코드값 안내가 없으면 값을 지어내지 않는다.
  - id: g09-utilization
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      서버·가상화 테이블에 CPU·메모리·스토리지 사용률 칸이 있지만 사용률의 정본이 아니다 — 사용률·추이 질문은
      ITAM에서 답하지 않고 관측 DB로 넘긴다.
      1회차에 사용률 추이 질문을 가상화 호스트 수집 이력 `tcdmsif90`으로 답한 것은 오답으로 판정됐다(관측 DB 정본).
  - id: g10-dialect
    origin: claude_code
    evidence: 20261006-152938
    status: active
    text: >-
      MariaDB 방언 — 행 제한은 LIMIT이고 한글 테이블·컬럼 식별자는 백틱으로 감싼다.
      이름이 년월일·년월로 끝나는 날짜 칸은 char 문자열이다(형식은 이름 기준 YYYYMMDD·YYYYMM 추정).
      금액·수량·용량 칸은 숫자형(decimal)이다.
