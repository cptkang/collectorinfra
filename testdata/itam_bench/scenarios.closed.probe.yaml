    title: "탐침 P01 — 서비스 핵심어 → 어플리케이션 목록의 이름 (실행하지 않는 질문)"
    category: probe
    env: [closed]
    traps: []
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "탐침 P01 전용 — 시스템에 보내지 않는다"}
