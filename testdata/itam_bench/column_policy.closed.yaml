      자산유지보수구분, 서버운영환경구분, 경과년수, 노후교체기기구분, 자산상태구분,
      유지보수계약시작년월일, 유지보수계약종료년월일, 유지보수계약해지년월일,
      자산매핑여부, 자산보유부점코드, 자산보유부점명, 창고자산여부,
      # 논리명≠ 자산분류구분·세부자산분류구분(각 「… 구분코드」)
      자산분류구분, 자산분류구분명, 세부자산분류구분, 세부자산분류구분명,
      유지보수희망년월, 무상시작년월일, 무상종료년월일,
      시스템등록처리일시, 시스템최종처리일시,
    ]
    # 식별자류(G-1 (b)) — 서버호스트명(논리명≠ 해당 서버의 호스트 명)·가상화·군집 ID · 번호류
    # (시리얼번호 논리명≠ 시리얼번호 내용)
    identifier: [
