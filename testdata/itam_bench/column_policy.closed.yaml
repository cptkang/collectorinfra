      물품분류번호, 물품고유번호, 구매계약번호, 구매물품세부일련번호,
      서버유지보수계약번호, 유지보수물품세부일련번호, 시리얼번호,
    ]
    network: [IP주소내용]  # 논리명≠ (해당 서버의 ip 주소)
    amount: [취득금액, 유지보수계약금액, 잔존장부금액]
    # 계약명(공급사명 포함 가능)·용도·구성 설명 — 사람 이름·연락처가 섞일 수 있는 서술형
    free_text: [물품사용용도내용, 구매계약명, 유지보수계약명, 구성항목설명내용]
