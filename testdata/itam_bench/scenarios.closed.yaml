# ITAM 질의 벤치 시나리오 — 폐쇄망(운영) 1회차 초안 (plans/135 W8 · G-1 · D-301 ①)
#
# ★ **초안 · 사용자 검토 대기**(2026-10-06 인터뷰 G-1 — 「우리가 운영 시나리오 초안을 쓰고 사용자가
#   검토한다」). 자산관리 포탈 사용자가 칠 법한 말로 썼다. 테이블·컬럼·SQL 용어·사람 이름은 넣지 않는다
#   (로더 린트 + 실행 시 운영 카탈로그 기준 린트).
#
# **1회차 = 관찰**(G-7 답 — 2026-10-06): 운영 108테이블 중 서비스↔서버 연결이 어디 있는지 아직 모른다.
# 그래서 전부 `observe`다(정답 대조 없음). 관찰 턴에서도 시스템이 조회한 테이블·컬럼(가린 SQL)·행 수·
# 스키마 맥락이 반출 로그에 남는다 → 반출 뒤 우리가 연결 위치를 찾아 정답 SQL 을 쓰고, 2회차부터
# `oracle`로 바꿔 자동 대조한다(정답 SQL 은 `testdata/scenarios/oracles/ITAM-1NN.mariadb.sql`).
#
# `no_data: false` — 운영에는 데이터가 있을 수 있어 「지어냄」 판정을 하지 않는다(범위 밖 질문만 true).
# 실행: `python -m scripts.itam_bench --run --env closed` (이 파일·`column_policy.closed.yaml`이 기본값).
#
# **4회차 = 오라클 7건 전환**(plans/146 W5 (1) · G-4 (a) · 2026-10-08): 3회차(`results/itam_bench/20261007-174622`)
# 관찰로 정답 모양이 정해진 ITAM-107·108·109·110·111·112·116을 `oracle`로 바꿨다(정답 SQL
# `testdata/scenarios/oracles/ITAM-1NN.mariadb.sql` — 값 리터럴 없음 · 날짜는 앵커 자리표). 모의 DB(합성 행)에서는
# 구문·실행만 확인했다 — **내부망 `--check-oracle --env closed`에서 0행·오류가 나면 그 시나리오는 `observe`로
# 되돌린다.** 서비스 개념(101~106·115·117·118)과 113은 관찰 유지 — 연결 위치 탐침
# (`scenarios.closed.probe.yaml`) 결과로 5회차 오라클을 쓴다.
# 판정 키 `host_key`: 폐쇄망 열 이름은 `서버호스트명`이고 폐쇄망 정책(`column_policy.closed.yaml`)에는 없다
# (unclassified). 로더 린트가 정책에 있는 general 이름을 하나 이상 요구해 샌드박스 이름 `sevrHostName`을 같은 뜻
# 후보로 함께 둔다 — 실행 시 시스템 쪽 키 열 등급이 general이 아니면 키 값은 건수로만 남는다(`keys_recorded`).
version: 1
db_id: itam

aliases:
  # server_hostname·server_host는 3회차 시스템 SQL이 서버호스트명에 붙인 결과 열 별칭(ITAM-106 t1 · ITAM-118 —
  # trace executed_sqls · plans/146 W5 교정 2) — 없으면 keyset이 판정 대신 hold
  host_key: &host_key [서버호스트명, sevrHostName, 호스트명, 서버명, 호스트, 서버, hostname, host_name, server_name,
    server_hostname, server_host, host]

scenarios:
  - id: ITAM-101
    title: "서비스 → 서버리스트 (사용자 예시 원문) · 초안"
    category: service
    env: [closed]
    traps: [service_concept]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리 시스템에서 통합인증 서비스의 서버리스트를 보여줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "서비스와 서버를 어느 테이블·컬럼으로 잇는가 · 결과 건수 — 2회차 정답 SQL 의 재료"
            no_data: false

  - id: ITAM-102
    title: "서비스 서버의 담당 부서 · 초안"
    category: service
    env: [closed]
    traps: [service_concept, org_not_person]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "통합인증 서비스 서버들 담당 부서 알려줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "서비스 연결 + 담당 부점(조직) 컬럼을 고르는가 · 사람 컬럼을 고르지 않는가"
            no_data: false

  - id: ITAM-103
    title: "서비스 서버 중 지원 종료 임박 · 초안"
    category: service
    env: [closed]
    traps: [service_concept, join_3col, date_text]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리에서 인터넷뱅킹 시스템 서버 중에 6개월 안에 지원 종료되는 서버 알려줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "서비스 연결 + 지원 종료일 테이블 조인(복합 키) · 날짜 문자열 비교"
            no_data: false

  - id: ITAM-104
    title: "서비스별 서버 수 · 초안"
    category: service
    env: [closed]
    traps: [service_concept, group_aggregate]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리 시스템에서 서비스별 서버 수 알려줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "서비스 단위를 무엇으로 보는가(코드·이름) · 집계 대상 테이블"
            no_data: false

  - id: ITAM-105
    title: "서비스 서버의 유지보수 계약 만료일 · 초안"
    category: service
    env: [closed]
    traps: [service_concept, date_text]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "통합인증 서비스 서버들의 유지보수 계약 만료일 알려줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "서비스 연결 + 유지보수 계약 컬럼"
            no_data: false

  - id: ITAM-106
    title: "멀티턴 — 서비스 서버의 지원 종료일 · 초안"
    category: multiturn
    env: [closed]
    traps: [service_concept, succession]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리에서 통합인증 서비스 서버 목록 보여줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "1턴 서비스 서버 목록"
            no_data: false
      - send: {query: "그 서버들 지원 종료일도 알려줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "앞 턴 서버를 승계해 지원 종료일을 붙이는가"
            no_data: false

  - id: ITAM-107
    title: "등록 서버 수 · 초안"
    category: inventory
    env: [closed]
    traps: []
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리 시스템에 등록된 서버 몇 대야?"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다(plans/146 W5 (1)) · 관찰 메모: 서버 자산의 기준 테이블을 무엇으로 보는가
          # 건수 질문 — 1행 값으로 대조, 목록으로 답하면 행 수로(count_rows_ok · ITAM-19와 같은 모양)
          count_rows_ok: true
          oracle:
            id: ITAM-107
            compare: value
            value: [n, 서버수, 서버 수, 대수, 건수, count, cnt, server_count]
            db_ids: [itam]

  - id: ITAM-108
    title: "이번 분기 유지보수 계약 만료 · 초안"
    category: maintenance
    env: [closed]
    traps: [date_text, quarter_boundary]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "이번 분기에 유지보수 계약이 끝나는 서버 있어?"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다(plans/146 W5 (1)) · 관찰 메모: 날짜 문자열 비교 · 분기 경계
          # tcdmsif80 마트 가설 — 탐침 ITAM-146-P07B(80↔72 행 배수)와 함께 확인
          oracle: {id: ITAM-108, compare: keyset, key: [*host_key], db_ids: [itam]}

  - id: ITAM-109
    title: "6개월 내 지원 종료 · 초안"
    category: eol
    env: [closed]
    traps: [join_3col, or_condition, date_text]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "6개월 안에 지원 종료(EOS)되는 서버 알려줘"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다(plans/146 W5 (1)) · 관찰 메모: 지원 종료일 테이블 · 하드웨어/소프트웨어 OR
          oracle: {id: ITAM-109, compare: keyset, key: [*host_key], db_ids: [itam]}

  - id: ITAM-110
    title: "노후 5년 이상 · 초안"
    category: lifecycle
    env: [closed]
    traps: [boundary_inclusive]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리에서 도입한 지 5년 이상 된 노후 서버 리스트 보여줘"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다(plans/146 W5 (1)) · 관찰 메모: 경과년수·취득일자 중 무엇을 쓰는가 · 경계 포함
          # G-4: 정답 기준 칸은 취득일자(대안 경과년수) · tcdmsif80 마트 가설
          oracle: {id: ITAM-110, compare: keyset, key: [*host_key], db_ids: [itam]}

  - id: ITAM-111
    title: "취득금액 상위 3 · 초안"
    category: amount
    env: [closed]
    traps: [order_limit]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리에서 취득금액 제일 큰 서버 3대랑 금액 보여줘"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다(plans/146 W5 (1)) · 관찰 메모: 금액 칸 · 정렬과 행 제한(금액은 합계·최소·최대만 기록)
          # G-4: 서버 단위 금액(tcdmsif80) 해석 — 상위 N은 동점을 흡수하는 argmax(샌드박스 ITAM-13과 같은 모양)
          oracle:
            id: ITAM-111
            compare: argmax
            top: 3
            key: [*host_key]
            value: [취득금액, acqsiAmt, 금액, 취득 금액, acquisition_amount, amount]
            db_ids: [itam]

  - id: ITAM-112
    title: "운영체제별 서버 수 · 초안"
    category: spec
    env: [closed]
    traps: [group_aggregate]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리 시스템에서 운영체제별 서버 수 알려줘"}
        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다(plans/146 W5 (1)) · 관찰 메모: 운영체제 칸 · 그룹 집계
          # 운영체제 칸은 폐쇄망 정책 밖(unclassified)이라 키로 쓰지 않는다 — 그룹 수(count)로 대조
          oracle: {id: ITAM-112, compare: count, db_ids: [itam]}

  - id: ITAM-113
    title: "가상 서버 — 코드값 · 초안"
    category: code_value
    env: [closed]
    traps: [code_value]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리에서 가상 서버로 등록된 서버 목록 보여줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "여부 코드값을 지어내는가 · 승인 코드값(A4)을 쓰는가"
            no_data: false

  - id: ITAM-114
    title: "범위 밖 — 사용률 추이 · 초안"
    category: out_of_scope
    env: [closed]
    traps: [scope_t5]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리에서 지난주 CPU 사용률 추이 보여줘"}
        expect:
          observe:
            what: "자산 DB 스냅숏으로 추이를 꾸며내지 않는가(관측 DB로 넘기거나 없음을 말하면 정상)"
            no_data: true

  # ── 2회차 관찰 추가 — 서비스↔서버 연결 단서(plans/139 W7 · §4.2 · 2026-10-06) ──────────────
  # 1회차는 ITAM SQL 0건이라 연결 위치를 찾지 못했다(plans/139 §1). 서버 원장에는 어플리케이션 코드 칸이 없고,
  # 후보는 서버의 용도·분류 경로·구성 설명 기재와 스토리지 할당의 업무 이름이다(시드 정의 `notes`). 아래 4건은
  # 그 후보를 하나씩 건드리는 관찰 질문이다 — 반출 뒤 어느 칸에 서비스 이름이 실제로 들어 있는지 보고 정답 SQL을 쓴다.

  - id: ITAM-115
    title: "서비스 단서 — 서버 용도 기재 · 2회차 관찰 초안"
    category: service
    env: [closed]
    traps: [service_concept]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리에서 용도에 통합인증이 적힌 서버 목록 보여줘"}
        expect:
          db_ids: [itam]
          observe:
            what: "서버 원장의 용도·구성 설명 칸을 서비스 단서로 거는가 · 현행 원장을 고르는가(적재본·수집 이력 아님) · 결과 건수"
            no_data: false

  - id: ITAM-116
    title: "서비스 단서 — 서버 분류 경로별 분포 · 2회차 관찰 초안"
    category: service
    env: [closed]
