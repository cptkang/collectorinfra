        expect:
          db_ids: [itam]
          # 내부망 --check-oracle에서 0행·오류면 observe로 되돌린다(plans/146 W5 (1)) · 관찰 메모: 서버 분류 경로 칸을 집계 축으로 고르는가
          # 경로 값에 업무 이름이 섞일 수 있어 키로 쓰지 않는다 — 그룹 수(count)로 대조
