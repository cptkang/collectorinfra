  - id: ITAM-118
    title: "서비스 단서 — 스토리지 업무 → 서버 연결 · 2회차 관찰 초안"
    category: service
    env: [closed]
    traps: [service_concept]
    key_columns: []
    gold_tables: []
    turns:
      - send: {query: "자산관리에서 통합인증 업무 스토리지를 쓰는 서버들의 운영체제 알려줘"}
