# Text-to-SQL EX 골드셋 — 은행존 폴스타 (polestar_b0, DB2 레거시)
# Plan 61 / E1(D-072). DB2 방언: 스키마 접두사 POLESTAR. / 행 제한 FETCH FIRST n ROWS ONLY /
#   소수 보존은 집계 전 CAST(... AS DOUBLE) — 고정 정밀도 DECIMAL(15,4)는 범위 밖 쓰레기 값에서
#   SQL0413N 변환 오버플로(D-086). PostgreSQL ::numeric 금지(Known Mistakes 2026-07-09).
# 1차 소스: config/db_profiles/polestar_b0.yaml 의 query_examples.
#
# 2026-07-20 실측 정비(D-072 후속): platform.server%(실 DB 0행 관행)→server.Server,
#   절단성 FETCH FIRST 제거, 사용률 골드에 D-086 값 게이트(BETWEEN 0 AND 1000)·DOUBLE 캐스트 반영
#   (b0 실측: resource 37339 쓰레기 행 max=5.5e13·avg=1.2e9 + 음수 21행 — 게이트 없으면 골드가 오염).
#   본 정비분은 초안이며 `--check-gold` 실측 통과 후 확정한다.

items:
  - id: b0-001
    query: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
    db_id: polestar_b0
    category: server_config
    coverage: inside
    gold_sql: |
      SELECT
        r.hostname,
        cc_ostype.stringvalue_short AS os_type,
        cc_vendor.stringvalue_short AS vendor
      FROM POLESTAR.cmm_resource r
      LEFT JOIN POLESTAR.core_config_prop cc_ostype
        ON r.resource_conf_id = cc_ostype.configuration_id AND cc_ostype.name = 'OSType'
      LEFT JOIN POLESTAR.core_config_prop cc_vendor
        ON r.resource_conf_id = cc_vendor.configuration_id AND cc_vendor.name = 'Vendor'
      WHERE r.resource_type = 'server.Server'
        AND r.dtime IS NULL;
    gold_result_signature:
      row_count: null
      columns: [hostname, os_type, vendor]
    notes: "DB2 방언 — POLESTAR. 스키마 접두사. gp-001과 의미 동일, 방언만 상이. 2026-07-20 실측 정비: platform.server%(0행)→server.Server, FETCH FIRST 절단 제거. 2026-07-21 실측: b0는 2337행이라 pred 기본 LIMIT(1000)에 절단(rows 2337/1000, yd/gp는 1000행 미만이라 미발현) → 질의에 '전체' 명시(resolve_query_limit 상향 키워드)로 전량 조회 의도를 명확화."

  - id: b0-002
    query: "서버 수를 조회해줘"
    db_id: polestar_b0
    category: server_config
    coverage: inside
    gold_sql: |
      SELECT COUNT(*) AS server_count
      FROM POLESTAR.cmm_resource r
      WHERE r.resource_type = 'server.Server'
        AND r.dtime IS NULL;
    gold_result_signature:
      row_count: 1
      columns: [server_count]
    notes: "DB2 단순 집계. 2026-07-20 실측 정비: platform.server%→server.Server. 2026-07-21 실측: COUNT 값 불일치(미일치 server_count) — 프로필 few-shot 3곳이 구 관행 LIKE 'platform.server%'로 잔존해 폴백 LLM이 다른 모수를 집계. 프로필 3종(b0/gp/yd) 예시를 server.Server로 스윕(골드만 정비하고 예시를 안 고친 비대칭 해소)."

  - id: b0-003
    query: "전체 서버별 서버이름, 호스트네임, IP, 시리얼번호, CPU모델, CPU코어수, 메모리를 조회해줘"
    db_id: polestar_b0
    category: complex
    coverage: inside
    gold_sql: |
      SELECT
          MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.name      END) AS server_name,
          MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.hostname  END) AS hostname,
          MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.ipaddress END) AS ipaddress,
          MAX(CASE WHEN c.resource_type = 'server.Server' AND cc.name = 'SerialNumber' THEN cc.stringvalue_short END) AS serialnumber,
          MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND cc.name = 'MODEL'        THEN cc.stringvalue_short END) AS cpu_model,
          MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND cc.name = 'LOGICALCORE'  THEN cc.stringvalue_short END) AS logicalcore,
          MAX(CASE WHEN c.resource_type = 'server.Memory' AND cc.name = 'TotalSize'    THEN cc.stringvalue_short END) AS mem_size
      FROM POLESTAR.cmm_resource c
      LEFT JOIN POLESTAR.core_config_prop cc
            ON c.resource_conf_id = cc.configuration_id
      WHERE c.resource_type IN ('server.Server','server.Cpus','server.Memory')
        AND c.dtime IS NULL
      GROUP BY COALESCE(c.platform_resource_id, c.id);
    gold_result_signature:
      row_count: null
      columns: [server_name, hostname, ipaddress, serialnumber, cpu_model, logicalcore, mem_size]
    notes: "은행존: 서버이름=등록명(c.name), 호스트네임=c.hostname(직접 컬럼). 2026-07-20 실측 정비: 기술 컬럼 id 제거(질의 명시 7컬럼으로 정렬). 2026-07-21: 대용량 절단(2337/1000) → 질의에 '전체' 명시."

  - id: b0-004
    query: "전체 서버들의 CPU, 메모리 사용률(평균·최대) 리스트를 조회해줘. 사용률은 지난달 1개월 통계 기준으로."
    db_id: polestar_b0
    category: performance
    coverage: inside
    gold_sql: |
      SELECT
          MAX(CASE WHEN c.resource_type = 'server.Server' THEN c.name END) AS pname,
          CAST(ROUND(AVG(CASE WHEN c.resource_type = 'server.Cpus'   AND s.definition_name = 'Utilization' AND s.avg_val BETWEEN 0 AND 1000 THEN CAST(s.avg_val AS DOUBLE) END), 2) AS DECIMAL(31,2)) AS cpu_avg,
          CAST(ROUND(MAX(CASE WHEN c.resource_type = 'server.Cpus'   AND s.definition_name = 'Utilization' AND s.max_val BETWEEN 0 AND 1000 THEN CAST(s.max_val AS DOUBLE) END), 2) AS DECIMAL(31,2)) AS cpu_max,
          CAST(ROUND(AVG(CASE WHEN c.resource_type = 'server.Memory' AND s.definition_name = 'Utilization' AND s.avg_val BETWEEN 0 AND 1000 THEN CAST(s.avg_val AS DOUBLE) END), 2) AS DECIMAL(31,2)) AS mem_avg,
          CAST(ROUND(MAX(CASE WHEN c.resource_type = 'server.Memory' AND s.definition_name = 'Utilization' AND s.max_val BETWEEN 0 AND 1000 THEN CAST(s.max_val AS DOUBLE) END), 2) AS DECIMAL(31,2)) AS mem_max
      FROM POLESTAR.cmm_resource c
      LEFT JOIN POLESTAR.cmm_metric_stat_m s
          ON s.resource_id = c.id
         AND s.definition_name = 'Utilization'
         AND s.stat_date = TO_CHAR(CURRENT_DATE - 1 MONTH, 'YYYYMM')
      WHERE c.resource_type IN ('server.Server', 'server.Cpus', 'server.Memory')
        AND c.dtime IS NULL
      GROUP BY COALESCE(c.platform_resource_id, c.id);
    gold_result_signature:
      row_count: null
      columns: [pname, cpu_avg, cpu_max, mem_avg, mem_max]
    gold_smq:
      pattern: B
      resource_types: [server.Cpus, server.Memory]
      dimensions: [name]
      measures:
        - {agg: avg, definition_name: Utilization, resource_type: server.Cpus}
        - {agg: max, definition_name: Utilization, resource_type: server.Cpus}
        - {agg: avg, definition_name: Utilization, resource_type: server.Memory}
        - {agg: max, definition_name: Utilization, resource_type: server.Memory}
      time_grain: month
      filters: []
    notes: "DB2 소수 보존 — 집계 전 CAST(... AS DOUBLE), 최종 DECIMAL(31,2) 스케일 고정(D-086). 2026-07-20 실측 정비 7차(최종): 제품 정본 스켈레톤(D-068 결정적 빌더 형태 — 서버 행 포함 단일 피벗, 전 서버 노출)으로 통일. D-086 값 게이트(37339 오염 차단) 유지. 2026-07-21: 대용량 절단(2337/1000) → 질의에 '전체' 명시(트랙 C 컴파일도 resolve_query_limit 공유라 동일 상향)."

  - id: b0-005
    query: "메모리 이용률이 90%를 초과한 적이 있는 서버를 조회해줘"
    db_id: polestar_b0
    category: performance
    coverage: outside
    scoring: subset
    gold_sql: |
      SELECT DISTINCT
          svr.name AS server_name,
          svr.hostname AS hostname
      FROM POLESTAR.cmm_resource r
      JOIN POLESTAR.cmm_resource svr
          ON svr.id = r.platform_resource_id
         AND svr.resource_type = 'server.Server'
      JOIN POLESTAR.cmm_metric_stat_m s
          ON r.id = s.resource_id
      WHERE r.resource_type = 'server.Memory'
        AND s.definition_name = 'Utilization'
        AND s.max_val > 90 AND s.max_val <= 1000
        AND r.dtime IS NULL
        AND svr.dtime IS NULL;
    gold_result_signature:
      row_count: null
      columns: [server_name, hostname]
    notes: "커버리지 밖 — '이용률'(=사용률) 동의어 + '90% 초과' 리터럴 임계. 2026-07-20 실측 정비: D-086 상한 게이트(<=1000) 추가 — 미추가 시 쓰레기 행(max=5.5e13)의 서버가 '90% 초과'로 오탐, FETCH FIRST 절단 제거. 2026-07-21 실측(376/131): 직전월 기본 관행(D-076 후속6)이 '초과한 적이 있는'(전 기간 존재) 질의에까지 적용돼 pred가 직전월로 한정된 것으로 추정 — 프롬프트·프로필 3종에 '~한 적이 있는' 예외(전 보관 기간 검색) 추가. 부가 컬럼 비결정(2/4)으로 scoring=subset."
