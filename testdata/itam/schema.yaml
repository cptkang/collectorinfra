#   컬럼 필드: seq(시트 순서 — `no`는 YAML 1.1 불리언이라 못 쓴다) · var(변수명) · ko(컬럼 정의) · domain(인포타입명) ·
#              type · nullable · pk(복합키 순번) · code(표준 코드 도메인 id) · grp(군)
# ============================================================================
