# ============================================================================
# 자산관리(ITAM) DB 스키마 — 벤더 제공 자료 전사본 (plans/95 §3)
# ============================================================================
# 성격: **전사본(transcription)이지 정본(profile)이 아니다.**
#   - 출처: 사용자 제공 화면 캡처 6장(2026-09-11) —
#       `업무룰리모델_RDB_테이블별컬럼(tcdmsif80).xlsx` 4장 · `(tcdmsif79).xlsx` 2장
#   - 런타임은 이 파일을 **읽지 않는다**. 구조 정본은 `config/db_profiles/{db_id}.yaml`이며,
#     그 파일은 **물리 컬럼·테이블 식별자가 확정된 뒤**(plans/95 G-4) 이 전사본을 재료로 쓴다.
#     확정 전에 프로필을 만들면 LLM이 존재하지 않는 컬럼명을 가르친다.
#   - 위치 근거: 비폴스타 DB 스키마 파일의 기존 선례는 `testdata/generic_mon/schema.json`이다
#     (Plan 63 P4-2). 형식만 YAML로 바꿨다 — 한국어 컬럼 정의·미확정 표기·코드 도메인 주석을
#     담아야 하는데 JSON은 주석을 못 쓴다.
#
# 판독 범례(각 항목의 `conf` 필드):
#   ok     제공 이미지에서 명확히 판독
#   check  판독했으나 원본 확인 필요(저해상도 화면 캡처 · 문자 혼동 가능)
#   none   미제공 — plans/95 §8의 게이트 대상
#
# ⚠ 이 파일에 **추정으로 채운 값을 넣지 말 것.** 모르는 값은 null로 두고 `unresolved`에 남긴다.
#   전사본에 추정이 섞이면 프로필이 그 추정을 정본으로 승격시킨다.
# ============================================================================

version: 1
db_id: itam
db_engine: mariadb            # 시트 「DBMS구분」 = MARIADB (conf: ok)
source: vendor_sheet          # 전사본 — 실 DB `information_schema` 대조 미실시
verified_against_live_db: false

provenance:
  captured: 2026-09-11
  medium: 화면 캡처 6장(엑셀 「업무룰리모델_RDB_테이블별컬럼」)
  files:
    - "업무룰리모델_RDB_테이블별컬럼(tcdmsif80).xlsx"
    - "업무룰리모델_RDB_테이블별컬럼(tcdmsif79).xlsx"
  registered: 2026-07-23        # 시트 「등록일시」
  app_code: DMS
  standard_group: 차계정/MDB_UTF8
  owner_system: IT자산관리포털 운영 DB      # 시트 「서버명」
  group_company_code: KB0       # conf: check — 화면상 'KB0'와 'KBO' 구분 불가
  server_code: R18S1
  instance_standard: IC1

# ── 이름 규약 — 확정 전까지 SQL을 쓸 수 없는 축 -----------------------------
naming:
  # 시트 B열 「스키마명」 값. 실 MariaDB database명인지 논리 인스턴스명인지 불명.
  logical_schema: INST1
  logical_schema_conf: check
  # 시트 C열 「테이블명」은 대문자, 파일명은 소문자(tcdmsif80). Linux MariaDB는
  # lower_case_table_names=0 이면 테이블명 대소문자를 **구분한다** — DB2 POLESTAR
  # 대문자 한정(D-057)과 같은 계열의 함정이다.
  tables_as_written: [TCDMSIF80, TCDMSIF79]
  table_case_conf: check
  # 아래 각 컬럼의 `var`는 시트 X열 「변수명」(= Y열 「서버변수명」과 동일)이다.
  # 실 DDL 식별자가 이 camelCase인지, 스네이크 대문자(SEVR_HOST_NAME)인지, 한글인지 미확정.
  physical_column_style: null
  physical_column_style_conf: none   # → plans/95 G-4

# ── 미확정 항목 — plans/95 §8 게이트와 1:1 ---------------------------------
unresolved:
  - gate: G-2
    item: 실 database(스키마)명 · MariaDB 버전
  - gate: G-4
    item: 물리 컬럼·테이블 식별자(대소문자 포함)
    how: "SHOW CREATE TABLE TCDMSIF80 한 줄이면 확정된다"
  - gate: G-5
    item: 코드성 컬럼 9종의 코드값 목록 또는 코드 마스터 테이블(아래 code_domains 참조)
  - gate: G-6
    item: sevrHostName·iPCtnt가 폴스타 cmm_resource.hostname·ipaddress와 정확 일치하는지
  - gate: G-10
    item: 서버현황조회 쿼리문(제공 이미지 6장은 전부 컬럼 정의 시트였다)
  - gate: G-11
    item: TCDMSIF*의 IF가 연계 테이블인지 · 적재 주기 · 행수 · 원장 테이블 존재 여부
  - gate: null
    item: FK 제약 실재 여부(시트에 제약 정보 열 없음) · 인덱스 · 파티션
  - gate: null
    item: TCDMSIF79·TCDMSIF80 외 테이블 목록

# ── 표준 코드 도메인 — 값 목록이 없어 WHERE 조건을 만들 수 없다(G-5) ---------
# key = 시트 V열 「인스턴스 식별자」, name = W열 「인스턴스명」.
code_domains:
  "105258000": {name: 그룹회사코드,         columns: [groupCoCd],                              values: null}
  "145354000": {name: 서버유형구분코드,     columns: [sevrPtrnDstcd],                          values: null}
  "145328000": {name: 서버운영환경구분코드, columns: [sevrOperEvirnDstcd],                     values: null}
  "133673000": {name: 자산유지보수구분코드, columns: [asstManmenDstcd],                        values: null}
  "145476000": {name: 노후교체기기구분코드, columns: [osoaRplacMchtlDstcd],                    values: null}
  "102739000": {name: 자산상태구분코드,     columns: [asstStusDstcd],                          values: null}
  "102738000": {name: 자산분류구분코드,     columns: [asstClsfiDstcd],                         values: null}
  "114287000": {name: 세부자산분류구분코드, columns: [dtalsAsstClsfiDstcd],                    values: null}
  "101370000": {name: 부점코드,             columns: [rspblBrncd, asstHoldBrncd],              values: null}
  "102132000": {name: 여부,                 columns: [vrtlSevrMapngYn, asstMapngYn, stohusAsstYn], values: null}

# ── 전 테이블 공통 규약 ------------------------------------------------------
conventions:
  # ① 날짜는 전부 CHAR(8) 'YYYYMMDD' 문자열이고 일시는 CHAR(20)이다 — DATE/TIMESTAMP가 아니다.
  #    기간 비교는 문자열 비교(`manmenCtrcEndYmd <= '20261231'`) 또는 STR_TO_DATE()로 한다.
  #    "이번 달 만료" 류 질의는 결정적 조립 대상(LLM에 맡기면 DATE 함수를 쓴다).
  date_columns_are_char8: true
  datetime_columns_are_char20: true
  # ② 감사 컬럼 4종은 모든 테이블에 같은 이름·타입으로 붙는다.
  audit_columns: [sysRegiUno, sysRegiPrcssYMS, sysLastUno, sysLastPrcssYMS]
  # ③ sys*PrcssYMS의 기본값 규칙(시트 「업무규칙」 열):
  #      DATE_FORMAT(CURRENT_TIMESTAMP(6), %Y%m%d%H%i%s%f)
  #    → MariaDB 함수다. 엔진 판정(mariadb)의 방증이기도 하다.
  timestamp_default_rule: "DATE_FORMAT(CURRENT_TIMESTAMP(6), %Y%m%d%H%i%s%f)"
  # ④ 감사 컬럼의 NOT NULL / NOT NULL WITH DEFAULT 구분은 저해상도라 행별 판독이 흔들렸다.
  #    조회에는 영향이 없어 nullable=false로만 적고 세부 구분은 확인 대상으로 둔다.
  audit_nullability_conf: check

# ── 시스템 간 조인 키 후보 (폴스타 대조 — plans/95 §4.3 · G-6) ---------------
cross_system_keys:
  - itam: sevrHostName
    polestar: [cmm_resource.hostname, cmm_resource.name]
    risk: "VARCHAR(300)은 호스트명 치고 과대 — FQDN·별칭·설명 혼입 시 정확 일치 조인 실패"
  - itam: iPCtnt
    polestar: [cmm_resource.ipaddress]
    risk: "VARCHAR(255) — 다중 IP가 한 칸에 들어갔을 수 있음"

# ── 민감 정보 (plans/95 §4.5 · G-9) -----------------------------------------
sensitive:
  pii:
    - column: rspblPsnEmnm
      reason: "시트 F·G열 「암호화/변환정보」=1, 「암호화/변환 항목구분」=성명 — 원천에서 암호화 대상"
      note: "조회 계정이 평문을 보는지 자체가 확인 대상"
  amount:
    - acqsiAmt          # 취득금액
    - manmenCnpr        # 유지보수계약금액
    - rmainAcbkAmt      # 잔존장부금액
  contract_identifiable:
    - byCtrcName        # 구매계약명(공급사명 포함 가능)
    - manmenCtrcName    # 유지보수계약명
  employee_identifiable:
    - rspblPsnEmpid     # 담당자직원번호
    - sysRegiUno        # 시스템등록사용자번호
    - sysLastUno        # 시스템최종사용자번호

# ── 테이블 간 조인 -----------------------------------------------------------
joins:
  - from: TCDMSIF80
    to: TCDMSIF79
    on_columns: [groupCoCd, sevrHostName, iPCtnt]   # 3열 복합 — 한 열만 쓰면 중복 행이 난다
                                                    # (`on`은 `no`와 마찬가지로 YAML 1.1 불리언이라 키로 못 쓴다)
    cardinality: null                        # 미확인
    fk_constraint: null                      # 시트에 제약 정보 없음 — 논리 조인으로 취급

# ============================================================================
