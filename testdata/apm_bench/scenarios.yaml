      agents:
      - apm_query
      views:
      - apm.app_health
      target: inst:c
      window: range:30
      clarify: source
    note: 「김포」 = cm_prd · 「여의도」 = cm_stg — 걸린 소스 둘 → 되묻기가 정답(선택지 = 걸린 소스)
  - prompt: 공동존 운영
    reply_to: source
    expect:
      agents:
      - apm_query
      views:
      - apm.app_health
      target: inst:c
      window: range:30
      apm_sources:
      - cm_prd
    note: 「공동존 운영」 글 답 = cm_prd 하나(「공동존」 단독은 어느 소스 단어도 아니라 글 답으로 읽히지 않는다)
