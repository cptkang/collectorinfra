# plans/152 · D-323 — 제니퍼 APM 조회 벤치마크 사용자 프롬프트 시나리오 (초안 · W1 검수 전)
#
# 생성: 2026-10-12 · 원천 = spec/CAPABILITY-MAP-134.md 표 A(허용 GET 경로 40개) · 표 B(실제 전달하는 선택 인자 26개)
#       + config/db_registry.yaml solutions[apm].views(보기 29개 · 보기 인자 59개)
# 규모: 시나리오 121개 · 턴 135개 · holdout 36개(30%)
#   분할 규칙(결정적): ① 표 A 경로마다 holdout 1개 확보(외부망 전용 변형 우선) ② 출현 순서로 30%까지 채움 — 경로의 dev가 사라지면 건너뜀 · heavy는 dev 고정
# 커버리지(생성 시 대조): 표 A 미커버 0 · 표 B 미커버 0 · 보기 미커버 0 · 보기 인자 미커버 0
#   경로별 분할: 표 A 40경로 모두 dev·holdout 양쪽 존재 — 단 holdout이 외부망 전용(e2_skip · WAS 접촉 1회 제한): COV-ACTIVE-DETAIL, COV-ENV, COV-LOADED-CLASS
#
# 규칙
# - 프롬프트에 도구명(apm_)·보기명(apm.)·API 경로(/api)·영문 인자 키를 넣지 않는다(로더 린트 — W1).
# - 운영 이름은 자리표: {{inst_N}} 인스턴스명 · {{host_N}} 호스트명 · {{biz_N}} 업무명 · {{svc_N}} 서비스(도메인)명 ·
#   {{inst_c}}/{{inst_b}} 공동존/은행존 인스턴스 · {{inst_w}} 운영자 지정 WAS 접촉 허용 인스턴스 1개 · {{url_1}} · {{pid_1}} ·
#   {{guid_1}} · {{user_1}} · {{domain_id_1}}. 내부망 키트가 운영 인벤토리에서 채운다(로컬 전용 · 반출 금지).
# - 소스 되묻기(D-322): expect.clarify가 없는 턴에서 소스 되묻기가 오면 드라이버가 대상 자리표의 소스로 답하고
#   기록만 한다(실패 아님). clarify가 적힌 턴은 되묻기가 정답이다.
#
# expect 칸
# - agents: 담당 처리기 집합 · views: 보기 집합(정확 일치 판정 · 누락/초과 수 기록)
# - target: none(대상 없음) · untargeted(서버 미지정 = 상위 N · D-313) · host:N · inst:N(inst:c 공동존 · inst:b 은행존) · biz:N · svc:N · inst_w · ref(앞 턴 행 지목)
# - window: default(말 안 함 = 보기 기본 창) · none · current · compare · range:<분> · hourly:today|yesterday|<분>
# - args: 요구한 보기 인자만 적는다 — 적지 않은 인자가 붙으면 환각(arg_hallucination). "*" = 값은 지표 카탈로그 의존 · 존재만 판정
# - apm_sources: 소스 지목 반영 · clarify: source|required_arg(되묻기가 정답) · refusal: unsupported|write_control(거절이 정답)
#
# 플래그(D-323 ③ 운영 뷰 서버 허용 범위)
# - heavy: 무거운 등급 — 최대 5개 · 맨 마지막 · 앞 단계 정상일 때만 · was_touch: WAS 에이전트 접촉 가능 API — API당 1회 · {{inst_w}}만
# - e2_skip: 내부망에서 건너뜀(사유) · sensitive: 응답 모양만 기록

- id: APM-INST-list
  split: holdout
  covers:
  - COV-DOMAIN
  - COV-INSTANCE
  turns:
  - prompt: 제니퍼에 등록된 WAS 인스턴스 전체 목록 보여줘
    expect:
      agents:
      - apm_query
      views:
      - apm.instances
      target: none
      window: none
- id: APM-INST-domain
  split: dev
  covers:
  - COV-INSTANCE
  turns:
  - prompt: 도메인 {{domain_id_1}}번에 속한 인스턴스만 보여줘
    expect:
      agents:
      - apm_query
      views:
      - apm.instances
      target: none
      window: none
      args:
        domain_id: '{{domain_id_1}}'
- id: APM-INST-host
  split: holdout
  covers:
  - COV-INSTANCE
  turns:
  - prompt: '{{host_1}} 서버에 올라가 있는 WAS 인스턴스가 뭐야?'
    expect:
      agents:
      - apm_query
      views:
      - apm.instances
      target: host:1
      window: none
- id: APM-HEALTH-inst
  split: holdout
