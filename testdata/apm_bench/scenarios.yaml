    note: 「레거시 제니퍼」 = b0 소스 단어(은행 제니퍼 — legacy 소스는 폐지돼 b0에 합쳐졌다)
- id: APM-SRC-ambiguous
  split: dev
  covers:
  - COV-RT-INSTANCE
  turns:
