  turns:
  - prompt: '{{inst_1}} 응답시간이랑 TPS 지금 어때?'
    expect:
      agents:
      - apm_query
      views:
      - apm.app_health
      target: inst:1
      window: default
- id: APM-HEALTH-host-30m
