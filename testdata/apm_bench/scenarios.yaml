- id: APM-HEALTH-untargeted
  split: dev
  covers:
  - COV-RT-INSTANCE
  heavy: true
  turns:
  - prompt: 지금 WAS들 응답시간 상태 어때?
    expect:
      agents:
      - apm_query
      views:
      - apm.app_health
      target: untargeted
      window: default
    note: 서버 미지정 = TPS 상위 20대(D-313) — 전 도메인 실시간 순회
