# plans/152 §3.8 · D-323 · D-321 — APM 벤치 반출 일반 단어 허용 목록(`scripts/apm_bench/hygiene.py`)
#
# 기본 거부: 목록이 비어 있으면 운영 이름(인스턴스·호스트·업무·서비스·URL)의 토큰은 전부 형식 보존
# 가짜 값으로 바뀐다. 여기 적은 단어만 반출본에 원문으로 남는다.
#
# 형식
# - terms: 문자열 목록. 한 항목 = 토큰 하나(구분자 없는 낱말 — `hygiene.split_name` 규칙으로 쪼갰을 때
#   토큰이 정확히 하나여야 한다). 숫자만인 항목은 받지 않는다(번호는 인스턴스를 식별한다).
# - 대조는 NFKC + casefold 같음이다(`WAS`를 적으면 `was`·`Was`도 원문 유지). 부분 일치는 없다.
# - 형식이 틀린 항목이 하나라도 있으면 로더가 실패한다(닫힌 쪽).
# - ASCII 2자 토큰(`db`·`ap` 등)과 camelCase 결합 소문자형(`OrdPay01` → `ordpay`)도 기본 거부다.
#   토큰 사전은 반출 레코드(trace·probe·run.json)의 문자열 값 전부에 적용되므로, 이름 토큰과 겹치는
#   코드 값(`domain`·`db` 등)도 여기 없으면 가짜 값으로 바뀐다(plans/152 §3.8 · 부록 A.2).
#
# 검토 절차(내부망 운영자 — 반출 전)
# 1. 사람·조직·고객·시스템 고유명을 식별하지 않는 업무 일반 단어만 넣는다(예: 업무 분류어·계층 약어·
#    환경 약어). 고유 시스템 약어·조직 약어·사람 이름·고객사 이름은 넣지 않는다.
# 2. 한↔영 약어 관계(한글 업무어와 그 영문 약어 토큰)는 한쪽만 허용 목록에 있으면 다른 쪽이 치환돼
#    대응 관계가 사라진다 — 진단에 필요하면 둘 다 넣거나 둘 다 빼는 것을 함께 정한다.
# 3. 넣은 항목과 검토자·날짜는 폐쇄망 반출 기록에 남긴다(이 파일에는 단어만 둔다).
# 4. 저장소 정본은 빈 목록이다 — 내부망 검토본은 로컬 전용 사본으로 두고 실행 시 경로로 넘긴다.

