# R4 - 착각 (plans/94 §3.7)
#
# **실사례를 가진 유일한 축이다.** D-200("가동률"은 가용성 계열이며 CPU 사용률 매핑 금지)과
# D-201("이번 달" = cmm_metric_stat_d 당월 1일~어제)은 둘 다 사용자의 말과 시스템의 해석이
# 어긋난 지점에서 나온 결정이다. 그래서 G-11 에서 1차 실행 우선순위가 가장 높다.
#
# 단언은 부정 단언(column_must_not_map / sql_must_not_match)이 주력이다 -
# 거부와 되묻기는 사용자가 알아차리지만 조용한 오답은 알아차리지 못한다.
version: 1
group:
  id: R4
  name: "착각"
  latency_target_ms: 30000
  # plans/123 CT-1 · 123·G-2 (b) · D-280 ② — 케이스별 허용 집합을 정정한 뒤 등급 정책을 확정한다.
  #   선언 밖 등급은 이제 불합격이다(종전 manual). 금지 3종은 종전대로 항상 불합격.
  policy_confirmed: true
  # plans/123 V-4 — 불변식 활성 선언. 값 = 판정에 넣기 시작하는 run 표지(null 은 트리아지만).
  #   활성도 응답 고지(done.disclosures)를 수집한 run(W-8 이후 러너)에서만 판정에 들어간다.
  invariants:
    limit_disclosed: R5          # 123 W-1(상한 도달 고지) 랜딩 run
    zone_coverage_named: R5      # 123 W-2·W-5(좁힌 범위 · 「전체가 아니라」) 랜딩 run
    upload_misattributed: R5     # 295feee(D-264 ④) — 러너가 고지를 수집하는 첫 run 부터
    empty_template_misuse: null  # 123 S-4a 가 섀도(D-280 ⑧) — run R5′ on 전환 때 활성
    overgeneralization: null     # 121 TP-4.4 ② 랜딩 뒤
    demonstrative_bulk: null     # 106 H1 되묻기 게이트(G-6 · S-7(b) 트리거) 랜딩 뒤
  source: "plans/94 §3.7 R4"
scenarios:
  - id: R4-01
    plans: [37, 61, 77]
    title: "용어 오해 - 가동률 (D-200 실사례)"
    kind: misconception
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    pair_with: R4-01C
    response_modes: [clarify, answer, guide]
    turns:
      - send: {query: "서버 가동률 보여줘"}
        expect:
          column_must_not_map: ["cpu_usage", "cpu_util"]
          sql_must_not_match: ["(?i)cpu_usage"]
    teardown: [drop_thread]
    notes: "D-200 - 의미 확정 결정이 회귀하지 않는지 감시"
  - id: R4-01C
    plans: [61]
    title: "[대조군] CPU 사용률 - 정상 요구"
    kind: control
    env: closed
    profile: baseline
    endpoint: stream
    pair_with: R4-01
    response_modes: [answer]
    turns:
      - send: {query: "서버 CPU 사용률 보여줘"}
        expect:
          status: completed
          row_count: {min: 1}
    teardown: [drop_thread]

  - id: R4-02
    plans: [61, 69]
    title: "시제 오해 - 이번 달 (D-201 실사례)"
    kind: misconception
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    pair_with: R4-02C
    response_modes: [answer, clarify]
    turns:
      - send: {query: "이번 달 CPU 평균 알려줘"}
        expect:
          sql_must_match: ["(?i)cmm_metric_stat_d"]
          # plans/123 CT-7 - D-201 결정적 각주(src/nodes/output_generator.py
          #   `_append_current_month_partial_note` - 「당월 1일부터 어제까지의 일간 통계를 집계한 기준」).
          response_must_contain_any: ["1일부터 어제까지", "1일~어제"]
    teardown: [drop_thread]
  - id: R4-02C
    plans: [61, 69]
