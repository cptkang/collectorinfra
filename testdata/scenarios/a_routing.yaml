# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
version: 1
group:
  id: A
  name: "의도 분류/라우팅"
  latency_target_ms: 5000
  policy_confirmed: false
  source: "docs/29"
scenarios:
  - id: A-01
    plans: [9, 79]
    title: "여의도 개발 서버들의 CPU 사용률을 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "여의도 개발 서버들의 CPU 사용률을 보여줘"
        expect:
          manual_review: "data_query / polestar_cm_yd / 위치어 결정적 힌트"
  - id: A-02
    plans: [9, 79]
    title: "은행존 서버의 디스크 사용량 조회"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "은행존 서버의 디스크 사용량 조회"
        expect:
          manual_review: "data_query / polestar_b0 / DB2 경로 진입"
  - id: A-03
    plans: [9, 79]
    title: "김포와 여의도 서버의 CPU 사용률을 비교해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "김포와 여의도 서버의 CPU 사용률을 비교해줘"
        expect:
          manual_review: "data_query / gp + yd (≥2) / **멀티DB 축소 회귀 감시 항목**"
  - id: A-04
    plans: [9, 79]
    title: "현재 활성 상태인 심각 알람 목록 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "현재 활성 상태인 심각 알람 목록 보여줘"
        expect:
          manual_review: "alarm_query / polestar_*"
  # 쓰기 시나리오 - 스키마 캐시를 갱신한다. cache_state 선언과 순서 고정이 필요하다(§2-3).
  - id: A-05
    plans: [9, 79]
    title: "polestar DB의 스키마 캐시를 갱신해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "polestar DB의 스키마 캐시를 갱신해줘"
        expect:
          manual_review: "cache_management / 없음 / DB 선택 단계 스킵"
    cache_state: cold
    teardown: [drop_thread, clear_schema_cache]
  - id: A-06
    plans: [9, 79]
    title: "조회 가능한 DB 목록과 설명을 알려줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "조회 가능한 DB 목록과 설명을 알려줘"
        expect:
          manual_review: "cache_management(db-guide) / 없음"
  - id: A-07
    plans: [9, 79]
    title: "안녕하세요, 오늘 날씨 어때요?"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "안녕하세요, 오늘 날씨 어때요?"
        expect:
          manual_review: "general_inference / `[]`"
  - id: A-08
    plans: [9, 79]
    title: "쿠버네티스란 뭐야?"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "쿠버네티스란 뭐야?"
        expect:
          manual_review: "general_inference / `[]` / 외부 IT 개념"
  - id: A-09
    plans: [9, 79]
    title: "서버 상태 좀 확인해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버 상태 좀 확인해줘"
        expect:
          manual_review: "data_query / ≥1 / 저신뢰 프로브 — `relevance_score` 분포 확인(0.3 게이트)"
  - id: A-10
    plans: [9, 79]
    title: "vcore, cpu, core은 동의어이다. 캐시에 등록하라."
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "vcore, cpu, core은 동의어이다. 캐시에 등록하라."
        expect:
          manual_review: "cache_management(결정적 pre-gate) / — / LLM 미호출 확인"
    # 쓰기 시나리오 - 유사어 사전(Redis)에 등록한다. 정리하지 않으면 뒤 시나리오의
    # 매핑이 바뀐다(유사어 오염 자기강화 - Known Mistakes). 러너가 아직 이 정리를
    # 수행하지 못하므로 teardown_unsupported 로 기록되어 리포트 10절에 노출된다.
    teardown: [drop_thread, unregister_synonym]
  - id: A-11
    plans: [9, 79]
    title: "○○ 서버 왜 느려? 원인 분석해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "○○ 서버 왜 느려? 원인 분석해줘"
        expect:
          manual_review: "flag off: data_query로 강등 / on: fault_diagnosis / — / 플래그 양쪽 실행"
  - id: A-12
    plans: [9, 79]
    title: "서버 목록 양식 채워줘 (파일 없이)"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버 목록 양식 채워줘 (파일 없이)"
        expect:
          manual_review: "결정적 안내문 반환 / — / `_FORM_FILL_NO_FILE_GUIDANCE`, LLM 미호출"
