# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
version: 1
group:
  id: A
  name: "의도 분류/라우팅"
  latency_target_ms: 5000
  policy_confirmed: false
  source: "docs/29"
scenarios:
  - id: A-01
    plans: [9, 79]
    title: "여의도 개발 서버들의 CPU 사용률을 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "여의도 개발 서버들의 CPU 사용률을 보여줘"
        expect:
          status: completed
          db_ids: ["polestar_cm_yd"]
          sql_must_not_match: ["(?i)여의도"]
          manual_review: "위치어 결정적 힌트가 적용됐는지 기동 로그 확인"
  - id: A-02
    plans: [9, 79]
    title: "은행존 서버의 디스크 사용량 조회"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "은행존 서버의 디스크 사용량 조회"
        expect:
          status: completed
          db_ids: ["polestar_b0"]
          sql_must_not_match: ["(?i)\\blimit\\s+\\d"]
  - id: A-03
    plans: [9, 79]
    title: "김포와 여의도 서버의 CPU 사용률을 비교해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "김포와 여의도 서버의 CPU 사용률을 비교해줘"
        expect:
          status: completed
          db_ids: ["polestar_cm_gp", "polestar_cm_yd"]
          manual_review: "멀티DB 축소 회귀 감시 - 한쪽으로 좁혀지지 않았는지"
  - id: A-04
    plans: [9, 79]
    title: "현재 활성 상태인 심각 알람 목록 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "현재 활성 상태인 심각 알람 목록 보여줘"
        expect:
          status: completed
          sql_must_match: ["(?i)\\bcmm_alarm(_active)?\\b"]
  # 쓰기 시나리오 - 스키마 캐시를 갱신한다. cache_state 선언과 순서 고정이 필요하다(§2-3).
  - id: A-05
    plans: [9, 79]
    title: "polestar DB의 스키마 캐시를 갱신해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "polestar DB의 스키마 캐시를 갱신해줘"
        expect:
          status: completed
          sql_must_not_match: ["(?i)\\bselect\\b"]
          has_file: false
    cache_state: cold
    # 되돌릴 상태가 없다 - 갱신은 같은 스키마를 다시 수집할 뿐이다(cache_management `_handle_generate`
    # -> refresh_cache). 종전 `clear_schema_cache` 는 수행하면 오히려 파괴적이다: 서버 캐시 삭제
    # (invalidate)는 config/db_profiles 정본 파일과 DB별 LLM 유사어·설명까지 지운다(D-217).
    teardown: [drop_thread]
  - id: A-06
    plans: [9, 79]
    title: "조회 가능한 DB 목록과 설명을 알려줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "조회 가능한 DB 목록과 설명을 알려줘"
        expect:
          status: completed
          sql_must_not_match: ["(?i)\\bselect\\b"]
          has_file: false
  - id: A-07
    plans: [9, 79]
    title: "안녕하세요, 오늘 날씨 어때요?"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "안녕하세요, 오늘 날씨 어때요?"
        expect:
          status: completed
          sql_must_not_match: ["(?i)\\bselect\\b"]
          db_ids: []
          manual_review: "일반 추론 응답인지 - 관측 데이터를 지어내지 않았는지"
  - id: A-08
    plans: [9, 79]
    title: "쿠버네티스란 뭐야?"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "쿠버네티스란 뭐야?"
        expect:
          status: completed
          sql_must_not_match: ["(?i)\\bselect\\b"]
          db_ids: []
  - id: A-09
    plans: [9, 79]
    title: "서버 상태 좀 확인해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버 상태 좀 확인해줘"
        expect:
          manual_review: "저신뢰 프로브 - relevance_score 분포 확인(0.3 게이트). 재질문·안내·조회 어느 쪽도 정답일 수 있어 기계 판정하지 않는다"
  - id: A-10
    plans: [9, 79]
    title: "vcore, cpu, core은 동의어이다. 캐시에 등록하라."
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "vcore, cpu, core은 동의어이다. 캐시에 등록하라."
        expect:
          status: completed
          sql_must_not_match: ["(?i)\\bselect\\b"]
          manual_review: "LLM 미호출 확인 - 유사어 등록이 결정적 경로로 처리됐는지"
    # 쓰기 시나리오 - 유사어 사전(Redis)에 등록한다. 정리하지 않으면 뒤 시나리오의
    # 매핑이 바뀐다(유사어 오염 자기강화 - Known Mistakes). 러너가 턴 전후 유사어 사전
    # 스냅샷을 떠 **이 시나리오가 더한 단어만** 지운다(D-217 - 원래 있던 단어는 건드리지 않는다).
    teardown: [drop_thread, unregister_synonym]
  - id: A-11
    plans: [9, 79]
    title: "○○ 서버 왜 느려? 원인 분석해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "○○ 서버 왜 느려? 원인 분석해줘"
        expect:
          manual_review: "플래그 양쪽 실행 - off 면 data_query 강등, on 이면 fault_diagnosis. 설정에 따라 정답이 갈려 기계 판정하지 않는다"
  - id: A-12
    plans: [9, 79]
    title: "서버 목록 양식 채워줘 (파일 없이)"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버 목록 양식 채워줘 (파일 없이)"
        expect:
          status: completed
          sql_must_not_match: ["(?i)\\bselect\\b"]
          has_file: false
          response_must_contain: ["양식 파일이 첨부되지 않아"]
