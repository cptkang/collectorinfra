# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
version: 1
group:
  id: B
  name: "단순 조회 - 서버 구성(EAV)"
  latency_target_ms: 10000
  policy_confirmed: false
  source: "docs/29"
scenarios:
  - id: B-01
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
        expect:
          status: completed
          # plans/122 A-5: 행 제한은 방언 중립으로 본다(은행존 DB2 는 FETCH FIRST).
          #   원식: "(?i)\\blimit\\s+10000\\b"
          sql_must_match: ["(?i)\\bcmm_resource\\b", "(?i)\\bcore_config_prop\\b",
                          "(?i)dtime\\s+is\\s+null",
                          "(?i)\\b(?:limit\\s+10000|fetch\\s+first\\s+10000\\s+rows?)\\b"]
          row_count: {min: 1}
          # 수동 유지 — 정답 서버 수는 DB 오라클(plans/122 O-3 · DB2 는 폐쇄망 검수 전)로만 구한다.
          manual_review: "행 수가 전체 서버 수와 일치하는지"
  - id: B-02
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "서버 수를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버 수를 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)count\\s*\\("]
          row_count: {eq: 1}
  - id: B-03
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, 호스트네임, CPU 모델, 메모리 용량을 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, 호스트네임, CPU 모델, 메모리 용량을 조회해줘"
        expect:
          status: completed
          # plans/120 U-1: `cocm-*` 는 장비명이다(D-148 · CU-17) - 정답은 `name` 필터다. 종전
          #   `(?i)hostname\s*=` 은 김포·여의도의 `name = 'cocm-hdkapp01'`(1행)을 떨어뜨리고 은행존의
          #   잘못된 `hostname =`(0행)이 있을 때만 통과시켰다(run 20260923-140539). `\bname\b` 는
          #   `hostname` 안에서 걸리지 않고, 값까지 묶어야 EAV 의 `cc.name = 'OSType'` 에 걸리지 않는다.
          #   `MAX(CASE … THEN c.name END) = '…'`(HAVING 피벗) 형태도 받는다.
          sql_must_match: ["(?i)\\bname\\b(?:\\s+END)?\\s*\\)?\\s*(?:=|\\bIN\\s*\\()\\s*'cocm-hdkapp01'",
                           "(?i)cocm-hdkapp01"]
          # 3-DB 팬아웃이라 합계로 본다(`row_count` 는 단일 DB 턴 전용 · Y-4).
          row_count_total: {eq: 1}
          # plans/122 H-1: 종전 수동 문구 "열 6개(OS종류·버전·IP·호스트명·CPU모델·메모리)가 모두
          #   채워졌는지". 결과 행(download-csv)의 6열이 전 행 채워졌는지 본다. 별칭은 모든 run 의
          #   B-03 실행 SQL 별칭 실측(os_type · os_version · ip_address · hostname · cpu_model ·
          #   memory_size/mem_size/memory_total_size)에 같은 뜻의 표기를 더했다.
          result:
            filled_columns:
              - [os_type, ostype, os_kind]
              - [os_version, osversion, os_ver]
              - [ip_address, ipaddress, ip]
              - [hostname, host_name]
              - [cpu_model, cpumodel, model]
              - [memory_size, mem_size, memory_total_size, memory_total, total_memory,
                 memory_capacity, mem_total]
  - id: B-04
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "장비명이 'cob0-bnndbp01'인 서버의 가용성 상태와 IP를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "장비명이 'cob0-bnndbp01'인 서버의 가용성 상태와 IP를 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)\\bname\\s*=", "(?i)cob0-bnndbp01"]
          sql_must_not_match: ["(?i)hostname\\s*=\\s*.?cob0-bnndbp01"]
          # plans/122 A-3: 3-DB 팬아웃 턴이라 `row_count` 는 보류(fanout)였다 — 세 run 모두
          #   b0 0 · cm_gp 1 · cm_yd 0. 장비 한 대이므로 합계로 본다(B-03 선례 · Y-4).
          #   원식: row_count: {eq: 1}
          row_count_total: {eq: 1}
  - id: B-05
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "호스트명이 sbhdbo53인 서버의 CPU 리소스를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "호스트명이 sbhdbo53인 서버의 CPU 리소스를 조회해줘"
        expect:
          status: completed
          # plans/122 A-5: 필터 모양을 넓힌다 — `hostname =` 에 더해 `COALESCE(name, hostname) =`·
          #   HAVING 피벗 `MAX(CASE … THEN c.hostname END) =`·`hostname IN (` 를 받는다(원식의 상위 집합).
          #   원식: "(?i)hostname\\s*="
          sql_must_match: ["(?i)hostname\\s*=|\\bhostname\\b(?:\\s+END)?\\s*\\)\\s*=|\\bhostname\\s+IN\\s*\\(",
                           "(?i)sbhdbo53"]
          # 수동 유지 — G-10(D-275 ⑩): "CPU 리소스" = EAV 세 속성인가 server.Cpu 자식 행인가 정답 미정.
          manual_review: "LOGICALCORE/PHYSICALCORE/MODEL 세 속성이 나오는지"
  - id: B-06
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "비정상 서버 목록과 IP를 10건만 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "비정상 서버 목록과 IP를 10건만 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)avail_status"]
          row_count: {min: 0}
  - id: B-07
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 10건만 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 10건만 보여줘"
        expect:
          status: completed
          # 캐스트 타입명은 `numeric|decimal` 양쪽을 인정한다 — EAV 값 컬럼의 숫자 캐스트는
          # 프롬프트가 `AS NUMERIC`으로 내놓아도 D-199 가드(`normalize_eav_unit_casts`)가
          # 단위 인지 정규화 식(`CAST(... AS DECIMAL(31, 6))`)으로 **결정적으로 치환**한다.
          # `numeric`만 요구하면 제품이 옳게 동작해도 불합격이다(run 20260918-182507 B-07·B-08).
          sql_must_match: ["(?i)cast\\s*\\(", "(?i)\\b(numeric|decimal)\\b",
                          "(?i)order\\s+by[\\s\\S]*\\bdesc\\b"]
          sql_must_not_match: ["(?i)as\\s+int(eger)?\\b"]
  - id: B-08
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "서버별 CPU 코어(vcore) 수 합계를 10건만 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버별 CPU 코어(vcore) 수 합계를 10건만 조회해줘"
        expect:
          status: completed
          # B-07 주석 참조 — D-199 가드가 `AS DECIMAL(31, 6)`으로 치환한다.
          sql_must_match: ["(?i)\\b(numeric|decimal)\\b"]
          sql_must_not_match: ["(?i)as\\s+int(eger)?\\b"]
          # plans/122 A-1 보류 — 계획 이관안은 `row_count_per_db: {min: 1}` + 오류 문구 부정이었다.
          #   그러나 질의에 존이 없어 세 run(20260922-093837 · 20260923-103638 · 20260923-140539 두 단)
          #   모두 polestar_cm_gp 단일 DB 로만 갔다 — **b0 는 한 번도 실행되지 않았다.** 그 단언은
          #   b0 캐스트를 보지 않은 채 통과한다(거짓 합격). b0 실행을 강제하는 수단(질의 변경 또는
          #   db_ids 에 b0 포함)이 정해질 때까지 수동으로 둔다.
          manual_review: "b0에서 '4.0' 값 캐스트 에러가 없는지"
  - id: B-09
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "장비명이 'cocm-xgzapp09'인 서버의 OS파라미터(커널 파라미터)를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "장비명이 'cocm-xgzapp09'인 서버의 OS파라미터(커널 파라미터)를 조회해줘"
        expect:
          status: completed
          # plans/120 U-2: 보는 것은 "값을 LOB(`stringvalue`) 우선으로 읽는가"다. 종전
          #   `stringvalue_short` 금지는 정답 `COALESCE(cc.stringvalue, cc.stringvalue_short)` 를
          #   조용한 오답으로 떨어뜨렸다(run 20260923-140539 2단 silent_wrong 의 유일한 건).
          #   `stringvalue_short` 만 읽으면 `\bstringvalue\b` 가 없어 불합격이고(`_short` 는 단어 경계가
          #   아니다), 짧은 값을 먼저 두는 `COALESCE(… stringvalue_short, …)` 는 금지다.
          sql_must_match: ["(?i)\\bstringvalue\\b", "(?i)OSParameter"]
          sql_must_not_match: ["(?i)coalesce\\s*\\(\\s*(?:\\w+\\.)?stringvalue_short\\b",
                               "(?i)is_lob\\s*=\\s*1"]
          row_count: {min: 1}
  - id: B-10
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "은행존 전체 서버별 호스트명, IP, 시리얼번호, CPU모델, CPU코어수, 메모리를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "은행존 전체 서버별 호스트명, IP, 시리얼번호, CPU모델, CPU코어수, 메모리를 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)POLESTAR\\.", "(?i)fetch\\s+first"]
          sql_must_not_match: ["(?i)\\blimit\\s+\\d"]
          row_count: {min: 2000}
  - id: B-11
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
        expect:
          status: completed
          # plans/122 A-5: 행 제한은 방언 중립으로 본다(은행존 DB2 는 FETCH FIRST).
          #   원식: "(?i)\\blimit\\s+3\\b"
          sql_must_match: ["(?i)\\b(?:limit\\s+3|fetch\\s+first\\s+3\\s+rows?)\\b",
                           "(?i)order\\s+by[\\s\\S]*\\bdesc\\b"]
          row_count: {eq: 3}
  - id: B-12
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
        expect:
          status: completed
          # plans/122 A-2: 날짜는 표기가 아니라 기간으로 본다(D-218 Y-5 · `to` 는 배타 경계).
          #   원식: "(?i)202606"
          sql_must_match: ["(?i)cmm_metric_stat_m"]
          period_covers: {from: "2026-06-01", to: "2026-07-01"}
          # plans/122 T-9 — 명시 기간은 리터럴만(§10.3 ④): DB 현재시각 함수식이 없어야 한다.
          sql_must_not_match: ["(?i)\\bcurrent[_ ](?:date|timestamp)\\b|\\bnow\\s*\\(|\\bsysdate\\b|\\binterval\\b"]
          column_must_not_map: ["logicalcore"]
          row_count: {eq: 3}
          # plans/122 H-1 — 결과 행(download-csv)의 CPU 평균 열이 0~100(docs/29 B-12 「3행, 값 0~100」).
          #   열 이름이 run 마다 갈려(results/ 아래 raw.jsonl 전수의 B-12 SQL 별칭: cpu_avg_utilization ·
          #   cpu_avg_percent · cpu_avg · cpu_avg_usage) 별칭 목록 형식으로 적었다 — 넷 다 없으면 불합격이고
          #   상세에 헤더가 실린다(새 별칭이 나오면 여기에 더한다). 상한 100: 월 **평균**이라 H-05(`CPU 최고`
          #   측정값 100.06 → 상한 101)의 여유가 필요 없다 — 관측 최댓값 67.88(세 run 응답 표).
          #   원 수동 문구: "값이 0~100 범위인지"
          result:
            value_range:
              - {columns: [cpu_avg_utilization, cpu_avg_percent, cpu_avg, cpu_avg_usage],
                 range: [0, 100]}
