# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
version: 1
group:
  id: B
  name: "단순 조회 - 서버 구성(EAV)"
  latency_target_ms: 10000
  policy_confirmed: false
  source: "docs/29"
scenarios:
  - id: B-01
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)\\bcmm_resource\\b", "(?i)\\bcore_config_prop\\b",
                          "(?i)dtime\\s+is\\s+null", "(?i)\\blimit\\s+10000\\b"]
          row_count: {min: 1}
          manual_review: "행 수가 전체 서버 수와 일치하는지"
  - id: B-02
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "서버 수를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버 수를 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)count\\s*\\("]
          row_count: {eq: 1}
  - id: B-03
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, 호스트네임, CPU 모델, 메모리 용량을 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, 호스트네임, CPU 모델, 메모리 용량을 조회해줘"
        expect:
          status: completed
          # plans/120 U-1: `cocm-*` 는 장비명이다(D-148 · CU-17) - 정답은 `name` 필터다. 종전
          #   `(?i)hostname\s*=` 은 김포·여의도의 `name = 'cocm-hdkapp01'`(1행)을 떨어뜨리고 은행존의
          #   잘못된 `hostname =`(0행)이 있을 때만 통과시켰다(run 20260923-140539). `\bname\b` 는
          #   `hostname` 안에서 걸리지 않고, 값까지 묶어야 EAV 의 `cc.name = 'OSType'` 에 걸리지 않는다.
          #   `MAX(CASE … THEN c.name END) = '…'`(HAVING 피벗) 형태도 받는다.
          sql_must_match: ["(?i)\\bname\\b(?:\\s+END)?\\s*\\)?\\s*(?:=|\\bIN\\s*\\()\\s*'cocm-hdkapp01'",
                           "(?i)cocm-hdkapp01"]
          # 3-DB 팬아웃이라 합계로 본다(`row_count` 는 단일 DB 턴 전용 · Y-4).
          row_count_total: {eq: 1}
          manual_review: "열 6개(OS종류·버전·IP·호스트명·CPU모델·메모리)가 모두 채워졌는지"
  - id: B-04
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "장비명이 'cob0-bnndbp01'인 서버의 가용성 상태와 IP를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "장비명이 'cob0-bnndbp01'인 서버의 가용성 상태와 IP를 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)\\bname\\s*=", "(?i)cob0-bnndbp01"]
          sql_must_not_match: ["(?i)hostname\\s*=\\s*.?cob0-bnndbp01"]
          row_count: {eq: 1}
  - id: B-05
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "호스트명이 sbhdbo53인 서버의 CPU 리소스를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "호스트명이 sbhdbo53인 서버의 CPU 리소스를 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)hostname\\s*=", "(?i)sbhdbo53"]
          manual_review: "LOGICALCORE/PHYSICALCORE/MODEL 세 속성이 나오는지"
  - id: B-06
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "비정상 서버 목록과 IP를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "비정상 서버 목록과 IP를 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)avail_status"]
          row_count: {min: 0}
  - id: B-07
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 보여줘"
        expect:
          status: completed
          # 캐스트 타입명은 `numeric|decimal` 양쪽을 인정한다 — EAV 값 컬럼의 숫자 캐스트는
          # 프롬프트가 `AS NUMERIC`으로 내놓아도 D-199 가드(`normalize_eav_unit_casts`)가
          # 단위 인지 정규화 식(`CAST(... AS DECIMAL(31, 6))`)으로 **결정적으로 치환**한다.
          # `numeric`만 요구하면 제품이 옳게 동작해도 불합격이다(run 20260918-182507 B-07·B-08).
          sql_must_match: ["(?i)cast\\s*\\(", "(?i)\\b(numeric|decimal)\\b",
                          "(?i)order\\s+by[\\s\\S]*\\bdesc\\b"]
          sql_must_not_match: ["(?i)as\\s+int(eger)?\\b"]
  - id: B-08
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "서버별 CPU 코어(vcore) 수 합계를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버별 CPU 코어(vcore) 수 합계를 조회해줘"
        expect:
          status: completed
          # B-07 주석 참조 — D-199 가드가 `AS DECIMAL(31, 6)`으로 치환한다.
          sql_must_match: ["(?i)\\b(numeric|decimal)\\b"]
          sql_must_not_match: ["(?i)as\\s+int(eger)?\\b"]
          manual_review: "b0에서 '4.0' 값 캐스트 에러가 없는지"
  - id: B-09
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "장비명이 'cocm-xgzapp09'인 서버의 OS파라미터(커널 파라미터)를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "장비명이 'cocm-xgzapp09'인 서버의 OS파라미터(커널 파라미터)를 조회해줘"
        expect:
          status: completed
          # plans/120 U-2: 보는 것은 "값을 LOB(`stringvalue`) 우선으로 읽는가"다. 종전
          #   `stringvalue_short` 금지는 정답 `COALESCE(cc.stringvalue, cc.stringvalue_short)` 를
          #   조용한 오답으로 떨어뜨렸다(run 20260923-140539 2단 silent_wrong 의 유일한 건).
          #   `stringvalue_short` 만 읽으면 `\bstringvalue\b` 가 없어 불합격이고(`_short` 는 단어 경계가
          #   아니다), 짧은 값을 먼저 두는 `COALESCE(… stringvalue_short, …)` 는 금지다.
          sql_must_match: ["(?i)\\bstringvalue\\b", "(?i)OSParameter"]
          sql_must_not_match: ["(?i)coalesce\\s*\\(\\s*(?:\\w+\\.)?stringvalue_short\\b",
                               "(?i)is_lob\\s*=\\s*1"]
          row_count: {min: 1}
  - id: B-10
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "은행존 전체 서버별 호스트명, IP, 시리얼번호, CPU모델, CPU코어수, 메모리를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "은행존 전체 서버별 호스트명, IP, 시리얼번호, CPU모델, CPU코어수, 메모리를 조회해줘"
        expect:
          status: completed
          sql_must_match: ["(?i)POLESTAR\\.", "(?i)fetch\\s+first"]
          sql_must_not_match: ["(?i)\\blimit\\s+\\d"]
          row_count: {min: 2000}
  - id: B-11
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
        expect:
          status: completed
          sql_must_match: ["(?i)\\blimit\\s+3\\b", "(?i)order\\s+by[\\s\\S]*\\bdesc\\b"]
          row_count: {eq: 3}
  - id: B-12
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
        expect:
          status: completed
          sql_must_match: ["(?i)cmm_metric_stat_m", "(?i)202606"]
          column_must_not_map: ["logicalcore"]
          row_count: {eq: 3}
          manual_review: "값이 0~100 범위인지"
