# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
version: 1
group:
  id: B
  name: "단순 조회 - 서버 구성(EAV)"
  latency_target_ms: 10000
  policy_confirmed: false
  source: "docs/29"
scenarios:
  - id: B-01
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "전체 서버의 호스트명, OS종류, 벤더를 조회해줘"
        expect:
          manual_review: "`cmm_resource` + EAV 피벗(OSType, Vendor), `dtime IS NULL` / 전체 서버 수만큼 행, LIMIT 10,000(전체 키워드)"
  - id: B-02
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "서버 수를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버 수를 조회해줘"
        expect:
          manual_review: "`COUNT(*)` / 1행 1값"
  - id: B-03
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, 호스트네임, CPU 모델, 메모리 용량을 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "cocm-hdkapp01 서버의 OS 종류·버전, IP주소, 호스트네임, CPU 모델, 메모리 용량을 조회해줘"
        expect:
          manual_review: "`r.hostname = ...`, server.Server + server.Cpus + server.Memory 피벗 / 1행, 열 6개"
  - id: B-04
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "장비명이 'cob0-bnndbp01'인 서버의 가용성 상태와 IP를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "장비명이 'cob0-bnndbp01'인 서버의 가용성 상태와 IP를 조회해줘"
        expect:
          manual_review: "**`r.name`** 필터(hostname 아님) / 1행"
  - id: B-05
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "호스트명이 sbhdbo53인 서버의 CPU 리소스를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "호스트명이 sbhdbo53인 서버의 CPU 리소스를 조회해줘"
        expect:
          manual_review: "**`r.hostname`** 필터 / LOGICALCORE/PHYSICALCORE/MODEL"
  - id: B-06
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "비정상 서버 목록과 IP를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "비정상 서버 목록과 IP를 조회해줘"
        expect:
          manual_review: "`avail_status <> 0` / 0건 가능 — 0건이면 \"데이터 없음\" 응답이지 에러 아님"
  - id: B-07
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 보여줘"
        expect:
          manual_review: "`CAST(stringvalue_short AS NUMERIC) >= 8`(정수 캐스트 금지 D-160) / 정렬 확인"
  - id: B-08
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "서버별 CPU 코어(vcore) 수 합계를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버별 CPU 코어(vcore) 수 합계를 조회해줘"
        expect:
          manual_review: "vcore→LOGICALCORE 유사어, NUMERIC 캐스트 / b0에서 `'4.0'` 값 캐스트 에러 없음"
  - id: B-09
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "장비명이 'cocm-xgzapp09'인 서버의 OS파라미터(커널 파라미터)를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "장비명이 'cocm-xgzapp09'인 서버의 OS파라미터(커널 파라미터)를 조회해줘"
        expect:
          manual_review: "`stringvalue`(LOB) 사용 / 긴 텍스트 1행"
  - id: B-10
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "은행존 전체 서버별 호스트명, IP, 시리얼번호, CPU모델, CPU코어수, 메모리를 조회해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "은행존 전체 서버별 호스트명, IP, 시리얼번호, CPU모델, CPU코어수, 메모리를 조회해줘"
        expect:
          manual_review: "DB2: `POLESTAR.` 스키마 한정, `FETCH FIRST`, 소문자 칼럼 / 2,328대 전수(1,328 절단 회귀 감시)"
  - id: B-11
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
        expect:
          manual_review: "`상위 3` → LIMIT 3 / 3행"
  - id: B-12
    plans: [20, 21, 25, 32, 33, 37, 42, 43]
    title: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
        expect:
          manual_review: "`cmm_metric_stat_m`(LOGICALCORE 오매핑 금지) / 3행, 값 0~100"
