# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
version: 1
group:
  id: H
  name: "폼필 (Excel/Word)"
  latency_target_ms: 60000
  policy_confirmed: false
  source: "docs/29"
scenarios:
  - id: H-01
    plans: [10, 19, 72, 73, 58, 35]
    title: "김포 서버로 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/templates/server_list_template.xlsx"
    turns:
      - send:
          query: "김포 서버로 채워줘"
        expect:
          status: completed
          has_file: true
          file: {columns: ["호스트명", "IP주소", "OS종류", "CPU코어수", "제조사", "상태"],
                 filled_rows: {min: 1}}
          manual_review: "서식·열 너비가 보존됐는지 · mapping_sources 가 hint/synonym 인지(LLM 추론 아님)"
  - id: H-02
    plans: [10, 19, 72, 73, 58, 35]
    title: "채워줘 (위치 없음)"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/templates/server_list_template.xlsx"
    turns:
      - send:
          query: "채워줘 (위치 없음)"
        expect:
          status: clarification
          manual_review: "재질문 후 존을 고르면 채움이 이어지는지"
  - id: H-03
    plans: [10, 19, 72, 73, 58, 35]
    title: "여의도 리소스 현황 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/templates/resource_status_template.xlsx"
    turns:
      - send:
          query: "여의도 리소스 현황 채워줘"
        expect:
          status: completed
          has_file: true
          file: {columns: ["서버명", "리소스유형", "리소스명", "상태", "설명"],
                 filled_rows: {min: 1}}
  - id: H-04
    plans: [10, 19, 72, 73, 58, 35]
    title: "은행존 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/scenarios/fixtures/adhoc_server_info.xlsx"
    turns:
      - send:
          query: "은행존 채워줘"
        expect:
          status: completed
          has_file: true
          file: {columns: ["서버명", "호스트명", "IP", "OS버전", "메모리용량", "비고"],
                 filled_rows: {min: 1}}
          sql_must_not_match: ["(?i)\\blimit\\s+\\d"]
          manual_review: "서버명(cmm_resource.name)과 호스트명 열의 값이 서로 다른지 — 같으면 EAV Hostname 으로 잘못 매핑된 것이다(D-148)"
  - id: H-05
    plans: [10, 19, 72, 73, 58, 35]
    title: "2026년 6월 기준으로 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/scenarios/fixtures/adhoc_cpu_memory.xlsx"
    turns:
      - send:
          query: "2026년 6월 기준으로 채워줘"
        expect:
          status: completed
          has_file: true
          file: {columns: ["호스트명", "CPU 평균", "CPU 최고", "메모리 평균"],
                 filled_rows: {min: 1}}
          sql_must_match: ["(?i)cmm_metric_stat_m", "(?i)202606"]
          manual_review: "값이 0~100 범위이고 서버당 1행인지"
  - id: H-06
    plans: [10, 19, 72, 73, 58, 35]
    title: "채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/scenarios/fixtures/adhoc_out_of_domain.xlsx"
    turns:
      - send:
          query: "채워줘"
        expect:
          status: completed
          has_file: true
          response_must_contain: ["[미작성 항목]"]
          manual_review: "TPMC·도입일자·용도 3열이 공란이고 그 사유가 열 이름과 함께 나오는지"
  - id: H-10
    plans: [10, 19, 72, 73, 58, 35]
    title: "2026년 6월 기준 CPU 양식 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/CPU_양식.xlsx"
    turns:
      - send:
          query: "2026년 6월 기준 CPU 양식 채워줘"
        expect:
          status: completed
          has_file: true
          sql_must_match: ["(?i)cmm_metric_stat_m", "(?i)202601", "(?i)202606"]
          manual_review: "평균 6열=avg_val · Peak 6열=max_val · 제조사(모델명)=Vendor+Model 결합 · 처리능력(TPMC)=공란 · 비고=name · [기준월 안내]의 연도가 정확한지"
  - id: H-11
    plans: [10, 19, 72, 73, 58, 35]
    title: "1월부터 6월까지의 데이터를 기준으로 양식을 채우시오"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/CPU_양식.xlsx"
    turns:
      - send:
          query: "1월부터 6월까지의 데이터를 기준으로 양식을 채우시오"
        expect:
          status: completed
          has_file: true
          sql_must_match: ["(?i)202601", "(?i)202606"]
          sql_must_not_match: ["(?i)202607"]
  - id: H-12
    plans: [10, 19, 72, 73, 58, 35]
    title: "채워줘 (기간 없음)"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/CPU_양식.xlsx"
    turns:
      - send:
          query: "채워줘 (기간 없음)"
        expect:
          status: completed
          has_file: true
          response_must_contain: ["[기준월 안내]"]
          manual_review: "기간 지정이 없으면 지난달 끝 기준 6개월인지(실행 시점 의존)"
  - id: H-13
    plans: [10, 19, 72, 73, 58, 35]
    title: "1월부터 3월까지 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/CPU_양식.xlsx"
    turns:
      - send:
          query: "1월부터 3월까지 채워줘"
        expect:
          status: completed
          has_file: true
          response_must_contain: ["[기간 불일치]"]
          manual_review: "나머지 3칸을 어떻게 처리했는지 응답에 명시됐는지"
  - id: H-14
    plans: [10, 19, 72, 73, 58, 35]
    title: "지난 반년 데이터로 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/CPU_양식.xlsx"
    turns:
      - send:
          query: "지난 반년 데이터로 채워줘"
        expect:
          status: completed
          has_file: true
          manual_review: "'지난 반년'이 실행 시점 기준 6개월 범위로 풀렸는지"
  - id: H-15
    plans: [10, 19, 72, 73, 58, 35]
    title: "2026년 6월 기준 메모리 양식 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/메모리_양식.xlsx"
    turns:
      - send:
          query: "2026년 6월 기준 메모리 양식 채워줘"
        expect:
          status: completed
          has_file: true
          sql_must_match: ["(?i)cmm_metric_stat_m", "(?i)202606"]
          manual_review: "리소스=server.Memory('주기억장치' 제목 인식) · 처리능력(GB)=TotalSize 채움"
  - id: H-16
    plans: [10, 19, 72, 73, 58, 35]
    title: "김포 서버 목록 양식 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/서버_목록_리스트_양식.xlsx"
    turns:
      - send:
          query: "김포 서버 목록 양식 채워줘"
        expect:
          status: completed
          has_file: true
          sql_must_not_match: ["(?i)cmm_metric_stat_"]
          manual_review: "용도·도입일자·설치장소·접근통제가 공란 + 사유로 처리됐는지"
  - id: H-17
    plans: [10, 19, 72, 73, 58, 35]
    title: "은행존 2026년 6월 기준 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/CPU_양식.xlsx"
    turns:
      - send:
          query: "은행존 2026년 6월 기준 채워줘"
        expect:
          status: completed
          has_file: true
          sql_must_not_match: ["(?i)\\blimit\\s+\\d"]
          manual_review: "DB2 방언 피벗으로 2,328행이 나왔는지(절단 회귀 감시)"
  - id: H-18
    plans: [10, 19, 72, 73, 58, 35]
    title: "채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/scenarios/fixtures/form_sample.xlsx"
    turns:
      - send:
          query: "채워줘"
        expect:
          manual_review: "원문이 가리키는 `sample/취합 예시1.xlsx`(4행 헤더·3행 부분 병합)가 저장소에 없어 재현하지 못한다. D-145 부정 픽스처 — 픽스처 편입이 선행 조건"
  - id: H-20
    plans: [10, 19, 72, 73, 58, 35]
    title: "cocm-hdkapp01 서버 정보로 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/e2e/fixtures/sample_template.docx"
    turns:
      - send:
          query: "cocm-hdkapp01 서버 정보로 채워줘"
        expect:
          status: completed
          has_file: true
          manual_review: "{{서버명}}·{{IP주소}} 플레이스홀더 치환 · 표 5행 스타일 유지"
  - id: H-21
    plans: [10, 19, 72, 73, 58, 35]
    title: "김포 전체 서버로 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/e2e/fixtures/sample_template.docx"
    turns:
      - send:
          query: "김포 전체 서버로 채워줘"
        expect:
          status: completed
          has_file: true
          manual_review: "표 행이 스타일 복제로 추가됐는지 · 플레이스홀더는 첫 행 값인지"
