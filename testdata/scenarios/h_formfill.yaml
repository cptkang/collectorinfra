# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
version: 1
group:
  id: H
  name: "폼필 (Excel/Word)"
  latency_target_ms: 60000
  policy_confirmed: false
  source: "docs/29"
scenarios:
  - id: H-01
    plans: [10, 19, 72, 73, 58, 35]
    title: "김포 서버로 10건만 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/templates/server_list_template.xlsx"
    turns:
      - send:
          query: "김포 서버로 10건만 채워줘"
        expect:
          status: completed
          has_file: true
          # plans/122 H-4 - 서식·열 너비 보존 = 업로드 원본 대비 사용자 지정 열 너비·병합 셀 대조.
          #   원 수동 문구: "서식·열 너비가 보존됐는지 · mapping_sources 가 hint/synonym 인지(LLM 추론 아님)"
          file: {columns: ["호스트명", "IP주소", "OS종류", "CPU코어수", "제조사", "상태"],
                 filled_rows: {min: 1}, style_preserved: true}
    notes: "plans/122 H-4 - 매핑 출처(mapping_sources 가 hint/synonym 인지)는 응답에 실리지 않아 이 시나리오에서 판정하지 않는다 - plans/110 `94·O-a 잔여` 소관"
  - id: H-02
    plans: [10, 19, 72, 73, 58, 35]
    title: "10건만 채워줘 (위치 없음)"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/templates/server_list_template.xlsx"
    turns:
      - send:
          query: "10건만 채워줘 (위치 없음)"
        expect:
          status: clarification
          clarification: {kind: zone_select}
      # plans/122 A-4 - 두 턴화: 존을 고르면 채움이 이어지는지. 파일 경로 역질문의 답은 파일을 다시 싣는다
      #   (웹 UI 와 같다 - 러너가 시나리오 upload 를 file_stream 턴에 재첨부하고 selected_db_ids 를 Form 으로
      #   보낸다 · 질의는 원문으로 채운다 clarify.complete_payload).
      #   원 수동 문구(턴 1): "재질문 후 존을 고르면 채움이 이어지는지"
      - send:
          selected_db_ids: ["polestar_cm_gp"]
        expect:
          status: completed
          has_file: true
          file: {columns: ["호스트명", "IP주소", "OS종류", "CPU코어수", "제조사", "상태"],
                 filled_rows: {min: 1}}
  - id: H-03
    plans: [10, 19, 72, 73, 58, 35]
    title: "여의도 리소스 현황 10건만 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/templates/resource_status_template.xlsx"
    turns:
      - send:
          query: "여의도 리소스 현황 10건만 채워줘"
        expect:
          status: completed
          has_file: true
          file: {columns: ["서버명", "리소스유형", "리소스명", "상태", "설명"],
                 filled_rows: {min: 1}}
  - id: H-04
    plans: [10, 19, 72, 73, 58, 35]
    title: "은행존 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/scenarios/fixtures/adhoc_server_info.xlsx"
    turns:
      - send:
          query: "은행존 채워줘"
        expect:
          status: completed
          has_file: true
          file: {columns: ["서버명", "호스트명", "IP", "OS버전", "메모리용량", "비고"],
                 optional_columns: ["비고"],
                 # G-4 확정(2026-09-16): '비고'는 DB 대응 컬럼이 없는 자유 서술 열이라
                 # **공란이 정답**이다 — filled_rows 를 깎지 않는다(Y-2). 왜 비었는지는
                 # 응답에 사유로 실린다(CU-9). 픽스처 헤더 실측 2026-09-16.
                 filled_rows: {min: 1},
                 # plans/122 H-4 - 두 열이 전 행에서 같으면(사본) 불합격 - name=hostname 인 정상 서버가 있어 행
                 #   단위 다름은 요구하지 않는다. ⚠ 세 run(20260922-093837 · 20260923-103638 · 20260923-140539)
                 #   산출물은 2,337행 전부 두 열이 같다(b0 name 은 "sicwso01 (이미지 업무 WAS#1)" 꼴인데 서버명
                 #   열이 hostname 으로 채워짐 - D-148 오매핑이 수동에 가려져 있었다) → 이관 뒤 불합격이 정상이다.
                 #   원 수동 문구: "서버명(cmm_resource.name)과 호스트명 열의 값이 서로 다른지 — 같으면
                 #   EAV Hostname 으로 잘못 매핑된 것이다(D-148)"
                 columns_differ: [["서버명", "호스트명"]]}
          # 이 부정 단언은 b0(DB2) 에서 `FETCH FIRST n ROWS` 를 보지 못한다. 방언 중립으로 바꾸면 폼필 표준
          #   상한 `FETCH FIRST 10000 ROWS ONLY`(2,338행 < 상한 - 절단 아님)에 걸려 거짓 불합격이 되므로
          #   바꾸지 않았다(plans/122 A-5 보고). 절단 판정은 행 수 오라클(트랙 O) 소관이다.
          sql_must_not_match: ["(?i)\\blimit\\s+\\d"]
  - id: H-05
    plans: [10, 19, 72, 73, 58, 35]
    title: "2026년 6월 기준으로 10건만 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/scenarios/fixtures/adhoc_cpu_memory.xlsx"
    turns:
      - send:
          query: "2026년 6월 기준으로 10건만 채워줘"
        expect:
          status: completed
          has_file: true
          file: {columns: ["호스트명", "CPU 평균", "CPU 최고", "메모리 평균"],
                 filled_rows: {min: 1},
                 # plans/122 H-4 - 세 열은 사용률(%)이다(열 이름 · docs/29 H-05 "값 0~100"). 상한을 101 로 둔 근거:
                 #   폴스타 측정값 자체가 100 을 조금 넘는다 - 세 run 산출물 `CPU 최고` 최댓값 100.06 · K-09 응답
                 #   cpu_max 최대 100.05 · K-08 응답 100.1. 단위·열 오매핑(바이트·개수·0~1 비율)을 거르는 것이 목적이다.
                 value_range: {"CPU 평균": [0, 101], "CPU 최고": [0, 101], "메모리 평균": [0, 101]}}
          # plans/122 A-2 - 날짜 리터럴 → 기간 의미(D-218 Y-5). 원식: ["(?i)cmm_metric_stat_m", "(?i)202606"]
          sql_must_match: ["(?i)cmm_metric_stat_m"]
          period_covers: {from: "2026-06-01", to: "2026-07-01"}
          # plans/122 T-9 — 명시 기간은 리터럴만(§10.3 ④).
          sql_must_not_match: ["(?i)\\bcurrent[_ ](?:date|timestamp)\\b|\\bnow\\s*\\(|\\bsysdate\\b|\\binterval\\b"]
          # 「서버당 1행」은 `unique_by: [호스트명]` 으로 옮기지 않았다 - 김포에는 호스트명이 같은 서로 다른
          #   서버가 실재한다(세 run 산출물 모두 호스트명 6개가 2~3행 · 행마다 값이 다르다 · D-148). 양식 키가
          #   호스트명뿐이라 서버 단위 유일성은 행 수 오라클(트랙 O · 활성 서버 수) 소관이다.
          #   원 수동 문구: "값이 0~100 범위이고 서버당 1행인지"
          manual_review: "서버당 1행인지(호스트명 중복 서버가 실재해 unique_by 로 판정 불가 - 행 수 오라클 소관)"
  - id: H-06
    plans: [10, 19, 72, 73, 58, 35]
    title: "10건만 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "testdata/scenarios/fixtures/adhoc_out_of_domain.xlsx"
    turns:
      - send:
          query: "10건만 채워줘"
        expect:
          status: completed
          has_file: true
          # plans/120 U-4: 제품은 3열을 폼필 역질문(D-151)으로 먼저 묻고, 러너는 "전 필드 공란"으로
          #   자동 응답한다(D-216). 사용자가 지정한 공란은 `[미작성 항목]` 에서 빠지고 대신
          #   `[사용자 답변 적용 내역]` 에 열마다 `공란 유지 적용` 으로 실린다(output_generator 결정적
          #   덧붙임 - plans/119 N-1 이후에도 LLM 요약 밖이다). 둘 중 하나면 사유 고지가 성립한다.
          response_must_contain_any:
            - "[미작성 항목]"
            - ["[사용자 답변 적용 내역]", "TPMC: 공란 유지", "도입일자: 공란 유지", "용도: 공란 유지"]
          # plans/122 H-4 - 도메인 밖 3열은 공란이 정답이다(채워지면 불합격). 사유 고지는 위 선택지가 본다.
          #   세 run(20260922-093837 · 20260923-103638 · 20260923-140539 두 arm) 산출물 전부 3열 0/1689 채움.
          #   tests/test_scenario/test_plan120_harness.py U4 테스트는 산출물 없는 합성 관측이라 `file` 을 빼고
          #   응답 선택지만 판정한다(그 테스트 독스트링).
          #   원 수동 문구: "TPMC·도입일자·용도 3열이 공란이고 그 사유가 열 이름과 함께 나오는지"
          file: {empty_columns: ["TPMC", "도입일자", "용도"]}
  - id: H-10
    plans: [10, 19, 72, 73, 58, 35]
    title: "2026년 6월 기준 CPU 양식을 10건만 채워줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/CPU_양식.xlsx"
    turns:
      - send:
          query: "2026년 6월 기준 CPU 양식을 10건만 채워줘"
        expect:
          status: completed
          has_file: true
          # plans/122 A-2 - 날짜 리터럴 → 기간 의미. 원식: ["(?i)cmm_metric_stat_m", "(?i)202601", "(?i)202606"]
          sql_must_match: ["(?i)cmm_metric_stat_m"]
          period_covers: {from: "2026-01-01", to: "2026-07-01"}
          # plans/122 T-9 — 명시 기간은 리터럴만(§10.3 ④).
          sql_must_not_match: ["(?i)\\bcurrent[_ ](?:date|timestamp)\\b|\\bnow\\s*\\(|\\bsysdate\\b|\\binterval\\b"]
          # plans/122 A-1 - [기준월 안내]의 연도: 제품 문구 `**[기준월 안내]** 월별 사용률 칼럼은 {시작}부터
          #   {끝}까지 (…) 데이터로 채웠습니다`(src/nodes/output_generator.py:1548-1553 · 월 표기 `YYYY년 M월`
          #   :1050-1054). docs/29 H-10 M=202601 … M+5=202606.
          response_must_contain: ["[기준월 안내]", "2026년 1월부터 2026년 6월까지"]
          # plans/122 H-4 - CPU_양식은 1행이 제목이고 머리글이 5·6행 2단(E5:J5 · K5:P5 가로 병합)이다 →
          #   `header_rows: [5, 6]`(이름 규칙 `상위/하위` - scripts/scenario/assertions.py `_header_view`).
          #   평균 6열·Peak 6열은 사용률(%)로 채워져야 한다 - 상한 101 은 H-05 와 같은 근거(폴스타 Peak 측정값
          #   100.06). 이 단언은 「숫자 사용률로 채움」을 보고 평균↔Peak 방향(avg_val·max_val)은 보지 못한다.
          #   처리능력(TPMC)은 공란이 정답이다.
          #   ⚠ 이관 뒤 불합격이 정상이다: 세 run 산출물은 12열이 전부 공란(폼필 역질문에 러너 자동응답
          #   「전 필드 공란」이 적용됨 - 응답 `[사용자 답변 적용 내역]` 월중평균사용률(최근 6개월간) > M: 공란 유지)이고
          #   처리능력(TPMC) 열은 메모리 용량("31.1 GB")으로 채워졌다(D-148 반례).
          file:
            header_rows: [5, 6]
            value_range:
              "월중평균사용률(최근 6개월간)/M": [0, 101]
              "월중평균사용률(최근 6개월간)/M+1": [0, 101]
              "월중평균사용률(최근 6개월간)/M+2": [0, 101]
              "월중평균사용률(최근 6개월간)/M+3": [0, 101]
              "월중평균사용률(최근 6개월간)/M+4": [0, 101]
              "월중평균사용률(최근 6개월간)/M+5": [0, 101]
              "월중 Peak시 사용률(최근 6개월간)/M": [0, 101]
              "월중 Peak시 사용률(최근 6개월간)/M+1": [0, 101]
              "월중 Peak시 사용률(최근 6개월간)/M+2": [0, 101]
              "월중 Peak시 사용률(최근 6개월간)/M+3": [0, 101]
              "월중 Peak시 사용률(최근 6개월간)/M+4": [0, 101]
              "월중 Peak시 사용률(최근 6개월간)/M+5": [0, 101]
            empty_columns: ["처리능력/(TPMC)"]
          # 남은 항목은 값의 **출처·형식**이라 단언 키가 없다(file 에 열 간 대소·열 값 정규식·DB 대조 키 없음).
          #   원 수동 문구: "평균 6열=avg_val · Peak 6열=max_val · 제조사(모델명)=Vendor+Model 결합 ·
          #   처리능력(TPMC)=공란 · 비고=name · [기준월 안내]의 연도가 정확한지"
          manual_review: "평균 6열=avg_val·Peak 6열=max_val 방향(value_range 는 사용률 채움만 본다) · 제조사(모델명)=Vendor+Model 결합 · 비고=name"
  - id: H-11
    plans: [10, 19, 72, 73, 58, 35]
    title: "1월부터 6월까지의 데이터를 기준으로 양식을 10건만 채우시오"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/CPU_양식.xlsx"
    turns:
      - send:
          query: "1월부터 6월까지의 데이터를 기준으로 양식을 10건만 채우시오"
        expect:
          status: completed
          has_file: true
          # plans/122 A-2 - 날짜 리터럴 → 기간 의미. 원식: sql_must_match: ["(?i)202601", "(?i)202606"]
          #   부정 단언(2~7월 밀림 D-176 가드)은 그대로 둔다 - period_covers 는 「덮는다」만 본다.
          period_covers: {from: "2026-01-01", to: "2026-07-01"}
          # plans/122 T-9 — 월 칼럼은 월 통계(입도) · 리터럴만(§10.3 ④ — 함수식 부정 단언을 더했다).
          #   7월 부정 단언(D-176 가드)은 **배타 끝 `< '202607'`** 을 허용하도록 좁혔다(종전 `(?i)202607`) — 시간
          #   해석 기본 on(D-306) 표준형 `s.stat_date < '202607'` 이 7월을 읽지 않는데도 떨어졌다(C-04 와 같은 사유).
          #   7월을 포함하는 표기('202607' · '20260701' · '2026070100' 등호·BETWEEN·`<=`)는 그대로 잡는다.
          #   세 run 의 H-11 SQL 에 202607 은 0건이라 과거 판정은 같다.
          sql_must_match: ["(?i)\\bcmm_metric_stat_m\\b"]
          sql_must_not_match: ["(?i)(?:[^<\\s]|<=)\\s*'202607", "(?i)\\bcurrent[_ ](?:date|timestamp)\\b|\\bnow\\s*\\(|\\bsysdate\\b|\\binterval\\b"]
  - id: H-12
    plans: [10, 19, 72, 73, 58, 35]
    title: "10건만 채워줘 (기간 없음)"
    kind: normal
    env: closed
    profile: baseline
    endpoint: file_stream
    upload: "tests/fixtures/forms/CPU_양식.xlsx"
    turns:
      - send:
          query: "10건만 채워줘 (기간 없음)"
        expect:
          status: completed
          has_file: true
          response_must_contain: ["[기준월 안내]"]
          # plans/122 H-2 - 지난달 끝 기준 6개월 = 앵커(턴 송신 시각 KST) 기준 완결 6개월
          #   (src/domain/time_spec.relative_window · 예: 앵커 2026-09-23 → [2026-03-01, 2026-09-01)).
          #   원 수동 문구: "기간 지정이 없으면 지난달 끝 기준 6개월인지(실행 시점 의존)"
