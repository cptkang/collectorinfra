# R1 - 복합 프롬프트 (plans/94 §3.7)
#
# R1의 판정은 "정답 SQL"이 아니라 (1)분해가 맞았는가 (2)부분 실패가 침묵하지 않았는가
# (3)예산 안에 끝났는가 다. 대조군을 강제하지 않는 유일한 R군이다 - 분해 정확도 축이라
# 가드를 유발하지 않기 때문이다(catalog.CONTROL_REQUIRED_KINDS).
version: 1
group:
  id: R1
  name: "복합 프롬프트"
  latency_target_ms: 30000
  policy_confirmed: false
  source: "plans/94 §3.7 R1"
scenarios:
  - id: R1-01
    plans: [88, 82, 80]
    title: "다중 의도 1문장 - 목록 + 조건부 알람 이력"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial, clarify]
    turns:
      - send:
          query: "은행존 서버 목록 보여주고, 그중 CPU 90% 넘는 건 알람 이력도 같이 알려줘"
        expect:
          status: completed
          row_count: {min: 1}
          manual_review: "분해가 2개 작업으로 떨어졌는가. 선행 0건일 때 후속이 침묵하지 않는가(D-203 게이트 노트)"
    perf: {target_ms: 30000}
    teardown: [drop_thread]
    notes: "순차 의존 계약 7종 기본 on (D-203)"

  - id: R1-02
    plans: [82, 90, 75]
    title: "다중 존 x 다중 지표 - 존별 상위 5대"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial]
    turns:
      - send:
          query: "김포와 여의도 서버의 CPU, 메모리, 디스크 사용률을 존별로 나눠서 상위 5대씩"
        expect:
          status: completed
          sql_must_not_match: ["(?i)\\bdelete\\b", "(?i)\\bupdate\\b"]
          manual_review: "존 라벨이 응답에서 구분되는가. 존 그룹 순차 실행이 일어났는가. 토큰 예산(D-159) 초과 없는가"
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-03
    plans: [10, 19, 72]
    title: "조회 + 문서 산출 동시"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial]
    turns:
      - send:
          query: "전체 서버 사양을 엑셀로 만들어주고, 그중 메모리 64GB 이상만 따로 표로 보여줘"
        expect:
          status: completed
          has_file: true
          manual_review: "산출물과 인라인 응답이 동시에 나오는가. 두 요구 중 하나가 조용히 빠지지 않는가"
    perf: {target_ms: 60000}
    teardown: [drop_thread]

  - id: R1-04
    plans: [61, 69]
    title: "기간 + 집계 + 정렬 + 조건 (HAVING)"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer]
    turns:
      - send:
          query: "최근 3개월 동안 월평균 CPU가 70% 넘은 적이 있는 서버를 상승폭 순으로"
        expect:
          status: completed
          sql_must_match: ["(?i)cmm_metric_stat_"]
          manual_review: "방언 캐스트가 집계 **전**에 오는가(::numeric / CAST AS DECIMAL). HAVING 이 쓰였는가"
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-05
    plans: [88, 81, 82]
    title: "순차 의존 3단 - 알람 -> 프로세스 -> OS 파라미터"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial, guide]
    turns:
      - send:
          query: "장애 알람이 났던 서버를 찾고, 그 서버들의 프로세스를 본 다음, OS 파라미터까지 정리해줘"
        expect:
          manual_review: "선행 스코프가 하위 단으로 전파되는가. 중간 0건일 때 하위 단이 전체 조회로 퍼지지 않는가"
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-06
    plans: [75, 82, 90]
    title: "조건 상충 가능 - 모순 지시 감지"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [clarify, partial]
    turns:
      - send:
          query: "전체 서버 중 상위 10대만, 근데 은행존은 빼고 전체로"
        expect:
          manual_review: "모순을 감지해 되묻는가. 조용히 한쪽을 임의 선택하지 않는가"
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-07
    plans: [88, 80]
    title: "다중 의도 + 비교 요구"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial]
    turns:
      - send:
          query: "김포와 여의도 서버 수를 비교하고, 차이가 큰 쪽의 OS 분포도 알려줘"
        expect:
          manual_review: "비교 결과가 후속 작업의 입력으로 실제로 쓰이는가(input_from)"
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-08
    plans: [44, 45, 88]
    title: "알람 + 자원 교차"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial]
    turns:
      - send:
          query: "어제 심각 알람이 3건 이상 난 서버의 메모리 용량과 벤더를 같이 보여줘"
        expect:
          manual_review: "알람 집계 조건(HAVING count>=3)과 EAV 피벗이 한 응답에 합쳐지는가"
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-09
    plans: [50, 88]
    title: "복합 요구를 멀티턴으로 쪼개 던짐"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, clarify]
    turns:
      - send:
          query: "CPU 사용률 상위 5대 서버 알려줘"
        expect:
          row_count: {min: 1}
          manual_review: "1턴이 정상 응답인가"
      - send:
          query: "그 서버들 중에 메모리가 64GB 넘는 것만 다시"
        expect:
          manual_review: "직전 5대로 스코프가 승계되는가. 전체로 퍼지지 않는가"
    perf: {target_ms: 30000, applies_to_turn: 2}
    teardown: [drop_thread]

  - id: R1-10
    plans: [78, 91, 50]
    title: "조회 + 원인 추론 동시 요구"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial, guide]
    turns:
      - send:
          query: "어제 CPU가 급등한 서버를 찾고 왜 그랬는지도 분석해줘"
        expect:
          manual_review: "조사 기능이 off 인 baseline 에서 '분석' 요구가 조용히 무시되지 않고 한계가 고지되는가"
    perf: {target_ms: 30000}
    teardown: [drop_thread]
