# R1 - 복합 프롬프트 (plans/94 §3.7)
#
# R1의 판정은 "정답 SQL"이 아니라 (1)분해가 맞았는가 (2)부분 실패가 침묵하지 않았는가
# (3)예산 안에 끝났는가 다. 대조군을 강제하지 않는 유일한 R군이다 - 분해 정확도 축이라
# 가드를 유발하지 않기 때문이다(catalog.CONTROL_REQUIRED_KINDS).
version: 1
group:
  id: R1
  name: "복합 프롬프트"
  latency_target_ms: 30000
  # plans/123 CT-1 · 123·G-2 (b) · D-280 ② — 케이스별 허용 집합을 정정한 뒤 등급 정책을 확정한다.
  #   선언 밖 등급은 이제 불합격이다(종전 manual). 금지 3종은 종전대로 항상 불합격.
  policy_confirmed: true
  # plans/123 V-4 — 불변식 활성 선언. 값 = 판정에 넣기 시작하는 run 표지(null 은 트리아지만).
  #   활성도 응답 고지(done.disclosures)를 수집한 run(W-8 이후 러너)에서만 판정에 들어간다.
  invariants:
    limit_disclosed: R5          # 123 W-1(상한 도달 고지) 랜딩 run
    zone_coverage_named: R5      # 123 W-2·W-5(좁힌 범위 · 「전체가 아니라」) 랜딩 run
    upload_misattributed: R5     # 295feee(D-264 ④) — 러너가 고지를 수집하는 첫 run 부터
    empty_template_misuse: null  # 123 S-4a 가 섀도(D-280 ⑧) — run R5′ on 전환 때 활성
    overgeneralization: null     # 121 TP-4.4 ② 랜딩 뒤
    demonstrative_bulk: null     # 106 H1 되묻기 게이트(G-6 · S-7(b) 트리거) 랜딩 뒤
  source: "plans/94 §3.7 R1"
scenarios:
  - id: R1-01
    plans: [88, 82, 80]
    title: "다중 의도 1문장 - 목록 + 조건부 알람 이력"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial, clarify]
    turns:
      - send:
          query: "은행존 서버 목록 보여주고, 그중 CPU 90% 넘는 건 알람 이력도 같이 알려줘"
        expect:
          status: completed
          row_count: {min: 1}
          # plans/121 TP-0.3 - 순차 표지 "그중"(D-203 ②)이라 서버 목록 → 알람 이력 input_from 간선이
          # 계약이다(없으면 제품이 1회 재분해하고 sequential_not_applied 를 남긴다). 알람 이력은
          # alarm_query 담당이다 - data_query 로 남으면 알람 테이블에 닿지 못한다(D-086 ④).
          # 선행 0건 → 후속 미실행·게이트 노트는 D-203 ① 코드 계약이 간선 위에서 보장한다.
          # (종전 수동 검토: "분해가 2개 작업으로 떨어졌는가. 선행 0건일 때 후속이 침묵하지 않는가")
          plan: {min_tasks: 2, edges: [[data_query, alarm_query]]}
    perf: {target_ms: 30000}
    teardown: [drop_thread]
    notes: "순차 의존 계약 7종 기본 on (D-203)"

  - id: R1-02
    plans: [82, 90, 75]
    title: "다중 존 x 다중 지표 - 존별 상위 5대"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial]
    turns:
      - send:
          query: "김포와 여의도 서버의 CPU, 메모리, 디스크 사용률을 존별로 나눠서 상위 5대씩"
        expect:
          status: completed
          sql_must_not_match: ["(?i)\\bdelete\\b", "(?i)\\bupdate\\b"]
          manual_review: "존 라벨이 응답에서 구분되는가. 존 그룹 순차 실행이 일어났는가. 토큰 예산(D-159) 초과 없는가"
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-03
    plans: [10, 19, 72]
    title: "조회 + 문서 산출 동시"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    # plans/123 CT-3 · 123·G-7 (a) · D-264 ④ — 업로드 없는 「엑셀로」는 파일을 만들지 않고 알린다.
    #   둘째 요구(64GB 이상 표)는 guide·partial 도 허용한다.
    response_modes: [answer, partial, guide]
    turns:
      - send:
          query: "전체 서버 사양을 엑셀로 만들어주고, 그중 메모리 64GB 이상만 따로 표로 보여줘"
        expect:
          status: completed
          # A-12형 - 양식이 없으면 파일이 없는 것이 정답이다(D-264 ④ 유지 · 123·G-7 (a)).
          has_file: false
          response_must_contain: ["양식 파일이 첨부되지 않아"]
          # 121·TP-0.3 의 `plan: {min_tasks: 2}` 는 같은 변경으로 뺐다(D-280 ⑦) - 원문 「전체 … 서버」가
          #   앞단 존 게이트를 발동해 답 턴이 단일 task 로 확정되는 경로라 구조적으로 불합격이었다
          #   (123 §2.6). 64GB 행 단언은 121·U-23(복합 행 단계 식별) 선행.
    perf: {target_ms: 60000}
    teardown: [drop_thread]

  - id: R1-04
    plans: [61, 69]
    title: "기간 + 집계 + 정렬 + 조건 (HAVING)"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer]
    turns:
      - send:
          query: "최근 3개월 동안 월평균 CPU가 70% 넘은 적이 있는 서버를 상승폭 순으로"
        expect:
          status: completed
          sql_must_match: ["(?i)cmm_metric_stat_"]
          manual_review: "방언 캐스트가 집계 **전**에 오는가(::numeric / CAST AS DECIMAL). HAVING 이 쓰였는가"
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-05
    plans: [88, 81, 82]
    title: "순차 의존 3단 - 알람 -> 프로세스 -> OS 파라미터"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial, guide]
    turns:
      - send:
          query: "장애 알람이 났던 서버를 찾고, 그 서버들의 프로세스를 본 다음, OS 파라미터까지 정리해줘"
        expect:
          # plans/121 TP-0.3 - 순차 표지("찾고"·"그 서버" - D-203 ②) 3단: 알람 → 프로세스(실시간 API ·
          # D-046) → OS 파라미터. OS 파라미터 task 는 앞 두 단 중 어느 결과를 받아도 된다("*").
          # 중간 0건이면 하위 단 미실행은 D-203 ① 게이트가 간선 위에서 보장한다.
          # (종전 수동 검토: "선행 스코프가 하위 단으로 전파되는가. 중간 0건일 때 하위 단이 전체
          #  조회로 퍼지지 않는가")
          plan:
            min_tasks: 3
            agents: [alarm_query, process_query, data_query]
            edges: [[alarm_query, process_query], ["*", data_query]]
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-06
    plans: [75, 82, 90]
    title: "조건 상충 가능 - 모순 지시 감지"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    # plans/123 CT-1 - 한쪽을 골랐다고 밝힌 응답(correct)도 허용한다. 말없이 고른 answer 가 오답이다.
    response_modes: [clarify, partial, correct]
    turns:
      - send:
          query: "전체 서버 중 상위 10대만, 근데 은행존은 빼고 전체로"
        expect:
          # 종전 수동 검토("모순을 감지해 되묻는가. 조용히 한쪽을 임의 선택하지 않는가")는 허용 등급이 판정한다.
          status_any: [completed, clarification]
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-07
    plans: [88, 80]
    title: "다중 의도 + 비교 요구"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial]
    turns:
      - send:
          query: "김포와 여의도 서버 수를 비교하고, 차이가 큰 쪽의 OS 분포도 알려줘"
        expect:
          manual_review: "비교 결과가 후속 작업의 입력으로 실제로 쓰이는가(input_from)"
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-08
    plans: [44, 45, 88]
    title: "알람 + 자원 교차"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial]
    turns:
      - send:
          query: "어제 심각 알람이 3건 이상 난 서버의 메모리 용량과 벤더를 같이 보여줘"
        expect:
          # plans/121 TP-0.3 - D-086 · 분해 프롬프트 예시 3-1: 알람으로 서버를 고른 뒤 그 서버들의
          # 설정 값(메모리·벤더)을 조회하는 질의는 2 task 분해가 정답이다. 집계 조건("3건 이상")은
          # count( 로, EAV 피벗은 E-07 과 같은 표지(core_config_prop)로 SQL 에서 본다.
          # (종전 수동 검토: "알람 집계 조건(HAVING count>=3)과 EAV 피벗이 한 응답에 합쳐지는가")
          sql_must_match: ["(?i)\\bcount\\s*\\(", "(?i)\\bcore_config_prop\\b"]
          plan: {min_tasks: 2, edges: [[alarm_query, data_query]]}
    perf: {target_ms: 30000}
    teardown: [drop_thread]

  - id: R1-09
    plans: [50, 88]
    title: "복합 요구를 멀티턴으로 쪼개 던짐"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    # plans/123 CT-1 - 승계한 5대 중 64GB 초과가 없으면 0건 템플릿이 정답이다(정상 0건 대조군).
    response_modes: [answer, clarify, empty_template]
    turns:
      - send:
          query: "CPU 사용률 상위 5대 서버 알려줘"
        expect:
          # plans/121 TP-0.3 - "정상 응답"은 완료 + 1행 이상으로 판정한다(종전 수동 검토: "1턴이 정상 응답인가").
          status: completed
          row_count: {min: 1}
      - send:
          query: "그 서버들 중에 메모리가 64GB 넘는 것만 다시"
        expect:
          # plans/123 CT-7 - 종전 수동 검토("직전 5대로 스코프가 승계되는가. 전체로 퍼지지 않는가")를
          #   기계 단언으로 옮겼다 - 승계했으면 앞 턴의 5대를 넘을 수 없다.
          status: completed
          row_count: {max: 5}
    perf: {target_ms: 30000, applies_to_turn: 2}
    teardown: [drop_thread]

  - id: R1-10
    plans: [78, 91, 50]
    title: "조회 + 원인 추론 동시 요구"
    kind: compound
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    response_modes: [answer, partial, guide]
    turns:
      - send:
          query: "어제 CPU가 급등한 서버를 찾고 왜 그랬는지도 분석해줘"
        expect:
          manual_review: "조사 기능이 off 인 baseline 에서 '분석' 요구가 조용히 무시되지 않고 한계가 고지되는가"
    perf: {target_ms: 30000}
    teardown: [drop_thread]
