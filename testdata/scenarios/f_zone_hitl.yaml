# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
version: 1
group:
  id: F
  name: "존 선택 HITL/멀티DB"
  latency_target_ms: 30000
  policy_confirmed: false
  source: "docs/29"
scenarios:
  # ★ 단언 이관 완료 사례 (plans/94 §3.2 정본 예시).
  #   HITL 은 자동화된다 - 역질문은 응답 `clarification`(schemas.py:115)으로 오고 답은
  #   자연어가 아니라 구조화 필드 `selected_db_ids`(:43)로 보낸다. docs/29 가 F군을
  #   수동으로 둔 전제는 이미 깨져 있다(§0.3-2).
  - id: F-01
    plans: [82, 90, 75]
    title: "존 선택 역질문 -> 단일 존 선택"
    kind: normal
    env: closed
    profile: baseline
    cache_state: warm
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "전체 서버 OS 종류 알려줘"
        expect:
          status: clarification
          clarification: {kind: zone_select, options_len: 3}
      - send:
          selected_db_ids: ["polestar_cm_gp"]
        expect:
          status: completed
          sql_must_match: ["(?i)\\blimit\\s+10000\\b"]
          sql_must_not_match: ["(?i)여의도"]
          row_count: {min: 1}
    perf: {target_ms: 30000, applies_to_turn: 2}
    teardown: [drop_thread]
    notes: "D-154 - 원문의 '여의도' 언급이 WHERE 로 새지 않는다"
    # 무과금 모의 실행에서 이 시나리오가 HITL 2턴을 실제로 왕복하는지 검증한다(V6).
    mock:
      turns:
        - response: "어느 존을 조회할까요?"
          executed_sql: null
          row_count: null
          clarification:
            kind: zone_select
            question: "어느 존을 조회할까요?"
            options:
              - {db_id: polestar_b0, label: "은행존"}
              - {db_id: polestar_cm_gp, label: "공동존(김포)"}
              - {db_id: polestar_cm_yd, label: "공동존(여의도)"}
        - response: "김포 공동존 서버 OS 종류입니다."
          executed_sql: "SELECT hostname, os_type FROM polestar.cmm_resource LIMIT 10000"
          row_count: 12
          processing_time_ms: 8200
  - id: F-02
    plans: [82, 90, 75]
    title: "전체 서버 OS 종류 알려줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "전체 서버 OS 종류 알려줘"
        expect:
          status: clarification
          clarification: {kind: zone_select}
      - send:
          selected_db_ids: ["polestar_cm_gp", "polestar_cm_yd"]
        expect:
          status: completed
          db_ids: ["polestar_cm_gp", "polestar_cm_yd"]
          row_count: {min: 1}
          manual_review: "두 DB 결과가 존 라벨로 구분돼 병합됐는지"
    teardown: [drop_thread]
  - id: F-03
    plans: [82, 90, 75]
    title: "은행존 및 공동존 여의도 센터의 모든 서버들 OS종류"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "은행존 및 공동존 여의도 센터의 모든 서버들 OS종류"
        expect:
          status: clarification
          manual_review: "재질문 종류가 group_exclusive 인지(존 그룹 상호배타)"
      - send:
          selected_db_ids: ["polestar_b0"]
        expect:
          status: completed
          db_ids: ["polestar_b0"]
          # D-154 - 선택에서 빠진 존의 원문 표면어가 WHERE 로 새면 안 된다.
          sql_must_not_match: ["(?i)여의도"]
    teardown: [drop_thread]
  - id: F-04
    plans: [82, 90, 75]
    title: "ㅇㅇ존 서버 CPU 사용률"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "ㅇㅇ존 서버 CPU 사용률"
        expect:
          status: clarification
          clarification: {kind: zone_select}
      - send:
          selected_db_ids: ["polestar_cm_yd"]
        expect:
          status: completed
          db_ids: ["polestar_cm_yd"]
          # 식별 불가 표면어가 필터로 새면 안 된다.
          sql_must_not_match: ["(?i)ㅇㅇ존"]
    teardown: [drop_thread]
  - id: F-05
    plans: [82, 90, 75]
    title: "호스트명이 sbhdbo53인 서버의 CPU"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "호스트명이 sbhdbo53인 서버의 CPU"
        expect:
          status: completed
          sql_must_match: ["(?i)hostname\\s*=", "(?i)sbhdbo53"]
  - id: F-06
    plans: [82, 90, 75]
    title: "존 선택 후 후속 턴이 DB 를 승계한다"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "전체 서버 OS 종류 알려줘"
        expect:
          status: clarification
      - send:
          selected_db_ids: ["polestar_cm_gp"]
        expect:
          status: completed
          db_ids: ["polestar_cm_gp"]
      - send:
          query: "그 서버들의 메모리도"
        # 여기서 역질문이 오면 승계 회귀다 - 자동 응답이 답해 버리면 회귀가 가려진다(D-216).
        auto_answer: false
        expect:
          # 재질문 없이 앞 턴의 존을 그대로 쓴다 - clarification 이 오면 승계 회귀다.
          status: completed
          db_ids: ["polestar_cm_gp"]
    teardown: [drop_thread]
  - id: F-07
    plans: [82, 90, 75]
    title: "김포와 여의도 서버의 CPU 사용률을 비교해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "김포와 여의도 서버의 CPU 사용률을 비교해줘"
        expect:
          status: completed
          db_ids: ["polestar_cm_gp", "polestar_cm_yd"]
          manual_review: "멀티 경로 토큰 예산(D-159) 안에서 비교 표가 나왔는지"
  - id: F-08
    plans: [82, 90, 75]
    title: "공동존 전체 서버 수"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "공동존 전체 서버 수"
        expect:
          status: completed
          db_ids: ["polestar_cm_gp", "polestar_cm_yd"]
          sql_must_match: ["(?i)count\\s*\\("]
  # 역질문 자동 응답(D-216). 턴이 역질문을 기대하지 않으므로 러너가 존 선택에 스스로 답하고
  # (config/scenarios/auto_answer.yaml 우선 존 = 김포) 답을 받은 뒤의 응답으로 판정한다.
  - id: F-09
    plans: [82, 90, 75, 94]
    title: "존 역질문에 스크립트가 자동 응답해 완료까지 간다"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    response_modes: [answer]
    turns:
      - send:
          query: "전체 서버 수 알려줘"
        expect:
          status: completed
          db_ids: ["polestar_cm_gp"]
          row_count: {min: 1}
    teardown: [drop_thread]
    mock:
      turns:
        - response: "조회할 존이 지정되지 않았습니다."
          executed_sql: null
          row_count: null
          clarification:
            kind: zone_select
            question: "조회할 존이 지정되지 않았습니다."
            original_query: "전체 서버 수 알려줘"
            options:
              - {db_id: polestar_b0, label: "은행존"}
              - {db_id: polestar_cm_gp, label: "공동존(김포)"}
              - {db_id: polestar_cm_yd, label: "공동존(여의도)"}
          # 러너가 답한 뒤의 응답. db_scope 는 모의 서버가 받은 selected_db_ids 로 채운다.
          answer:
            response: "김포 공동존 서버는 12대입니다."
            executed_sql: "SELECT COUNT(*) FROM polestar.cmm_resource"
            row_count: 1
