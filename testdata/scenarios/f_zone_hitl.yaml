# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
version: 1
group:
  id: F
  name: "존 선택 HITL/멀티DB"
  latency_target_ms: 30000
  policy_confirmed: false
  source: "docs/29"
scenarios:
  # ★ 단언 이관 완료 사례 (plans/94 §3.2 정본 예시).
  #   HITL 은 자동화된다 - 역질문은 응답 `clarification`(schemas.py:115)으로 오고 답은
  #   자연어가 아니라 구조화 필드 `selected_db_ids`(:43)로 보낸다. docs/29 가 F군을
  #   수동으로 둔 전제는 이미 깨져 있다(§0.3-2).
  - id: F-01
    plans: [82, 90, 75]
    title: "존 선택 역질문 -> 단일 존 선택"
    kind: normal
    env: closed
    profile: baseline
    cache_state: warm
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "전체 서버 OS 종류 알려줘"
        expect:
          status: clarification
          clarification: {kind: zone_select, options_len: 3}
      - send:
          selected_db_ids: ["polestar_cm_gp"]
        expect:
          status: completed
          # plans/122 A-5 - 방언 중립(DB2 는 `FETCH FIRST n ROWS`). 원식: ["(?i)\\blimit\\s+10000\\b"]
          sql_must_match: ["(?i)\\blimit\\s+10000\\b|\\bfetch\\s+first\\s+10000\\s+rows\\b"]
          sql_must_not_match: ["(?i)여의도"]
          row_count: {min: 1}
    perf: {target_ms: 30000, applies_to_turn: 2}
    teardown: [drop_thread]
    notes: "D-154 - 원문의 '여의도' 언급이 WHERE 로 새지 않는다"
    # 무과금 모의 실행에서 이 시나리오가 HITL 2턴을 실제로 왕복하는지 검증한다(V6).
    mock:
      turns:
        - response: "어느 존을 조회할까요?"
          executed_sql: null
          row_count: null
          clarification:
            kind: zone_select
            question: "어느 존을 조회할까요?"
            options:
              - {db_id: polestar_b0, label: "은행존"}
              - {db_id: polestar_cm_gp, label: "공동존(김포)"}
              - {db_id: polestar_cm_yd, label: "공동존(여의도)"}
        - response: "김포 공동존 서버 OS 종류입니다."
          executed_sql: "SELECT hostname, os_type FROM polestar.cmm_resource LIMIT 10000"
          row_count: 12
          processing_time_ms: 8200
  - id: F-02
    plans: [82, 90, 75]
    title: "전체 서버 OS 종류 알려줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "전체 서버 OS 종류 알려줘"
        expect:
          status: clarification
          clarification: {kind: zone_select}
      - send:
          selected_db_ids: ["polestar_cm_gp", "polestar_cm_yd"]
        expect:
          status: completed
          db_ids: ["polestar_cm_gp", "polestar_cm_yd"]
          # plans/122 A-3 - 2개 DB 팬아웃 턴이라 `row_count`(단일 DB 전용)는 보류였다.
          #   원식: row_count: {min: 1}
          row_count_per_db: {min: 1}
          # plans/122 A-1 - 존 라벨 = 멀티 DB 병합 응답의 결정적 존별 건수 줄(src/nodes/output_generator.py:1433
          #   `**[존별 결과]** {레지스트리 display_name} N건 · …`). 표의 "출처" 열도 같은 display_name 이다(:871).
          #   원 수동 문구: "두 DB 결과가 존 라벨로 구분돼 병합됐는지"
          response_must_contain: ["[존별 결과]", "김포", "여의도"]
    teardown: [drop_thread]
  - id: F-03
    plans: [82, 90, 75]
    title: "은행존 및 공동존 여의도 센터의 모든 서버들 OS종류 10건만"
    kind: normal
    env: closed
    # plans/120 U-5: 턴 1 역질문은 존 그룹 상호배타(`ZONE_GROUP_EXCLUSIVE=true`)가 전제다. 기본값
    #   false(D-206 후속1)에서는 두 존을 조회해 답하는 것이 정답이라 기본 프로파일에서 반드시
    #   떨어졌다(run 20260923-140539). D-220 ③ 선례대로 옵트인 프로파일로 옮긴다 - **서버 기동이
    #   1회 늘어난다**(프로파일 1개 = 기동 1회 · arm 을 얹으면 arm 마다 1회).
    profile: optin_zone_exclusive
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "은행존 및 공동존 여의도 센터의 모든 서버들 OS종류 10건만"
        expect:
          status: clarification
          # plans/122 A-1 - 계획서 §4 는 `clarification: {kind: group_exclusive}` 였으나 제품의 역질문 kind 는
          #   상호배타여도 항상 `zone_select` 다(src/utils/query_gen_common.py:2120 · 상호배타는 페이로드의
          #   `group_exclusive: true` 플래그 :2127-2129 - 평가기는 kind·선택지만 본다). 상호배타 위반의 결정적
          #   표지는 질문 문구다(ZONE_GROUP_EXCLUSIVE_QUESTION :2066-2069 · 라우트 게이트 src/api/routes/query.py:1636).
          #   원 수동 문구: "재질문 종류가 group_exclusive 인지(존 그룹 상호배타)"
          clarification: {kind: zone_select}
          response_must_contain: ["은행존과 공동존은 동시에 조회할 수 없습니다"]
      - send:
          selected_db_ids: ["polestar_b0"]
        expect:
          status: completed
          db_ids: ["polestar_b0"]
          # D-154 - 선택에서 빠진 존의 원문 표면어가 WHERE 로 새면 안 된다.
          sql_must_not_match: ["(?i)여의도"]
    teardown: [drop_thread]
  - id: F-04
    plans: [82, 90, 75]
    title: "ㅇㅇ존 서버 CPU 사용률 10건만"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "ㅇㅇ존 서버 CPU 사용률 10건만"
        expect:
          status: clarification
          clarification: {kind: zone_select}
      - send:
          selected_db_ids: ["polestar_cm_yd"]
        expect:
          status: completed
          db_ids: ["polestar_cm_yd"]
          # 식별 불가 표면어가 필터로 새면 안 된다.
          sql_must_not_match: ["(?i)ㅇㅇ존"]
    teardown: [drop_thread]
  - id: F-05
    plans: [82, 90, 75]
    title: "호스트명이 sbhdbo53인 서버의 CPU"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "호스트명이 sbhdbo53인 서버의 CPU"
        expect:
          status: completed
          sql_must_match: ["(?i)hostname\\s*=", "(?i)sbhdbo53"]
  - id: F-06
    plans: [82, 90, 75]
    title: "존 선택 후 후속 턴이 DB 를 승계한다"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    response_modes: [clarify, answer]
    turns:
      - send:
          query: "전체 서버 OS 종류 알려줘"
        expect:
          status: clarification
      - send:
          selected_db_ids: ["polestar_cm_gp"]
        expect:
          status: completed
          db_ids: ["polestar_cm_gp"]
      - send:
          query: "그 서버들의 메모리도 10건만"
        # 여기서 역질문이 오면 승계 회귀다 - 자동 응답이 답해 버리면 회귀가 가려진다(D-216).
        auto_answer: false
        expect:
          # 재질문 없이 앞 턴의 존을 그대로 쓴다 - clarification 이 오면 승계 회귀다.
          status: completed
          db_ids: ["polestar_cm_gp"]
    teardown: [drop_thread]
  - id: F-07
    plans: [82, 90, 75]
    title: "김포와 여의도 서버의 CPU 사용률을 10건씩 비교해줘"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "김포와 여의도 서버의 CPU 사용률을 10건씩 비교해줘"
        expect:
          status: completed
          db_ids: ["polestar_cm_gp", "polestar_cm_yd"]
          # plans/122 A-1 - 두 존 모두 행을 내고 존 라벨로 갈랐는지(F-02 와 같은 존별 건수 줄 ·
          #   src/nodes/output_generator.py:1433). 토큰 예산(D-159)은 응답에 실리지 않아 측정 불가 - 삭제.
          #   원 수동 문구: "멀티 경로 토큰 예산(D-159) 안에서 비교 표가 나왔는지"
          row_count_per_db: {min: 1}
          response_must_contain: ["[존별 결과]", "김포", "여의도"]
          # 「비교」 자체는 남긴다 - 존 라벨·DB별 행 수는 병합 표만 있어도 통과한다. run 20260923-140539 3단 행은 이
          #   단언을 모두 통과하면서 "김포와 여의도 각각에 대한 평균·최대 CPU 사용률이 별도로 계산되어 있지 않으므로
          #   두 지역 간 직접적인 평균 비교는 추가적인 집계 작업이 필요합니다"라고 답했다(재판정 대조에서 확인한
          #   거짓 합격 후보 - 수동 문구를 지우지 않은 이유). 존별 집계 줄(:895-910)은 건수·합계·최대·최소만이고
          #   조건부로만 붙어 비교의 결정적 표지가 아니다.
          manual_review: "두 존의 CPU 사용률을 실제로 대조했는지(존별 집계·비교 서술 — 존 라벨이 붙은 병합 표만으로는 비교가 아니다)"
  - id: F-08
    plans: [82, 90, 75]
    title: "공동존 전체 서버 수"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "공동존 전체 서버 수"
        expect:
          status: completed
          db_ids: ["polestar_cm_gp", "polestar_cm_yd"]
          sql_must_match: ["(?i)count\\s*\\("]
  # 역질문 자동 응답(D-216). 턴이 역질문을 기대하지 않으므로 러너가 존 선택에 스스로 답하고
  # (config/scenarios/auto_answer.yaml 우선 존 = 김포) 답을 받은 뒤의 응답으로 판정한다.
  - id: F-09
    plans: [82, 90, 75, 94]
    title: "존 역질문에 스크립트가 자동 응답해 완료까지 간다"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    response_modes: [answer]
    turns:
      - send:
          query: "전체 서버 수 알려줘"
        expect:
          status: completed
          db_ids: ["polestar_cm_gp"]
          row_count: {min: 1}
    teardown: [drop_thread]
    mock:
      turns:
        - response: "조회할 존이 지정되지 않았습니다."
          executed_sql: null
          row_count: null
          clarification:
            kind: zone_select
            question: "조회할 존이 지정되지 않았습니다."
            original_query: "전체 서버 수 알려줘"
            options:
              - {db_id: polestar_b0, label: "은행존"}
              - {db_id: polestar_cm_gp, label: "공동존(김포)"}
              - {db_id: polestar_cm_yd, label: "공동존(여의도)"}
          # 러너가 답한 뒤의 응답. db_scope 는 모의 서버가 받은 selected_db_ids 로 채운다.
          answer:
            response: "김포 공동존 서버는 12대입니다."
            executed_sql: "SELECT COUNT(*) FROM polestar.cmm_resource"
            row_count: 1
