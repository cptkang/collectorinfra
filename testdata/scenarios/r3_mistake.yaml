# R3 - 실수 (plans/94 §3.7)
#
# 오타/잘못된 값/없는 대상/자기모순. 선의의 어긋남이며 지금 스위트에 0건인 축이다.
# 단언은 **부정 단언이 주력**이다 - 조용한 유사 대체(silent_wrong)가 이 축의 주적이다.
version: 1
group:
  id: R3
  name: "실수"
  latency_target_ms: 30000
  # plans/123 CT-1 · 123·G-2 (b) · D-280 ② — 케이스별 허용 집합을 정정한 뒤 등급 정책을 확정한다.
  #   선언 밖 등급은 이제 불합격이다(종전 manual). 금지 3종은 종전대로 항상 불합격.
  policy_confirmed: true
  # plans/123 V-4 — 불변식 활성 선언. 값 = 판정에 넣기 시작하는 run 표지(null 은 트리아지만).
  #   활성도 응답 고지(done.disclosures)를 수집한 run(W-8 이후 러너)에서만 판정에 들어간다.
  invariants:
    limit_disclosed: R5          # 123 W-1(상한 도달 고지) 랜딩 run
    zone_coverage_named: R5      # 123 W-2·W-5(좁힌 범위 · 「전체가 아니라」) 랜딩 run
    upload_misattributed: R5     # 295feee(D-264 ④) — 러너가 고지를 수집하는 첫 run 부터
    empty_template_misuse: null  # 123 S-4a 가 섀도(D-280 ⑧) — run R5′ on 전환 때 활성
    overgeneralization: null     # 121 TP-4.4 ② 랜딩 뒤
    demonstrative_bulk: null     # 106 H1 되묻기 게이트(G-6 · S-7(b) 트리거) 랜딩 뒤
  source: "plans/94 §3.7 R3"
scenarios:
  - id: R3-01
    plans: [61, 37]
    title: "호스트명 오타 - cocm-hdkapp1 (실제 cocm-hdkapp01)"
    kind: mistake
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    pair_with: R3-01C
    response_modes: [correct, clarify, guide]
    turns:
      - send: {query: "cocm-hdkapp1 서버의 OS"}
        expect:
          # plans/123 CT-5 - 식별자 조건 0건에 「임계값을 낮추라」는 틀린 권고다(S-4b).
          response_must_not_contain: ["임계값 낮추기", "임계값을 낮추거나"]
    teardown: [drop_thread]
  - id: R3-01C
    plans: [61, 37]
    title: "[대조군] 정확한 호스트명"
    kind: control
    env: closed
    profile: baseline
    endpoint: stream
    pair_with: R3-01
    response_modes: [answer]
    turns:
      - send: {query: "cocm-hdkapp01 서버의 OS"}
        expect: {status: completed, row_count: {min: 1}}
    teardown: [drop_thread]

