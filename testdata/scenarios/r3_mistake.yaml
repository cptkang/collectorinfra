          #   S-4a kind entity_not_found)는 run R5′ on 전환 뒤 - 그 전에는 0건 템플릿이라 불합격이 맞다.
          response_must_not_contain: ["임계값 낮추기", "임계값을 낮추거나"]
    teardown: [drop_thread]
  - id: R3-04C
    plans: [82]
