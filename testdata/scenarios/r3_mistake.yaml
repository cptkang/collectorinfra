    kind: mistake
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    pair_with: R3-03C
    response_modes: [guide, clarify]
    turns:
      - send: {query: "판교존 서버 목록"}
        expect:
          row_count: {max: 0}
          manual_review: "0건 응답이 아니라 '그런 존이 없다'고 말하는가"
    teardown: [drop_thread]
  - id: R3-03C
    plans: [82, 75]
    title: "[대조군] 실제 존"
