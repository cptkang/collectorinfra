# R3 - 실수 (plans/94 §3.7)
#
# 오타/잘못된 값/없는 대상/자기모순. 선의의 어긋남이며 지금 스위트에 0건인 축이다.
# 단언은 **부정 단언이 주력**이다 - 조용한 유사 대체(silent_wrong)가 이 축의 주적이다.
version: 1
group:
  id: R3
  name: "실수"
  latency_target_ms: 30000
  policy_confirmed: false
  source: "plans/94 §3.7 R3"
scenarios:
  - id: R3-01
    plans: [61, 37]
    title: "호스트명 오타 - cocm-hdkapp1 (실제 cocm-hdkapp01)"
    kind: mistake
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    pair_with: R3-01C
    response_modes: [correct, clarify, guide]
    turns:
      - send: {query: "cocm-hdkapp1 서버의 OS"}
        expect:
          manual_review: "교정했다면 교정 사실을 밝혔는가. 조용히 유사 서버로 대체하지 않았는가"
    teardown: [drop_thread]
  - id: R3-01C
    plans: [61, 37]
    title: "[대조군] 정확한 호스트명"
    kind: control
    env: closed
    profile: baseline
    endpoint: stream
    pair_with: R3-01
    response_modes: [answer]
    turns:
      - send: {query: "cocm-hdkapp01 서버의 OS"}
        expect: {status: completed, row_count: {min: 1}}
    teardown: [drop_thread]

  - id: R3-02
