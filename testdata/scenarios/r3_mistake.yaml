  - id: R3-03
    plans: [82, 75]
    title: "없는 존 - 판교존"
    kind: mistake
    env: closed
    profile: baseline
    endpoint: stream
    repeat: 3
    pair_with: R3-03C
    # plans/123 CT-2 · 123·G-4 (a) - 역질문 기대 턴은 F-06형 2턴이다. t1 이 역질문을 선언하면 러너는
    #   자동 응답하지 않는다 - 제품이 되물은 사실을 자동 응답이 덮지 않는다(123 §2.5). t2 는 러너가 고르던
    #   존(김포 - D-216 ②)을 턴이 직접 보내고, 미등록 존 치환 고지(W-4)를 본다. 치환을 밝힌 응답은 correct.
    response_modes: [guide, clarify, correct]
    turns:
      - send: {query: "판교존 서버 목록 10건만"}
        expect:
          # 종전 `row_count: {max: 0}` 은 뺐다 - 역질문으로 끝난 턴은 행 수가 없어 늘 불합격이었다.
          status: clarification
          clarification: {kind: zone_select}
      - send: {selected_db_ids: ["polestar_cm_gp"]}
        expect:
          status: completed
          disclosures_contains: [unregistered_zone]
    teardown: [drop_thread]
  - id: R3-03C
    plans: [82, 75]
    title: "[대조군] 실제 존"
    kind: control
    env: closed
    profile: baseline
    endpoint: stream
    pair_with: R3-03
    response_modes: [answer, clarify]
    turns:
      - send: {query: "은행존 서버 목록 10건만"}
        expect: {status: completed, row_count: {min: 1}}
    teardown: [drop_thread]

  - id: R3-04
