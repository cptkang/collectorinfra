        expect:
          manual_review: "유사어 경로로 CPU 사용률에 닿는가"
    teardown: [drop_thread]
  - id: R3-02C
    plans: [37, 61]
    title: "[대조군] 표준 지표명"
    kind: control
    env: both
    profile: baseline
    endpoint: stream
    pair_with: R3-02
    response_modes: [answer]
    turns:
      - send: {query: "CPU 사용률 상위 5대"}
        expect: {status: completed, row_count: {min: 1}}
    teardown: [drop_thread]

  - id: R3-03
    plans: [82, 75]
