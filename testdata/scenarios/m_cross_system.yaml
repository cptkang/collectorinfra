# 교차 소스 시나리오 군 (plans/121 TP-0.7 · D-270 ① · D-272 ③ 묶음 A · plans/102 H-2 재정렬 — D-270 ⑯)
#
# 폴스타 ↔ 자산관리(ITAM) ↔ Prometheus 를 잇는 다중 소스 질의 9건. 로컬 샌드박스 전용이다.
#
# ★ 기준선 의미 — **첫 run 은 현행 동작을 재는 기준선이다.** 현행 2단은 요청 소스를 조용히 바꾸고
#   (N-11 · "프로메테우스에서"가 폴스타 SQL 로), 시스템 사이 키 대응을 LLM 에 맡기고(N-12·N-16),
#   제품명·DB명 힌트를 모든 task 에 고정한다(N-10). 아래 `expect` 는 **목표 동작**이며 TP-9(소스
#   카탈로그)·TP-10(다중 소스 연쇄) 랜딩 뒤 통과를 기대한다 — **지금은 불합격이 정상이다.**
#   이 군의 불합격을 "회귀"로 읽지 말 것. 회귀는 이 군 기준선 run 대비 통과 → 불합격 전이다
#   (`regression.md` 는 같은 환경·같은 성격의 직전 run 과만 비교한다). D군 ★ 선례(`d_alarm.yaml` —
#   "제품 결함이라 단언을 그대로 둠")와 같은 규약이다.
#
# ★ 목표 단언과 현행 관측의 구분 —
#   - 목표 동작 = `expect` 의 기계 단언. `manual_review` 는 **Prometheus 3건에만** 둔다(M-03·M-04·M-07 —
#     "소스를 못 썼다는 사유"의 문구·필드가 TP-10 전이라 미정이고, 응답이 질문의 "프로메테우스"를 그대로
#     되풀이하면 기계 단언이 거짓 통과한다). `manual_review` 가 있는 턴은 기계 단언이 전부 통과해도
#     `manual` 이 상한이다(assertions.evaluate_turn).
#   - 현행 관측·홉별 기대값 = **오라클 파일** `testdata/scenarios/fixtures/m_cross_system_oracle.yaml`
#     (producer 집합 · 브리지 등급 · consumer 커버리지 · 병합 키 · 속성 · 기준선 관측 포인트). 판정기가
#     읽지 않는다 — 홉별 지표 분석기(설계만 · plans/121 TP-0.7 보고)의 입력이다.
#   - `response_modes` 는 선언하지 않는다 — Prometheus 준비 상태에 따라 정답 등급(answer ↔ partial)이
#     바뀐다.
#
# ★ `env: sandbox` 고정과 폐쇄망 기준선 — `--env closed` 명시 run 은 이 군을 선택하지 않는다
#   (`Catalog.select`). `--env` 없는 자동 판정 run(D-216 ③)에서 빼는 수단은 **요구 소스 선언**이다
#   (plans/122 C-4b · D-276 ②): 군 헤더 `requires_sources: [polestar, itam]`(판정 전제 데이터 =
#   샌드박스 폴스타 + ITAM — 폐쇄망 `ACTIVE_DB_IDS` 에는 둘 다 없다), Prometheus 3건(M-03·M-04·M-07)은
#   Prometheus **미연결**에서 "요청 소스 불가"를 재므로 `[polestar]` 로 덮는다(`[prometheus]` 로 두면
#   Prometheus 가 붙을 때까지 어느 run 에서도 선택되지 않아 로컬 기준선을 잃는다). 러너는 활성 소스에
#   요구 소스가 없으면 선택하지 않고 사유를 적재한다. 그래도 선택되는 run(선언 누락 · 활성 소스 판독
#   불가)은 D-216 ③대로 실행·보류되므로, 환경 불일치에도 판정되는 키(`runner.ENV_NEUTRAL_KEYS`)는
#   **샌드박스 합성 표식 문구의 `response_must_not_contain` 만** 쓴다(폐쇄망 응답에 나올 수 없는
#   값 — "합성 유지보수계약 NN" 등). 이 규칙은 `tests/test_scenario/test_m_cross_system_catalog.py`
#   가 고정한다. 부정 오라클 중 폐쇄망에서 안전하지 않은 것(`.37` 사용률 표식 · 이종 합산 값 ·
#   `cmm_metric_stat` 침묵 대체 SQL)은 오라클 파일에만 둔다.
#
# ★ 실행 전제(로컬) — ①도커 `polestar_pg`(5434)·`itam_mariadb`(3307) ②MCP 소스 `itam`
#   (`mcp_server/.env` `ITAM_CONNECTION`) ③루트 `.env` `ACTIVE_DB_IDS=polestar,itam`(실측 2026-09-28 —
#   러너 `detect_env` 는 이 조합을 `sandbox` 로 판정한다 · TP-11.7) ④작업 트리의
#   `config/db_profiles/itam.yaml`(104 로컬 승인본 · git 추적 해제 대상 TP-11.1 — 파일이 없으면 ITAM
#   task 가 구조 부재 사유로 끝난다) ⑤ITAM 시드 날짜는 init 시점 상대값이다 — 기준선 전에
#   `testdata/itam/setup.sh` 로 다시 만든다(M-01 의 svr-db-04 만료일이 분기 경계 상대값) ⑥Prometheus
#   는 **현재 로컬 미연결**(mcp_server `PROMETHEUS_URL` 미설정 · 픽스처 컨테이너 미기동 · 2단 호출부
#   0건 §2.7.1)이라 M-03·M-04·M-07 은 "요청 소스 불가"를 잰다. 픽스처(`testdata/prometheus` · 9190 ·
#   `nodename="svr-web-01"` 1개)는 TP-10.5 뒤에 붙인다.
#
# ★ MLX 동시성 1 — 앱에 이것을 거는 설정이 **없다**(실측 2026-09-28): `agent_orchestrator` 가 같은
#   레벨 task 를 상한 없는 `asyncio.gather` 로 돌리고(`src/orchestration/agent_orchestrator.py:134`),
#   동시성 설정은 `composite.fanout_concurrency`(process_query 조사 전용)·
#   `schema_cache.admin_llm_concurrency`(관리자 구조 분석 잡 전용)뿐이다. 제품 해소는 TP-10.7(병렬
#   예산)이다. 그때까지는 ①MLX 서버를 `scripts/mlx_server.sh -- --decode-concurrency 1
#   --prompt-concurrency 1` 로 띄운다(mlx-lm 0.31.3 기본값 32·8 · 서버 쪽 직렬화 — 공유 8080 은 띄운
#   세션만 재기동한다) ②이 군을 `--group M --env sandbox` 로 **단독** 실행하고 다른 MLX 클라이언트와
#   겹치지 않게 한다(`lsof -nP -iTCP:8080 -sTCP:ESTABLISHED`). 병렬 모양 M-06 이 특히 그렇다 — 분해
#   결과에 따라 다른 건도 같은 레벨 task 2개가 될 수 있다.
#
# ★ 로컬에서 재현하지 못하는 것 — (A) "김포" 위치어 오염(gp 비활성 — 제품명·DB명 힌트 "폴스타"·
#   "자산관리"로만 N-10 을 건드린다) · (B) 존 역질문 재개 턴의 복합 계획 붕괴(샌드박스에 존이 없다) ·
#   ITAM `per_ip` 다행(시드는 호스트당 1행 — 다건은 IP 부분 일치로만 만든다, M-08) · 운영 ITAM·
#   Prometheus 연결(95 G-3 · 92 외부 선행).
#
# ★ 성능 — 군 목표 30초는 복합 목표(내부망)다. 로컬 MLX 지연으로 판정하지 않는다(D-240 ④).
#   M-03 은 알람 질의라 2단 run 에서 리포트가 「2단 알람 교정 우회 - 해석 제외 권고」를 달 수 있다.
version: 1
group:
  id: M
  name: "교차 소스 (폴스타·자산관리·Prometheus)"
  latency_target_ms: 30000
  policy_confirmed: false
  source: "plans/121 TP-0.7"
  # plans/122 C-4b — 판정 전제 데이터(샌드박스 폴스타 + ITAM). Prometheus 3건은 시나리오에서 덮는다.
  requires_sources: [polestar, itam]
scenarios:
  # ── (A) 폴스타 선별 → ITAM 상세 ─────────────────────────────────────────
  - id: M-01
    plans: [121, 102, 95, 88]
    title: "폴스타 가용 상태 비정상 서버 → 자산관리 유지보수 계약 만료일 (브리지 1:1 5건 · 0건 3건)"
    kind: normal
    env: sandbox
    profile: cross_system_tier2
    endpoint: stream
    turns:
      - send:
          query: "폴스타에서 가용 상태가 정상이 아닌 서버를 찾고, 그 서버들의 유지보수 계약 만료일을 자산관리(ITAM)에서 알려줘"
        expect:
          status: completed
          db_ids: ["itam", "polestar"]
          row_count_per_db: {min: 1}
          # producer 선별 조건과 consumer 속성이 각 시스템 SQL 에 실제로 실렸는가
          sql_must_match: ["(?i)\\bavail_status\\b", "(?i)\\bmanmenCtrcEndYmd\\b"]
          # 브리지 1:1 — ITAM 에서 찾은 5대
          response_must_contain: ["svr-web-05", "svr-web-08", "svr-was-03", "svr-was-07", "svr-db-04"]
          # ★ consumer 커버리지 「없음」 노출 — ITAM 에 없는 선별 서버 3대가 응답에서 사라지지 않는다
          #   (현행은 병합이 행 없는 쪽을 조용히 버린다 · TP-10.4 목표)
          response_must_contain_any:
            - ["SV-BATCH-009", "svr-app-03", "svr-bat-02"]
            - ["svbatch009", "svr-app-03", "svr-bat-02"]
    notes: "오라클 M-01 — producer 8대(avail_status≠0) · ITAM 1:1 5 · 0 3. 현행 관측: DB명 힌트 고정으로 ITAM task 에 polestar 가 붙는지(N-10 로컬판)"

  - id: M-02
    plans: [121, 102, 95]
    title: "폴스타 CPU 최대 사용률 80% 이상 서버 → 자산관리 계약 만료일 (브리지 0 · 사용률 출처 함정 T5)"
    kind: normal
    env: sandbox
    profile: cross_system_tier2
    endpoint: stream
    turns:
      - send:
          query: "폴스타에서 2026년 6월 CPU 최대 사용률이 80% 이상이었던 서버를 찾아, 자산관리(ITAM)에서 그 서버들의 유지보수 계약 만료일을 알려줘"
        expect:
          status: completed
          # ITAM 을 **조회하고** 없다고 말해야 한다 — 조회 안 함과 없음은 다른 사실이다
          db_ids: ["itam", "polestar"]
          # 선별은 폴스타 모니터링 통계에서 — 자산 DB 의 `sevrCPUUseRt`(연계 스냅샷)가 아니다(T5)
          sql_must_match: ["(?i)\\bcmm_metric_stat_m\\b"]
          response_must_contain_any: ["DB-ORA-023", "dbora023"]
    notes: "오라클 M-02 — producer DB-ORA-023(2026-06 max 91.6) 1대 · ITAM 0. 부정 오라클(`.37` 표식)은 폐쇄망 안전하지 않아 오라클 파일에만"

  # ── (B) 알람 선별 → Prometheus 추이 ─────────────────────────────────────
  - id: M-03
    plans: [121, 92, 88]
    title: "폴스타 활성 심각 알람 서버 → Prometheus CPU 추이 (소스 불가 · nodename 불일치 0건)"
    kind: normal
    env: sandbox
    profile: cross_system_tier2
    endpoint: stream
    # Prometheus 미연결 상태의 「요청 소스 불가」를 잰다 — 전제 데이터는 샌드박스 폴스타뿐(C-4b)
    requires_sources: [polestar]
    turns:
      - send:
          query: "현재 활성 상태인 심각 알람이 발생한 서버들을 폴스타에서 찾고, 그 서버들의 최근 1시간 CPU 사용률 추이를 프로메테우스에서 보여줘"
        expect:
          status: completed
          sql_must_match: ["(?i)\\bcmm_alarm"]
          # 선별 서버 2대 + 요청 소스(Prometheus)를 응답이 함께 다룬다 — 표기 둘 중 하나
          response_must_contain_any:
            - ["SV-WEB-001", "SV-BATCH-009", "프로메테우스"]
            - ["SV-WEB-001", "SV-BATCH-009", "Prometheus"]
            - ["svweb001", "svbatch009", "프로메테우스"]
            - ["svweb001", "svbatch009", "Prometheus"]
          manual_review: "추이가 Prometheus 에서 왔는가, 못 썼다는 사유가 있는가 — 실행 SQL 에 cmm_metric_stat 이 있으면 요청 소스 침묵 대체(N-11)다. Prometheus 픽스처 nodename 은 svr-web-01 뿐이라 두 서버 모두 「없음」이 정답"
    notes: "오라클 M-03 — producer SV-WEB-001·SV-BATCH-009(cmm_alarm_active 심각·ACTIVE) · Prometheus 키 패싯 server_name → nodename 0/2"

  - id: M-04
    plans: [121, 92]
    title: "폴스타 WEB 서버 10대 → Prometheus CPU 추이 (consumer 커버리지 1/10)"
    kind: normal
    env: sandbox
    profile: cross_system_tier2
    endpoint: stream
    # Prometheus 미연결 상태의 「요청 소스 불가」를 잰다 — 전제 데이터는 샌드박스 폴스타뿐(C-4b)
    requires_sources: [polestar]
    turns:
      - send:
          query: "폴스타에서 서버명이 svr-web으로 시작하는 서버 목록을 조회하고, 그 서버들의 최근 1시간 CPU 사용률 추이를 프로메테우스에서 보여줘"
        expect:
          status: completed
          sql_must_match: ["(?i)svr-web"]
          response_must_contain_any:
            - ["svr-web-01", "프로메테우스"]
            - ["svr-web-01", "Prometheus"]
          manual_review: "Prometheus 추이가 있는 서버(svr-web-01)와 없는 서버 9대를 구분해 알리는가, 아니면 폴스타 통계로 조용히 대체했는가(실행 SQL 의 cmm_metric_stat) — 현재 로컬 Prometheus 미연결이면 10대 전부 「조회 안 함」+사유가 정답"
    notes: "오라클 M-04 — producer svr-web-01~10 · Prometheus nodename svr-web-01 1개(픽스처 연결 뒤)"

  # ── ITAM 선별 → 폴스타 ──────────────────────────────────────────────────
  - id: M-05
    plans: [121, 102, 95, 88]
    title: "자산관리 경과 5년 이상 서버 → 폴스타 가용 상태·CPU 사용률 (역방향 · 속성 커버리지)"
    kind: normal
    env: sandbox
    profile: cross_system_tier2
    endpoint: stream
    turns:
      - send:
          query: "자산관리(ITAM)에서 경과년수가 5년 이상인 노후 서버를 찾고, 폴스타에서 그 서버들의 가용 상태와 CPU 사용률을 보여줘"
        expect:
          status: completed
          db_ids: ["itam", "polestar"]
          row_count_per_db: {min: 1}
          # producer 는 ITAM 경과년수, consumer 는 폴스타 리소스 — 역방향 연쇄가 실제로 이어졌는가
          sql_must_match: ["(?i)\\belapsNoy\\b", "(?i)\\bcmm_resource\\b"]
          response_must_contain: ["svr-db-07", "svr-db-08"]
    notes: "오라클 M-05 — producer svr-db-07(5년)·svr-db-08(7년) · 1:1 2 · 가용 상태 있음 2/2 · CPU 사용률 없음 2/2(폴스타 통계 없음 — ITAM sevrCPUUseRt 로 채우면 T5 위반). 현행 관측: 선행 게이트 prior_no_identity 로 후속 미실행 여부"

  # ── (C) 병렬 비교 ───────────────────────────────────────────────────────
  - id: M-06
    plans: [121, 113, 95]
    title: "폴스타 서버 수 vs 자산관리 서버 자산 수 (병렬 · 이종 합산 금지)"
    kind: normal
    env: sandbox
    profile: cross_system_tier2
    endpoint: stream
    turns:
      - send:
          query: "폴스타에 등록된 서버 수와 자산관리(ITAM)에 등록된 서버 자산 수를 각각 알려주고 비교해줘"
        expect:
          status: completed
          db_ids: ["itam", "polestar"]
          # 두 시스템 값이 각각 나온다 — 폴스타는 세는 방식에 따라 54(행) 또는 50(호스트명 고유)
          response_must_contain_any:
            - ["30", "54"]
            - ["30", "50"]
    notes: "오라클 M-06 — 폴스타 54/50 · ITAM 30 · 이종 합산(84·80)을 「전체」로 내면 N-13(폐쇄망 안전하지 않아 부정 단언 없음). ★ MLX 병렬 모양 — 같은 레벨 task 2개"

  # ── 요청 소스 불가 ───────────────────────────────────────────────────────
  - id: M-07
    plans: [121, 92]
    title: "Prometheus 명시 단일 조회 — 요청 소스 불가 시 침묵 대체 금지 (N-11)"
    kind: normal
    env: sandbox
    profile: cross_system_tier2
    endpoint: stream
    # Prometheus 미연결 상태의 「요청 소스 불가」를 잰다 — 전제 데이터는 샌드박스 폴스타뿐(C-4b)
    requires_sources: [polestar]
    turns:
      - send:
          query: "프로메테우스에서 svr-web-01 서버의 최근 1시간 CPU 사용률 추이를 보여줘"
        expect:
          status: completed
          response_must_contain: ["svr-web-01"]
          response_must_contain_any: ["프로메테우스", "Prometheus"]
          manual_review: "요청 소스를 못 썼다는 사유가 응답에 있는가 — 실행 SQL 에 cmm_metric_stat 이 있으면 침묵 대체(N-11 · 침묵 대체 0 목표). Prometheus 픽스처가 붙은 뒤에는 nodename=svr-web-01 추이가 정답"
    notes: "오라클 M-07 — 현행 추적: 폴스타 시간 통계 SQL 로 조용히 대체(plans/121 §2.7.2 (B))"

  # ── 브리지 등급 ──────────────────────────────────────────────────────────
  - id: M-08
    plans: [121, 102, 95]
    title: "폴스타 IP 10.0.1.1 서버 → 자산관리 유지보수 계약명 (IP 부분 일치 다건 브리지 함정)"
    kind: normal
    env: sandbox
    profile: cross_system_tier2
    endpoint: stream
    turns:
      - send:
          query: "폴스타에서 IP 주소가 10.0.1.1인 서버를 찾고, 자산관리(ITAM)에서 그 서버의 유지보수 계약명을 알려줘"
        expect:
          status: completed
          db_ids: ["itam", "polestar"]
          response_must_contain: ["합성 유지보수계약 00"]
          # ★ 다건 자동 조인 0 — `iPCtnt LIKE '%10.0.1.1%'` 는 svr-web-04(10.0.1.104)·svr-web-10(10.0.1.10)
          #   까지 3행이 된다. 샌드박스 합성 표식이라 폐쇄망 응답에는 나올 수 없다(환경 불일치에도 안전).
          response_must_not_contain: ["합성 유지보수계약 03", "합성 유지보수계약 09"]
    notes: "오라클 M-08 — producer svr-web-01 · 호스트명 키 1:1 / IP 부분 일치 키 다건 3"

  - id: M-09
    plans: [121, 102, 95]
    title: "호스트 키 4형 브리지 — 정확·대소문자·FQDN·다중 IP (FQDN 은 가능 일치로 드러낸다)"
    kind: normal
    env: sandbox
    profile: cross_system_tier2
    endpoint: stream
    turns:
      - send:
          query: "폴스타에서 svr-web-01, svr-web-02, svr-web-03, svr-web-04 네 서버의 IP 주소를 확인하고, 자산관리(ITAM)에서 각 서버의 취득금액을 알려줘"
        expect:
          status: completed
          db_ids: ["itam", "polestar"]
          row_count_per_db: {min: 1}
          # ★ FQDN 등록(`svr-web-03.synth.example`)을 조용히 빠뜨리지 않고 가능 일치로 드러낸다
          #   (D-224 ② ㉰ — FQDN 단축 자동 결합은 금지, 노출은 목표 · TP-10.3)
          response_must_contain: ["svr-web-03.synth.example"]
    notes: "오라클 M-09 — 1:1 svr-web-01 · 대소문자 SVR-WEB-02(샌드박스 collation 이 `=` 로 조용히 맞춘다) · FQDN 가능 · 다중 IP svr-web-04 1:1"
