    plans: [67, 84]
    title: "B-01~B-06 각 5회 반복(캐시 warm)"
    kind: normal
    env: closed
    profile: baseline
    endpoint: stream
    # 원문이 프롬프트가 아니라 산문(시나리오/방법 서술)이다.
    # 사람이 실제 프롬프트로 고쳐 쓰고 이 줄을 지울 때까지 러너가 건너뛴다.
    prompt_authored: false
    turns:
      - send:
          query: "B-01~B-06 각 5회 반복(캐시 warm)"
        expect:
          manual_review: "p50/p95 / p95 ≤10s"
