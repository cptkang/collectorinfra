# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
#
# ★ 누락 고지: 원문의 **그룹 D(등록 흐름)와 그룹 G(시드x거버넌스)는 표가 아니라 산문 절차**다
#   (docker exec redis-cli / 오프라인 prune 스크립트). 프롬프트 트랙으로 재현되지 않아 이 카탈로그에
#   없다 - 32건은 표 형식 케이스 전건이며 D/G 는 별도 트랙이다. 조용히 빠진 것이 아니라 빠진 사유를
#   여기 남긴다.
version: 1
group:
  id: L
  name: "유사어/용어 (SYN A~I)"
  latency_target_ms: 30000
  policy_confirmed: false
  source: "docs/synonym_test_cases.md"
# plans/122 C-3 - `manual_review` 의 기대값을 기계 단언으로 옮겼다. 근거 데이터는 샌드박스 자동 적재분
#   (testdata/pg/init/ - docker-entrypoint-initdb.d)뿐이다: 07_plan61_text2sql_gold_fixtures.sql(서버 4대 ·
#   EAV · 2026-05~07 월 통계 · 알람 5건) + 09_plan67(서버 4대 추가 - LOGICALCORE ≥8 · TotalSize 65536 등) +
#   05 더미 알람(가짜 resource_id) + 08 쌍둥이(같은 이름·conf 의 platform.server 행 - resource_type 미한정이면
#   행이 두 배 → 기대 행 수 불일치로 드러난다 · SYN-H-03 문구의 B4 함정).
#   옮기지 않은 것: ① 순서 기준(응답 문자열로 순서를 볼 수 없다) ② 09 추가 서버로 낡은 기대값 ③ init 밖
#   testdata/pg/05_insert_excel_data.sql(hostapo01/02 · svr-app-03 등 - 자동 적재 대상 아님)에 기대는 값
#   ④ 문구가 잘려 기대값이 없는 것 ⑤ LLM 표기가 정해지지 않은 값. 그런 시나리오는 manual_review 를 남기고
#   확인된 값만 부분 단언으로 붙였다. L군은 env: sandbox 라 폐쇄망 run 에서는 종전대로 보류된다(D-216 ③).
scenarios:
  - id: SYN-A-01
    plans: [37, 61]
    title: "DB-ORA-023과 SV-WEB-001 두 서버의 커널 파라미터를 비교해서 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "DB-ORA-023과 SV-WEB-001 두 서버의 커널 파라미터를 비교해서 보여줘"
        expect:
          # plans/122 C-3 - 07 픽스처 OSParameter LOB(stringvalue): SV-WEB-001 `kernel.shmmax = 68719476736` ·
          #   DB-ORA-023 `kernel.shmmax = 137438953472`(stringvalue_short 는 NULL - 빈 값 회귀면 두 숫자가 없다).
          #   원 수동 문구: "\"커널 파라미터\"→`OSParameter` + **복수 서버 IN 조건**. LOB이므로 `stringvalue` 사용
          #   (`stringvalue_short`면 빈 값 회귀). `is_lob=1` 조건이 SQL에 있으면 실패(Known Mistakes 2026-06-10) /
          #   2행 — DB-ORA-023: `kernel.shmmax = 137438953472` 등, SV-WEB-001: `kernel.shmmax = 68719476736` 등"
          row_count: {eq: 2}
          sql_must_not_match: ["(?i)\\bis_lob\\s*=\\s*1\\b"]
          response_must_contain: ["DB-ORA-023", "SV-WEB-001", "kernel.shmmax", "137438953472", "68719476736"]
  - id: SYN-A-02
    plans: [37, 61]
    title: "SV-WEB-001 서버의 sysctl 설정에서 vm.swappiness 값이 얼마인지 알려줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "SV-WEB-001 서버의 sysctl 설정에서 vm.swappiness 값이 얼마인지 알려줘"
        expect:
          # plans/122 C-3 - 옮기지 않음(⑤): 값(07 픽스처 SV-WEB-001 `vm.swappiness = 10`)은 확인했지만 추출 방식이
          #   둘 다 허용돼(SQL LIKE · 결과 후처리) 응답 표기가 정해지지 않는다 - "= 10" 과 "값은 10" 을 가를 수 없다.
          manual_review: "영문 동의어 \"sysctl\"→`OSParameter` + **LOB 텍스트 내 특정 키 추출**(SQL LIKE 또는 결과 후처리 — 어느 쪽이든 최종 답이 맞으면 통과) / `vm.swappiness = 10`"
  - id: SYN-A-03
    plans: [37, 61]
    title: "SV-WEB-001, DB-ORA-023, cocm-hdkapp01 세 서버의 제조사, 일련번호, 모델명을 표로 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "SV-WEB-001, DB-ORA-023, cocm-hdkapp01 세 서버의 제조사, 일련번호, 모델명을 표로 보여줘"
        expect:
          # plans/122 C-3 - 07 픽스처 EAV(Vendor·SerialNumber·Model) 그대로. 제조사 열이 틀리면 HPE·Dell 이 없다
          #   (모델명 문자열에 제조사명이 들어 있지 않다).
          #   원 수동 문구: "\"제조사\"→`Vendor`, \"일련번호\"→`SerialNumber`, \"모델명\"→`Model` — **3개 서버 IN ×
          #   3개 속성 동시 피벗** / SV-WEB-001: HPE/KR2024WEB0001/ProLiant DL380 Gen10 · DB-ORA-023:
          #   Dell/KR2023ORA0023/PowerEdge R750 · cocm-hdkapp01: HPE/KR2024APP0001/ProLiant DL360 Gen10"
          response_must_contain: ["HPE", "Dell", "KR2024WEB0001", "KR2023ORA0023", "KR2024APP0001",
                                  "ProLiant DL380 Gen10", "PowerEdge R750", "ProLiant DL360 Gen10"]
  - id: SYN-A-04
    plans: [37, 61]
    title: "hostapo01과 hostapo02의 타임존과 제조사를 함께 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "hostapo01과 hostapo02의 타임존과 제조사를 함께 보여줘"
        expect:
          # plans/122 C-3 - 옮기지 않음(③): hostapo01/02 는 init 밖 testdata/pg/05_insert_excel_data.sql 에만 있다.
          manual_review: "\"타임존\"→`GMT`, \"제조사\"→`Vendor` — **복수 서버 × 복수 속성 동시 매핑** / 2행 모두 `GMT+09:00` / `Dell Inc.`"
  - id: SYN-A-05
    plans: [37, 61]
    title: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 10건만 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 10건만 보여줘"
        expect:
          # plans/122 C-3 - 옮기지 않음(①②): 순서 기준이고, 09 픽스처가 LOGICALCORE ≥8 서버 4대(cocm-ngcapo91 16 ·
          #   cob0-bnndbp01·sbhdbo53·cocm-xgzapp09 각 8)를 더해 기대 목록이 낡았다.
          manual_review: "\"논리코어\"→`LOGICALCORE`(server.Cpus), \"메모리 용량\"→`TotalSize`(server.Memory). **자식 리소스 EAV 피벗(D-068) + EAV 값 수치 조건 + 정렬**. 값이 NULL이면 server.Server 행에만 조인한 회귀 / DB-ORA-023(16/65536)·cocm-hdkapp01(16/65536) → SV-WEB-001(8/32768) 순. SV-BATCH-009(4코어)는 **제외**돼야 함. hostapo01/02(`16.0`/`62.1 GB`)는 판정 제외"
  - id: SYN-B-01
    plans: [37, 61]
    title: "장비명이 SV-로 시작하는 서버의 장비명과 IP 주소를 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "장비명이 SV-로 시작하는 서버의 장비명과 IP 주소를 보여줘"
        expect:
          # plans/122 C-3 - 07 픽스처 name 이 'SV-' 로 시작하는 서버는 둘뿐(09·합성·excel 데이터에 없음 - 실측).
          #   hostname 경로면 0건, resource_type 미한정이면 쌍둥이로 4건 → 행 수로 드러난다.
          #   원 수동 문구: "\"장비명\"→`name` + **LIKE 전방일치**. SQL이 `c.name LIKE 'SV-%'` (hostname으로 가면
          #   svweb001·svbatch009는 패턴 불일치로 0건) / 2건 — SV-WEB-001(10.61.0.1), SV-BATCH-009(10.61.0.4)"
          row_count: {eq: 2}
          response_must_contain: ["SV-WEB-001", "10.61.0.1", "SV-BATCH-009", "10.61.0.4"]
  - id: SYN-B-02
    plans: [37, 61]
    title: "호스트네임에 batch가 포함된 서버의 장비명과 IP를 찾아줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "호스트네임에 batch가 포함된 서버의 장비명과 IP를 찾아줘"
        expect:
          # plans/122 C-3 - hostname 에 'batch' 가 있는 서버는 07 픽스처 svbatch009 하나(excel 데이터의 '/fsbatch' 는
          #   hostname NULL 인 파일시스템 자원 - 실측). resource_type 미한정이면 쌍둥이로 2건 → 행 수로 드러난다.
          #   원 수동 문구: "\"호스트네임\"→`hostname` + **LIKE 부분일치**. SQL이 `hostname LIKE '%batch%'` (name 칼럼 +
          #   대소문자 구분 LIKE면 'SV-BATCH-009'가 매칭되지 않아 0건) / 1건 — SV-BATCH-009 / 10.61.0.4"
          row_count: {eq: 1}
          response_must_contain: ["SV-BATCH-009", "10.61.0.4"]
  - id: SYN-B-03
    plans: [37, 61]
    title: "서버 이름과 호스트명이 서로 다른 서버 목록을 10건만 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버 이름과 호스트명이 서로 다른 서버 목록을 10건만 보여줘"
        expect:
          # plans/122 C-3 - 옮기지 않음(③): 기대 5건 중 hostapo01/02 는 init 밖 excel 데이터에만 있다.
          manual_review: "\"서버 이름\"→`name`, \"호스트명\"→`hostname` 분리 매핑 + **칼럼 간 비교 조건**(`name <> hostname`) / 5건(hostname 단위) — DB-ORA-023, SV-WEB-001, SV-BATCH-009, hostapo01, hostapo02"
  - id: SYN-C-01
    plans: [37, 61]
    title: "DB-ORA-023과 SV-WEB-001의 커널 파라메터를 비교해서 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "DB-ORA-023과 SV-WEB-001의 커널 파라메터를 비교해서 보여줘"
        expect:
          # plans/122 C-3 - SYN-A-01 과 같은 결과(같은 단언).
          #   원 수동 문구: "\"파라메터\"(오타) → 자모 편집거리. **복수 서버 IN** 골격 / `OSParameter` 2행(SYN-A-01과 동일 결과)"
          row_count: {eq: 2}
          sql_must_not_match: ["(?i)\\bis_lob\\s*=\\s*1\\b"]
          response_must_contain: ["DB-ORA-023", "SV-WEB-001", "kernel.shmmax", "137438953472", "68719476736"]
  - id: SYN-C-02
    plans: [37, 61]
    title: "전체 서버의 시리얼 넘버를 제조사와 함께 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "전체 서버의 시리얼 넘버를 제조사와 함께 보여줘"
        expect:
          # plans/122 C-3 - 옮기지 않음(⑤): 「전체 서버」라 응답 표가 앞부분만 보여줄 수 있어 SYN-A-03 서버 값이
          #   응답 본문에 실린다는 보장이 없다(결과 행 H-1 로 볼 대상).
          manual_review: "\"시리얼 넘버\" → \"시리얼\" 부분어 포함(0.85~0.95). **미등록 변형(\"시리얼 넘버\") + 등록어(\"제조사\") 혼합 매핑** — 한쪽만 매핑되는 비대칭 확인 / `SerialNumber`+`Vendor` 동시 조회(SYN-A-03 서버들 값 포함)"
  - id: SYN-C-03
    plans: [37, 61]
    title: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
        expect:
          # plans/122 C-3 - 옮기지 않음(②): 09 픽스처 cocm-ngcapo91 도 TotalSize 65536 이라 상위 3대가
          #   DB-ORA-023·cocm-hdkapp01·cocm-ngcapo91 로 바뀌었다(SV-WEB-001 32768 은 4위권) - 기대값이 낡았다.
          manual_review: "\"메모리 사이즈\" → \"메모리크기/메모리용량\" 근사. **정렬 + LIMIT(TOP-N)** 골격 / `TotalSize`(server.Memory) 내림차순 — DB-ORA-023(65536)·cocm-hdkapp01(65536) → SV-WEB-001(32768). hostapo01/02(`62.1 GB` 텍스트)는 판정 제외"
  - id: SYN-C-04
    plans: [37, 61]
    title: "hostapo01과 hostapo02의 하이퍼 스레딩 설정을 비교해줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "hostapo01과 hostapo02의 하이퍼 스레딩 설정을 비교해줘"
        expect:
          # plans/122 C-3 - 옮기지 않음(③): HYPERTHREADING 은 init 밖 excel 데이터(hostapo01/02)에만 있다.
          manual_review: "\"하이퍼 스레딩\" → 구분자 제거 동등(0.97, 등록형 \"하이퍼스레딩\"). **복수 서버 IN**. HYPERTHREADING 데이터는 hostapo01/02에만 존재(SV-WEB-001 등 P61 서버엔 없음) / 2행 모두 `HYPERTHREADING` = `on`"
  - id: SYN-E-01
    plans: [37, 61]
    title: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
        expect:
          # plans/122 C-3 - 부분 이관: 2026-06 월 통계는 07 픽스처 4대뿐이다(05 더미는 stat_date 가 'stat_date_1' 꼴 ·
          #   09 는 통계 없음 - 실측). 상위 3대 집합·값·기간은 옮겼고, 「기대 순서」는 응답 문자열로 볼 수 없어 남긴다.
          row_count: {eq: 3}
          sql_must_match: ["(?i)\\bcmm_metric_stat_m\\b"]
          period_covers: {from: "2026-06-01", to: "2026-07-01"}
          response_must_contain: ["DB-ORA-023", "72.1", "cocm-hdkapp01", "48.9", "SV-WEB-001", "42.8"]
          manual_review: "\"CPU\"가 `LOGICALCORE` synonym에 포함 / 코어 수(EAV)가 아닌 **사용률 metric**(`cmm_metric_stat_m`, Utilization, server.Cpus) 경로 + `stat_date='202606'` + 내림차순 + TOP-3. 기대 순서: **DB-ORA-023(72.1) > cocm-hdkapp01(48.9) > SV-WEB-001(42.8)** (4위 SV-BATCH-009 18.3은 잘려야 함). 트랙 C(semantic compiler) 활성 시 결정적 피벗 SQL"
  - id: SYN-E-02
    plans: [37, 61]
    title: "디스크 용량이 2TB 이상인 서버를 용량이 큰 순서로 10건만 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "디스크 용량이 2TB 이상인 서버를 용량이 큰 순서로 10건만 보여줘"
        expect:
