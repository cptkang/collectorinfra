# 자동 생성 초안 (scripts/scenario/import_docs.py) - plans/94 §3.4
#
# expect 는 비어 있고 manual_review 만 들어 있다. 단언으로 옮긴 만큼만 자동 판정
# 대상이 되며, 옮기지 않은 것은 리포트 9절 '수동 검토'에 계속 남는다.
# plans 필드는 군 단위 기본값이다 - 시나리오별로 정확히 좁히는 것이 사람의 일이다.
#
# ★ 누락 고지: 원문의 **그룹 D(등록 흐름)와 그룹 G(시드x거버넌스)는 표가 아니라 산문 절차**다
#   (docker exec redis-cli / 오프라인 prune 스크립트). 프롬프트 트랙으로 재현되지 않아 이 카탈로그에
#   없다 - 32건은 표 형식 케이스 전건이며 D/G 는 별도 트랙이다. 조용히 빠진 것이 아니라 빠진 사유를
#   여기 남긴다.
version: 1
group:
  id: L
  name: "유사어/용어 (SYN A~I)"
  latency_target_ms: 30000
  policy_confirmed: false
  source: "docs/synonym_test_cases.md"
scenarios:
  - id: SYN-A-01
    plans: [37, 61]
    title: "DB-ORA-023과 SV-WEB-001 두 서버의 커널 파라미터를 비교해서 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "DB-ORA-023과 SV-WEB-001 두 서버의 커널 파라미터를 비교해서 보여줘"
        expect:
          manual_review: "\"커널 파라미터\"→`OSParameter` + **복수 서버 IN 조건**. LOB이므로 `stringvalue` 사용(`stringvalue_short`면 빈 값 회귀). `is_lob=1` 조건이 SQL에 있으면 실패(Known Mistakes 2026-06-10) / 2행 — DB-ORA-023: `kernel.shmmax = 137438953472` 등, SV-WEB-001: `kernel.shmmax = 68719476736` 등"
  - id: SYN-A-02
    plans: [37, 61]
    title: "SV-WEB-001 서버의 sysctl 설정에서 vm.swappiness 값이 얼마인지 알려줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "SV-WEB-001 서버의 sysctl 설정에서 vm.swappiness 값이 얼마인지 알려줘"
        expect:
          manual_review: "영문 동의어 \"sysctl\"→`OSParameter` + **LOB 텍스트 내 특정 키 추출**(SQL LIKE 또는 결과 후처리 — 어느 쪽이든 최종 답이 맞으면 통과) / `vm.swappiness = 10`"
  - id: SYN-A-03
    plans: [37, 61]
    title: "SV-WEB-001, DB-ORA-023, cocm-hdkapp01 세 서버의 제조사, 일련번호, 모델명을 표로 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "SV-WEB-001, DB-ORA-023, cocm-hdkapp01 세 서버의 제조사, 일련번호, 모델명을 표로 보여줘"
        expect:
          manual_review: "\"제조사\"→`Vendor`, \"일련번호\"→`SerialNumber`, \"모델명\"→`MODEL` — **3개 서버 IN × 3개 속성 동시 피벗** / SV-WEB-001: HPE/KR2024WEB0001/ProLiant DL380 Gen10 · DB-ORA-023: Dell/KR2023ORA0023/PowerEdge R750 · cocm-hdkapp01: HPE/KR2024APP0001/ProLiant DL360 Gen10"
  - id: SYN-A-04
    plans: [37, 61]
    title: "hostapo01과 hostapo02의 타임존과 제조사를 함께 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "hostapo01과 hostapo02의 타임존과 제조사를 함께 보여줘"
        expect:
          manual_review: "\"타임존\"→`GMT`, \"제조사\"→`Vendor` — **복수 서버 × 복수 속성 동시 매핑** / 2행 모두 `GMT+09:00` / `Dell Inc.`"
  - id: SYN-A-05
    plans: [37, 61]
    title: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "논리코어가 8개 이상인 서버의 서버명, 논리코어 수, 메모리 용량을 논리코어 내림차순으로 보여줘"
        expect:
          manual_review: "\"논리코어\"→`LOGICALCORE`(server.Cpus), \"메모리 용량\"→`TotalSize`(server.Memory). **자식 리소스 EAV 피벗(D-068) + EAV 값 수치 조건 + 정렬**. 값이 NULL이면 server.Server 행에만 조인한 회귀 / DB-ORA-023(16/65536)·cocm-hdkapp01(16/65536) → SV-WEB-001(8/32768) 순. SV-BATCH-009(4코어)는 **제외**돼야 함. hostapo01/02(`16.0`/`62.1 GB`)는 판정 제외"
  - id: SYN-B-01
    plans: [37, 61]
    title: "장비명이 SV-로 시작하는 서버의 장비명과 IP 주소를 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "장비명이 SV-로 시작하는 서버의 장비명과 IP 주소를 보여줘"
        expect:
          manual_review: "\"장비명\"→`name` + **LIKE 전방일치**. SQL이 `c.name LIKE 'SV-%'` (hostname으로 가면 svweb001·svbatch009는 패턴 불일치로 0건) / 2건 — SV-WEB-001(10.61.0.1), SV-BATCH-009(10.61.0.4)"
  - id: SYN-B-02
    plans: [37, 61]
    title: "호스트네임에 batch가 포함된 서버의 장비명과 IP를 찾아줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "호스트네임에 batch가 포함된 서버의 장비명과 IP를 찾아줘"
        expect:
          manual_review: "\"호스트네임\"→`hostname` + **LIKE 부분일치**. SQL이 `hostname LIKE '%batch%'` (name 칼럼 + 대소문자 구분 LIKE면 'SV-BATCH-009'가 매칭되지 않아 0건) / 1건 — SV-BATCH-009 / 10.61.0.4"
  - id: SYN-B-03
    plans: [37, 61]
    title: "서버 이름과 호스트명이 서로 다른 서버 목록을 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "서버 이름과 호스트명이 서로 다른 서버 목록을 보여줘"
        expect:
          manual_review: "\"서버 이름\"→`name`, \"호스트명\"→`hostname` 분리 매핑 + **칼럼 간 비교 조건**(`name <> hostname`) / 5건(hostname 단위) — DB-ORA-023, SV-WEB-001, SV-BATCH-009, hostapo01, hostapo02"
  - id: SYN-C-01
    plans: [37, 61]
    title: "DB-ORA-023과 SV-WEB-001의 커널 파라메터를 비교해서 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "DB-ORA-023과 SV-WEB-001의 커널 파라메터를 비교해서 보여줘"
        expect:
          manual_review: "\"파라메터\"(오타) → 자모 편집거리. **복수 서버 IN** 골격 / `OSParameter` 2행(SYN-A-01과 동일 결과)"
  - id: SYN-C-02
    plans: [37, 61]
    title: "전체 서버의 시리얼 넘버를 제조사와 함께 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "전체 서버의 시리얼 넘버를 제조사와 함께 보여줘"
        expect:
          manual_review: "\"시리얼 넘버\" → \"시리얼\" 부분어 포함(0.85~0.95). **미등록 변형(\"시리얼 넘버\") + 등록어(\"제조사\") 혼합 매핑** — 한쪽만 매핑되는 비대칭 확인 / `SerialNumber`+`Vendor` 동시 조회(SYN-A-03 서버들 값 포함)"
  - id: SYN-C-03
    plans: [37, 61]
    title: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "메모리 사이즈가 큰 순서로 상위 3대 서버를 보여줘"
        expect:
          manual_review: "\"메모리 사이즈\" → \"메모리크기/메모리용량\" 근사. **정렬 + LIMIT(TOP-N)** 골격 / `TotalSize`(server.Memory) 내림차순 — DB-ORA-023(65536)·cocm-hdkapp01(65536) → SV-WEB-001(32768). hostapo01/02(`62.1 GB` 텍스트)는 판정 제외"
  - id: SYN-C-04
    plans: [37, 61]
    title: "hostapo01과 hostapo02의 하이퍼 스레딩 설정을 비교해줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "hostapo01과 hostapo02의 하이퍼 스레딩 설정을 비교해줘"
        expect:
          manual_review: "\"하이퍼 스레딩\" → 구분자 제거 동등(0.97, 등록형 \"하이퍼스레딩\"). **복수 서버 IN**. HYPERTHREADING 데이터는 hostapo01/02에만 존재(SV-WEB-001 등 P61 서버엔 없음) / 2행 모두 `HYPERTHREADING` = `on`"
  - id: SYN-E-01
    plans: [37, 61]
    title: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "2026년 6월 서버별 CPU 사용률 평균이 높은 상위 3대를 보여줘"
        expect:
          manual_review: "\"CPU\"가 `LOGICALCORE` synonym에 포함 / 코어 수(EAV)가 아닌 **사용률 metric**(`cmm_metric_stat_m`, Utilization, server.Cpus) 경로 + `stat_date='202606'` + 내림차순 + TOP-3. 기대 순서: **DB-ORA-023(72.1) > cocm-hdkapp01(48.9) > SV-WEB-001(42.8)** (4위 SV-BATCH-009 18.3은 잘려야 함). 트랙 C(semantic compiler) 활성 시 결정적 피벗 SQL"
  - id: SYN-E-02
    plans: [37, 61]
    title: "디스크 용량이 2TB 이상인 서버를 용량이 큰 순서로 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "디스크 용량이 2TB 이상인 서버를 용량이 큰 순서로 보여줘"
        expect:
          manual_review: "\"디스크용량\"이 `TotalSize` synonym에 있으나 TotalSize는 server.Memory/server.Disks 양쪽 속성 / `server.Disks`의 TotalSize 기준 + **단위 변환(2TB=2097152MB) 수치 조건** + 정렬. 기대: DB-ORA-023(4194304) > SV-BATCH-009(3145728) > cocm-hdkapp01(2097152), SV-WEB-001(1048576)은 제외. 메모리 TotalSize로 가면(최대 65536) 0건 — 즉시 실패 판정. hostapo01/"
  - id: SYN-E-03
    plans: [37, 61]
    title: "가용성 상태가 정상이 아닌 서버의 서버명과 제조사를 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "가용성 상태가 정상이 아닌 서버의 서버명과 제조사를 보여줘"
        expect:
          manual_review: "avail_status 값 매핑(규칙 13) + EAV 조인 결합 / `avail_status != 0` (특정 값 `= 1` 매핑이면 실패 — svbatch009는 2라 누락됨). 기대 8건: SV-BATCH-009(IBM), svr-app-03(HPE), svr-bat-02(VMware, Inc.), svr-db-04(Dell Inc.), svr-was-03(HPE), svr-was-07(Dell Inc.), svr-web-05(VMware, Inc.), svr-web-08(HPE)"
  - id: SYN-F-01
    plans: [37, 61]
    title: "2026년 6월에 메모리 사용률이 90%를 넘은 적이 있는 서버를 알려줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "2026년 6월에 메모리 사용률이 90%를 넘은 적이 있는 서버를 알려줘"
        expect:
          manual_review: "\"메모리 사용률\"→`cmm_metric_stat_*`(시드 패턴 B) + **\"넘은 적이 있는\"→`max_val` 선택 + 임계 조건 + 월 필터**. EAV `TotalSize`(용량)로 가면 실패. `avg_val > 90`으로 가면 0건(최고 82.6) — max/avg 칼럼 선택까지 판정 / **DB-ORA-023 1건**(202606 max_val 95.2). 처리 현황에 metric 테이블 표시"
  - id: SYN-F-02
    plans: [37, 61]
    title: "2026년 7월에 발생한 심각 알람이 몇 건인지 알려줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "2026년 7월에 발생한 심각 알람이 몇 건인지 알려줘"
        expect:
          manual_review: "\"심각\"→`cmm_alarm.alarmseverity` + column_values `심각=3`(시드 패턴 C) + **ctime 날짜 범위 결합** / SQL `alarmseverity = 3` + 7월 범위 → **2건**(7/10, 7/13). `= 1` 등 다른 리터럴이면 column_values 미주입/환각. 날짜 조건 누락 시 4건으로 초과"
  - id: SYN-F-03
    plans: [37, 61]
    title: "경고 알람 목록을 발생 서버명과 함께 최신순으로 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "경고 알람 목록을 발생 서버명과 함께 최신순으로 보여줘"
        expect:
          manual_review: "\"경고\"→`alarmseverity = 2` + **cmm_resource 조인 + ctime 내림차순** / 서버명 조인 시 2건: DB-ORA-023(2026-06-25) → SV-BATCH-009(2026-06-05) 순. LEFT JOIN이면 3건(더미 1건은 서버명 NULL) — 2·3건 모두 허용, `alarmseverity = 2` 리터럴과 정렬 방향이 판정 기준"
  - id: SYN-F-04
    plans: [37, 61]
    title: "2026년 6월 디스크 아이오가 가장 높았던 서버의 제조사와 일련번호를 알려줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "2026년 6월 디스크 아이오가 가장 높았던 서버의 제조사와 일련번호를 알려줘"
        expect:
          manual_review: "표기 변형 \"디스크 아이오\"가 시드에 **직접 등재** — fuzzy OFF에서도 정확일치. **metric TOP-1 → EAV 속성 크로스도메인 조인** / 디스크 IO metric(`MaxIORate`, 202606) 최고 서버 = **DB-ORA-023** → 제조사 `Dell`, 일련번호 `KR2023ORA0023`"
  - id: SYN-F-05
    plans: [37, 61]
    title: "(프롬프트 아님) `python scripts/synonym_seeds.py load --db polestar` 재실행"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "(프롬프트 아님) `python scripts/synonym_seeds.py load --db polestar` 재실행"
        expect:
          manual_review: "멱등성·무손실(합집합 병합) / HLEN 불변, 기존 단어 소실 없음"
  - id: SYN-H-01
    plans: [37, 61]
    title: "심각 알람이 발생한 적이 있는 서버들의 제조사와 메모리 용량을 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
          query: "심각 알람이 발생한 적이 있는 서버들의 제조사와 메모리 용량을 보여줘"
        expect:
          manual_review: "**알람(column_values 심각=3) → cmm_resource → 자식 EAV 피벗** 3도메인 조인. 알람 4건 중 1건(더미)은 resource 미존재 — 서버 결과에 나타나면 안 됨 / 3건: SV-WEB-001(HPE/32768), DB-ORA-023(Dell/65536), SV-BATCH-009(IBM/16384)"
  - id: SYN-H-02
    plans: [37, 61]
    title: "2026년 6월 CPU 사용률 평균이 40%를 넘은 서버의 서버명과 논리코어 수를 보여줘"
    kind: normal
    env: sandbox
    profile: baseline
    endpoint: stream
    turns:
      - send:
