# plans/122 T-0 — 한국어 시간 표현 골드셋 ①: 해석 정책 표(§10.3.1 · G-15 · D-275 ⑮) × 다중 기준 시각
#
# 기대값의 정본은 plans/122 §10.3.1 표다. 표가 정하지 않은 조합(진행 중인 명시 기간 · 연도 없는 월 ·
# 「지난 N주」 · 비교 질의 등)은 src/domain/time_spec.py · time_expr.py 머리말의 「표 밖 조합」 규칙을 따른다.
#
# 채점: 구간 정확 일치(Laparra et al. TACL 2018 · plans/122 §11) — start·end·grain·completeness 전부.
# notes는 부분 집합 단언(적힌 코드가 모두 있어야 한다).
#
# 시각 표기: "YYYY-MM-DD"(그날 0시) 또는 "YYYY-MM-DD HH:MM" — 모두 KST. 구간은 반개구간 [start, end).
# expect 종류:
#   {start, end, grain, completeness, notes?}  — 해석 결과
#   {unbounded: true, grain}                   — 기간 조건 없음(「~한 적이 있는」)
#   {unresolved: true}                         — 규칙 해석 불가 + 기간 흔적 있음 → LLM 슬롯·되묻기 대상
#   {no_period: true}                          — 기간 표현 아님(오탐 차단) → 기본값(직전 완결 월)
#
# 「이번 달 미적재」(당월 행 없음)는 데이터 조건이라 해석기 입력이 아니다 — 해석기는 「매월 1일」
# 기준 시각(m_first · q_first · leap_next)에서 빈 구간(empty_range)을 내는 것까지만 책임진다.
version: 1
