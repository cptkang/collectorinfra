  jan: "2026-01-15 09:00"        # 목 — 1월(연 넘김)
  leap: "2028-02-29 10:00"       # 화 — 윤년 2월 말일
  leap_next: "2028-03-01 10:00"  # 수 — 윤년 다음 날 · 매월 1일
  monday: "2026-09-28 09:00"     # 월 — 주 경계(주 시작)
  sunday: "2026-09-27 22:00"     # 일 — 주 마지막 날
  q_first: "2026-10-01 10:00"    # 목 — 분기 경계 · 매월 1일
  m_first: "2026-09-01 10:00"    # 화 — 매월 1일
