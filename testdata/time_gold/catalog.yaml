# plans/122 T-0 — 한국어 시간 표현 골드셋 ②: 시나리오 카탈로그의 시간 표현 턴
#
# 출처: testdata/scenarios/*.yaml(load_catalog · 247턴) 중 기간·「~한 적이 있는」·「현재」류 표현이 있는 턴과
# 기간 없음 대표 2턴(A-01 · H-12). 각 케이스의 scenario·turn이 출처다. query는 카탈로그 원문 그대로다.
# 기준 시각은 §10.3.1 표와 같은 base(2026-09-29 화 10:00 KST) 하나다 — 다중 기준 시각은 policy.yaml,
# 실제 run 시각의 재생은 replay_20260923.yaml에 있다.
#
# expect 종류는 policy.yaml 머리말과 같고, 둘이 더 있다:
#   {ambiguous: 사유}     — 정답 정의 미정(G-10) — 채점하지 않는다
#   {out_of_scope: 사유}  — 「현재·지금」류(정책 표에 행 없음) — 인식기가 기간을 만들지 않는 것만 단언
#
# 집계(이 파일): 기간·unbounded·해석 불가 63 + 기간 없음 2 + G-10 모호 3 + 현재류 7 = 75
version: 1
anchors:
  base: "2026-09-29 10:00"
cases:
  - id: C-001
    scenario: A-01
    turn: 1
    env: closed
    anchor: base
    query: "여의도 개발 서버들의 CPU 사용률을 10건만 보여줘"
    source: "기간 없음(§10.1 — 현행은 CURRENT_DATE 함수식)"
    expect: {start: "2026-08-01", end: "2026-09-01", grain: month, completeness: complete, notes: [default_period]}
  - id: C-002
    scenario: A-04
    turn: 1
    env: closed
    anchor: base
    query: "현재 활성 상태인 심각 알람 목록 10건만 보여줘"
    source: "현재류"
    expect: {out_of_scope: "현재 활성 알람 — 상태 조회(기간 아님)"}
  - id: C-003
    scenario: A-07
    turn: 1
    env: closed
    anchor: base
    query: "안녕하세요, 오늘 날씨 어때요?"
    source: "오늘(범용 대화 — 기간 해석은 결정적)"
    expect: {start: "2026-09-29 00:00", end: "2026-09-29 10:00", grain: hour, completeness: to_date}
  - id: C-004
