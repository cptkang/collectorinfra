# plans/122 T-0 — 한국어 시간 표현 골드셋 ③: §10.1 오답 재현용 재생 케이스(두 run의 서버 로그)
#
# 대상: §10.1 「월 단위로 표현할 수 없는 시간 표현」 중 2단 로그가 있는 11턴 + R3-05(값 범위 밖 · 환각 기간).
# M-03·M-04·M-07(최근 1시간)은 로컬 샌드박스 전용이라 두 run에 로그가 없다.
#
# 각 케이스:
#   anchor         — 그 턴의 input_parser 로그 시각(KST · 요청 수신 직후) — 기대값의 기준 시각
#   expect         — 새 해석기 기대값(§10.3.1 정책 표 · 그 기준 시각에서) — tests가 단언한다
#   llm_time_range — 그 턴에 실행된 input_parser LLM `time_range`(로그 원문 그대로). 현행
#                    `resolve_stat_month_range(query, parsed_time_range=…)` 재생 입력이다(스크래치 채점)
#   domain         — 현행 월 투영이 소비된 경로: stat(월 통계 블록 · (당월, 당월)이면 D-201 일간 블록)
#                    · alarm(`_month_range_to_ts_bounds` — 월 전체 ctime 구간)
#   verdict_10_1   — §10.1의 실행 SQL 판정: wrong(오답) · function(의미는 맞지만 DB 함수식)
#   log            — run 디렉터리 · 서버 로그 파일:줄(input_parser 줄 → 폴백 계측 줄)
#
# run: bench = results/bench/run-closed-20260928-triage.tar/20260923-140539(2단 baseline arm)
#      scenario = results/scenario/20260923-103638(2단)
version: 1
