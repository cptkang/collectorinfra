    scenario: K-09
    query: "전체 서버의 시간 단위 CPU 사용률을 최근 30일치 전부 보여줘"
    anchor: "2026-09-23 16:47"
    expect: {start: "2026-08-24", end: "2026-09-23", grain: hour, completeness: complete}
    llm_time_range: {start: "2026-08-24", end: "2026-09-23"}
    domain: stat
    verdict_10_1: wrong
    log: "bench server-baseline.log:6366 → :6384 ('202608','202608')"
