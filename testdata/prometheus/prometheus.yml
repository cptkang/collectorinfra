# §8.1 스크레이프·라벨 규약 — nodename 값은 PG 픽스처 polestar.cmm_resource의
# server_name(svr-web-01)과 동일하게 정렬해 D-119 서버측 {nodename=…} 조립과
# 소스 교차 검증(§2)이 픽스처에서 실제로 단언 가능하게 한다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # target-vm(우분투+node_exporter 설치·hostname=svr-web-01) — static 라벨(0차 결정적)에
  # 더해 node_uname_info{nodename}이 실 uname으로 svr-web-01을 보고한다(§5-1 실측 경로).
  - job_name: node
    static_configs:
      - targets: ["target-vm:9100"]
        labels:
          nodename: svr-web-01

  - job_name: mock
    static_configs:
      - targets: ["mock-exporter:80"]
        labels:
          nodename: svr-web-01

  # plans/92 O5(B-2) 폴스타 → OpenMetrics 브리지 — 호스트에서 EXPOSE_POLESTAR_EXPORTER=true로 띄운
  # mcp_server(임시 포트 9098 · 9099/9097 상주 인스턴스와 별개)의 GET /metrics를 긁는다.
  # 미기동이면 up{job="polestar"} == 0 — 나머지 job에는 영향 없다. 기동 절차는 docs/27 §4.1.
  # MCP_BEARER_TOKEN을 켠 인스턴스면 authorization(credentials)을 추가한다.
  - job_name: polestar
    static_configs:
      - targets: ["host.docker.internal:9098"]

  # plans/189 W6 — 운영 Prometheus 타깃 라벨 규약(D-119 ③ 부기 2026-10-20) 재현. nodename 라벨은 없고
  # hostname(OS)·node_ip(OS IP)·instance(=node_ip:port)·resources(VM name)·type 라벨을 단다.
  # 모두 mock-exporter를 긁되 instance를 명시해 서로 다른 타깃으로 만든다(값은 mock 결정값).
  # 소비: mcp_server/tests/test_plan189_prom_anchor.py TestDockerOperationalLabels(RUN_DOCKER_IT=1).
  - job_name: ops_node
    static_configs:
      # 정상 서버 — 사다리 1단(hostname+node_ip)
      - targets: ["mock-exporter:80"]
        labels:
          instance: "10.10.0.1:9100"
          hostname: ops-01
          node_ip: 10.10.0.1
          resources: svr-ops-01
          type: node
      # VM 교체 서버 — resources가 교체 전 VM name으로 낡아 있다(폴스타 등록명과 다름)
      - targets: ["mock-exporter:80"]
        labels:
          instance: "10.10.0.2:9100"
          hostname: ops-02
          node_ip: 10.10.0.2
          resources: svr-ops-02-old
          type: node
      # 물리 호스트명 그룹 — 같은 hostname 아래 서로 다른 instance 두 타깃(「모호」 판정)
      - targets: ["mock-exporter:80"]
        labels:
          instance: "10.10.0.3:9100"
          hostname: ops-phys
          node_ip: 10.10.0.3
          resources: svr-ops-phys-a
          type: node
      - targets: ["mock-exporter:80"]
        labels:
          instance: "10.10.0.4:9100"
          hostname: ops-phys
          node_ip: 10.10.0.4
          resources: svr-ops-phys-b
          type: node
