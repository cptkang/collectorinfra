# 시연 세션 카탈로그 — 장애 대응 시스템 연계 (scripts/demo · docs/35_demo_script_guide.md)
#
# 장애 대응 흐름을 따라 시스템을 넘나드는 대화다. 기준 존은 **은행존**(폴스타 polestar_b0 ·
# 제니퍼 소스 b0)이다 — 소스 이름은 자리표({{polestar_name}} · {{apm_name}} · {{asset_name}})라
# 환경 값 파일에서 바꾼다. 기능 둘러보기 카탈로그(2026-10-13 · 8군 37세션)는 git 이력에 있다
# (`git show 09f1a1c:testdata/demo/sessions.yaml`).
#
# 세션 하나 = 웹 대화 1건(thread_id 1개). 같은 세션의 턴은 이어서 묻는 흐름이다.
# 판정·기대값이 없다 — 판정·회귀는 testdata/scenarios(scripts.scenario)가 맡는다.
#
# 질의 작성 원칙 (2026-10-14 코드 검토 — 폐쇄망 LLM temperature ≠ 0 전제)
#   1. 모든 턴에 소스 이름을 쓴다 — 「은행 제니퍼」(apm·b0)·「은행 폴스타」(polestar_b0)·「자산관리」(itam)는
#      레지스트리 별칭이라 입력 파서가 결정적으로 소스를 고정한다.
#   2. 폴스타·자산관리로 가는 턴은 서버명을 **직접 지목**한다. 「그 서버(들)」를 폴스타 SQL·자산관리 SQL로
#      넘기는 경로는 LLM 재작성에 의존하고, 여러 대 + 알람이면 서버 조건이 빠져 전체 알람이 나올 수 있다.
#   3. 「그 서버들」은 **제니퍼로 가는 턴에만** 쓴다(★ 연계) — 앞 턴 결과의 hostname(또는 폴스타 등록명 →
#      hostname 변환)을 제니퍼 대상 해석이 결정적으로 이어받는다(src/orchestration/apm_query.py
#      resolve_apm_targets ③). 앞 턴 결과는 20행 이하로 둔다(넘으면 앞쪽 표본만 이어진다).
#      제니퍼 결과를 다시 「그 서버들」로 잇지 않는다 — 소스 이름을 쓰면 제니퍼 직전 대상 승계(D-334)가
#      꺼지고, 제니퍼 결과 행은 식별 칸(인스턴스 id·이름·hostname…)이 많아 직전 엔티티 상한 20개를
#      몇 행 만에 채워 뒤쪽 서버가 말없이 빠진다. 제니퍼에서 볼 것은 「그 서버들」 턴 하나에 묶는다.
#   4. 한 시스템 결과를 다른 시스템으로 넘기는 한 문장 복합(연결형)은 쓰지 않는다 — 작업 분해·연결이 LLM 몫이고
#      폴스타 쪽 hostname 대조가 정확 일치라 표기가 다르면 0건이다. E1 처럼 같은 서버명을 각 시스템에 따로
#      묻는 병렬 복합만 쓴다.
#   5. 알람은 「지금 발생 중인」(활성) 또는 「{{alarm_period}}」(이력) 중 하나만 묻는다 — 섞으면 모호 처리된다.
#   6. 「OS 정보」·「자원 현황」·「사용률 추세」·「실시간 지표」 표현은 쓰지 않는다 — 호스트 조사 플래그가
#      켜진 서버에서 MCP 조사 도구로 갈 수 있고, 그 도구는 은행존에서 파일시스템·hostname 지목이 0건이다.
#
# 세션 칸
#   id · title · shows(이 세션이 보여주는 것) · core(true = 핵심 세트) · requires(필요 소스) · turns
# 턴 칸 (문자열 하나면 query 만)
#   query                  질의 문구. {{이름}} 은 환경 값 파일 values 로 채운다
#   upload                 저장소 루트 기준 업로드 파일 (양식 채우기)
#   expect_clarify: true   이 턴은 역질문을 받는 것이 정상 — 자동 응답하지 않고 다음 턴이 답한다
#   selected_db_ids / selected_sources / selected_apm_source_ids
#                          역질문 답(웹 칩 확인 버튼과 같은 구조화 필드). query 를 비우면 원 질의를 다시 보낸다
#   form_fill_answers      양식 미해결 열 답 — {열 이름: {action: literal, value: 값}} · form_fill_remember
#   note                   발표자 메모(전송하지 않는다)

version: 1

groups:
  # ────────────────────────────────────────────────────────────────────────
  - id: A
    name: 제니퍼에서 이상 발견 → 폴스타로 서버 확인
    sessions:
      - id: A1
        title: WAS 인스턴스 지연 알람 대응
        shows: >-
          지연 알람이 난 WAS 인스턴스를 제니퍼에서 확인(위치·상태 → 응답 지표 → JVM·커넥션 풀 → 느린 거래)한 뒤,
          제니퍼가 알려 준 호스트를 폴스타에서 확인한다(CPU·메모리·파일시스템 → 활성 알람 → 프로세스)
        core: true
        requires: [polestar, apm]
        turns:
          - query: "{{apm_name}}에서 {{apm_instance}} 인스턴스에 응답 지연 알람이 왔어. 이 인스턴스가 어느 서버(호스트네임)에서 돌고 있고 지금 상태는 어때?"
            note: 상황 설정 - 지연 알람 수신. 응답의 호스트네임이 {{was_host}} 와 같은지 리허설에서 확인
          - query: "{{apm_name}}에서 {{apm_instance}} 인스턴스의 {{incident_window}} 평균·p95 응답시간, TPS, 에러율, 액티브 서비스 수를 보여줘"
            note: 지연이 언제부터·얼마나인지 - 응답시간 분포와 처리량·에러를 함께 본다
          - query: "{{apm_name}}에서 {{apm_instance}} 인스턴스의 {{incident_window}} 힙 사용량과 GC 시간 비중, 프로세스 CPU, DB 커넥션 풀 사용률을 보여줘"
            note: 지연의 흔한 원인 - JVM 힙 압박·GC 지연·DB 커넥션 풀 고갈
          - query: "{{apm_name}}에서 {{apm_instance}} 인스턴스의 {{incident_window}} 느린 트랜잭션 상위 5건을 SQL·외부 호출 시간으로 나눠서 보여줘"
            note: 어느 구간(SQL·외부 호출·CPU)에서 느린지
          - query: "{{polestar_name}}에서 {{was_host}} 서버의 {{metric_window}} CPU·메모리·파일시스템 사용률을 시간대별로 보여줘"
            note: 연계 - 1턴에서 제니퍼가 알려 준 호스트를 폴스타에서 확인(서버명 지목 - 결정적)
          - query: "{{polestar_name}}에서 {{was_host}} 서버에 지금 발생 중인 알람을 보여줘"
            note: 서버 자원 알람(CPU·메모리·파일시스템)이 같이 떠 있는지
          - query: "{{polestar_name}}에서 {{was_host}} 서버의 CPU를 많이 쓰는 프로세스 상위 5개 보여줘"
            note: WAS(java) 프로세스가 CPU 를 독점하는지 - 서버 .env 에 은행존 프로세스 API 주소가 있어야 한다

      - id: A2
        title: 가장 느린 WAS 들의 JVM·실행 중 서비스
        shows: 제니퍼 전체 인스턴스 순위로 느린 WAS 를 찾고, 그 서버들의 JVM 상태와 붙잡혀 있는 요청을 한 턴에 이어 본다
        requires: [apm]
        turns:
          - query: "{{apm_name}}에서 {{incident_window}} 평균 응답시간이 가장 느린 WAS 인스턴스 3개를 호스트네임과 함께 보여줘"
          - query: "그 서버들의 {{apm_name}} WAS 힙 사용량·GC 시간 비중과 지금 실행 중인 서비스를 경과 시간 순으로 보여줘"
            note: >-
              ★ 연계 - 순위 결과(3행)의 hostname 을 이어받는다(제니퍼 → 제니퍼 · 결정적).
              JVM 과 실행 중 서비스를 한 턴에 묻는다 - 이 결과를 다시 「그 서버들」로 잇지 않는다(원칙 3)

  # ────────────────────────────────────────────────────────────────────────
  - id: B
    name: 폴스타에서 이상 발견 → 제니퍼로 서비스 영향 확인
    sessions:
      - id: B1
        title: 심각 알람 서버의 서비스 영향
        shows: 폴스타 심각 알람이 떠 있는 서버의 WAS 가 실제로 느려졌는지 제니퍼로 확인한다
        core: true
        requires: [polestar, apm]
        turns:
          - query: "{{polestar_name}}에서 지금 발생 중인 심각 알람을 서버별 건수로 상위 5대 보여줘"
            note: 활성 알람이 없으면 B2(자원 과부하)로 넘어간다
          - query: "그 서버들의 {{apm_name}} WAS 응답시간·TPS·에러율과 힙 사용량·GC 시간 비중을 보여줘"
            note: >-
              ★ 연계 - 폴스타 결과의 서버(등록명 → hostname 변환)를 제니퍼가 이어받는다. 서비스 지표와
              JVM 압박을 한 턴에 묻는다(원칙 3). WAS 가 없는 서버(DB·웹 서버)는 「인스턴스 미연결」 안내가 정상이다

      - id: B2
        title: CPU 과부하 서버의 서비스 영향
        shows: CPU 과부하 서버를 폴스타에서 찾아 그 서버 WAS 의 응답·처리량과 실행 중 요청을 제니퍼로 본다
        core: true
        requires: [polestar, apm]
        turns:
          - query: "{{polestar_name}}에서 {{metric_window}} CPU 사용률 최대값이 {{cpu_threshold}}%를 넘은 서버를 최대값 순으로 상위 5대 보여줘"
            note: 없으면 {{cpu_threshold}} 를 낮춘 값으로 웹에서 다시 묻는다
          - query: "그 서버들의 {{apm_name}} WAS 응답시간·TPS와 지금 실행 중인 서비스를 경과 시간 순으로 보여줘"
            note: >-
              ★ 연계 - 폴스타 → 제니퍼(서버 → WAS 인스턴스 매핑). 처리량과 CPU 를 잡고 있는 요청을
              한 턴에 묻는다(원칙 3)

  # ────────────────────────────────────────────────────────────────────────
  - id: C
    name: 장애 서버 확인 → 자산관리로 담당자·계약 확인
    sessions:
      - id: C1
        title: 장애 서버 상태 → 담당자·유지보수·EOS
        shows: >-
          장애 서버의 상태·알람·자원을 폴스타에서 먼저 확인하고, 같은 서버의 조치 연락처(담당 부서·담당자)와
          유지보수 계약·지원 종료(EOS)를 자산관리에서 확인한다
        core: true
        requires: [polestar, itam]
        turns:
          - query: "{{polestar_name}}에서 {{phys_host}} 서버의 OS·IP·가용 상태를 보여줘"
            note: 상황 설정 - 장애 서버 지목({{phys_host}} 는 물리 서버 - 유지보수·EOS 는 물리 서버에만 있다)
          - query: "{{polestar_name}}에서 {{phys_host}} 서버에 지금 발생 중인 알람을 보여줘"
          - query: "{{polestar_name}}에서 {{phys_host}} 서버의 {{metric_window}} CPU·메모리·파일시스템 사용률을 보여줘"
          - query: "{{polestar_name}}에서 {{phys_host}} 서버의 {{alarm_period}} 알람 이력을 심각도별 건수로 보여줘"
            note: 일회성인지 반복 장애인지
          - query: "{{asset_name}}에서 {{phys_host}} 서버의 담당 부서·담당자와 용도, 운영체제를 알려줘"
            note: 연계 - 같은 서버를 자산관리에서(hostname = 서버호스트명)
          - query: "{{asset_name}}에서 {{phys_host}} 서버의 유지보수 계약 종료일과 하드웨어·소프트웨어 지원 종료(EOS)일을 알려줘"
            note: 업체 출동이 가능한지(유지보수 계약 유효) · 지원 종료 장비인지

  # ────────────────────────────────────────────────────────────────────────
  - id: D
    name: 예방 점검 - 지원 종료·유지보수 만료
    sessions:
      - id: D1
        title: 지원 종료(EOS) 임박 서버
        shows: 하드웨어·소프트웨어 지원 종료가 다가오는 서버를 자산관리에서 찾아 분포를 본다
        core: true
        requires: [itam]
        turns:
          - query: "{{asset_name}}에서 하드웨어 또는 소프트웨어 지원 종료(EOS)가 {{eos_window}} 안에 도래하는 서버를 종료일 순으로 보여줘"
            note: 지원 종료일은 물리 서버에만 있다 - 결과가 물리 서버 목록이다
          - query: "{{asset_name}}에서 하드웨어 또는 소프트웨어 지원 종료(EOS)가 {{eos_window}} 안에 도래하는 서버를 운영체제별 대수로 정리해줘"
            note: 교체 규모 - 앞 턴을 이어받지 않고 같은 조건을 다시 쓴다(자산관리 SQL 승계는 LLM 의존)

      - id: D2
        title: 유지보수 계약 만료 임박 서버
        shows: 유지보수 계약이 곧 끝나거나 이미 끝난 서버와 담당 부서를 자산관리에서 본다
        core: true
        requires: [itam]
        turns:
          - query: "{{asset_name}}에서 {{maint_window}} 안에 유지보수 계약이 끝나는 서버를 종료일과 담당 부서·담당자와 함께 종료일 순으로 보여줘"
          - query: "{{asset_name}}에서 유지보수 계약 종료일이 이미 지난 서버를 종료일 순으로 보여줘"
            note: 계약 공백 서버 - 장애 시 업체 지원이 안 되는 대상

  # ────────────────────────────────────────────────────────────────────────
  - id: E
    name: 한 서버 종합 진단
    sessions:
      - id: E1
        title: 장애 문의 서버 한 번에 보기
        shows: 서버 하나를 지목하면 폴스타·제니퍼·자산관리를 한 번에 모아 정리한다
        core: true
        requires: [polestar, apm, itam]
        turns:
          - query: "{{was_host}} 서버 장애 문의가 들어왔어. {{polestar_name}} 서버 상태와 지금 발생 중인 알람, {{apm_name}} WAS 응답시간, {{asset_name}} 담당자를 한 번에 정리해줘"
            note: 세 시스템을 같은 서버명으로 각각 조회 - 앞 결과 승계가 없다(작업 분해만 LLM)
          - query: "{{was_host}} 서버의 {{polestar_name}} {{metric_window}} CPU·메모리 사용률과 {{apm_name}} WAS 힙 사용량을 같이 보여줘"
            note: 서버 자원과 JVM 자원을 한 화면에서 비교
