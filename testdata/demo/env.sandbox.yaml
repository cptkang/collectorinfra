# 시연 환경 값 파일 — 로컬 샌드박스용 (scripts/demo · docs/35_demo_script_guide.md)
#
# 값은 전부 로컬 도커 샌드박스(testdata/pg/init · testdata/itam · testdata/prometheus)의 합성 이름이다.
# 운영 서버명·IP·담당자 이름을 이 파일에 넣지 않는다.
# 폐쇄망 값은 같은 형식의 파일을 **저장소 밖에** 만들어 --env-file 로 넘긴다(반출·커밋 금지).
# 시작점: testdata/demo/env.closed.template.yaml
#
# 칸
# - sources: 이 환경에 연동된 소스. 여기 없는 소스를 요구하는 세션은 사유와 함께 건너뛴다.
#     polestar · multi_zone · itam · prometheus · apm · docs · sre_agent (scripts/demo/catalog.py SOURCES)
# - zone_preference: 존 역질문 자동 응답 때 고를 db_id 우선순위(제시된 것 중 첫 번째 · 없으면 첫 선택지)
# - apm_source_preference: 제니퍼 소스 역질문 자동 응답 우선순위(bank · common · legacy)
# - values: 세션 질의의 {{이름}} 자리표 값. 선택된 세션이 쓰는 자리표가 비면 실행 전에 멈춘다.

environment: sandbox

sources:
  - polestar
  - itam
  - prometheus      # testdata/prometheus 컨테이너를 띄우지 않았으면 지운다

zone_preference: []
apm_source_preference: []

values:
  # --- 서버 (폴스타 cmm_resource 에 있는 이름) ---
  server_web: svr-web-01          # 대표 웹 서버 — Prometheus 대상 · 자산관리에도 있는 서버
  server_was: svr-was-01          # 대표 WAS 서버
  server_db: svr-db-01            # 대표 DB 서버 — 상세 사양 조회용
  server_prefix_web: svr-web      # 서버명 접두 — 「~으로 시작하는 서버」
  server_group_a: 웹 서버          # 서버 묶음 표현 1 (병렬 다중 의도)
  server_group_b: DB 서버          # 서버 묶음 표현 2
  process_name: db2sysc           # 여러 서버에 떠 있는 프로세스 이름

  # --- 기간 (지표 데이터가 있는 달) ---
  month: 2026년 6월               # 지표가 가장 많은 달
  prev_month: 2026년 5월          # 전월 비교 기준
  alarm_period: 최근 3개월        # 알람 집계 기간 표현

  # --- 양식 채우기 ---
  form_scope: svr-web 서버        # 양식을 채울 대상 표현 (폐쇄망 예: 김포 서버)
  form_owner_answer: 인프라팀      # 양식 역질문(담당자 열)에 넣을 값

  # --- 폐쇄망 전용 (sources 에 없으면 쓰이지 않는다) ---
  zone_scope_text: ""
  zone_db_id: ""
  apm_instance: ""
  doc_question_1: ""
  doc_question_2: ""
