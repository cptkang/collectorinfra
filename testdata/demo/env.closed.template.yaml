# 시연 환경 값 파일 — 폐쇄망용 **템플릿** (scripts/demo · docs/35_demo_script_guide.md 「실제 데이터 입력」)
#
# 사용법
#   1. 이 파일을 저장소 **밖**으로 복사한다 (예: C:\demo\env.closed.yaml · ~/demo/env.closed.yaml).
#      운영 서버명·IP·담당자 이름이 들어가므로 저장소 안에 두거나 커밋하지 않는다(반출 금지).
#   2. 아래 각 칸의 「찾는 법」대로 웹 화면에서 질의해 실제 값을 확인하고 채운다.
#   3. python -m scripts.demo --check --env-file <복사한 파일>  → 「점검 통과」가 나올 때까지 고친다.
#   4. python -m scripts.demo --list --env-file <복사한 파일>   → 채워진 질의를 눈으로 확인한다.
#
# 값이 빈 자리표를 쓰는 세션은 실행 전에 멈춘다. 연동이 없는 소스는 sources 에서 지우면
# 그 소스를 요구하는 세션이 사유와 함께 건너뛰어진다.

environment: closed

sources:
  - polestar
  - multi_zone      # 은행존·공동존 김포/여의도가 모두 활성일 때
  - itam            # 자산관리 DB 가 ACTIVE_DB_IDS 에 있을 때
  - apm             # apm_gateway 가 떠 있고 제니퍼 연동이 켜져 있을 때
  - docs            # 사내 문서(RAG) 컬렉션이 적재돼 있을 때
  # - prometheus    # 프로메테우스 연동이 있을 때만
  # - sre_agent     # 장애 조사 프로세스가 떠 있을 때만

# 존 역질문 자동 응답 우선순위 — 김포가 먼저인 이유: 존 전체를 고르면 질의당 시간이 약 3배다.
zone_preference: [polestar_cm_gp]
# 제니퍼 소스 역질문 자동 응답 우선순위 — bank(은행존) · common(공동존) · legacy(레거시)
apm_source_preference: [common]

values:
  # --- 서버 ---
  # 찾는 법: 웹에서 「김포 서버 중 CPU 사용률 상위 5대」 → 응답에 나온 서버명 하나
  server_web: ""
  # 찾는 법: 「김포 WAS 서버 목록 5건」 → 서버명 하나 (APM 세션을 쓰면 제니퍼에 등록된 WAS 서버로)
  server_was: ""
  # 찾는 법: 「김포 DB 서버 목록 5건」 → 서버명 하나 (OS·IP·코어·메모리가 다 채워진 서버)
  server_db: ""
  # 찾는 법: 위 서버명들의 공통 접두 (예: 「cocm-」) — 5~20대가 걸리는 접두가 좋다
  server_prefix_web: ""
  # 서버 묶음 표현 두 개 — 응답이 깔끔하게 나뉘는 표현 (예: 「김포 서버」·「여의도 서버」)
  server_group_a: ""
  server_group_b: ""
  # 찾는 법: 「{{server_db}} 서버의 프로세스 목록」 → 여러 서버에 떠 있을 법한 프로세스 이름
  process_name: ""

  # --- 기간 ---
  # 찾는 법: 「지난달 서버별 CPU 사용률 평균 5건」이 행을 돌려주면 지난달 (예: 2026년 9월)
  month: ""
  prev_month: ""
  alarm_period: 최근 3개월

  # --- 존 (multi_zone) ---
  # 존 되묻기를 이끌어 낼 질의 범위 — 존을 말하지 않은 표현이어야 한다 (예: 「전체 서버」)
  zone_scope_text: 전체 서버
  # 존 되묻기에 고를 db_id — polestar_cm_gp(김포) · polestar_cm_yd(여의도) · polestar_b0(은행존)
  zone_db_id: polestar_cm_gp

  # --- 양식 채우기 ---
  form_scope: 김포 서버
  form_owner_answer: 인프라팀

  # --- 제니퍼 APM (apm) ---
  # 찾는 법: 「제니퍼 WAS 인스턴스 목록」 → 인스턴스 이름 하나
  apm_instance: ""

  # --- 사내 문서 (docs) ---
  # 찾는 법: 관리자 화면 「문서 검색 시험」에서 결과가 나오는 질문 — testdata/rag_gold/rag_gold_v1.yaml 참고
  doc_question_1: 서버 관리자의 역할은?
  doc_question_2: 인프라 변경관리 절차를 알려줘
