# 시연 환경 값 파일 — 폐쇄망용 **템플릿** (scripts/demo · docs/35_demo_script_guide.md 「실제 데이터 입력」)
#
# 기준 존: 은행존 — 폴스타 polestar_b0 · 제니퍼 소스 b0 (폴스타·제니퍼 모두 가장 안정적으로 연동된 존).
#
# 사용법
#   1. 이 파일을 저장소 **밖**으로 복사한다 (예: C:\demo\env.closed.yaml · ~/demo/env.closed.yaml).
#      운영 서버명·인스턴스명이 들어가므로 저장소 안에 두거나 커밋하지 않는다(반출 금지).
#   2. 아래 각 칸의 「찾는 법」대로 웹 화면에서 질의해 실제 값을 확인하고 채운다.
#      값에 따옴표는 필요 없다(숫자만 있는 값은 "80" 처럼 따옴표 권장).
#   3. python -m scripts.demo --check --env-file <복사한 파일>  → 「점검 통과」가 나올 때까지 고친다.
#   4. python -m scripts.demo --list --env-file <복사한 파일>   → 채워진 질의를 눈으로 확인한다.
#
# 값이 빈 자리표를 쓰는 세션은 실행 전에 멈춘다. 연동이 없는 소스는 sources 에서 지우면
# 그 소스를 요구하는 세션이 사유와 함께 건너뛰어진다.
#
# ★ 서버 고르는 기준
#   - was_hosts : 은행 제니퍼 호스트 3~5대(B 군). 폴스타에서 이 서버들로 한정해 출발해야 제니퍼 연계가 비지 않는다.
#   - was_host  : 은행 제니퍼 인스턴스가 올라간 서버(대개 VM). 은행 폴스타·자산관리에도 있어야 E1 이 끝까지 보인다.
#   - phys_host : **물리 서버**. 자산관리 유지보수 계약·지원 종료(EOS)는 물리 서버에만 있다(VM 은 개별 유지보수 없음).
#                 은행 폴스타에도 등록돼 있고, 가능하면 최근 알람 이력이 있는 서버.
#
# ★ 실행 전 서버 조건 (리허설 전에 확인)
#   - 기동 로그 사다리 확정 1줄이 2단(intent_orchestration)인지 — 1단이면 제니퍼 결과가 다음 작업으로 넘어가지 않는다.
#   - 서버 .env 의 ALARM_PROCESS_API_BASE_URLS_CSV 에 은행존 프로세스 API 주소가 있는지(A1 7턴 프로세스 조회).
#   - TEXT2SQL_ALARM_DETERMINISTIC 은 false(기본) 유지 — true 면 서버를 지목한 알람 질의도 존 전체 알람이 나올 수 있다.

environment: closed

sources:
  - polestar
  - apm             # apm_gateway 가 떠 있고 은행 제니퍼(b0) 연동이 켜져 있을 때
  - itam            # 자산관리 DB 가 ACTIVE_DB_IDS 에 있을 때

# 존·제니퍼 소스 역질문 자동 응답 — 질의에 소스 이름(은행 폴스타·은행 제니퍼)을 넣어 역질문은 거의 없다.
# 그래도 물어 오면 은행존을 고른다(목록 중 선택지에 있는 첫 값 · 없으면 첫 선택지).
zone_preference: [polestar_b0]
apm_source_preference: [b0]

values:
  # --- 소스 이름 — 질의에 넣어 소스·존을 결정적으로 고정한다 (config/db_registry.yaml 별칭·terms) ---
  polestar_name: 은행 폴스타
  apm_name: 은행 제니퍼
  asset_name: 자산관리

  # --- 서버 ---
  # 찾는 법: 웹에서 「은행 제니퍼 WAS 인스턴스 목록과 호스트네임 보여줘」 → 호스트네임이 채워진 인스턴스 이름 하나
  #   (A1 의 지연 알람 주인공 · 실제로 트래픽이 있는 인스턴스가 지표가 풍부하다)
  apm_instance: ""
  # 찾는 법: 위 인스턴스의 호스트네임(OS 호스트명 그대로). 확인:
  #   「은행 폴스타에서 <호스트네임> 서버의 OS·IP 보여줘」 · 「자산관리에서 <호스트네임> 서버 담당자 알려줘」가 모두 행을 돌려줄 것
  #   제니퍼 호스트네임이 대문자·FQDN(SICWSO01 · sicwso01.xxx.local)이면 폴스타가 0건일 수 있다 — 폴스타 조회 결과의
  #   hostname 표기(대개 소문자 짧은 이름)를 넣는다(제니퍼 쪽은 대소문자·짧은 이름을 가려 대조한다)
  was_host: ""
  # 찾는 법: 「은행 제니퍼 WAS 인스턴스 목록과 호스트네임 보여줘」에서 서로 다른 호스트네임 3~5개를 쉼표로
  #   (B 군의 대상 서버군 · was_host 포함 가능 · 폴스타 표기). 폴스타 전체 순위·알람에서 출발하면 제니퍼가 없는
  #   서버가 대부분이라 다음 턴이 빈다 — 그래서 대상을 제니퍼 호스트로 한정한다
  #   확인: 「은행 폴스타에서 <목록> 서버의 오늘 CPU 사용률 최대값」이 목록 수만큼 행을 돌려줄 것
  was_hosts: ""
  # 찾는 법: 「자산관리에서 유지보수 계약 종료일과 하드웨어 지원 종료일이 모두 있는 서버 10건 보여줘」 → 서버 하나.
  #   확인: 「은행 폴스타에서 <서버> 서버의 OS·IP 보여줘」가 행을 돌려줄 것(은행존 물리 서버)
  phys_host: ""

  # --- 기간·기준 — 시연 시각에 데이터가 있는 범위로 ---
  # 제니퍼 구간(분 단위 데이터). 「최근 1시간」·「최근 30분」·「오늘 09시부터 10시까지」 등
  incident_window: 최근 1시간
  # 폴스타 지표 구간 — 폴스타 성능 통계는 시간 단위 집계(stat_h)라 짧은 창은 비거나 적재 지연이 있다.
  #   「은행 폴스타에서 <서버> 서버의 오늘 CPU 사용률을 시간대별로」가 행을 돌려주는 표현 (예: 오늘 · 최근 3시간)
  metric_window: 오늘
  # 알람 이력·집계 기간
  alarm_period: 최근 7일
  # D1 지원 종료 임박 범위. 「자산관리에서 지원 종료가 N 안에 도래하는 서버」가 몇 대~수십 대인 값 (예: 6개월 · 1년)
  eos_window: 6개월
  # D2 유지보수 계약 만료 임박 범위 — 3개월은 0건이었다(2026-10-15 폐쇄망). 몇 대 이상 나오는 값 (예: 6개월)
  maint_window: 6개월
