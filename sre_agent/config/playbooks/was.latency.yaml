# WAS 응답 지연 플레이북 (plans/187 §4.1 was.latency · §5.2 · §5.7.2 · D-341)
# 액션 ID만 쓴다 — 도구명은 스텝 라이브러리(application)에만 둔다(§5.2).
id: was.latency
version: 3
match:                                   # 결정적 매칭 — 우선순위 → 목록 순서의 첫 일치
  resource_type: apm.Instance
  any_kind: [latency, response_time, was_external_call_delay, was_slow_sql]   # was_signals kind 또는 이벤트 유형 정규화 값
  surface_terms: [응답 지연, 응답시간, 느려]  # 채팅 증상 질의 표면어(§5.6.2 ③ · W12)
  priority: 10
window: {before_min: 30, after_min: 10, baseline: [prev_day, prev_week]}   # §4.0
steps:
  - id: S0
    action: scope.resolve_was_targets    # 대상 확정 · 범위 비교(R-A)
    args: {pick: degraded, max_instances: 3}
    timeout_s: 120                       # 대상 확정은 호출이 많다(최대 13건) — 실행기 기본 90s 대신(W21 P3 · W22 60→120 · 도구 1건 60s의 2배 · 수집 예산 240s 안 · 남은 예산보다 길지 않다)
    narrate: {focus: "알람 인스턴스와 같은 호스트·같은 업무 인스턴스의 판정 분포", max_sentences: 3}
  - id: S1
    action: apm.golden_signals           # 골든 시그널(R-B 부하형/처리 지연형 · R-B′)
    args: {p95_ratio: 2.0}               # [제안] p95 ≥ 배수 × 기준선 → degraded(§4.2 — 임계는 YAML 인자)
    for_each: targets
    narrate: {focus: "p95·TPS·에러율·액티브의 기준선 대비 변화", max_sentences: 4}
  - id: S2
    action: apm.runtime_and_pool         # JVM·DB 커넥션 풀(R-F)
    for_each: targets
    narrate: {focus: "힙·GC 비율·스레드와 커넥션 풀 사용·대기", max_sentences: 4}
  - id: S3
    action: apm.slow_tx_breakdown        # 트랜잭션 Top5 시간 분해(R-C · R-D)
    args: {n: 5, profile_top: 1}
    when: "S1.verdict != 'normal'"       # enum 분기 — 결정적 평가(§5.2)
    narrate: {focus: "Top5 트랜잭션의 지배 계층과 1위 건의 커넥션 획득 대 SQL 실행", max_sentences: 4}
  - id: S4
    action: host.usage_trend             # 호스트 시계열(R-G)
    args: {kinds: [cpu, memory, filesystem], granularity: h}
    narrate: {focus: "호스트 CPU·메모리·파일시스템의 기준선 대비 변화와 포화 여부", max_sentences: 3}
  - id: S5
    action: xsource.related_alarms       # 연관 알람 타임라인(상관≠인과)
    narrate: {focus: "알람 전후 선행·동시·후행 알람", max_sentences: 3}
  - id: S6
    action: host.process_top             # 프로세스 Top(R-E)
    args: {top_n: 10, sort: cpu}
    narrate: {focus: "CPU 상위 프로세스와 WAS 프로세스의 비중", max_sentences: 3}
  - id: S7
    action: change.recent                # 변경 대조(R-H · 상관 후보로만 표기)
    args: {lookback_hours: 24}
    narrate: {focus: "사건창 직전 변경의 시간 근접순", max_sentences: 3}
  - id: S8
    action: dpm.db_health                # DPM 연동 전에는 skipped(not_connected)
  - id: S9
    action: synthesize
response_hints:                          # 대응 제안 문구(실행 아님 · 사람 승인) — §4.1 대응 제안 열
  triage_first: "완화 먼저 — 재기동 전에 스레드 덤프를 확보한다"
  sql_dominant: "DBA·DPM에서 해당 SQL 실행계획·락 확인"
  connection_acquire: "커넥션 풀 설정과 커넥션 점유 시간 확인"
  external_dominant: "연계 대상 응답·타임아웃 설정 확인"
  gc_dominant: "힙 덤프 확보 후 재기동 검토"
  recent_change: "배포 직후 발생이면 롤백 검토"
runbook:                                 # §5.7.2 — 제안이며 실행 명령이 아니다
  meaning: "WAS 인스턴스 응답시간(p95)이 기준선 대비 상승했다."
  impact: "해당 업무 응답 지연 · 액티브 누적 시 스레드 고갈로 전 업무 영향 가능"
  mitigation:
    - {when: "db_split == 'acquire'", action: "커넥션 풀 점유 트랜잭션 확인 후 담당 업무팀에 통보", risk: low,
       verification: "풀 대기 0 · p95 기준선 복귀", rollback: "해당 없음"}
    - {when: "dominant == 'sql' and db_split == 'execute'", action: "DBA에 해당 SQL 실행계획·락 대기 확인 요청", risk: low,
       verification: "해당 SQL 응답시간 기준선 복귀", rollback: "해당 없음"}
    - {when: "dominant == 'external'", action: "연계 담당에 대상 응답 확인 요청 · 타임아웃 설정 점검", risk: low,
       verification: "외부 호출 구간 시간 기준선 복귀", rollback: "해당 없음"}
  escalation: "업무 담당 → WAS 담당 → DBA"
  references: ["manual://incident/was-latency"]
  owner: "WAS운영팀"
  last_reviewed: 2026-10-17
  review_every_days: 180
deep_dive:
  focus: "S3 1위 트랜잭션의 지연 계층(DB 실행·커넥션 획득·외부 호출)과 같은 업무 다른 인스턴스로의 확산 여부"
