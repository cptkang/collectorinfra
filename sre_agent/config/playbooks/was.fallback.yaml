# APM 알람 공통 점검 플레이북 (plans/196 D2 ② · D-341)
# 유형 플레이북에 맞지 않는 APM 알람이 호스트용 fallback(호스트 자원·폴스타 재발 위주) 대신 고른다 —
# 제니퍼 이벤트·골든 시그널·소스 변경 위주. 최하위 우선순위라 다른 APM 플레이북이 먼저 일치한다.
# 심층 조사는 호스트 fallback처럼 모드와 무관하게 돈다(dispatcher APM_FALLBACK_ID).
id: was.fallback
version: 1
match:
  resource_type: apm.Instance
  priority: 900
window: {before_min: 30, after_min: 10, baseline: [prev_day, prev_week]}   # §4.0
steps:
  - id: S0
    action: scope.resolve_was_targets
    args: {max_instances: 3}
    timeout_s: 120                       # 대상 확정은 호출이 많다 — was.latency와 같은 상한(W22)
    narrate: {focus: "알람 인스턴스와 같은 업무 인스턴스의 판정 분포", max_sentences: 3}
  - id: S1
    action: apm.golden_signals
    for_each: targets
    narrate: {focus: "p95·TPS·에러율·액티브의 기준선 대비 변화", max_sentences: 4}
  - id: S1e
    action: apm.events_errors            # 사건창 제니퍼 이벤트·오류 유형 상위
    args: {n: 10}
    narrate: {focus: "사건창 이벤트·오류 유형 상위와 그 비중", max_sentences: 3}
  - id: S5
    action: xsource.related_alarms
    narrate: {focus: "알람 전후 선행·동시·후행 알람과 제니퍼 이벤트", max_sentences: 3}
  - id: S7
    action: change.recent
    args: {lookback_hours: 24}
    narrate: {focus: "사건창 직전 소스 변경의 시간 근접순", max_sentences: 3}
  - id: S9
    action: synthesize
response_hints:
  unclassified: "유형 미정 — APM 플레이북 추가 후보"
runbook:
  meaning: "등록된 APM 알람 유형 플레이북에 맞지 않는 제니퍼 알람이다. WAS 공통 수집 결과만 요약한다."
  impact: "유형별 판독 규칙이 적용되지 않아 원인 가설의 근거가 제한적이다"
  mitigation:
    - {action: "수집 결과를 검토해 WAS 담당에 이관하고 이 이벤트 유형의 플레이북 추가를 요청", risk: low,
       verification: "WAS 담당 접수 확인", rollback: "해당 없음"}
  escalation: "관제 담당 → WAS 담당"
  owner: "관제운영팀"
  last_reviewed: 2026-10-27
  review_every_days: 180
