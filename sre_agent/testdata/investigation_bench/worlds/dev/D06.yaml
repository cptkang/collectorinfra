# plans/154 §4.6 D06 — 스왑 스래싱(swap_thrash · os · 함정 없음)
id: D06
split: dev
title: 캐시 적재 프로세스의 메모리 과점유로 스왑 스래싱
event:
  dbId: polestar
  serverName: bw-d06-app01
  hostname: bw-d06-app01
  ipAddress: 192.0.2.16
  resourceAncestry: ""
  alarmId: "bw-d06-0001"
  severity: 2
  alarmStatus: NOT_ACK
  resourceType: server.Server
  resourceName: ""
  alarmName: "Load Average 임계 초과"
  alarmTime: "20261012092000"
  conditions: "> 32"
  conditionLog: "[Load Average 5분 (> 32)]"
label:
  root_entity: {host: bw-d06-app01, component: bwd06_cache_loader}
  layer: os
  kind: swap_thrash
  change_related: false
  aliases:
    kind: [스왑 스래싱, 스왑 과다, swap thrashing, 페이징 폭증, 스왑 사용 급증]
key_evidence:
